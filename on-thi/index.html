  const ol=n=>`<li>${n.n}${n.c&&n.c.length?`<ul class="dots">${n.c.map(ol).join("")}</ul>`:""}</li>`;
  $("#mmOutline",v).innerHTML=`<ul class="dots">${ol(data)}</ul>`;
  if(window.innerWidth<640)$("#mmOutlineBox",v).open=true;
  if(typeof d3==="undefined"){$("#mmWrap",v).innerHTML='<p style="padding:16px">Không tải được thư viện vẽ bản đồ. Hãy mở phần "dạng dàn ý" bên dưới.</p>';return;}
  const svg=d3.select($("#mmSvg",v)),g=svg.append("g");
  const root=d3.hierarchy(data,d=>d.c);
  root.each(d=>{d.id=Math.random().toString(36).slice(2);d.grp=d.data.g||(d.parent&&d.parent.grp)||"";if(!d.data.g&&d.parent)d.grp=d.ancestors().map(a=>a.data.g).find(Boolean)||"";});
  root.descendants().forEach(d=>{d._children=d.children;if(d.depth>=2)d.children=null;});
  const measG=svg.append("g").attr("aria-hidden","true").style("visibility","hidden");
  const measT=measG.append("text");
  const tw=(t,depth)=>{measG.attr("class","mm-node d"+Math.min(depth,3));measT.text(t);return measT.node().getComputedTextLength();};
  const W=n=>{const lw=n.lines?Math.max(...n.lines.map(l=>tw(l,n.depth))):tw(n.data.n,n.depth);return Math.ceil(lw)+22+(n._children?16:0);};
  const zoom=d3.zoom().scaleExtent([.25,2.5]).on("zoom",e=>g.attr("transform",e.transform));
  svg.call(zoom).on("dblclick.zoom",null);
  const wrapLines=(t,maxW,depth)=>{const words=t.split(" ");const out=[];let line="";
    words.forEach(w=>{const test=line?line+" "+w:w;if(tw(test,depth)>maxW&&line){out.push(line);line=w;}else line=test;});if(line)out.push(line);return out;};
  function update(fit){
    const nodes=[];root.eachBefore(d=>nodes.push(d));
    nodes.forEach(d=>{d.lines=d.depth>=3?wrapLines(d.data.n,340,d.depth):[d.data.n];d.w=W(d);d.h=10+d.lines.length*16;});
    // column x by depth: cumulative max width
    const maxW=[];nodes.forEach(d=>{maxW[d.depth]=Math.max(maxW[d.depth]||0,d.w);});
    const colX=[0];for(let i=1;i<maxW.length;i++)colX[i]=colX[i-1]+maxW[i-1]+46;
    // vertical layout: leaves stacked
    let y=0;const gap=8;
    (function lay(d){if(d.children){d.children.forEach(lay);d.y=(d.children[0].y+d.children[d.children.length-1].y)/2;}else{d.y=y+d.h/2;y+=d.h+gap;}})(root);
    nodes.forEach(d=>d.x=colX[d.depth]);
    const links=g.selectAll("path.mm-link").data(nodes.filter(d=>d.parent),d=>d.id);
    links.exit().remove();
    links.enter().append("path").attr("class","mm-link").merge(links)
      .attr("d",d=>{const sx=d.parent.x+d.parent.w,sy=d.parent.y,tx=d.x,ty=d.y,mx=(sx+tx)/2;return `M${sx},${sy}C${mx},${sy} ${mx},${ty} ${tx},${ty}`;});
    const ns=g.selectAll("g.mm-node").data(nodes,d=>d.id);
    ns.exit().remove();
    const ent=ns.enter().append("g").on("click",(e,d)=>{if(!d._children)return;const opening=!d.children;d.children=d.children?null:d._children;update(false);if(opening)focusOn(d);});
    ent.append("rect");ent.append("text").attr("class","lab");ent.append("text").attr("class","tog");ent.append("title");
    const all=ent.merge(ns);
    all.attr("class",d=>`mm-node d${Math.min(d.depth,3)} g-${d.grp}${d._children?" has-kids":""}`).attr("transform",d=>`translate(${d.x},${d.y-d.h/2})`);
    all.select("rect").attr("width",d=>d.w).attr("height",d=>d.h).attr("rx",d=>d.depth<=1?8:6);
    all.select("text.lab").each(function(d){const t=d3.select(this);t.selectAll("tspan").remove();
      d.lines.forEach((l,i)=>t.append("tspan").attr("x",11).attr("y",5+12+i*16).text(l));});
    all.select("text.tog").attr("x",d=>d.w-15).attr("y",d=>d.h/2+4).text(d=>d._children?(d.children?"–":"+"):"");

  }
  function focusOn(d){const wr=$("#mmWrap",v).getBoundingClientRect();if(!wr.width)return;
    const sub=d.descendants();const right=Math.max(...sub.map(n=>n.x+n.w)),top=Math.min(...sub.map(n=>n.y-n.h/2)),bot=Math.max(...sub.map(n=>n.y+n.h/2));
    const k=Math.max(.5,Math.min(1.1,(wr.width-28)/(right-d.x),(wr.height-28)/(bot-top)));
    svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity.translate(14-d.x*k,wr.height/2-((top+bot)/2)*k).scale(k));}
  function fitView(){const b=g.node().getBBox(),wr=$("#mmWrap",v).getBoundingClientRect();if(!b.width||!wr.width)return;
    let s=Math.min(1.1,(wr.width-40)/b.width,(wr.height-40)/b.height),tx,ty;
    if(s<.7){s=Math.max(s,Math.min(.7,(wr.height-40)/b.height));tx=14-b.x*s;}else tx=(wr.width-b.width*s)/2-b.x*s;
    ty=Math.max(14,(wr.height-b.height*s)/2)-b.y*s;

  $("#mmCollapse",v).onclick=()=>{root.descendants().forEach(d=>{if(d._children)d.children=d.depth>=2?null:d._children;});update(true);};
  $("#mmFit",v).onclick=fitView;
  update(true);
  renderMindmap.fit=fitView;
  try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{update(false);fitView();});}catch(e){}
}

/* ---------- Bộ đề thi thử ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function sshuffle(a,rnd){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const qByGroup=g=>QUIZ.map((q,i)=>i).filter(i=>docById[QUIZ[i].doc]&&docById[QUIZ[i].doc].group===g);
const EXAMSETS=(function(){
  const sets=[];
  const mk=(prefix,kind,count,minutes,mix,nSets,seed0,note)=>{
    for(let k=1;k<=nSets;k++){
      const r=seeded(seed0+k*7919);let items=[];
      mix.forEach(([g,n])=>{items=items.concat(sshuffle(qByGroup(g),r).slice(0,n));});
      if(items.length<count){
        const extra=sshuffle(QUIZ.map((q,i)=>i).filter(i=>!items.includes(i)&&mix.some(([g])=>docById[QUIZ[i].doc]&&docById[QUIZ[i].doc].group===g)),r);
        items=items.concat(extra.slice(0,count-items.length));
      }
      items=sshuffle(items,r).slice(0,count);
      if(items.length>=10)sets.push({id:prefix+k,kind,num:k,minutes,items,note});
    }
  };
  mk("ktc","Kiến thức chung",60,60,[["law",25],["party",20],["congress",15]],6,101,"Như vòng 1: 60 câu trong 60 phút, đạt khi đúng từ 50% (30 câu).");
  if(qByGroup("pro").length>=20)mk("cm","Chuyên môn",60,90,[["pro",40],["congress",20]],4,202,"Theo hình thức viết trên máy tính của NĐ 259: 60 câu trong 90 phút.");
  return sets;
})();
let exTimer=null;
function stopTimer(){if(exTimer){clearInterval(exTimer);exTimer=null;}}
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");};

function startExam(id){
  const v=views.bode,set=EXAMSETS.find(s=>s.id===id);if(!set)return;
  stopTimer();window.scrollTo({top:Math.min(window.scrollY,$(".tabbar").offsetTop)});
  const n=set.items.length,L="ABCD";
  const st={i:0,ans:new Array(n).fill(-1),order:set.items.map(qi=>shuffle(QUIZ[qi].opts.map((_,j)=>j))),start:Date.now(),confirm:false};
  const endAt=st.start+set.minutes*60000;
  v.innerHTML=`<div class="exbar"><div><b>${set.kind} – đề số ${set.num}</b> <span class="muted">· ${n} câu · ${set.minutes} phút</span></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="timer" id="exT">${fmt(set.minutes*60)}</span><span class="muted" id="exCount" style="font-size:.85rem"></span><button class="btn primary" id="exSubmit">Nộp bài</button></div></div>
    <div class="qcard" id="exQ"></div>
    <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn" id="exPrev">← Câu trước</button><button class="btn" id="exNext">Câu sau →</button></div>
    <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Bảng câu hỏi – bấm số để chuyển câu</div><div class="qgrid" id="exGrid">${set.items.map((_,k)=>`<button data-k="${k}">${k+1}</button>`).join("")}</div></div>
    <button class="btn" id="exBack" style="justify-self:start">← Bỏ bài, về danh sách đề</button>`;
  const grid=$("#exGrid",v);
  grid.onclick=e=>{const b=e.target.closest("button");if(b){st.i=+b.dataset.k;draw();}};
  function draw(){
    const q=QUIZ[set.items[st.i]];
    $("#exQ",v).innerHTML=`<div class="qbar"><span>Câu ${st.i+1}/${n}</span></div><div class="qtext">${q.q}</div><div class="opts">${st.order[st.i].map((oi,k)=>`<button class="opt ${st.ans[st.i]===oi?"sel":""}" data-oi="${oi}"><span class="k">${L[k]}.</span><span>${q.opts[oi]}</span></button>`).join("")}</div>`;
    $("#exQ",v).querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.ans[st.i]=+b.dataset.oi;draw();setTimeout(()=>{if(st.i<n-1){st.i++;draw();}},220);});
    grid.querySelectorAll("button").forEach((b,k)=>{b.className=(st.ans[k]>=0?"ans":"")+(k===st.i?" cur":"");});
    $("#exCount",v).textContent=`Đã làm ${st.ans.filter(a=>a>=0).length}/${n}`;
    st.confirm=false;$("#exSubmit",v).textContent="Nộp bài";
  }
  $("#exPrev",v).onclick=()=>{if(st.i>0){st.i--;draw();}};
  $("#exNext",v).onclick=()=>{if(st.i<n-1){st.i++;draw();}};
  $("#exBack",v).onclick=()=>{stopTimer();renderSets(v);};
  $("#exSubmit",v).onclick=()=>{const left=st.ans.filter(a=>a<0).length;
    if(left&&!st.confirm){st.confirm=true;$("#exSubmit",v).textContent=`Còn ${left} câu bỏ trống – bấm lần nữa để nộp`;return;}finish(false);};
  const tick=()=>{const t=$("#exT",v);if(!t){stopTimer();return;}const left=(endAt-Date.now())/1000;t.textContent=fmt(left);t.classList.toggle("low",left<=300);if(left<=0)finish(true);};
  function finish(timeout){
    stopTimer();
    const ok=set.items.filter((qi,k)=>st.ans[k]===QUIZ[qi].ans).length,used=Math.min(set.minutes*60,(Date.now()-st.start)/1000);
    const best=store.get("exbest",{});const pv=best[id]?(+best[id].split("/")[0]):-1;if(ok>pv){best[id]=`${ok}/${n}`;store.set("exbest",best);}
    const byG={};set.items.forEach((qi,k)=>{const g=docById[QUIZ[qi].doc].group;byG[g]=byG[g]||[0,0];byG[g][1]++;if(st.ans[k]===QUIZ[qi].ans)byG[g][0]++;});
    v.innerHTML=`<div class="qcard"><div class="eyebrow">${timeout?"Hết giờ – bài đã được nộp tự động":"Kết quả"} · ${set.kind} – đề số ${set.num}</div>
      <div class="score">${ok}/${n} <span class="muted" style="font-size:1rem">(${Math.round(ok/n*100)}%)</span></div>
      <p style="margin:0">${ok>=Math.ceil(n/2)?"Đạt ngưỡng 50%.":"Chưa đạt ngưỡng 50%."} Thời gian làm bài: ${fmt(used)}.</p>
      <div class="chips">${Object.entries(byG).map(([g,[a,b]])=>`<span class="tag ${g}">${grpName(g)[2]}: ${a}/${b}</span>`).join("")}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="exAgain">Làm lại đề này</button><button class="btn" id="exList">Về danh sách đề</button>
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="exOnlyWrong" checked> Chỉ xem câu sai và câu bỏ trống</label></div></div>
      <div id="exReview" class="grid" style="gap:10px"></div>`;
    const drawReview=()=>{const only=$("#exOnlyWrong",v).checked;
      $("#exReview",v).innerHTML=set.items.map((qi,k)=>{const q=QUIZ[qi],a=st.ans[k],right=a===q.ans;if(only&&right)return "";
        return `<div class="qcard"><div class="qbar"><span>Câu ${k+1} · ${docShort(q.doc)}</span><span style="color:var(${right?"--ok":"--seal"})">${right?"Đúng":a<0?"Bỏ trống":"Sai"}</span></div><div class="qtext" style="font-size:1rem">${q.q}</div>
        ${a>=0&&!right?`<div>Bạn chọn: <span style="color:var(--seal)">${q.opts[a]}</span></div>`:""}<div>Đáp án: <b style="color:var(--ok)">${q.opts[q.ans]}</b></div>
        <div class="explain muted">${q.ex||""}${q.ref?` (${q.ref})`:""}</div></div>`;}).join("")||`<p class="muted">Bạn làm đúng tất cả các câu.</p>`;};
    $("#exOnlyWrong",v).onchange=drawReview;drawReview();
    $("#exAgain",v).onclick=()=>startExam(id);
    $("#exList",v).onclick=()=>renderSets(v);
  }
  draw();tick();exTimer=setInterval(tick,1000);
}

function startWritten(id){
  const v=views.bode,w=WRITTEN.find(x=>x.id===id);if(!w)return;
  stopTimer();window.scrollTo({top:Math.min(window.scrollY,$(".tabbar").offsetTop)});
  const key="w:"+id,saved=store.get(key,{}),total=w.questions.reduce((n,q)=>n+(+q.points||0),0);
  let left=w.minutes*60,running=false;
  v.innerHTML=`<div class="exbar"><div><b>${w.title}</b> <span class="muted">· ${w.minutes} phút · ${total} điểm</span></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="timer" id="wT">${fmt(left)}</span><button class="btn primary" id="wStart">Bắt đầu tính giờ</button></div></div>
    ${w.intro?`<div class="callout">${w.intro}</div>`:""}
    ${w.questions.map((q,k)=>`<div class="wq"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><h3>Câu ${k+1}</h3><span class="pts">${q.points} điểm</span></div>
      <div>${q.q}</div>
      <textarea id="wa-${id}-${k}" aria-label="Bài làm câu ${k+1}" placeholder="Viết bài làm ở đây. Bài được lưu trên trình duyệt của máy này."></textarea>
      <div class="muted" style="font-size:.8rem" id="wc-${id}-${k}"></div>
      <details><summary>Xem đáp án gợi ý và thang điểm</summary>${q.outline?`<ol style="padding-left:1.2rem;display:grid;gap:.3rem">${q.outline.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}${q.answer?`<div style="margin-top:8px">${q.answer}</div>`:""}</details></div>`).join("")}
    <button class="btn" id="wBack" style="justify-self:start">← Về danh sách đề</button>`;
  w.questions.forEach((q,k)=>{const ta=$(`#wa-${id}-${k}`,v),wc=$(`#wc-${id}-${k}`,v);ta.value=saved[k]||"";
    const count=()=>{const t=ta.value.trim();wc.textContent=t?`${t.split(/\s+/).length} chữ`:"";};count();
    ta.addEventListener("input",()=>{saved[k]=ta.value;store.set(key,saved);count();});});
  const t=$("#wT",v),btn=$("#wStart",v);
  const tick=()=>{if(!running)return;left--;t.textContent=fmt(left);t.classList.toggle("low",left<=600);if(left<=0){running=false;stopTimer();btn.textContent="Hết giờ";btn.disabled=true;}};
  btn.onclick=()=>{running=!running;btn.textContent=running?"Tạm dừng":"Tiếp tục";if(running&&!exTimer)exTimer=setInterval(tick,1000);};
  $("#wBack",v).onclick=()=>{stopTimer();renderSets(v);};
}

    <div class="ivdrill"><div class="eyebrow">Luyện nói ngẫu nhiên</div><div class="muted" id="ivH" style="font-size:.85rem"></div><div class="q" id="ivQ">Bấm nút bên dưới để nhận câu hỏi.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn primary" id="ivNext">Câu hỏi ngẫu nhiên</button><span class="timer" id="ivT">02:00</span><button class="btn" id="ivShow" disabled>Xem gợi ý</button></div>
      <div id="ivA" hidden></div></div>
    ${INTERVIEW.map(s=>`<div class="iv"><h3 style="margin:8px 0">${s.h}</h3>${s.intro?`<p class="muted" style="margin:0 0 8px">${s.intro}</p>`:""}${s.items.map(it=>`<details><summary>${it.q}</summary><div class="ans">${it.a}</div></details>`).join("")}</div>`).join("")}`;
  let cur=null,left=120;

  $("#ivNext",v).onclick=()=>{cur=all[Math.floor(Math.random()*all.length)];$("#ivH",v).textContent=cur.h;$("#ivQ",v).innerHTML=cur.it.q;a.hidden=true;a.innerHTML=cur.it.a;sb.disabled=false;
    left=120;t.textContent=fmt(left);t.classList.remove("low");if(ivTimer)clearInterval(ivTimer);
    ivTimer=setInterval(()=>{left--;t.textContent=fmt(left);t.classList.toggle("low",left<=20);if(left<=0){clearInterval(ivTimer);ivTimer=null;}},1000);};
  sb.onclick=()=>{a.hidden=!a.hidden;sb.textContent=a.hidden?"Xem gợi ý":"Ẩn gợi ý";};
  bindGo(v);
}

function goBtn(target,label){const [k,id]=target.split(":");if(k==="doc"&&!docById[id])return"";if(k==="tab"&&!TABS.some(t=>t.id===id))return"";return `<button class="btn" data-go="${target}">${label}</button>`;}
function quickLinks(){
  const b=[goBtn("doc:hoidong","Hội đồng phỏng vấn"),goBtn("doc:quytrinh","Quy trình xuất bản (dự thảo 11/2025)"),goBtn("tab:hieuvb","Hiểu văn bản của Đảng và Nhà nước"),goBtn("tab:sachnxb","Sách NXB theo năm"),goBtn("doc:ktgs","Kiểm tra, giám sát, kỷ luật Đảng 2026")].join("");
  return b?`<div class="panel"><div class="eyebrow">Mới cập nhật</div><div class="golinks">${b}</div></div>`:"";
}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(b=>{b.onclick=()=>{const [k,id]=b.dataset.go.split(":");if(k==="doc")show("vanban",{doc:id});else show(id);};});}

function parseQuery(raw){
  raw=raw.normalize("NFC").trim().replace(/\s+/g," ");
  if(!raw)return null;
  const fold=!/[^\x00-\x7f]/.test(raw);

  const q={raw,fold,terms,phrase:new RegExp(B+terms.map(esc).join("[\\s\\u00a0]+")+tail(terms[terms.length-1]),flags),termRes:terms.map(t=>new RegExp(B+esc(t)+tail(t),flags)),ref:null};
  const f=foldStr(raw).replace(/\s+/g," ");
  let m=f.match(/^(nq|ct|kl|qd|hd|nd|tt|kh|tb|nghi quyet|chi thi|ket luan|quyet dinh|quy dinh|huong dan|nghi dinh|thong tu|ke hoach|thong bao)\s*(?:so\s*)?[-.]?\s*(\d{1,4})(?:\s*[-\/][a-z\/-]*)?$/);

  if(m){key=LONG[m[1]]||m[1];num=m[2];}
  else if((m=f.match(/^(\d{1,4})\s*-\s*(nq|ct|kl|qd|hd|nd|tt|kh|tb)(?:\/[a-z-]*)?$/))){num=m[1];key=m[2];}
  if(key){
    const N="0*"+String(parseInt(num,10));
    const words=DTYPE[key].map(esc).join("|");
    q.ref=new RegExp(B+"(?:"+N+"\\s*-\\s*"+key+"(?![a-z])|"+key+"\\s*(?:so\\s*)?"+N+NB+"|(?:"+words+")\\s+(?:so\\s+)?"+N+NB+"|"+N+"\\/\\d{4}\\/"+key+"(?![a-z]))",flags);
    q.refLab=DLAB[key]+" số "+parseInt(num,10);
  }
  return q;
}
function firstIdx(re,hay,from){re.lastIndex=from||0;const m=re.exec(hay);return m?m.index:-1;}
function rangesOf(hay,res,cap){const out=[];for(const re of res){re.lastIndex=0;let m;while((m=re.exec(hay))){if(!m[0].length){re.lastIndex++;continue;}out.push([m.index,m.index+m[0].length]);if(out.length>(cap||600))break;}}
  out.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);const mg=[];for(const r of out){const L=mg[mg.length-1];if(L&&r[0]<=L[1])L[1]=Math.max(L[1],r[1]);else mg.push(r.slice());}return mg;}
function matchRec(r,q,useRef){
  const hay=useRef||q.fold?r.cf:r.cl;
  let res,first;
  if(useRef){first=firstIdx(q.ref,hay);if(first<0)return null;res=[q.ref];}
  else{first=firstIdx(q.phrase,hay);
    if(first>=0)res=[q.phrase];
    else{if(q.terms.length<2)return null;for(const re of q.termRes)if(firstIdx(re,hay)<0)return null;res=q.termRes;first=Math.min(...q.termRes.map(re=>firstIdx(re,hay)));}}
  const all=rangesOf(hay,res,60);
  const inTitle=all.some(x=>x[0]<r.tlen-5);
  let score=(res===q.termRes?10:30)+(inTitle?15:0)+Math.min(all.length,10)*3;
  if(r.cat==="vanban"||r.cat==="hieuvb")score+=4;
  return {r,res,hay,score,ranges:all};
}
function run(raw){
  const q=parseQuery(raw);if(!q)return{q:null,list:[]};
  if(!IDX)buildIndex();

  if(q.ref){for(const r of IDX){const x=matchRec(r,q,true);if(x)list.push(x);}usedRef=list.length>0;}
  if(!usedRef){for(const r of IDX){const x=matchRec(r,q,false);if(x)list.push(x);}}
  q.usedRef=usedRef;
  list.sort((a,b)=>b.score-a.score||catOrd[a.r.cat]-catOrd[b.r.cat]||a.r.n-b.r.n);

function hlText(text,offset,ranges,from,to){

  return (from>0?"… ":"")+hlText(t,off,x.ranges,from,to)+(to<t.length?" …":"");

function clearMarks(){$$("mark.shl").forEach(m=>{const p=m.parentNode;if(!p)return;m.replaceWith(document.createTextNode(m.textContent));p.normalize();});}
function markIn(root,q){
  const useRef=q.usedRef,base=useRef||q.fold?foldStr:lowStr;
  const full=base((root.textContent||"").normalize("NFC"));
  let res=useRef?[q.ref]:(firstIdx(q.phrase,full)>=0?[q.phrase]:q.termRes);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.nodeValue.trim()&&!(n.parentElement&&n.parentElement.closest("script,style,textarea,select,option,mark.shl")))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  let c=0;
  for(const n of nodes){const s=n.nodeValue;const rg=rangesOf(base(s),res,200);if(!rg.length)continue;
    const fr=document.createDocumentFragment();let p=0;
    for(const [a,b] of rg){if(a>p)fr.append(s.slice(p,a));const m=document.createElement("mark");m.className="shl";m.textContent=s.slice(a,b);fr.append(m);p=b;c++;}
    if(p<s.length)fr.append(s.slice(p));n.replaceWith(fr);}
  return c;
}
const pill=$("#spill");
function go(i){
  const x=state.view[i];if(!x)return;state.act=i;const r=x.r,q=state.q;
  closeS();clearMarks();
  if(r.pre)r.pre();
  show(r.tab,Object.assign({keepScroll:true},r.opts||{}));
  if(r.after)r.after();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const v=views[r.tab];let tgt=null;
    if(r.sel){const key=nk(r.key).slice(0,60);tgt=$$(r.sel,v).find(e=>!key||nk(e.textContent).includes(key))||null;}
    const scope=tgt||v;
    if(tgt&&tgt.tagName==="DETAILS")tgt.open=true;
    markIn(scope,q);
    const first=scope.querySelector("mark.shl")||tgt;
    let p=first&&first.parentElement;while(p&&p!==document.body){if(p.tagName==="DETAILS")p.open=true;p=p.parentElement;}
    if(first){const bar=$(".tabbar").getBoundingClientRect().height;const y=first.getBoundingClientRect().top+window.scrollY-bar-90;window.scrollTo({top:Math.max(0,y)});}
    if(tgt){tgt.classList.remove("sflash");void tgt.offsetWidth;tgt.classList.add("sflash");}
    $("#spT").innerHTML=`“${escH(q.raw)}” · ${i+1}/${state.view.length}`;
    $("#spPrev").disabled=i<=0;$("#spNext").disabled=i>=state.view.length-1;pill.hidden=false;
  }));
}
$("#spPrev").onclick=()=>{if(state.act>0)go(state.act-1);};
$("#spNext").onclick=()=>{if(state.act<state.view.length-1)go(state.act+1);};
$("#spList").onclick=()=>{ov.hidden=false;document.documentElement.style.overflow="hidden";drawList();setAct(state.act);setTimeout(()=>inp.focus(),20);};
$("#spX").onclick=()=>{pill.hidden=true;clearMarks();};
})();

show(views[h]?h:store.get("tab","tongquan"),{keepScroll:true});
window.addEventListener("hashchange",()=>{const k=(location.hash||"").replace("#","");if(views[k]&&k!==current)show(k);});
})();
