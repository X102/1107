{h:"Cương lĩnh 1991 (Đại hội VII)",items:[
"<b>Tên:</b> \"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội\", Đại hội VII (24–27/6/1991).",
"<b>6 đặc trưng</b> của xã hội XHCN: (1) <b>Do nhân dân lao động làm chủ</b>; (2) Có một nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và <b>chế độ công hữu về các tư liệu sản xuất chủ yếu</b>; (3) Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc; (4) Con người được giải phóng khỏi áp bức, bóc lột, bất công, làm theo năng lực, hưởng theo lao động, có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện cá nhân; (5) Các dân tộc trong nước bình đẳng, đoàn kết và giúp đỡ lẫn nhau cùng tiến bộ; (6) Có quan hệ hữu nghị và hợp tác với nhân dân tất cả các nước trên thế giới.",
"<b>7 phương hướng cơ bản:</b> (1) xây dựng Nhà nước XHCN, Nhà nước của nhân dân, do nhân dân, vì nhân dân; (2) phát triển lực lượng sản xuất, công nghiệp hóa đất nước theo hướng hiện đại; (3) thiết lập từng bước quan hệ sản xuất XHCN; (4) cách mạng XHCN trên lĩnh vực tư tưởng và văn hóa; (5) chính sách đại đoàn kết dân tộc, củng cố và mở rộng Mặt trận dân tộc thống nhất; (6) xây dựng CNXH và bảo vệ Tổ quốc là hai nhiệm vụ chiến lược; (7) xây dựng Đảng trong sạch, vững mạnh về chính trị, tư tưởng và tổ chức.",
"<b>Mục tiêu tổng quát</b> khi kết thúc thời kỳ quá độ: \"xây dựng xong về cơ bản những cơ sở kinh tế của chủ nghĩa xã hội, với kiến trúc thượng tầng về chính trị và tư tưởng, văn hoá phù hợp, làm cho nước ta trở thành một nước xã hội chủ nghĩa phồn vinh\".",
"<b>Nền tảng tư tưởng:</b> \"Đảng lấy chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng, kim chỉ nam cho hành động, lấy tập trung dân chủ làm nguyên tắc tổ chức cơ bản.\"",
"Câu mở đầu: \"Thực hiện Cương lĩnh năm 1930, trong suốt 45 năm, Đảng ta do Chủ tịch Hồ Chí Minh sáng lập và rèn luyện...\""]},
{h:"Cương lĩnh bổ sung, phát triển năm 2011 – 8 đặc trưng",html:`<p style="margin:.2rem 0 .3rem">"Xã hội xã hội chủ nghĩa mà nhân dân ta xây dựng là một xã hội:</p><ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li><b>Dân giàu, nước mạnh, dân chủ, công bằng, văn minh</b>;</li>
<li>Do <b>nhân dân làm chủ</b>;</li>
<li>Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và <b>quan hệ sản xuất tiến bộ phù hợp</b>;</li>
<li>Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc;</li>
<li>Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện;</li>
<li>Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọng và giúp nhau cùng phát triển;</li>
<li>Có <b>Nhà nước pháp quyền xã hội chủ nghĩa</b> của nhân dân, do nhân dân, vì nhân dân do Đảng Cộng sản lãnh đạo;</li>
<li>Có quan hệ hữu nghị và hợp tác với các nước trên thế giới."</li></ol>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">So với 1991: thêm đặc trưng (1) và (7); "nhân dân lao động làm chủ" thành "nhân dân làm chủ"; "chế độ công hữu về các tư liệu sản xuất chủ yếu" thành "quan hệ sản xuất tiến bộ phù hợp".</p>`},
{h:"Cương lĩnh 2011 – 8 phương hướng cơ bản và 8 mối quan hệ lớn",html:`<p style="margin:.2rem 0 .3rem"><b>8 phương hướng cơ bản</b></p><ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li>Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường.</li>
<li>Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa.</li>
<li>Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc; xây dựng con người, nâng cao đời sống nhân dân, thực hiện tiến bộ và công bằng xã hội.</li>
<li>Bảo đảm vững chắc quốc phòng và an ninh quốc gia, trật tự, an toàn xã hội.</li>
<li>Thực hiện đường lối đối ngoại độc lập, tự chủ, hòa bình, hữu nghị, hợp tác và phát triển; chủ động và tích cực hội nhập quốc tế.</li>
<li>Xây dựng nền dân chủ xã hội chủ nghĩa, thực hiện đại đoàn kết toàn dân tộc, tăng cường và mở rộng mặt trận dân tộc thống nhất.</li>
<li>Xây dựng Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân.</li>
<li>Xây dựng Đảng trong sạch, vững mạnh.</li></ol>
<p style="margin:.6rem 0 .3rem"><b>8 mối quan hệ lớn</b> (Cương lĩnh 2011): giữa (1) đổi mới, ổn định và phát triển; (2) đổi mới kinh tế và đổi mới chính trị; (3) kinh tế thị trường và định hướng XHCN; (4) phát triển lực lượng sản xuất và xây dựng, hoàn thiện từng bước quan hệ sản xuất XHCN; (5) tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ và công bằng xã hội; (6) xây dựng CNXH và bảo vệ Tổ quốc XHCN; (7) độc lập, tự chủ và hội nhập quốc tế; (8) Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ.</p>
<p style="margin:.4rem 0 0"><b>Phát triển tiếp:</b> Đại hội XII bổ sung quan hệ giữa <b>Nhà nước và thị trường</b> (thành <b>9</b>). Đại hội XIII nêu <b>10</b> mối quan hệ: diễn đạt lại thành \"giữa ổn định, đổi mới và phát triển\", \"giữa tuân theo các quy luật thị trường và bảo đảm định hướng xã hội chủ nghĩa\", \"giữa <b>Nhà nước, thị trường và xã hội</b>\" và bổ sung \"giữa <b>thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội</b>\".</p>`},
{h:"So sánh Cương lĩnh 1991 và Cương lĩnh 2011",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Nội dung</th><th>Cương lĩnh 1991 (Đại hội VII)</th><th>Cương lĩnh 2011 (Đại hội XI)</th></tr></thead><tbody>
<tr><td>Đặc trưng xã hội XHCN</td><td>6</td><td>8</td></tr>
<tr><td>Phương hướng cơ bản</td><td>7</td><td>8</td></tr>
<tr><td>Mối quan hệ lớn</td><td>không nêu thành danh mục</td><td>8 (XII: 9; XIII: 10)</td></tr>
<tr><td>Bài học kinh nghiệm</td><td>5</td><td>5</td></tr>
<tr><td>Chủ thể làm chủ</td><td>"nhân dân lao động làm chủ"</td><td>"nhân dân làm chủ"</td></tr>
<tr><td>Cơ sở kinh tế</td><td>"chế độ công hữu về các tư liệu sản xuất chủ yếu"</td><td>"quan hệ sản xuất tiến bộ phù hợp"</td></tr>
<tr><td>Bài học 5</td><td>sự lãnh đạo đúng đắn của Đảng là nhân tố hàng đầu <b>bảo đảm</b> thắng lợi</td><td>... nhân tố hàng đầu <b>quyết định</b> thắng lợi</td></tr>
<tr><td>Đảng là đội tiên phong</td><td>của giai cấp công nhân Việt Nam</td><td>của giai cấp công nhân, đồng thời của nhân dân lao động và của dân tộc Việt Nam</td></tr>
<tr><td>Mục tiêu cuối thời kỳ quá độ</td><td>"xây dựng xong về cơ bản những cơ sở kinh tế của CNXH ... nước XHCN phồn vinh"</td><td>"xây dựng được về cơ bản nền tảng kinh tế của CNXH ... nước XHCN ngày càng phồn vinh, hạnh phúc"</td></tr>
</tbody></table></div>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Cương lĩnh 2011: "Đi lên chủ nghĩa xã hội là khát vọng của nhân dân ta, là sự lựa chọn đúng đắn của Đảng Cộng sản Việt Nam và Chủ tịch Hồ Chí Minh, phù hợp với xu thế phát triển của lịch sử"; "Từ nay đến giữa thế kỷ XXI ... xây dựng nước ta trở thành một nước công nghiệp hiện đại, theo định hướng xã hội chủ nghĩa".</p>`},
{h:"5 bài học kinh nghiệm (Cương lĩnh 1991 và 2011)",items:[
"(1) Nắm vững ngọn cờ độc lập dân tộc và chủ nghĩa xã hội.",

"(3) Không ngừng củng cố, tăng cường đoàn kết: đoàn kết toàn Đảng, đoàn kết toàn dân, đoàn kết dân tộc, đoàn kết quốc tế.",
"(4) Kết hợp sức mạnh dân tộc với sức mạnh thời đại, sức mạnh trong nước với sức mạnh quốc tế.",
"(5) Sự lãnh đạo đúng đắn của Đảng là nhân tố hàng đầu <b>quyết định</b> thắng lợi của cách mạng Việt Nam (bản 1991 viết \"<b>bảo đảm</b> thắng lợi\").",
"Bố cục hai Cương lĩnh đều có 4 phần; câu mở đầu bản 2011: \"Từ năm 1930 đến nay, Đảng Cộng sản Việt Nam do Chủ tịch Hồ Chí Minh sáng lập và rèn luyện...\"."]}

DOCS.push({id:"dh13",group:"congress",short:"Đại hội XIII (2021)",mmLabel:"Đại hội XIII (01–02/2021)",so:"XIII",
title:"Đại hội đại biểu toàn quốc lần thứ XIII của Đảng Cộng sản Việt Nam (25/01 – 01/02/2021)",
meta:[["Thời gian","25/01 – 01/02/2021 (khai mạc chính thức sáng 26/01); 7 ngày làm việc, sớm gần 2 ngày so với kế hoạch"],["Địa điểm","Trung tâm Hội nghị quốc gia, Hà Nội"],["Đại biểu","1.587, thay mặt gần 5,2 triệu đảng viên (tăng 77 đại biểu so với Đại hội XII)"],["BCH TW khóa XIII","200 (180 chính thức, 20 dự khuyết); Bộ Chính trị 18; UBKT TW 19, Chủ nhiệm Trần Cẩm Tú"],["Tổng Bí thư","Nguyễn Phú Trọng (tái cử). Từ 3/8/2024: Tô Lâm"],["Văn kiện","Báo cáo chính trị; Chiến lược phát triển KT-XH 10 năm 2021–2030; Phương hướng, nhiệm vụ 5 năm 2021–2025; Báo cáo xây dựng Đảng và thi hành Điều lệ (không sửa Điều lệ)"]],
tldr:`Chủ đề nhấn mạnh <b>"khơi dậy khát vọng phát triển đất nước"</b>; Nghị quyết dùng cụm <b>"khát vọng phát triển đất nước phồn vinh, hạnh phúc"</b>. Ba mốc: <mark>2025</mark> nước đang phát triển, có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp; <mark>2030</mark> có công nghiệp hiện đại, thu nhập trung bình cao; <mark>2045</mark> nước phát triển, thu nhập cao. Con số khung: <mark>5 quan điểm – 6 nhiệm vụ trọng tâm – 3 đột phá – 12 định hướng – 10 mối quan hệ lớn – 5 bài học</mark>. Chỉ tiêu 2021–2025: GDP <mark>6,5–7%/năm</mark>, GDP/người <mark>4.700–5.000 USD</mark>, kinh tế số <mark>khoảng 20% GDP</mark>.`,
sections:[
{h:"Chủ đề, đánh giá và 5 quan điểm chỉ đạo",items:[
"<b>Chủ đề</b> (tiêu đề Báo cáo chính trị): \"Tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh; <b>khơi dậy khát vọng phát triển đất nước</b>, phát huy ý chí, sức mạnh đại đoàn kết toàn dân tộc kết hợp với sức mạnh thời đại; tiếp tục đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; xây dựng và bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; phấn đấu đến giữa thế kỷ XXI, nước ta trở thành <b>nước phát triển, theo định hướng xã hội chủ nghĩa</b>\".",
"<b>Đánh giá 35 năm đổi mới:</b> \"Đất nước ta chưa bao giờ có được cơ đồ, tiềm lực, vị thế và uy tín quốc tế như ngày nay.\"",
"<b>5 quan điểm chỉ đạo</b>: (1) kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh, mục tiêu độc lập dân tộc và CNXH, đường lối đổi mới; (2) bảo đảm cao nhất lợi ích quốc gia – dân tộc trên cơ sở các nguyên tắc cơ bản của Hiến chương Liên hợp quốc và luật pháp quốc tế; <b>phát triển kinh tế – xã hội là trung tâm, xây dựng Đảng là then chốt</b>; (3) khơi dậy mạnh mẽ tinh thần yêu nước, ý chí tự cường dân tộc, sức mạnh đại đoàn kết toàn dân tộc và khát vọng phát triển đất nước phồn vinh, hạnh phúc; (4) kết hợp sức mạnh dân tộc với sức mạnh thời đại, độc lập, tự chủ, chủ động, tích cực hội nhập; nguồn lực nội sinh, nhất là nguồn lực con người là quan trọng nhất; (5) tăng cường xây dựng, chỉnh đốn Đảng, phát huy bản chất giai cấp công nhân của Đảng."]},

<tr><td><b>2045</b></td><td>100 năm thành lập nước Việt Nam Dân chủ Cộng hòa, nay là nước CHXHCN Việt Nam</td><td>Trở thành <b>nước phát triển, thu nhập cao</b></td></tr>
</tbody></table></div>
<p style="margin:.5rem 0 0"><b>Mục tiêu tổng quát:</b> nâng cao năng lực lãnh đạo, năng lực cầm quyền và sức chiến đấu của Đảng; xây dựng Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện; củng cố niềm tin của nhân dân; <b>khơi dậy khát vọng phát triển đất nước phồn vinh, hạnh phúc</b>; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới, CNH, HĐH; xây dựng và bảo vệ vững chắc Tổ quốc; phấn đấu đến giữa thế kỷ XXI nước ta trở thành nước phát triển, theo định hướng XHCN.</p>`},

{h:"6 nhiệm vụ trọng tâm",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li>Tiếp tục đẩy mạnh <b>xây dựng, chỉnh đốn Đảng</b>, xây dựng Nhà nước pháp quyền XHCN và hệ thống chính trị trong sạch, vững mạnh; đổi mới phương thức lãnh đạo, cầm quyền; bộ máy tinh gọn; chống quan liêu, tham nhũng, lãng phí, tiêu cực, "lợi ích nhóm", "tự diễn biến", "tự chuyển hóa"; xây dựng cán bộ các cấp, nhất là cấp chiến lược, người đứng đầu.</li>
<li>Tập trung <b>kiểm soát đại dịch Covid-19</b>, tiêm chủng vắc-xin; phục hồi, phát triển KT-XH, đổi mới mô hình tăng trưởng, cơ cấu lại nền kinh tế; thể chế phù hợp với kinh tế thị trường đầy đủ, hiện đại, hội nhập; <b>chuyển đổi số quốc gia, phát triển kinh tế số</b>; khắc phục những điểm nghẽn.</li>
<li>Giữ vững độc lập, tự chủ, nâng cao hiệu quả đối ngoại, hội nhập; tăng cường tiềm lực quốc phòng, an ninh; xây dựng Quân đội, Công an cách mạng, chính quy, tinh nhuệ, từng bước hiện đại, <b>một số lực lượng tiến thẳng lên hiện đại</b>; năm 2030 Quân đội, Công an cách mạng, chính quy, tinh nhuệ, hiện đại.</li>
<li><b>Khơi dậy khát vọng phát triển đất nước phồn vinh, hạnh phúc</b>; phát huy giá trị văn hóa, sức mạnh con người Việt Nam; chính sách xã hội, an ninh xã hội, an ninh con người; nâng cao chất lượng cuộc sống và <b>chỉ số hạnh phúc</b>.</li>
<li>Hoàn thiện hệ thống pháp luật, cơ chế phát huy dân chủ XHCN, quyền làm chủ của nhân dân; xây dựng Nhà nước pháp quyền XHCN; cải cách tư pháp, tăng cường pháp chế, kỷ cương; tăng cường đại đoàn kết toàn dân tộc.</li>
<li>Quản lý chặt chẽ, sử dụng hợp lý, hiệu quả đất đai, tài nguyên; bảo vệ, cải thiện môi trường; chủ động thích ứng với <b>biến đổi khí hậu</b>, thiên tai khắc nghiệt.</li></ol>`},
{h:"3 đột phá chiến lược",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li><b>Thể chế:</b> "Hoàn thiện đồng bộ thể chế phát triển, trước hết là thể chế phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa. Đổi mới quản trị quốc gia theo hướng hiện đại, cạnh tranh hiệu quả"; huy động, sử dụng hiệu quả nguồn lực, nhất là đất đai, tài chính, hợp tác công – tư; phân cấp, phân quyền; kiểm soát quyền lực bằng hệ thống pháp luật.</li>
<li><b>Nguồn nhân lực:</b> "Phát triển nguồn nhân lực, nhất là nguồn nhân lực chất lượng cao"; ưu tiên nhân lực cho lãnh đạo, quản lý và lĩnh vực then chốt; gắn với tuyển dụng, đãi ngộ nhân tài; phát triển khoa học – công nghệ, đổi mới sáng tạo; <b>khơi dậy khát vọng phát triển đất nước phồn vinh, hạnh phúc</b>.</li>
<li><b>Hạ tầng:</b> "Xây dựng hệ thống kết cấu hạ tầng đồng bộ, hiện đại cả về kinh tế và xã hội"; ưu tiên công trình trọng điểm quốc gia về giao thông, thích ứng với biến đổi khí hậu; hạ tầng thông tin, viễn thông, nền tảng chuyển đổi số quốc gia.</li></ol>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">So sánh: XI – thể chế kinh tế thị trường (trọng tâm môi trường cạnh tranh bình đẳng, cải cách hành chính), nhân lực (đổi mới giáo dục), hạ tầng (giao thông, đô thị lớn). XIV – đột phá về thể chế và thực thi; nguồn nhân lực chất lượng cao gắn với khoa học, công nghệ, đổi mới sáng tạo; hạ tầng đồng bộ, hiện đại.</p>`},
{h:"12 định hướng phát triển 2021–2030 và 10 mối quan hệ lớn",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li>Tiếp tục đổi mới mạnh mẽ tư duy, xây dựng, hoàn thiện đồng bộ thể chế phát triển bền vững.</li>
<li>Hoàn thiện toàn diện, đồng bộ thể chế phát triển nền kinh tế thị trường định hướng XHCN.</li>
<li>Tạo đột phá trong đổi mới căn bản, toàn diện giáo dục và đào tạo, phát triển nguồn nhân lực chất lượng cao, thu hút và trọng dụng nhân tài; thúc đẩy nghiên cứu, chuyển giao, ứng dụng khoa học, công nghệ.</li>
<li>Phát triển con người toàn diện và xây dựng nền văn hóa Việt Nam tiên tiến, đậm đà bản sắc dân tộc để văn hóa thực sự trở thành sức mạnh nội sinh.</li>
<li>Quản lý phát triển xã hội có hiệu quả, nghiêm minh, bảo đảm an ninh xã hội, an ninh con người.</li>
<li>Chủ động thích ứng có hiệu quả với biến đổi khí hậu, phòng chống và giảm nhẹ thiên tai, dịch bệnh; quản lý, sử dụng hợp lý tài nguyên.</li>
<li>Kiên quyết, kiên trì bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ.</li>
<li>Tiếp tục thực hiện đường lối đối ngoại độc lập, tự chủ, đa phương hóa, đa dạng hóa.</li>
<li>Thực hành và phát huy rộng rãi dân chủ XHCN, quyền làm chủ và vai trò chủ thể của nhân dân.</li>
<li>Xây dựng và hoàn thiện Nhà nước pháp quyền XHCN trong sạch, vững mạnh, tinh gọn.</li>
<li>Tiếp tục xây dựng, chỉnh đốn Đảng toàn diện; tăng cường bản chất giai cấp công nhân của Đảng.</li>
<li>Tiếp tục nắm vững và xử lý tốt các <b>quan hệ lớn</b>.</li></ol>
<p style="margin:.5rem 0 0"><b>10 mối quan hệ lớn</b> (định hướng 12): giữa (1) ổn định, đổi mới và phát triển; (2) đổi mới kinh tế và đổi mới chính trị; (3) tuân theo các quy luật thị trường và bảo đảm định hướng XHCN; (4) phát triển lực lượng sản xuất và xây dựng, hoàn thiện từng bước quan hệ sản xuất XHCN; (5) <b>Nhà nước, thị trường và xã hội</b>; (6) tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, công bằng xã hội, bảo vệ môi trường; (7) xây dựng và bảo vệ Tổ quốc Việt Nam XHCN; (8) độc lập, tự chủ và hội nhập quốc tế; (9) Đảng lãnh đạo, Nhà nước quản lý và nhân dân làm chủ; (10) <b>thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội</b>.</p>`},
{h:"5 bài học kinh nghiệm và điểm mới",items:[
"<b>Bài học 1:</b> công tác xây dựng, chỉnh đốn Đảng phải được triển khai quyết liệt, toàn diện, đồng bộ, thường xuyên.",
"<b>Bài học 2:</b> trong mọi công việc của Đảng và Nhà nước, phải luôn quán triệt sâu sắc, thực hiện nghiêm túc quan điểm <b>\"dân là gốc\"</b>; kiên trì nguyên tắc \"dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng\"; nhân dân là trung tâm, là chủ thể của công cuộc đổi mới; lấy hạnh phúc, ấm no của nhân dân làm mục tiêu phấn đấu.",
"<b>Bài học 3:</b> trong lãnh đạo, chỉ đạo, điều hành, tổ chức thực hiện phải có quyết tâm chính trị cao.",
"<b>Bài học 4:</b> tập trung ưu tiên xây dựng đồng bộ thể chế phát triển, bảo đảm hài hòa giữa kiên định và đổi mới, kế thừa và phát triển; giữa đổi mới kinh tế và đổi mới chính trị, văn hóa, xã hội; giữa tuân theo quy luật thị trường và bảo đảm định hướng XHCN...",
"<b>Bài học 5:</b> chủ động nghiên cứu, nắm bắt, dự báo đúng tình hình, không để bị động, bất ngờ.",
"<b>Điểm mới đáng nhớ:</b> (1) \"khát vọng phát triển đất nước phồn vinh, hạnh phúc\" xuất hiện trong chủ đề, mục tiêu tổng quát, nhiệm vụ trọng tâm 4 và đột phá 2; (2) ba mốc 2025 – 2030 – 2045 gắn với ba ngày kỷ niệm lớn; (3) mở rộng quan hệ Nhà nước – thị trường thành <b>Nhà nước, thị trường và xã hội</b> và thêm quan hệ dân chủ – pháp chế (10 mối quan hệ); (4) chỉ tiêu kinh tế số khoảng 20% GDP, nhiệm vụ chuyển đổi số quốc gia; (5) Covid-19 trong nhiệm vụ trọng tâm; (6) không sửa đổi Điều lệ Đảng."]},

title:"Đại hội đại biểu toàn quốc lần thứ XI (12–19/01/2011) và lần thứ XII (20–28/01/2016) của Đảng",
meta:[["Đại hội XI","12–19/1/2011, Trung tâm Hội nghị quốc gia (Mỹ Đình), Hà Nội; 1.377 đại biểu, hơn 3,6 triệu đảng viên"],["Văn kiện XI","Cương lĩnh (bổ sung, phát triển năm 2011); Chiến lược phát triển KT-XH 2011–2020; Điều lệ Đảng (bổ sung, sửa đổi)"],["Đại hội XII","20–28/1/2016, Hà Nội; 1.510 đại biểu, hơn 4,5 triệu đảng viên"],["Văn kiện XII","Báo cáo chính trị; Báo cáo KT-XH 2011–2015 và phương hướng 2016–2020; không sửa đổi Điều lệ"],["Tổng Bí thư","Nguyễn Phú Trọng (bầu tại XI, tái cử tại XII)"],["BCH TW","Khóa XI: 175 chính thức + 25 dự khuyết, BCT 14. Khóa XII: 180 + 20; Chủ nhiệm UBKT TW Trần Quốc Vượng"]],
tldr:`<b>Đại hội XI</b> (<mark>1/2011</mark>) thông qua <b>Cương lĩnh bổ sung, phát triển năm 2011</b> và <b>Chiến lược 2011–2020</b> với <mark>3 đột phá chiến lược</mark>: thể chế kinh tế thị trường định hướng XHCN; nguồn nhân lực chất lượng cao; kết cấu hạ tầng đồng bộ. Mục tiêu: đến <mark>2020</mark> nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại; GDP <mark>7–8%/năm</mark>. <b>Đại hội XII</b> (<mark>1/2016</mark>) với <mark>1.510</mark> đại biểu, đề ra <mark>6 nhiệm vụ trọng tâm</mark>, GDP <mark>6,5–7%/năm</mark>, GDP/người 2020 <mark>3.200–3.500 USD</mark>; nhiệm vụ 1 nêu rõ ngăn chặn <b>"tự diễn biến", "tự chuyển hóa"</b>.`,
sections:[
{h:"Đại hội XI – thông tin và chủ đề",items:[
"<b>Thời gian, địa điểm:</b> 12–19/1/2011 (phiên trù bị 11/1), Trung tâm Hội nghị quốc gia, Mỹ Đình, Hà Nội.",
"<b>Đại biểu:</b> 1.377, thay mặt hơn 3,6 triệu đảng viên ở gần 54.000 tổ chức cơ sở đảng.",
"<b>Chủ đề:</b> \"Tiếp tục nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, phát huy sức mạnh toàn dân tộc, đẩy mạnh toàn diện công cuộc đổi mới, <b>tạo nền tảng để đến năm 2020 nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại</b>.\"",
"<b>Nhân sự:</b> BCH TW 175 chính thức, 25 dự khuyết (bầu sáng 18/1/2011); Bộ Chính trị 14; <b>Nguyễn Phú Trọng</b> được bầu làm Tổng Bí thư (Tổng Bí thư Nông Đức Mạnh không tái cử).",
"<b>Văn kiện:</b> Cương lĩnh (bổ sung, phát triển năm 2011) – 8 đặc trưng, 8 phương hướng, 8 mối quan hệ lớn (xem mục Cương lĩnh); Chiến lược 2011–2020; Điều lệ Đảng bổ sung, sửa đổi."]},
{h:"Chiến lược phát triển KT-XH 2011–2020",items:[
"<b>Mục tiêu tổng quát:</b> \"Phấn đấu đến năm 2020 nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại\"; tạo tiền đề vững chắc để phát triển cao hơn trong giai đoạn sau.",
"<b>5 quan điểm phát triển:</b> (1) phát triển nhanh gắn liền với phát triển bền vững; (2) đổi mới đồng bộ, phù hợp về kinh tế và chính trị; (3) mở rộng dân chủ, phát huy tối đa nhân tố con người; (4) phát triển mạnh mẽ lực lượng sản xuất với trình độ khoa học, công nghệ ngày càng cao; (5) xây dựng nền kinh tế độc lập, tự chủ ngày càng cao trong điều kiện hội nhập quốc tế ngày càng sâu rộng.",
"<b>Chỉ tiêu:</b> GDP bình quân <b>7–8%/năm</b>; công nghiệp và dịch vụ khoảng <b>85% GDP</b>; lao động nông nghiệp khoảng <b>30–35%</b>; lao động qua đào tạo <b>trên 70%</b>."]},
{h:"3 đột phá chiến lược (Đại hội XI) và sự tiếp nối",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li>"Hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa, <b>trọng tâm là tạo lập môi trường cạnh tranh bình đẳng và cải cách hành chính</b>."</li>
<li>"Phát triển nhanh nguồn nhân lực, nhất là nguồn nhân lực chất lượng cao, <b>tập trung vào việc đổi mới căn bản và toàn diện nền giáo dục quốc dân</b>; gắn kết chặt chẽ phát triển nguồn nhân lực với phát triển và ứng dụng khoa học, công nghệ."</li>
<li>"Xây dựng hệ thống kết cấu hạ tầng đồng bộ, với một số công trình hiện đại, <b>tập trung vào hệ thống giao thông và hạ tầng đô thị lớn</b>."</li></ol>
<div class="tablewrap" style="margin-top:.6rem"><table class="nums"><thead><tr><th>Đại hội</th><th>Thể chế</th><th>Nhân lực</th><th>Hạ tầng</th></tr></thead><tbody>
<tr><td>XI (2011)</td><td>Thể chế KTTT định hướng XHCN; cạnh tranh bình đẳng, cải cách hành chính</td><td>Nhân lực chất lượng cao; đổi mới giáo dục quốc dân</td><td>Đồng bộ, một số công trình hiện đại; giao thông, đô thị lớn</td></tr>
<tr><td>XII (2016)</td><td colspan="3">"Tiếp tục thực hiện có hiệu quả ba đột phá chiến lược" (nằm trong nhiệm vụ trọng tâm 3)</td></tr>
<tr><td>XIII (2021)</td><td>Thể chế phát triển, trước hết thể chế KTTT; quản trị quốc gia hiện đại</td><td>Nhân lực, nhất là chất lượng cao; khát vọng phát triển</td><td>Đồng bộ, hiện đại cả kinh tế và xã hội; chuyển đổi số</td></tr>
<tr><td>XIV (2026)</td><td>Thể chế và thực thi</td><td>Nhân lực chất lượng cao gắn với KHCN, đổi mới sáng tạo</td><td>Hạ tầng đồng bộ, hiện đại</td></tr>
</tbody></table></div>`},
{h:"Đại hội XII – thông tin và chủ đề",items:[
"<b>Thời gian:</b> 20–28/1/2016, Hà Nội; hơn 8 ngày làm việc.",
"<b>Đại biểu:</b> <b>1.510</b> – nhiều nhất trong 12 kỳ Đại hội tính đến khi đó; thay mặt hơn 4,5 triệu đảng viên.",
"<b>Chủ đề:</b> \"Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc và dân chủ xã hội chủ nghĩa; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; <b>phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại</b>.\"",
"<b>Nhân sự:</b> BCH TW 200 (180 chính thức, 20 dự khuyết); <b>Nguyễn Phú Trọng</b> tái cử Tổng Bí thư; <b>Trần Quốc Vượng</b> làm Chủ nhiệm UBKT TW.",
"<b>Văn kiện:</b> Báo cáo chính trị; báo cáo KT-XH 2011–2015 và phương hướng 2016–2020; kiểm điểm BCH TW khóa XI; tổng kết thi hành Điều lệ – Đại hội <b>không sửa đổi Điều lệ</b>; tổng kết Nghị quyết TW 4 khóa XI về xây dựng Đảng; tổng kết 30 năm đổi mới."]},
{h:"Đại hội XII – mục tiêu và chỉ tiêu 2016–2020",items:[
"<b>Mục tiêu tổng quát:</b> tăng cường xây dựng Đảng trong sạch, vững mạnh, nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, xây dựng hệ thống chính trị vững mạnh; phát huy sức mạnh toàn dân tộc và dân chủ XHCN; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; phát triển kinh tế nhanh, bền vững, <b>phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại</b>; nâng cao đời sống nhân dân; bảo vệ vững chắc Tổ quốc; nâng cao vị thế, uy tín của Việt Nam.",
"Tăng trưởng GDP bình quân 5 năm <b>6,5–7%/năm</b>; GDP bình quân đầu người năm 2020 khoảng <b>3.200–3.500 USD</b>.",
"Công nghiệp và dịch vụ khoảng <b>85% GDP</b>; tổng vốn đầu tư toàn xã hội khoảng 32–34% GDP; bội chi ngân sách khoảng 4% GDP.",
"TFP đóng góp khoảng <b>30–35%</b>; năng suất lao động xã hội tăng khoảng 5%/năm; tiêu hao năng lượng/GDP giảm 1–1,5%/năm; đô thị hóa năm 2020 <b>38–40%</b>; bảo hiểm y tế trên 80% dân số."]},
{h:"Đại hội XII – 6 nhiệm vụ trọng tâm",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li>Tăng cường xây dựng, chỉnh đốn Đảng; ngăn chặn, đẩy lùi sự suy thoái về tư tưởng chính trị, đạo đức, lối sống, biểu hiện <b>"tự diễn biến", "tự chuyển hóa"</b> trong nội bộ; xây dựng đội ngũ cán bộ, nhất là <b>cán bộ cấp chiến lược</b>, đủ năng lực, phẩm chất và uy tín, ngang tầm nhiệm vụ.</li>
<li>Xây dựng tổ chức bộ máy của toàn hệ thống chính trị <b>tinh gọn, hoạt động hiệu lực, hiệu quả</b>; đẩy mạnh đấu tranh phòng, chống tham nhũng, lãng phí, quan liêu.</li>
<li>Nâng cao chất lượng tăng trưởng, năng suất lao động và sức cạnh tranh; tiếp tục thực hiện có hiệu quả <b>ba đột phá chiến lược</b>; cơ cấu lại tổng thể nền kinh tế gắn với đổi mới mô hình tăng trưởng; CNH, HĐH, chú trọng nông nghiệp, nông thôn gắn với nông thôn mới; cơ cấu lại doanh nghiệp nhà nước, ngân sách, xử lý nợ xấu, bảo đảm an toàn nợ công.</li>
<li>Kiên quyết, kiên trì đấu tranh bảo vệ vững chắc độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ; giữ vững môi trường hòa bình, ổn định; mở rộng và đưa vào chiều sâu các quan hệ đối ngoại, hội nhập quốc tế.</li>
<li>Thu hút, phát huy mạnh mẽ mọi nguồn lực và sức sáng tạo của nhân dân; chăm lo đời sống vật chất, tinh thần; an sinh xã hội, giảm nghèo bền vững; phát huy quyền làm chủ của nhân dân và sức mạnh đại đoàn kết toàn dân tộc.</li>
<li>Phát huy <b>nhân tố con người</b> trong mọi lĩnh vực; xây dựng con người về đạo đức, nhân cách, lối sống, trí tuệ và năng lực làm việc; xây dựng môi trường văn hóa lành mạnh.</li></ol>`},
{h:"So sánh nhanh XI – XII – XIII",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Nội dung</th><th>XI (2011)</th><th>XII (2016)</th><th>XIII (2021)</th></tr></thead><tbody>
<tr><td>Đại biểu / đảng viên</td><td>1.377 / hơn 3,6 triệu</td><td>1.510 / hơn 4,5 triệu</td><td>1.587 / gần 5,2 triệu</td></tr>
<tr><td>BCH TW</td><td>175 + 25</td><td>180 + 20</td><td>180 + 20</td></tr>
<tr><td>Tăng trưởng GDP mục tiêu</td><td>7–8%/năm (Chiến lược 2011–2020)</td><td>6,5–7%/năm (2016–2020)</td><td>6,5–7%/năm (2021–2025)</td></tr>
<tr><td>GDP bình quân đầu người</td><td>—</td><td>3.200–3.500 USD (2020)</td><td>4.700–5.000 USD (2025)</td></tr>
<tr><td>Nhiệm vụ trọng tâm</td><td>—</td><td>6</td><td>6</td></tr>
<tr><td>Mối quan hệ lớn</td><td>8 (Cương lĩnh 2011)</td><td>9</td><td>10</td></tr>
<tr><td>Điều lệ Đảng</td><td>Bổ sung, sửa đổi</td><td>Không sửa đổi</td><td>Không sửa đổi</td></tr>
</tbody></table></div>`}
],

CONFUSE.push(
{doc:"lsdh",a:"Đại hội I của Đảng họp ở Hương Cảng?",b:"Không. Đại hội I (27–31/3/1935) họp ở <b>Ma Cao</b>. <b>Hương Cảng</b> là nơi diễn ra <b>Hội nghị thành lập Đảng</b> (đầu năm 1930, Cửu Long) và <b>Hội nghị BCH TW lần thứ nhất</b> (10/1930).",tip:"Thành lập và Luận cương: Hương Cảng; Đại hội I: Ma Cao."},
{doc:"lsdh",a:"Tên \"Đảng Cộng sản Đông Dương\" do Đại hội I đặt?",b:"Không. Đổi tên thành Đảng Cộng sản Đông Dương tại <b>Hội nghị BCH TW lần thứ nhất (10/1930)</b>. <b>Đại hội II (1951)</b> đặt tên <b>Đảng Lao động Việt Nam</b>; <b>Đại hội IV (1976)</b> đổi thành <b>Đảng Cộng sản Việt Nam</b>.",tip:"30 – 51 – 76."},
{doc:"lsdh",a:"Lê Duẩn được bầu làm Tổng Bí thư tại Đại hội III?",b:"Đại hội III (1960) bầu Lê Duẩn làm <b>Bí thư thứ nhất</b>; Hồ Chí Minh là <b>Chủ tịch Đảng</b>. Đại hội IV (1976) dùng lại chức danh <b>Tổng Bí thư</b> và bầu Lê Duẩn.",tip:""},
{doc:"lsdh",a:"Đại hội XIV có số đại biểu đông nhất?",b:"Không. Đông nhất là <b>Đại hội XIII: 1.587</b>. Đại hội XIV: <b>1.586</b>. Đại hội XII: 1.510 (đông nhất trong 12 kỳ tính đến 2016).",tip:"XIII hơn XIV đúng 1 đại biểu."},
{doc:"lsdh",a:"Đại hội VI khởi xướng đổi mới và thông qua Cương lĩnh?",b:"Đại hội <b>VI (12/1986)</b> khởi xướng đường lối đổi mới. <b>Cương lĩnh</b> xây dựng đất nước trong thời kỳ quá độ được thông qua tại <b>Đại hội VII (6/1991)</b>. Đại hội VIII (1996) chuyển sang thời kỳ đẩy mạnh CNH, HĐH.",tip:"VI đổi mới – VII Cương lĩnh – VIII CNH."},
{doc:"lsdh",a:"Ngày 3/2 là ngày khai mạc Hội nghị thành lập Đảng?",b:"Tài liệu hiện hành ghi Hội nghị thành lập Đảng họp <b>từ 6/1 đến 7/2/1930</b> (một số tài liệu ghi 3–7/2/1930). Ngày <b>3/2</b> là <b>ngày kỷ niệm</b> do <b>Đại hội III (1960)</b> quyết định.",tip:""},
{doc:"cuongling",a:"Cương lĩnh 1991 và Cương lĩnh 2011 đều có 8 đặc trưng?",b:"Không. <b>1991: 6 đặc trưng</b>, <b>2011: 8 đặc trưng</b>. Bản 2011 thêm \"<b>Dân giàu, nước mạnh, dân chủ, công bằng, văn minh</b>\" và \"có <b>Nhà nước pháp quyền XHCN</b> của nhân dân, do nhân dân, vì nhân dân do Đảng Cộng sản lãnh đạo\".",tip:"1991: 6–7; 2011: 8–8–8."},
{doc:"cuongling",a:"Cương lĩnh 2011 giữ nguyên cụm \"do nhân dân lao động làm chủ\"?",b:"Không. 1991: \"Do <b>nhân dân lao động</b> làm chủ\"; 2011: \"do <b>nhân dân</b> làm chủ\". Cơ sở kinh tế: 1991 \"chế độ công hữu về các tư liệu sản xuất chủ yếu\"; 2011 \"quan hệ sản xuất tiến bộ phù hợp\".",tip:""},
{doc:"cuongling",a:"Cương lĩnh 2011 có 9 (hoặc 10) mối quan hệ lớn?",b:"<b>Cương lĩnh 2011: 8</b> mối quan hệ lớn. <b>Đại hội XII</b> bổ sung quan hệ Nhà nước – thị trường (<b>9</b>). <b>Đại hội XIII</b> nêu <b>10</b>: mở rộng thành \"Nhà nước, thị trường và xã hội\" và thêm \"thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội\".",tip:"8 – 9 – 10 theo XI – XII – XIII."},
{doc:"cuongling",a:"Bài học 5: sự lãnh đạo đúng đắn của Đảng là nhân tố hàng đầu \"bảo đảm\" thắng lợi – theo Cương lĩnh 2011?",b:"Cương lĩnh <b>1991</b> viết \"nhân tố hàng đầu <b>bảo đảm</b> thắng lợi\"; Cương lĩnh <b>2011</b> viết \"nhân tố hàng đầu <b>quyết định</b> thắng lợi của cách mạng Việt Nam\".",tip:"2011 mạnh hơn: quyết định."},
{doc:"cuongling",a:"Luận cương chính trị 10/1930 do Nguyễn Ái Quốc soạn?",b:"Không. Cương lĩnh đầu tiên (Chánh cương, Sách lược vắn tắt) do <b>Nguyễn Ái Quốc</b> soạn; <b>Luận cương chính trị</b> do <b>Trần Phú</b> khởi thảo, thông qua tại Hội nghị TW lần thứ nhất (14–31/10/1930), kèm việc đổi tên thành Đảng Cộng sản Đông Dương.",tip:""},
{doc:"cuongling",a:"Mục tiêu đến giữa thế kỷ XXI trong Cương lĩnh 2011 là \"nước phát triển, thu nhập cao\"?",b:"Cương lĩnh 2011: \"một <b>nước công nghiệp hiện đại</b>, theo định hướng xã hội chủ nghĩa\". Đại hội XIII: đến giữa thế kỷ XXI \"<b>nước phát triển</b>, theo định hướng XHCN\"; mốc 2045: \"nước phát triển, thu nhập cao\".",tip:""},
{doc:"dh13",a:"Ba đột phá chiến lược của Đại hội XIII và XIV giống hệt nhau?",b:"Cùng 3 lĩnh vực nhưng khác diễn đạt. <b>XIII:</b> hoàn thiện đồng bộ <b>thể chế phát triển</b>, trước hết thể chế KTTT định hướng XHCN, đổi mới quản trị quốc gia; nguồn nhân lực, nhất là chất lượng cao; hạ tầng đồng bộ, hiện đại cả kinh tế và xã hội. <b>XIV:</b> đột phá về <b>thể chế và thực thi</b>; nhân lực chất lượng cao <b>gắn với khoa học, công nghệ, đổi mới sáng tạo</b>; hạ tầng đồng bộ, hiện đại.",tip:"XIV thêm \"thực thi\" và gắn nhân lực với KHCN."},
{doc:"dh13",a:"Mục tiêu năm 2025 theo Đại hội XIII là thu nhập trung bình cao?",b:"<b>2025:</b> có công nghiệp <b>theo hướng hiện đại</b>, <b>vượt qua mức thu nhập trung bình thấp</b>. <b>2030:</b> có <b>công nghiệp hiện đại</b>, <b>thu nhập trung bình cao</b>. <b>2045:</b> nước phát triển, thu nhập cao.",tip:"25 thấp – 30 trung bình cao – 45 cao."},
{doc:"dh13",a:"Chỉ tiêu tăng trưởng GDP của Đại hội XIII khác Đại hội XII?",b:"Giống nhau: <b>6,5–7%/năm</b> (XII cho 2016–2020, XIII cho 2021–2025). Khác: Chiến lược 2011–2020 (XI) 7–8%/năm; Đại hội XIV đặt mục tiêu từ 10%/năm cho 2026–2030.",tip:""},
{doc:"dh13",a:"Các con số của Đại hội XIII: 6 đột phá, 3 nhiệm vụ trọng tâm?",b:"Ngược lại: <b>6 nhiệm vụ trọng tâm, 3 đột phá chiến lược</b>; ngoài ra 5 quan điểm, 12 định hướng 2021–2030, 10 mối quan hệ lớn, 5 bài học.",tip:"5 – 6 – 3 – 12 – 10 – 5."},
{doc:"dh13",a:"\"Tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình\" là chủ đề Đại hội XIII?",b:"Không, đó là chủ đề <b>Đại hội XIV</b>. Chủ đề XIII có cụm \"<b>khơi dậy khát vọng phát triển đất nước</b>\" và \"phấn đấu đến giữa thế kỷ XXI, nước ta trở thành nước phát triển, theo định hướng xã hội chủ nghĩa\".",tip:""},
{doc:"dh11_12",a:"Đột phá thể chế của Đại hội XI có trọng tâm là \"đổi mới quản trị quốc gia theo hướng hiện đại\"?",b:"Không. XI: thể chế KTTT định hướng XHCN, <b>trọng tâm là tạo lập môi trường cạnh tranh bình đẳng và cải cách hành chính</b>. \"Đổi mới quản trị quốc gia theo hướng hiện đại, cạnh tranh hiệu quả\" là của <b>XIII</b>.",tip:""},
{doc:"dh11_12",a:"Đột phá hạ tầng của XI và XIII cùng nhấn mạnh hạ tầng số?",b:"XI: \"tập trung vào <b>hệ thống giao thông và hạ tầng đô thị lớn</b>\". XIII: hạ tầng đồng bộ, hiện đại <b>cả về kinh tế và xã hội</b>, chú trọng <b>hạ tầng thông tin, viễn thông</b>, nền tảng chuyển đổi số.",tip:""},
{doc:"dh11_12",a:"Chủ đề Đại hội XII kết thúc bằng \"tạo nền tảng để đến năm 2020...\"?",b:"Không. Đó là chủ đề <b>XI</b>. Chủ đề <b>XII</b> kết thúc bằng \"<b>phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại</b>\" và có cụm \"phát huy sức mạnh toàn dân tộc và dân chủ xã hội chủ nghĩa\".",tip:"XI: tạo nền tảng; XII: phấn đấu sớm."},
{doc:"dh11_12",a:"Đại hội XII sửa đổi Điều lệ Đảng?",b:"Không. <b>XI</b> thông qua Điều lệ bổ sung, sửa đổi; <b>XII</b> và <b>XIII</b> không sửa đổi Điều lệ.",tip:""},
{doc:"dh11_12",a:"Nhiệm vụ trọng tâm của XII có kiểm soát dịch Covid-19 và chuyển đổi số quốc gia?",b:"Không, đó là nhiệm vụ 2 của <b>XIII</b>. Nhiệm vụ 3 của <b>XII</b> là nâng cao chất lượng tăng trưởng, thực hiện ba đột phá, cơ cấu lại doanh nghiệp nhà nước, ngân sách, xử lý nợ xấu, an toàn nợ công.",tip:""}
);

FLASH.push(
{doc:"lsdh",q:"Đại hội I: thời gian, địa điểm, Tổng Bí thư?",a:"<b>27–31/3/1935</b>, <b>Ma Cao</b> (Trung Quốc), 13 đại biểu; bầu BCH TW 13 ủy viên; Tổng Bí thư <b>Lê Hồng Phong</b>; cử Nguyễn Ái Quốc làm đại biểu bên cạnh Quốc tế Cộng sản."},
{doc:"lsdh",q:"Đại hội II: thời gian, địa điểm, quyết định lớn?",a:"<b>11–19/2/1951</b>, xã Vinh Quang, Chiêm Hóa, <b>Tuyên Quang</b>; Đảng ra hoạt động công khai với tên <b>Đảng Lao động Việt Nam</b>; Chủ tịch Đảng Hồ Chí Minh, Tổng Bí thư Trường Chinh."},
{doc:"lsdh",q:"Đại hội III: đường lối và lãnh đạo?",a:"<b>5–10/9/1960</b>, Hà Nội: tiến hành cách mạng XHCN ở miền Bắc, cách mạng dân tộc dân chủ nhân dân ở miền Nam; Kế hoạch 5 năm 1961–1965; Hồ Chí Minh Chủ tịch Đảng, <b>Lê Duẩn Bí thư thứ nhất</b>; lấy 3/2 làm ngày thành lập Đảng."},
{doc:"lsdh",q:"Đại hội IV quyết định gì về tên Đảng và chức danh?",a:"<b>14–20/12/1976</b>: đổi tên thành <b>Đảng Cộng sản Việt Nam</b>; dùng lại chức danh <b>Tổng Bí thư</b> (Lê Duẩn); 1.008 đại biểu."},
{doc:"lsdh",q:"Đại hội VI (1986) – dấu ấn?",a:"<b>15–18/12/1986</b>: khởi xướng <b>đường lối đổi mới</b>, bắt đầu từ đổi mới tư duy, trước hết là tư duy kinh tế; tinh thần \"nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật\"; Tổng Bí thư <b>Nguyễn Văn Linh</b>."},
{doc:"lsdh",q:"Đại hội VII (1991) thông qua những văn kiện chiến lược nào?",a:"<b>Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH</b> và <b>Chiến lược ổn định và phát triển KT-XH đến năm 2000</b>; Tổng Bí thư Đỗ Mười."},
{doc:"lsdh",q:"Đại hội VIII (1996) nhận định gì?",a:"Nước ta <b>đã ra khỏi khủng hoảng KT-XH</b>, chuyển sang thời kỳ <b>đẩy mạnh CNH, HĐH</b>; phấn đấu đến 2020 cơ bản trở thành nước công nghiệp."},
{doc:"lsdh",q:"Đại hội IX (2001) – mô hình kinh tế?",a:"<b>Kinh tế thị trường định hướng XHCN</b> là mô hình kinh tế tổng quát của thời kỳ quá độ; Chiến lược 2001–2010; Tổng Bí thư <b>Nông Đức Mạnh</b>."},
{doc:"lsdh",q:"Đại hội X (2006) – điểm đáng nhớ?",a:"<b>18–25/4/2006</b>: tổng kết 20 năm đổi mới; mục tiêu <b>sớm đưa nước ta ra khỏi tình trạng kém phát triển</b>; chính thức nêu vấn đề <b>đảng viên làm kinh tế tư nhân</b>."},
{doc:"lsdh",q:"Ba lần đổi tên Đảng?",a:"<b>10/1930</b> Đảng Cộng sản Đông Dương (Hội nghị TW 1) → <b>1951</b> Đảng Lao động Việt Nam (Đại hội II) → <b>1976</b> Đảng Cộng sản Việt Nam (Đại hội IV)."},
{doc:"lsdh",q:"Đại hội XIV: thời gian, đại biểu, Tổng Bí thư?",a:"<b>19–23/1/2026</b> (khai mạc 20/1), Trung tâm Hội nghị quốc gia; <b>1.586</b> đại biểu, hơn 5,6 triệu đảng viên; BCH TW 180 + 20, Bộ Chính trị 19; Tổng Bí thư <b>Tô Lâm</b>."},
{doc:"cuongling",q:"Cương lĩnh chính trị đầu tiên gồm những văn kiện nào, ai soạn?",a:"<b>Chánh cương vắn tắt, Sách lược vắn tắt</b> do <b>Nguyễn Ái Quốc</b> soạn thảo, thông qua tại Hội nghị thành lập Đảng (đầu năm 1930, Cửu Long, Hương Cảng); Hội nghị còn thông qua Chương trình tóm tắt, Điều lệ vắn tắt."},
{doc:"cuongling",q:"Phương hướng chiến lược của Cương lĩnh đầu tiên?",a:"Làm <b>tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản</b>; độc lập dân tộc đặt lên hàng đầu."},
{doc:"cuongling",q:"Luận cương chính trị 10/1930: ai khởi thảo, Hội nghị nào, hệ quả về tên Đảng?",a:"<b>Trần Phú</b>; Hội nghị BCH TW lần thứ nhất (<b>14–31/10/1930</b>, Hương Cảng); đổi tên thành <b>Đảng Cộng sản Đông Dương</b>, Trần Phú làm Tổng Bí thư."},
{doc:"cuongling",q:"Hạn chế chính của Luận cương 10/1930?",a:"Nhận thức chưa đầy đủ về <b>vấn đề dân tộc</b> và <b>lực lượng cách mạng</b>: nặng đấu tranh giai cấp, ruộng đất; thu hẹp lực lượng chủ yếu là công – nông."},
{doc:"cuongling",q:"Cương lĩnh 1991: bao nhiêu đặc trưng, phương hướng, bài học?",a:"<b>6</b> đặc trưng, <b>7</b> phương hướng cơ bản, <b>5</b> bài học lớn; thông qua tại Đại hội VII (6/1991)."},
{doc:"cuongling",q:"Cương lĩnh 2011: các con số?",a:"<b>8</b> đặc trưng, <b>8</b> phương hướng cơ bản, <b>8</b> mối quan hệ lớn, <b>5</b> bài học; thông qua tại Đại hội XI (1/2011)."},
{doc:"cuongling",q:"Đặc trưng thứ nhất của xã hội XHCN theo Cương lĩnh 2011?",a:"\"<b>Dân giàu, nước mạnh, dân chủ, công bằng, văn minh</b>\" (Cương lĩnh 1991 mở đầu bằng \"Do nhân dân lao động làm chủ\")."},
{doc:"cuongling",q:"Hai mối quan hệ lớn mới trong văn kiện Đại hội XIII?",a:"\"Giữa <b>Nhà nước, thị trường và xã hội</b>\" (mở rộng quan hệ Nhà nước – thị trường của XII) và \"giữa <b>thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội</b>\" → tổng cộng 10."},
{doc:"cuongling",q:"Mục tiêu tổng quát khi kết thúc thời kỳ quá độ (Cương lĩnh 2011)?",a:"Xây dựng được về cơ bản <b>nền tảng kinh tế của CNXH</b> với kiến trúc thượng tầng về chính trị, tư tưởng, văn hóa phù hợp, tạo cơ sở để nước ta trở thành một nước XHCN <b>ngày càng phồn vinh, hạnh phúc</b>."},
{doc:"cuongling",q:"Theo Cương lĩnh 2011, Đảng Cộng sản Việt Nam là gì?",a:"Đội tiên phong của giai cấp công nhân, <b>đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam</b>; đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của dân tộc."},
{doc:"dh13",q:"Chủ đề Đại hội XIII (cụm then chốt)?",a:"\"Tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh; <b>khơi dậy khát vọng phát triển đất nước</b>... phấn đấu đến giữa thế kỷ XXI, nước ta trở thành <b>nước phát triển, theo định hướng XHCN</b>.\""},
{doc:"dh13",q:"Ba mốc mục tiêu và ngày kỷ niệm tương ứng?",a:"<b>2025</b> (50 năm giải phóng miền Nam): vượt mức thu nhập trung bình thấp; <b>2030</b> (100 năm thành lập Đảng): công nghiệp hiện đại, thu nhập trung bình cao; <b>2045</b> (100 năm thành lập nước): nước phát triển, thu nhập cao."},
{doc:"dh13",q:"Ba đột phá chiến lược của Đại hội XIII?",a:"(1) <b>Thể chế phát triển</b>, trước hết thể chế KTTT định hướng XHCN; đổi mới quản trị quốc gia. (2) <b>Nguồn nhân lực</b>, nhất là chất lượng cao. (3) <b>Kết cấu hạ tầng</b> đồng bộ, hiện đại cả về kinh tế và xã hội."},
{doc:"dh13",q:"Bốn chỉ tiêu kinh tế quan trọng nhất 2021–2025?",a:"GDP <b>6,5–7%/năm</b>; GDP/người <b>4.700–5.000 USD</b>; công nghiệp chế biến, chế tạo <b>trên 25%</b> GDP; kinh tế số <b>khoảng 20%</b> GDP."},
{doc:"dh13",q:"Bộ con số khung của văn kiện XIII?",a:"<b>5</b> quan điểm – <b>6</b> nhiệm vụ trọng tâm – <b>3</b> đột phá – <b>12</b> định hướng 2021–2030 – <b>10</b> mối quan hệ lớn – <b>5</b> bài học."},
{doc:"dh13",q:"Nhiệm vụ trọng tâm thứ 4 của Đại hội XIII?",a:"<b>Khơi dậy khát vọng phát triển đất nước phồn vinh, hạnh phúc</b>; phát huy giá trị văn hóa, sức mạnh con người Việt Nam; an ninh xã hội, an ninh con người; nâng cao chất lượng cuộc sống và <b>chỉ số hạnh phúc</b>."},
{doc:"dh13",q:"Đánh giá nổi bật về 35 năm đổi mới?",a:"\"Đất nước ta <b>chưa bao giờ có được cơ đồ, tiềm lực, vị thế và uy tín quốc tế như ngày nay</b>.\""},
{doc:"dh13",q:"Nhân sự khóa XIII?",a:"BCH TW <b>180 + 20</b>; Bộ Chính trị <b>18</b>; UBKT TW 19, Chủ nhiệm <b>Trần Cẩm Tú</b>; Tổng Bí thư <b>Nguyễn Phú Trọng</b> (tái cử); từ 3/8/2024 Tổng Bí thư <b>Tô Lâm</b>."},
{doc:"dh13",q:"Bài học thứ hai của Đại hội XIII?",a:"Trong mọi công việc của Đảng và Nhà nước, phải luôn quán triệt sâu sắc, thực hiện nghiêm túc quan điểm <b>\"dân là gốc\"</b>."},
{doc:"dh13",q:"Định hướng thứ 12 (2021–2030) nói gì?",a:"Tiếp tục nắm vững và xử lý tốt các <b>quan hệ lớn</b> – liệt kê <b>10</b> mối quan hệ, từ \"ổn định, đổi mới và phát triển\" đến \"thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội\"."},
{doc:"dh11_12",q:"Đại hội XI thông qua những văn kiện chiến lược nào?",a:"<b>Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH (bổ sung, phát triển năm 2011)</b>, <b>Chiến lược phát triển KT-XH 2011–2020</b>, Điều lệ Đảng (bổ sung, sửa đổi)."},
{doc:"dh11_12",q:"Ba đột phá chiến lược trong Chiến lược 2011–2020?",a:"(1) Thể chế KTTT định hướng XHCN – trọng tâm <b>môi trường cạnh tranh bình đẳng, cải cách hành chính</b>; (2) nhân lực chất lượng cao – <b>đổi mới căn bản, toàn diện nền giáo dục quốc dân</b>; (3) hạ tầng đồng bộ – <b>giao thông, hạ tầng đô thị lớn</b>."},
{doc:"dh11_12",q:"Mục tiêu tổng quát Chiến lược 2011–2020?",a:"Phấn đấu đến <b>năm 2020</b> nước ta <b>cơ bản trở thành nước công nghiệp theo hướng hiện đại</b>; GDP bình quân <b>7–8%/năm</b>."},
{doc:"dh11_12",q:"Chủ đề Đại hội XI?",a:"\"Tiếp tục nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng, phát huy sức mạnh toàn dân tộc, đẩy mạnh toàn diện công cuộc đổi mới, <b>tạo nền tảng để đến năm 2020</b> nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại.\""},
{doc:"dh11_12",q:"Chủ đề Đại hội XII?",a:"\"<b>Tăng cường xây dựng Đảng trong sạch, vững mạnh</b>; phát huy sức mạnh toàn dân tộc và dân chủ XHCN; đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; bảo vệ vững chắc Tổ quốc, giữ vững môi trường hòa bình, ổn định; <b>phấn đấu sớm</b> đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại.\""},
{doc:"dh11_12",q:"Chỉ tiêu kinh tế chủ yếu của Đại hội XII (2016–2020)?",a:"GDP <b>6,5–7%/năm</b>; GDP/người 2020 <b>3.200–3.500 USD</b>; công nghiệp, dịch vụ khoảng 85% GDP; đô thị hóa 38–40%; TFP 30–35%."},
{doc:"dh11_12",q:"Nhiệm vụ trọng tâm thứ nhất của Đại hội XII?",a:"Tăng cường xây dựng, chỉnh đốn Đảng; ngăn chặn, đẩy lùi suy thoái về tư tưởng chính trị, đạo đức, lối sống, biểu hiện <b>\"tự diễn biến\", \"tự chuyển hóa\"</b>; xây dựng cán bộ, nhất là <b>cấp chiến lược</b>."},
{doc:"dh11_12",q:"Nhiệm vụ trọng tâm thứ 6 của Đại hội XII?",a:"<b>Phát huy nhân tố con người</b> trong mọi lĩnh vực; xây dựng con người về đạo đức, nhân cách, lối sống, trí tuệ, năng lực làm việc; xây dựng môi trường văn hóa lành mạnh."},
{doc:"dh11_12",q:"Nhân sự chủ chốt Đại hội XI và XII?",a:"XI: BCH 175 + 25, Bộ Chính trị 14, Tổng Bí thư <b>Nguyễn Phú Trọng</b>. XII: BCH 180 + 20, Nguyễn Phú Trọng tái cử, Chủ nhiệm UBKT TW <b>Trần Quốc Vượng</b>."},
{doc:"dh11_12",q:"Năm quan điểm phát triển của Chiến lược 2011–2020?",a:"Phát triển nhanh gắn với bền vững; đổi mới đồng bộ kinh tế – chính trị; mở rộng dân chủ, phát huy nhân tố con người; phát triển mạnh lực lượng sản xuất với KHCN cao; kinh tế độc lập, tự chủ trong hội nhập sâu rộng."}
);

{doc:"dh11_12",q:"Theo Chiến lược 2011–2020, đột phá về nguồn nhân lực tập trung vào:",opts:["Đổi mới căn bản và toàn diện nền giáo dục quốc dân","Thu hút, trọng dụng nhân tài người Việt Nam ở nước ngoài","Phát triển nhân lực số và trí tuệ nhân tạo","Đào tạo nghề cho lao động nông thôn"],ans:0,ex:"Đồng thời gắn phát triển nguồn nhân lực với phát triển và ứng dụng khoa học, công nghệ.",ref:"3 đột phá"},
{doc:"dh11_12",q:"Theo Chiến lược 2011–2020, đột phá về kết cấu hạ tầng tập trung vào:",opts:["Hệ thống giao thông và hạ tầng đô thị lớn","Hạ tầng thông tin, viễn thông và chuyển đổi số","Thủy lợi và năng lượng tái tạo","Hạ tầng xã hội: y tế, giáo dục"],ans:0,ex:"Hạ tầng thông tin, viễn thông được nhấn mạnh trong đột phá 3 của Đại hội XIII.",ref:"3 đột phá"},
{doc:"dh11_12",q:"Mục tiêu tổng quát của Chiến lược 2011–2020 là đến năm 2020 nước ta:",opts:["Cơ bản trở thành nước công nghiệp theo hướng hiện đại","Trở thành nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao","Ra khỏi tình trạng kém phát triển","Trở thành nước công nghiệp hiện đại, theo định hướng XHCN"],ans:0,ex:"Phương án 2: mốc 2030 (Đại hội XIII); phương án 3: Đại hội X; phương án 4: mục tiêu giữa thế kỷ XXI của Cương lĩnh 2011.",ref:"Chiến lược 2011–2020"},
{doc:"dh11_12",q:"Chỉ tiêu tăng trưởng GDP bình quân trong Chiến lược 2011–2020:",opts:["7–8%/năm","6,5–7%/năm","8–9%/năm","6–7%/năm"],ans:0,ex:"6,5–7%/năm là chỉ tiêu của Đại hội XII (2016–2020) và Đại hội XIII (2021–2025).",ref:"Chiến lược 2011–2020"},
{doc:"dh11_12",q:"Chủ đề Đại hội nào có cụm \"tạo nền tảng để đến năm 2020 nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại\"?",opts:["Đại hội XI","Đại hội XII","Đại hội X","Đại hội IX"],ans:0,ex:"Chủ đề XII dùng \"phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại\".",ref:"Chủ đề XI"},
{doc:"dh11_12",q:"Số đại biểu dự Đại hội XII – nhiều nhất trong 12 kỳ Đại hội tính đến năm 2016 – là:",opts:["1.510","1.377","1.587","1.176"],ans:0,ex:"XI: 1.377; XIII: 1.587; 1.176 là số đại biểu Đại hội VII và X.",ref:"Đại hội XII"},
{doc:"dh11_12",q:"Chỉ tiêu GDP bình quân đầu người năm 2020 theo Đại hội XII:",opts:["Khoảng 3.200–3.500 USD","Khoảng 4.700–5.000 USD","Khoảng 3.000 USD","Khoảng 2.500–2.800 USD"],ans:0,ex:"4.700–5.000 USD là chỉ tiêu năm 2025 của Đại hội XIII.",ref:"Nghị quyết XII"},
{doc:"dh11_12",q:"Nhiệm vụ trọng tâm thứ nhất của Đại hội XII là:",opts:["Tăng cường xây dựng, chỉnh đốn Đảng; ngăn chặn, đẩy lùi suy thoái về tư tưởng chính trị, đạo đức, lối sống, biểu hiện \"tự diễn biến\", \"tự chuyển hóa\" trong nội bộ","Tập trung kiểm soát đại dịch Covid-19, phục hồi và phát triển kinh tế – xã hội","Phát huy nhân tố con người trong mọi lĩnh vực của đời sống xã hội","Quản lý chặt chẽ, sử dụng hợp lý, hiệu quả đất đai, tài nguyên"],ans:0,ex:"Covid-19 và đất đai, tài nguyên thuộc nhiệm vụ trọng tâm của Đại hội XIII; nhân tố con người là nhiệm vụ thứ 6 của XII.",ref:"Nhiệm vụ trọng tâm XII"},
{doc:"dh11_12",q:"\"Tiếp tục thực hiện có hiệu quả ba đột phá chiến lược\" nằm trong nhiệm vụ trọng tâm thứ mấy của Đại hội XII?",opts:["Thứ ba","Thứ nhất","Thứ hai","Thứ năm"],ans:0,ex:"Nhiệm vụ 3: chất lượng tăng trưởng, ba đột phá, cơ cấu lại kinh tế, nợ xấu, nợ công.",ref:"Nhiệm vụ trọng tâm XII"},
{doc:"dh11_12",q:"Chủ nhiệm Ủy ban Kiểm tra Trung ương khóa XII là:",opts:["Trần Quốc Vượng","Trần Cẩm Tú","Ngô Văn Dụ","Nguyễn Văn Chi"],ans:0,ex:"Trần Cẩm Tú: khóa XIII; Nguyễn Văn Chi: khóa X.",ref:"Đại hội XII"},
{doc:"dh11_12",q:"Ban Chấp hành Trung ương khóa XI gồm:",opts:["175 ủy viên chính thức và 25 ủy viên dự khuyết","180 ủy viên chính thức và 20 ủy viên dự khuyết","160 ủy viên chính thức và 21 ủy viên dự khuyết","170 ủy viên chính thức"],ans:0,ex:"180 + 20: khóa XII, XIII, XIV; 160 + 21: khóa X; 170: khóa VIII.",ref:"Đại hội XI"}
);

ESSAY.push(
{doc:"lsdh",q:"Trình bày vị trí của Đại hội VI (12/1986) trong lịch sử Đảng và sự phát triển đường lối đổi mới qua các Đại hội VII – XIII.",outline:["Bối cảnh: khủng hoảng KT-XH; Đại hội VI (15–18/12/1986), 1.129 đại biểu, Tổng Bí thư Nguyễn Văn Linh.","Nội dung: đổi mới toàn diện, bắt đầu từ đổi mới tư duy, trước hết là tư duy kinh tế; \"nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật\"; 4 bài học, \"lấy dân làm gốc\"; 3 chương trình kinh tế.","Phát triển: VII – Cương lĩnh 1991, Chiến lược đến 2000; VIII – ra khỏi khủng hoảng, đẩy mạnh CNH, HĐH; IX – kinh tế thị trường định hướng XHCN; X – 20 năm đổi mới, ra khỏi tình trạng kém phát triển; XI – Cương lĩnh 2011, 3 đột phá; XII – 30 năm đổi mới; XIII – 35 năm đổi mới, \"chưa bao giờ có được cơ đồ...\", tầm nhìn 2045.","Ý nghĩa và liên hệ: đổi mới tư duy trong công tác xuất bản, biên tập; trách nhiệm của viên chức."]},
{doc:"lsdh",q:"Phân tích ý nghĩa của Đại hội II (1951) và Đại hội III (1960) đối với cách mạng Việt Nam.",outline:["Đại hội II: 11–19/2/1951, Chiêm Hóa, Tuyên Quang; Đảng ra công khai với tên Đảng Lao động Việt Nam; mỗi nước Đông Dương một đảng; Chính cương, Tuyên ngôn, Điều lệ; Chủ tịch Đảng Hồ Chí Minh, Tổng Bí thư Trường Chinh; thúc đẩy kháng chiến chống Pháp thắng lợi.","Đại hội III: 5–10/9/1960, Hà Nội; tiến hành đồng thời cách mạng XHCN ở miền Bắc (quyết định nhất) và cách mạng dân tộc dân chủ nhân dân ở miền Nam (quyết định trực tiếp); Kế hoạch 5 năm 1961–1965; Bí thư thứ nhất Lê Duẩn; lấy 3/2 là ngày thành lập Đảng.","Ý nghĩa: hoàn chỉnh đường lối kháng chiến, kiến quốc; nền tảng cho thắng lợi 1975."]},
{doc:"lsdh",q:"Nêu quá trình thay đổi tên Đảng và chức danh người đứng đầu Đảng qua các thời kỳ; giải thích ý nghĩa của các lần đổi tên.",outline:["2/1930: Đảng Cộng sản Việt Nam (Hội nghị thành lập).","10/1930: Đảng Cộng sản Đông Dương (Hội nghị TW 1, Luận cương) – phạm vi Đông Dương.","1951: Đảng Lao động Việt Nam (Đại hội II) – ra công khai, mỗi nước Đông Dương một đảng.","1976: Đảng Cộng sản Việt Nam (Đại hội IV) – cả nước đi lên CNXH.","Chức danh: Tổng Bí thư; Chủ tịch Đảng (Hồ Chí Minh, II–III); Bí thư thứ nhất (Lê Duẩn, III); dùng lại Tổng Bí thư từ IV.","Danh sách Tổng Bí thư do các Đại hội bầu, đến Tô Lâm (XIV)."]},
{doc:"cuongling",q:"So sánh Cương lĩnh chính trị đầu tiên (đầu năm 1930) với Luận cương chính trị (10/1930). Vì sao nói Cương lĩnh đầu tiên đúng đắn, sáng tạo?",outline:["Hoàn cảnh: Hội nghị thành lập Đảng (Cửu Long, Hương Cảng; Nguyễn Ái Quốc) và Hội nghị TW lần thứ nhất (14–31/10/1930; Trần Phú).","Điểm giống: cách mạng tư sản dân quyền tiến lên CNXH; vô sản lãnh đạo qua Đảng; bộ phận của cách mạng thế giới.","Điểm khác: nhiệm vụ hàng đầu (độc lập dân tộc vs nặng giai cấp, ruộng đất); lực lượng (rộng rãi vs chủ yếu công – nông); phạm vi (Việt Nam vs Đông Dương); tên Đảng.","Kết luận: Cương lĩnh đầu tiên kết hợp độc lập dân tộc và CNXH, đặt giải phóng dân tộc lên hàng đầu, tập hợp rộng rãi lực lượng; hạn chế của Luận cương được khắc phục dần trong thực tiễn."]},
{doc:"cuongling",q:"Phân tích những điểm bổ sung, phát triển của Cương lĩnh năm 2011 so với Cương lĩnh năm 1991.",outline:["Giới thiệu: Cương lĩnh 1991 (Đại hội VII) và Cương lĩnh 2011 (Đại hội XI); bố cục 4 phần.","Đặc trưng: 6 → 8; thêm \"dân giàu, nước mạnh, dân chủ, công bằng, văn minh\" và Nhà nước pháp quyền XHCN; \"nhân dân lao động làm chủ\" → \"nhân dân làm chủ\"; \"công hữu tư liệu sản xuất chủ yếu\" → \"quan hệ sản xuất tiến bộ phù hợp\".","Phương hướng: 7 → 8 (CNH, HĐH gắn kinh tế tri thức; kinh tế thị trường định hướng XHCN; đối ngoại, hội nhập; Nhà nước pháp quyền).","8 mối quan hệ lớn; phát triển tiếp tại XII (9) và XIII (10).","Mục tiêu cuối thời kỳ quá độ và đến giữa thế kỷ XXI; Đảng là đội tiên phong của giai cấp công nhân, đồng thời của nhân dân lao động và dân tộc.","Liên hệ: vai trò của Nhà xuất bản Chính trị quốc gia Sự thật trong tuyên truyền Cương lĩnh."]},
{doc:"dh13",q:"Trình bày mục tiêu, nhiệm vụ trọng tâm và đột phá chiến lược theo Nghị quyết Đại hội XIII của Đảng.",outline:["Thông tin chung: 25/1–1/2/2021; 1.587 đại biểu; chủ đề với \"khơi dậy khát vọng phát triển đất nước\".","Mục tiêu tổng quát; ba mốc 2025, 2030, 2045 gắn với ba ngày kỷ niệm.","Chỉ tiêu 2021–2025 tiêu biểu: GDP 6,5–7%, 4.700–5.000 USD/người, kinh tế số 20% GDP, đô thị hóa 45%, che phủ rừng 42%.","6 nhiệm vụ trọng tâm (xây dựng Đảng; Covid-19 và phục hồi kinh tế, chuyển đổi số; quốc phòng, đối ngoại; khát vọng phồn vinh, hạnh phúc; dân chủ, pháp quyền; tài nguyên, biến đổi khí hậu).","3 đột phá: thể chế, nhân lực, hạ tầng; so sánh với XI và XIV.","Liên hệ trách nhiệm của biên tập viên trong tuyên truyền Nghị quyết."]},
{doc:"dh13",q:"Phân tích những điểm mới của Văn kiện Đại hội XIII (khát vọng phát triển, các mối quan hệ lớn, bài học kinh nghiệm).",outline:["Khát vọng phát triển đất nước phồn vinh, hạnh phúc: có trong chủ đề, mục tiêu, nhiệm vụ 4, đột phá 2.","Đánh giá 35 năm đổi mới: \"chưa bao giờ có được cơ đồ, tiềm lực, vị thế và uy tín quốc tế như ngày nay\".","10 mối quan hệ lớn: Nhà nước, thị trường và xã hội; thực hành dân chủ và tăng cường pháp chế, bảo đảm kỷ cương xã hội.","5 bài học: xây dựng, chỉnh đốn Đảng; \"dân là gốc\"; quyết tâm chính trị cao; xây dựng thể chế phát triển; dự báo đúng tình hình.","12 định hướng 2021–2030; chuyển đổi số, kinh tế số; Covid-19.","Ý nghĩa đối với công tác xuất bản sách chính trị."]},
{doc:"dh11_12",q:"Trình bày ba đột phá chiến lược do Đại hội XI xác định và sự kế thừa, phát triển ở các Đại hội XII, XIII, XIV.",outline:["Đại hội XI (1/2011), Chiến lược 2011–2020; mục tiêu 2020 cơ bản thành nước công nghiệp theo hướng hiện đại.","Ba đột phá XI: thể chế (cạnh tranh bình đẳng, cải cách hành chính); nhân lực (đổi mới căn bản, toàn diện giáo dục); hạ tầng (giao thông, đô thị lớn).","XII: tiếp tục thực hiện ba đột phá (nhiệm vụ trọng tâm 3).","XIII: thể chế phát triển và quản trị quốc gia hiện đại; nhân lực gắn với khát vọng; hạ tầng cả kinh tế và xã hội, hạ tầng số.","XIV: thể chế và thực thi; nhân lực chất lượng cao gắn với KHCN, đổi mới sáng tạo; hạ tầng đồng bộ, hiện đại.","Nhận xét: tính kế thừa của ba lĩnh vực, sự dịch chuyển trọng tâm sang thực thi và khoa học, công nghệ."]},
{doc:"dh11_12",q:"Trình bày chủ đề, mục tiêu tổng quát và 6 nhiệm vụ trọng tâm của Đại hội XII; nêu ý nghĩa của nhiệm vụ xây dựng, chỉnh đốn Đảng.",outline:["Thông tin: 20–28/1/2016; 1.510 đại biểu; Tổng Bí thư Nguyễn Phú Trọng tái cử; không sửa đổi Điều lệ.","Chủ đề: tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc và dân chủ XHCN; phấn đấu sớm cơ bản thành nước công nghiệp theo hướng hiện đại.","Chỉ tiêu: GDP 6,5–7%/năm, 3.200–3.500 USD/người năm 2020, đô thị hóa 38–40%.","6 nhiệm vụ trọng tâm: chỉnh đốn Đảng, \"tự diễn biến\", \"tự chuyển hóa\"; bộ máy tinh gọn, chống tham nhũng; chất lượng tăng trưởng, ba đột phá; bảo vệ chủ quyền, đối ngoại; phát huy nguồn lực nhân dân, an sinh; nhân tố con người.","Ý nghĩa: nền tảng cho Nghị quyết TW 4 khóa XII, tiếp tục ở nhiệm vụ 1 Đại hội XIII.","Liên hệ trách nhiệm cá nhân."]}
);

/* ===== Kiến thức chuyên môn: Luật Xuất bản, Chỉ thị 04-CT/TW, nghiệp vụ biên tập, quyền tác giả ===== */
DOCS.push({id:"luatxb",group:"pro",short:"Luật Xuất bản 2012 (đang áp dụng) và Luật sửa đổi 2026",mmLabel:"Luật Xuất bản 2012 và Luật sửa đổi 2026",so:"19/2012/QH13",
title:"Luật Xuất bản số 19/2012/QH13 (Văn bản hợp nhất số 43/VBHN-VPQH năm 2026) và Luật số 17/2026/QH16 sửa đổi, bổ sung một số điều của Luật Xuất bản",
meta:[["Luật đang có hiệu lực (10/2026)","Luật Xuất bản số 19/2012/QH13, thông qua 20/11/2012 (Quốc hội khóa XIII, kỳ họp thứ 4), hiệu lực 01/7/2013; 6 chương, 54 điều"],["Đã sửa đổi bởi","Luật số 35/2018/QH14 (hiệu lực 01/01/2019) và Luật Quy hoạch số 112/2025/QH15 (hiệu lực 01/3/2026); hợp nhất tại VBHN 43/VBHN-VPQH (2026)"],["Luật sửa đổi mới (chưa có hiệu lực)","Luật số 17/2026/QH16, thông qua 24/8/2026 (kỳ họp bất thường thứ nhất, Quốc hội khóa XVI, 472/475 đại biểu tán thành); hiệu lực 01/3/2027, riêng quy định in gia công cho nước ngoài từ 01/01/2029"],["Văn bản hướng dẫn đang áp dụng","NĐ 195/2013/NĐ-CP (sửa đổi bởi NĐ 150/2018/NĐ-CP); TT 01/2020/TT-BTTTT (sửa đổi bởi TT 23/2023/TT-BTTTT); xử phạt: NĐ 119/2020/NĐ-CP"],["Cơ quan quản lý nhà nước","Bộ Văn hóa, Thể thao và Du lịch (từ 01/3/2025, NĐ 43/2025/NĐ-CP; nay NĐ 298/2026/NĐ-CP); Cục Xuất bản, In và Phát hành, đổi tên thành Cục Xuất bản và Thư viện"],["Kế hoạch triển khai Luật 2026","Quyết định 1953/QĐ-TTg ngày 08/10/2026: nghị định mới thay NĐ 195/2013 trình Chính phủ tháng 12/2026; thông tư mới thay TT 01/2020 ban hành tháng 01/2027"]],
tldr:`Tính đến 10/2026, luật đang áp dụng là <b>Luật Xuất bản số 19/2012/QH13</b> (hiệu lực <mark>01/7/2013</mark>, đã sửa đổi năm 2018 và 2025, hợp nhất tại VBHN 43/VBHN-VPQH). <b>Luật số 17/2026/QH16</b> sửa đổi, bổ sung một số điều được Quốc hội thông qua ngày <b>24/8/2026</b> nhưng <b>chỉ có hiệu lực từ <mark>01/3/2027</mark></b>. Trước ngày đó vẫn áp dụng luật 2012 và NĐ 195/2013. Con số phải thuộc: xác nhận đăng ký xuất bản trong <mark>07 ngày làm việc</mark>, giấy xác nhận có giá trị đến <mark>31/12</mark>; nộp lưu chiểu <mark>chậm nhất 10 ngày trước khi phát hành</mark>; nộp Thư viện Quốc gia trong <mark>45 ngày</mark> kể từ ngày phát hành; cấp chứng chỉ hành nghề biên tập trong <mark>15 ngày</mark>; bị thu hồi thì sau <mark>02 năm</mark> mới được xét cấp lại; tổng biên tập cần <mark>ít nhất 03 năm</mark> làm biên tập; nhà xuất bản cần <mark>ít nhất 05</mark> biên tập viên cơ hữu. Quản lý nhà nước về xuất bản thuộc <b>Bộ Văn hóa, Thể thao và Du lịch</b>.`,
sections:[
{h:"Vị trí, khái niệm, nguyên tắc (Điều 3–6)",items:[
"<b>Điều 3:</b> hoạt động xuất bản thuộc lĩnh vực <b>văn hóa, tư tưởng</b>; nhằm phổ biến tri thức, giá trị văn hóa của dân tộc và nhân loại, đáp ứng nhu cầu đời sống tinh thần, nâng cao dân trí, xây dựng đạo đức, lối sống, mở rộng giao lưu văn hóa, phát triển kinh tế – xã hội, đấu tranh chống tư tưởng, hành vi làm tổn hại lợi ích quốc gia.",
"<b>Xuất bản</b> (khoản 1 Điều 4): việc tổ chức, khai thác bản thảo, biên tập thành bản mẫu để in và phát hành hoặc để phát hành trực tiếp qua các phương tiện điện tử.",
"<b>Biên tập</b> (khoản 6 Điều 4): <b>“việc rà soát, hoàn thiện nội dung và hình thức bản thảo để xuất bản”</b>. <b>Bản thảo</b> (khoản 5): bản viết tay, đánh máy hoặc tạo bằng phương tiện điện tử của tác phẩm, tài liệu để xuất bản.",
"<b>In</b>: dùng thiết bị in tạo ra xuất bản phẩm từ bản mẫu. <b>Phát hành</b>: đưa xuất bản phẩm đến người sử dụng qua mua, bán, tặng, cho thuê, cho mượn, xuất khẩu, nhập khẩu, hội chợ, triển lãm.",
"<b>Xuất bản phẩm</b> (khoản 4): tác phẩm, tài liệu về chính trị, kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, văn học, nghệ thuật được xuất bản qua nhà xuất bản hoặc cơ quan, tổ chức được cấp giấy phép; gồm sách in, sách chữ nổi, tranh, ảnh, bản đồ, áp-phích, tờ rời, tờ gấp, lịch, băng âm thanh, hình ảnh thay sách hoặc minh họa cho sách. <b>Tài liệu không kinh doanh</b> (khoản 7): xuất bản phẩm không dùng để mua, bán.",
"<b>Lưu chiểu</b> (khoản 12): việc nộp xuất bản phẩm để lưu giữ, đối chiếu, kiểm tra, thẩm định. Xuất bản điện tử, xuất bản phẩm điện tử: khoản 8, 9.",
"<b>Điều 5:</b> <b>“Nhà nước không kiểm duyệt tác phẩm trước khi xuất bản.”</b> <b>Điều 6:</b> Chính phủ thống nhất quản lý nhà nước về hoạt động xuất bản; văn bản luật ghi Bộ Thông tin và Truyền thông, nay là Bộ Văn hóa, Thể thao và Du lịch."]},
{h:"Nội dung và hành vi bị cấm (Điều 10), xử lý vi phạm (Điều 11)",items:[
"<b>Nghiêm cấm xuất bản, in, phát hành xuất bản phẩm có nội dung:</b> tuyên truyền chống Nhà nước CHXHCN Việt Nam, phá hoại khối đại đoàn kết toàn dân tộc; tuyên truyền kích động chiến tranh xâm lược, gây hận thù giữa các dân tộc và nhân dân các nước, kích động bạo lực, truyền bá tư tưởng phản động, lối sống dâm ô, đồi trụy, hành vi tội ác, tệ nạn xã hội, mê tín dị đoan, phá hoại thuần phong mỹ tục; tiết lộ bí mật nhà nước, bí mật đời tư và bí mật khác do pháp luật quy định.",
"Và nhóm nội dung biên tập viên sách chính trị phải đặc biệt cảnh giác: <b>xuyên tạc sự thật lịch sử, phủ nhận thành tựu cách mạng; xúc phạm dân tộc, danh nhân, anh hùng dân tộc; không thể hiện hoặc thể hiện không đúng chủ quyền quốc gia</b>; vu khống, xúc phạm uy tín của cơ quan, tổ chức và danh dự, nhân phẩm của cá nhân.",
"<b>Hành vi bị cấm (khoản 2):</b> xuất bản mà không đăng ký, không có quyết định xuất bản hoặc không có giấy phép; sửa chữa, làm sai lệch nội dung bản thảo đã được duyệt, ký; in lậu, in giả, in nối bản trái phép; phát hành xuất bản phẩm không có nguồn gốc hợp pháp, <b>chưa nộp lưu chiểu</b>; xuất bản, in, phát hành xuất bản phẩm đã có quyết định đình chỉ, thu hồi, tịch thu, cấm lưu hành, tiêu hủy hoặc nhập khẩu trái phép.",
"<b>Điều 11:</b> tổ chức vi phạm bị xử phạt hành chính; cá nhân bị xử lý kỷ luật, xử phạt hành chính hoặc truy cứu trách nhiệm hình sự; gây thiệt hại thì bồi thường. Xuất bản phẩm vi phạm bị đình chỉ phát hành, tùy mức độ phải sửa chữa mới được phát hành, hoặc bị thu hồi, tịch thu, cấm lưu hành, tiêu hủy. Xuất bản phẩm điện tử vi phạm bị gỡ bỏ khỏi phương tiện điện tử.",
"<b>Xử phạt hành chính:</b> NĐ 119/2020/NĐ-CP (07/10/2020, hiệu lực 01/12/2020): phạt tiền tối đa mỗi hành vi <mark>200 triệu đồng</mark> với tổ chức, <mark>100 triệu đồng</mark> với cá nhân; hình thức bổ sung đình chỉ hoạt động <mark>01–12 tháng</mark>. Ví dụ: đứng tên tổng biên tập, biên tập viên mà không có chứng chỉ hành nghề biên tập bị phạt 10–15 triệu đồng."]},
{h:"Nhà xuất bản, tổng giám đốc (giám đốc), tổng biên tập (Điều 12, 13, 17, 18)",items:[
"<b>Loại hình:</b> đơn vị sự nghiệp công lập hoặc doanh nghiệp kinh doanh có điều kiện do Nhà nước làm chủ sở hữu. Cơ quan chủ quản: cơ quan nhà nước, tổ chức chính trị, chính trị – xã hội ở trung ương và cấp tỉnh; đơn vị sự nghiệp công lập, tổ chức xã hội – nghề nghiệp ở trung ương trực tiếp tạo ra tác phẩm khoa học, học thuật.",
"<b>Điều kiện thành lập (Điều 13):</b> tôn chỉ, mục đích phù hợp cơ quan chủ quản; người đứng đầu đủ tiêu chuẩn Điều 17 và <b>ít nhất <mark>05</mark> biên tập viên cơ hữu</b>; có trụ sở, nguồn tài chính. Giấy phép thành lập do Bộ cấp trong <mark>30 ngày</mark>.",
"<b>Tổng giám đốc (giám đốc)</b>: công dân Việt Nam thường trú tại Việt Nam, phẩm chất chính trị, đạo đức tốt; đại học trở lên; <b>ít nhất 03 năm</b> làm biên tập, quản lý xuất bản, báo chí hoặc quản lý tại cơ quan chủ quản nhà xuất bản.",
"<b>Tổng biên tập</b>: các tiêu chuẩn trên và <b>có chứng chỉ hành nghề biên tập</b>, <b>ít nhất 03 năm làm biên tập tại nhà xuất bản hoặc cơ quan báo chí</b>.",
"<b>Nhiệm vụ của tổng giám đốc (giám đốc)</b>: tổ chức đăng ký xuất bản; tổ chức thẩm định; ký hợp đồng liên kết trước khi ký quyết định xuất bản; <b>ký duyệt bản thảo hoàn chỉnh trước khi đưa in</b>; <b>ký quyết định xuất bản</b> cho từng xuất bản phẩm, đúng giấy xác nhận đăng ký, kể cả khi in tăng số lượng; <b>ký quyết định phát hành</b>; định giá bán lẻ; <b>lưu trữ hồ sơ biên tập</b>; sửa chữa, đình chỉ, thu hồi, tiêu hủy khi có yêu cầu; không để lộ, lọt nội dung trước khi phát hành; chịu trách nhiệm trước pháp luật và cơ quan chủ quản về xuất bản phẩm và mọi hoạt động của nhà xuất bản.",
"<b>Nhiệm vụ của tổng biên tập</b>: giúp tổng giám đốc chỉ đạo tổ chức bản thảo; tổ chức biên tập; <b>đọc và ký duyệt từng bản thảo</b> để trình tổng giám đốc ký quyết định xuất bản; không để lộ, lọt nội dung; chịu trách nhiệm trước tổng giám đốc và trước pháp luật về <b>nội dung</b> xuất bản phẩm."]},
{h:"Biên tập viên và chứng chỉ hành nghề biên tập (Điều 19, 20)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Nội dung</th><th>Quy định của Luật Xuất bản 2012</th></tr></thead><tbody>
<tr><td>Tiêu chuẩn</td><td>(a) công dân Việt Nam thường trú tại Việt Nam, phẩm chất chính trị, đạo đức tốt; (b) trình độ <b>đại học trở lên</b>; (c) hoàn thành <b>khóa bồi dưỡng kiến thức pháp luật xuất bản và nghiệp vụ biên tập</b>; (d) có <b>chứng chỉ hành nghề biên tập</b>.</td></tr>
<tr><td>Nhiệm vụ, quyền hạn</td><td>Thực hiện biên tập bản thảo; <b>được từ chối biên tập</b> bản thảo có dấu hiệu vi phạm khoản 1 Điều 10 và <b>phải báo cáo bằng văn bản</b> với tổng giám đốc và tổng biên tập; <b>đứng tên</b> trên xuất bản phẩm do mình biên tập; tham gia tập huấn định kỳ; không để lộ, lọt nội dung; <b>chịu trách nhiệm trước tổng biên tập và trước pháp luật</b> về phần nội dung do mình biên tập.</td></tr>
<tr><td>Hồ sơ cấp chứng chỉ</td><td>Đơn theo mẫu; sơ yếu lý lịch; bản sao có chứng thực văn bằng; giấy chứng nhận hoàn thành khóa bồi dưỡng.</td></tr>
<tr><td>Thời hạn cấp</td><td><mark>15 ngày</mark> kể từ ngày nhận đủ hồ sơ; không cấp phải trả lời bằng văn bản, nêu rõ lý do.</td></tr>
<tr><td>Thu hồi</td><td>(a) xuất bản phẩm do mình biên tập bị cấm lưu hành, thu hồi, tịch thu, tiêu hủy; (b) trong <b>01 năm có hai</b> xuất bản phẩm, hoặc trong <b>02 năm liên tục</b> có xuất bản phẩm sai phạm nội dung buộc phải sửa chữa mới được phát hành; (c) bị kết án bằng bản án có hiệu lực của tòa án.</td></tr>
<tr><td>Cấp lại</td><td>Bị thu hồi: sau <mark>02 năm</mark> mới được xét cấp lại (trừ trường hợp bị kết án về tội rất nghiêm trọng, đặc biệt nghiêm trọng hoặc xâm phạm an ninh quốc gia). Mất, hư hỏng: được cấp lại (theo TT 01/2020 sửa đổi: nộp đơn trong 15 ngày, xử lý trong 05 ngày làm việc).</td></tr>
</tbody></table></div>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Thủ tục cấp, thu hồi do Cục Xuất bản, In và Phát hành thực hiện theo TT 01/2020/TT-BTTTT. Từ 01/3/2027 (Luật 17/2026) bổ sung căn cứ thu hồi khi <b>không trực tiếp làm biên tập trong 36 tháng liên tục</b>.</p>`},
{h:"Từ bản thảo đến phát hành (Điều 21–29)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Khâu</th><th>Quy định</th><th>Con số</th></tr></thead><tbody>
<tr><td>Quyền tác giả (Đ.21)</td><td>Xuất bản tác phẩm, tái bản xuất bản phẩm phải có <b>văn bản chấp thuận</b> của tác giả, chủ sở hữu quyền tác giả.</td><td></td></tr>
<tr><td>Đăng ký xuất bản (Đ.22)</td><td>Trước khi xuất bản, tái bản, nhà xuất bản đăng ký với Bộ theo mẫu; Bộ xác nhận bằng văn bản, cấp số xác nhận đăng ký và mã ISBN (NĐ 195/2013); không xác nhận phải nêu lý do.</td><td><mark>07 ngày làm việc</mark>; giá trị đến <mark>31/12</mark> năm xác nhận; số không dùng báo cáo trước 31/3 năm sau</td></tr>
<tr><td>Liên kết (Đ.23)</td><td>Liên kết từng xuất bản phẩm với tác giả, chủ sở hữu quyền, nhà xuất bản, cơ sở in, phát hành, pháp nhân khác; 4 hình thức: khai thác bản thảo, biên tập sơ bộ, in, phát hành. <b>Không liên kết biên tập sơ bộ</b> với tác phẩm về <b>lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký</b>.</td><td>Đối tác biên tập sơ bộ phải có ít nhất 03 biên tập viên có chứng chỉ (NĐ 195)</td></tr>
<tr><td>Thẩm định (Đ.24)</td><td>Thẩm định nội dung trước khi <b>tái bản</b> nếu có thể vi phạm khoản 1 Điều 10: tác phẩm xuất bản trước Cách mạng Tháng Tám 1945; 1945–1954 ở vùng tạm chiếm; 1954–30/4/1975 ở miền Nam không được Chính phủ Cách mạng lâm thời cho phép; xuất bản ở nước ngoài.</td><td></td></tr>
<tr><td>Duyệt và quyết định</td><td>Tổng biên tập đọc, ký duyệt; tổng giám đốc ký duyệt bản thảo hoàn chỉnh trước khi in, ký quyết định xuất bản (Đ.18).</td><td>Quyết định xuất bản ban hành trong năm xác nhận</td></tr>
<tr><td>Thông tin ghi trên sách (Đ.27)</td><td><b>Bìa 1</b>: tên sách, tác giả (người biên soạn, chủ biên), người dịch, tên nhà xuất bản. <b>Cùng một trang</b>: họ tên tổng giám đốc, tổng biên tập, biên tập viên, khuôn khổ, số xác nhận đăng ký, số quyết định xuất bản, số lượng in, cơ sở in, thời gian nộp lưu chiểu, ISBN… <b>Bìa 4</b>: giá bán lẻ (hoặc “sách Nhà nước đặt hàng”, “sách không bán”). Sách dịch ghi tên nguyên bản, ngôn ngữ dịch.</td><td></td></tr>
<tr><td>Lưu chiểu (Đ.28)</td><td>Nộp cho Bộ: <b>03 bản</b> (in dưới 300 bản thì 02 bản); tái bản không sửa chữa: 01 bản; nội dung bí mật nhà nước chỉ nộp tờ khai. Kèm 02 tờ khai lưu chiểu; xuất bản phẩm lưu chiểu được lưu giữ 24 tháng (TT 01/2020).</td><td><mark>Chậm nhất 10 ngày trước khi phát hành</mark></td></tr>
<tr><td>Phát hành</td><td>Tổng giám đốc ký quyết định phát hành; không phát hành khi chưa nộp lưu chiểu (khoản 2 Điều 10).</td><td></td></tr>
<tr><td>Thư viện Quốc gia (Đ.28)</td><td>Nộp 03 bản (in dưới 300 bản thì 02 bản).</td><td><mark>Trong 45 ngày</mark> kể từ ngày phát hành</td></tr>
<tr><td>Đọc, kiểm tra lưu chiểu (Đ.29)</td><td>Bộ (và UBND cấp tỉnh với xuất bản phẩm do mình cấp phép) tổ chức đọc, kiểm tra, quyết định xử lý vi phạm.</td><td></td></tr>
</tbody></table></div>`},
{h:"Văn bản hướng dẫn và cơ quan quản lý (tính đến 10/2026)",items:[
"<b>NĐ 195/2013/NĐ-CP</b> ngày 21/11/2013, hiệu lực 01/3/2014: quy định chi tiết Luật Xuất bản; được sửa đổi bởi <b>NĐ 150/2018/NĐ-CP</b> ngày 07/11/2018 (hiệu lực 24/12/2018). Theo QĐ 1953/QĐ-TTg, nghị định thay thế sẽ trình Chính phủ tháng 12/2026 và có hiệu lực cùng Luật 17/2026.",
"<b>TT 01/2020/TT-BTTTT</b> ngày 07/02/2020, hiệu lực 01/4/2020 (53 biểu mẫu; tập huấn; chứng chỉ hành nghề; lưu chiểu); sửa đổi bởi <b>TT 23/2023/TT-BTTTT</b> (31/12/2023, hiệu lực 01/5/2024). LuatVietnam còn ghi TT 09/2026/TT-BVHTTDL ngày 29/4/2026 về phân cấp thủ tục hành chính có sửa đổi TT 01/2020 (nội dung cụ thể chưa xác minh).",
"<b>TTLT 169/2013/TTLT-BTC-BTTTT</b> (15/11/2013) về thù lao đọc, kiểm tra, thẩm định xuất bản phẩm lưu chiểu; sẽ được thay bằng thông tư của Bộ Tài chính (01/2027).",
"<b>Cơ quan quản lý:</b> từ 01/3/2025, theo <b>NĐ 43/2025/NĐ-CP</b> (28/02/2025), Bộ Văn hóa, Thể thao và Du lịch quản lý nhà nước về báo chí, <b>xuất bản, in, phát hành</b>; Cục Xuất bản, In và Phát hành là đơn vị của Bộ. <b>Bộ Khoa học và Công nghệ không quản lý xuất bản.</b>",
"<b>NĐ 298/2026/NĐ-CP</b> (27/7/2026, hiệu lực 28/7/2026): Cục Xuất bản, In và Phát hành nhận thêm chức năng quản lý nhà nước về thư viện và đổi tên thành <b>Cục Xuất bản và Thư viện</b>; Cục Bản quyền tác giả thành <b>Cục Công nghiệp văn hóa và Bản quyền tác giả</b>. Các đơn vị lập theo NĐ 43/2025 hoạt động đến khi Bộ trưởng ban hành quyết định mới.",
"Văn bản luật 2012 vẫn ghi “Bộ Thông tin và Truyền thông”; Luật 17/2026 thay cụm từ này bằng “Bộ Văn hóa, Thể thao và Du lịch” hoặc “Ủy ban nhân dân cấp tỉnh” tùy điều."]},
{h:"Luật 17/2026/QH16: đã thông qua, có hiệu lực từ 01/3/2027",items:[
"<b>Vị trí mới:</b> xuất bản vừa thuộc lĩnh vực văn hóa, tư tưởng, vừa là <b>ngành kinh tế – công nghệ</b>, bộ phận của công nghiệp văn hóa và hạ tầng tri thức quốc gia. Vẫn giữ nguyên tắc <b>Nhà nước không kiểm duyệt trước khi xuất bản</b>.",
"<b>Khái niệm:</b> xuất bản gồm 4 khâu (khai thác bản thảo, biên tập, thiết kế – chế bản, quyết định xuất bản); định nghĩa mới về biên tập viên, dịch vụ trung gian, sản phẩm thông tin có hình thức như xuất bản phẩm trên mạng, in lậu, in giả, in nối bản trái phép.",
"<b>AI:</b> nội dung tạo ra hoàn toàn hoặc một phần bằng trí tuệ nhân tạo <b>“phải được thông báo, gắn nhãn”</b> và không làm giảm trách nhiệm của nhà xuất bản (điểm đ khoản 1 Điều 27 mới); cấm <b>“lợi dụng trí tuệ nhân tạo để thực hiện hành vi vi phạm pháp luật trong hoạt động xuất bản”</b>; cấm đe dọa, quấy rối, cản trở biên tập viên, người làm xuất bản.",
"<b>Thẩm định nhiều lớp với sách nhạy cảm</b> (lịch sử cách mạng, chủ quyền, an ninh quốc gia, lãnh tụ, anh hùng dân tộc, theo danh mục Chính phủ): nhà xuất bản thẩm định <b>trước khi đăng ký kế hoạch xuất bản</b>; cơ quan chủ quản xem xét, phê duyệt kế hoạch; sau lưu chiểu chỉ được phát hành khi <b>Bộ VHTTDL có ý kiến</b>. Quyền quyết định và trách nhiệm cuối cùng vẫn thuộc nhà xuất bản.",
"<b>Đăng ký xuất bản</b> đổi thành <b>đăng ký kế hoạch xuất bản</b>; văn bản xác nhận vẫn có giá trị đến 31/12. <b>Lưu chiểu</b> vẫn chậm nhất 10 ngày trước khi phát hành; nộp bản in hoặc tệp điện tử; nộp tệp điện tử gốc cho Thư viện Quốc gia.",
"<b>Chứng chỉ hành nghề biên tập</b> do Bộ VHTTDL cấp; thêm căn cứ thu hồi: không trực tiếp biên tập <b>36 tháng liên tục</b>; cấp lại khi chuyển nhà xuất bản hoặc hoàn thành bồi dưỡng. Người đứng đầu cơ quan chủ quản không kiêm giám đốc nhà xuất bản.",
"<b>Liên kết:</b> nhà xuất bản phải tổ chức biên tập hoàn chỉnh, <b>không chuyển giao quyền quyết định nội dung</b>; đối tác chịu trách nhiệm về quyền và về việc dùng AI tạo nội dung.",
"<b>Phân cấp, chuyển hậu kiểm:</b> giấy phép in, tài liệu không kinh doanh, văn phòng đại diện chuyển cho địa phương; phát hành chuyển sang thông báo với UBND cấp xã; nhập khẩu thông báo danh mục trước khi làm thủ tục hải quan. Chính sách ưu đãi thuế, tiền thuê đất, hợp tác công tư, tập đoàn xuất bản – truyền thông.",
"<b>Chuyển tiếp:</b> giấy phép, chứng chỉ đã cấp tiếp tục có giá trị; tổng giám đốc, tổng biên tập chưa đạt chuẩn mới phải đáp ứng trong 12 tháng."]},
{h:"Tình huống năm 2026: trách nhiệm của nhà xuất bản khi liên kết",items:[
"Cuốn “Chuyện với Thanh – Lời kể mới về ánh sáng” (NXB Hội Nhà văn, liên kết với tác giả): ngày 02/6/2026 Cục Xuất bản, In và Phát hành yêu cầu tạm dừng phát hành, đọc thẩm định lại; 04/6/2026 yêu cầu dừng phát hành, thu hồi; thư viện dừng cho mượn.",
"Ngày 15/6/2026: phạt nhà xuất bản <b>100 triệu đồng</b>, <b>đình chỉ hoạt động 02 tháng</b>, tiêu hủy toàn bộ sách thu hồi, nộp lại số lợi bất hợp pháp. Lý do nêu trong tin chính thống: thông tin, đánh giá không chính xác về một số nhân vật, sự kiện lịch sử; ngôn ngữ không phù hợp khi viết về Chủ tịch Hồ Chí Minh và một số lãnh đạo.",
"Tháng 7/2026 cơ quan an ninh điều tra khởi tố, bắt tạm giam một số người lãnh đạo, biên tập của nhà xuất bản theo Điều 117 Bộ luật Hình sự; vụ án đang điều tra, chưa xét xử.",
"<b>Bài học cho biên tập viên:</b> liên kết xuất bản <b>“không đồng nghĩa với việc chuyển giao trách nhiệm cho đối tác liên kết”</b> (PGS.TS Vũ Trọng Lâm, Giám đốc – Tổng biên tập NXB Chính trị quốc gia Sự thật); sách lịch sử, hồi ký không được liên kết biên tập sơ bộ; mọi thông tin quan trọng phải được xác minh; lưu đầy đủ hồ sơ biên tập."]}
],
