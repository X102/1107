<p><b>Đoạn văn đã sửa</b></p><blockquote>Đại hội đại biểu toàn quốc lần thứ VI của Đảng (tháng 12/1986) đã đề ra đường lối đổi mới toàn diện đất nước, trước hết là đổi mới tư duy, nhất là tư duy kinh tế. Đại hội chủ trương phát triển nền kinh tế hàng hóa nhiều thành phần, xóa bỏ cơ chế tập trung quan liêu, bao cấp, tăng cường vai trò quản lý của Nhà nước. Đến Đại hội IX (năm 2001), Đảng xác định nền kinh tế thị trường định hướng xã hội chủ nghĩa là mô hình kinh tế tổng quát của nước ta trong thời kỳ quá độ. Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) tiếp tục làm rõ mô hình, mục tiêu và phương hướng phát triển. Đổi mới không phải là thay đổi mục tiêu xã hội chủ nghĩa, mà là làm cho mục tiêu ấy được thực hiện có hiệu quả bằng những hình thức, bước đi, biện pháp phù hợp. Công cuộc đổi mới đã đưa nước ta thoát khỏi khủng hoảng kinh tế – xã hội; các ngành kinh tế phát triển mạnh, đời sống người dân được cải thiện rõ rệt. Năm 2007, Việt Nam trở thành thành viên chính thức của Tổ chức Thương mại thế giới (WTO). Sau 40 năm đổi mới (1986–2026), đất nước đã đạt được những thành tựu to lớn, có ý nghĩa lịch sử. Đó là nền tảng để thực hiện khát vọng đưa nước ta trở thành nước phát triển, thu nhập cao vào năm 2045.</blockquote>`},
{q:`Tác giả một bản thảo sách chính trị – xã hội đề nghị: (a) trích nguyên văn khoảng hai trang từ một cuốn sách đang được bảo hộ để phân tích, phê bình, không xin phép; (b) in kèm 12 bức ảnh do một nhà nhiếp ảnh công bố lần đầu năm 1972 (nhà nhiếp ảnh mất năm 1990) và trích trọn hai bài thơ của một nhà thơ mất năm 1965; (c) một chương do tác giả dùng công cụ trí tuệ nhân tạo viết rồi chỉnh lại. Là biên tập viên, anh/chị xử lý từng đề nghị thế nào? Nêu căn cứ pháp luật.`,points:30,
outline:["(a) Trích dẫn hợp lý (Điều 25 Luật SHTT): tác phẩm đã công bố; không làm sai ý tác giả; để bình luận, giới thiệu, minh họa; phần trích phù hợp mục đích, không gây phương hại bất hợp lý; ghi tên tác giả, nguồn. Nếu đoạn trích là phần cốt lõi, vượt mức cần thiết → rút gọn hoặc xin phép. Không nhầm với giới hạn 10% sao chép (10 điểm).","(b) Ảnh: nhiếp ảnh bảo hộ 75 năm từ khi công bố lần đầu → ảnh 1972 còn bảo hộ đến hết 31/12/2047 → phải xin phép người thừa kế/chủ sở hữu, trả thù lao theo thỏa thuận, ghi tên tác giả. Thơ: đời tác giả + 50 năm → tác giả mất 1965, quyền tài sản hết vào 24 giờ 31/12/2015 → không phải xin phép về quyền tài sản nhưng phải tôn trọng quyền nhân thân vô thời hạn (ghi đúng tên, giữ nguyên văn, không xuyên tạc) (10 điểm).","(c) AI: Luật 131/2025 – Chính phủ quy định việc xác lập quyền với đối tượng tạo ra có sử dụng AI; Luật 17/2026 (từ 01/3/2027) – nội dung tạo bằng AI phải thông báo, gắn nhãn, không làm giảm trách nhiệm; cấm lợi dụng AI vi phạm pháp luật. Biên tập viên: yêu cầu tác giả khai báo phần dùng AI, cam kết không sao chép; kiểm tra lại sự kiện, trích dẫn, số liệu; cân nhắc yêu cầu viết lại phần quan trọng (10 điểm)."],
answer:`<p><b>Lưu ý chấm.</b> Câu (b) cần tính đúng mốc: 1972 + 75 = 2047; 1965 + 50 = 2015; thời hạn chấm dứt vào 24 giờ ngày 31/12 của năm cuối. Ở câu (c), trước 01/3/2027 chưa có nghĩa vụ gắn nhãn theo Luật Xuất bản, nhưng nhà xuất bản vẫn chịu trách nhiệm đầy đủ về nội dung, nên vẫn phải yêu cầu khai báo và kiểm chứng.</p>`}

intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề tự soạn để luyện tập, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026. Ở câu sửa lỗi, chỉ tính lỗi đã định sẵn.`,
questions:[
{q:`Trình bày trình tự pháp lý từ khi nhà xuất bản tiếp nhận bản thảo đến khi xuất bản phẩm được phát hành theo Luật Xuất bản 2012 (đăng ký, quyết định xuất bản, thông tin trên xuất bản phẩm, lưu chiểu, phát hành, nộp Thư viện Quốc gia). Nêu những điểm thay đổi ở các khâu này khi Luật số 17/2026/QH16 có hiệu lực.`,points:30,
outline:["Văn bản chấp thuận của tác giả, chủ sở hữu quyền tác giả (Điều 21) (3 điểm).","Đăng ký xuất bản với Bộ; xác nhận trong 07 ngày làm việc; giá trị đến 31/12; số xác nhận và ISBN; số không dùng báo cáo trước 31/3 năm sau (5 điểm).","Biên tập, thẩm định (Điều 24 khi tái bản); tổng biên tập ký duyệt; tổng giám đốc ký duyệt bản thảo hoàn chỉnh, ký quyết định xuất bản trong năm xác nhận (4 điểm).","Thông tin bắt buộc (Điều 27): bìa 1, trang thông tin, bìa 4 (4 điểm).","Lưu chiểu chậm nhất 10 ngày trước khi phát hành; 03 bản (dưới 300 bản: 02); quyết định phát hành; Thư viện Quốc gia trong 45 ngày (6 điểm).","Luật 2026 (từ 01/3/2027): “đăng ký kế hoạch xuất bản”; sách nhạy cảm thẩm định trước khi đăng ký, cơ quan chủ quản phê duyệt kế hoạch, Bộ VHTTDL cho ý kiến trước phát hành; nộp lưu chiểu bằng bản in hoặc tệp điện tử; nộp tệp gốc cho Thư viện Quốc gia; nội dung AI phải gắn nhãn (8 điểm)."],
answer:`<p><b>Điểm dễ mất điểm:</b> nhầm 07 ngày làm việc (đăng ký) với 10 ngày (lưu chiểu), 15 ngày (chứng chỉ), 45 ngày (Thư viện Quốc gia); viết Luật 2026 “đã có hiệu lực”; cho rằng tổng biên tập ký quyết định xuất bản.</p>`},
{q:`Đọc đoạn văn sau. Đoạn văn có <b>14 lỗi</b> (chính tả, viết hoa, dấu câu, dùng từ, sự kiện – số liệu, trích dẫn văn bản, logic, chính trị – tư tưởng). Hãy chỉ ra, sửa, giải thích từng lỗi và viết lại đoạn văn hoàn chỉnh.
<blockquote>Sách là kho tàng tri thức của nhân loại. Hằng năm, ngày 23/4 được chọn là Ngày sách và văn hóa đọc Việt Nam. Chỉ thị số 04-CT/TW ngày 17/3/2026 của Bộ Chính trị xác định: “Phát triển văn hóa đọc, lấy nhà xuất bản là trung tâm, là mục tiêu của hoạt động xuất bản” và đặt mục tiêu đến năm 2030 có 80% nhà xuất bản tham gia xuất bản điện tử. Nghị quyết số 80-NQ/TW của Bộ Chính trị về phát triển văn hóa Việt Nam đề ra mục tiêu các ngành công nghiệp văn hóa đóng góp 9% GDP vào năm 2030. Trong bối cảnh chuyển đổi số, thói quen đọc đang thay đổi: sách điện tử, sách nói, ngày càng phổ biến. Vì vậy, trên không gian mạng cũng xuất hiện nhiều sản phẩm xao chép trái phép, nội dung thiếu kiểm chứng. Các nhà xuất bản không thể bàng quang trước tình trạng đó; cần nâng cao chất lượng nội dung, kiên quyết đấu tranh với nạn in lậu, vi phạm bản quyền. Bởi lẽ, xuất bản trước hết là một ngành kinh doanh thuần túy. Luật sửa đổi, bổ sung một số điều của luật xuất bản đã có hiệu lực từ ngày 24/8/2026 và cấm sử dụng trí tuệ nhân tạo trong xuất bản. Mỗi biên tập viên phải là người “gác cổng tri thức”, bảo đảm mỗi cuốn sách đến tay bạn đọc đều chính xác, bổ ích.</blockquote>`,points:40,
outline:["Mỗi lỗi 2,5 điểm: phát hiện 1, sửa đúng 1, giải thích 0,5 (14 lỗi = 35 điểm).","Đoạn văn sửa hoàn chỉnh (5 điểm).","Sửa sai chỗ vốn đúng: trừ 1 điểm/lần."],

<p><b>Đoạn văn đã sửa</b></p><blockquote>Sách là kho tàng tri thức của nhân loại. Hằng năm, ngày 21/4 được chọn là Ngày Sách và Văn hóa đọc Việt Nam. Chỉ thị số 04-CT/TW ngày 17/3/2026 của Ban Bí thư xác định: “Phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản” và đặt mục tiêu đến năm 2030 có 100% nhà xuất bản tham gia xuất bản điện tử. Nghị quyết số 80-NQ/TW của Bộ Chính trị về phát triển văn hóa Việt Nam đề ra mục tiêu các ngành công nghiệp văn hóa đóng góp 7% GDP vào năm 2030. Trong bối cảnh chuyển đổi số, thói quen đọc đang thay đổi: sách điện tử, sách nói ngày càng phổ biến. Tuy nhiên, trên không gian mạng cũng xuất hiện nhiều sản phẩm sao chép trái phép, nội dung thiếu kiểm chứng. Các nhà xuất bản không thể bàng quan trước tình trạng đó; cần nâng cao chất lượng nội dung, kiên quyết đấu tranh với nạn in lậu, vi phạm bản quyền. Bởi lẽ, hoạt động xuất bản thuộc lĩnh vực văn hóa, tư tưởng. Luật sửa đổi, bổ sung một số điều của Luật Xuất bản (Luật số 17/2026/QH16), được Quốc hội thông qua ngày 24/8/2026 và có hiệu lực từ ngày 01/3/2027, yêu cầu nội dung được tạo ra hoàn toàn hoặc một phần bằng trí tuệ nhân tạo phải được thông báo, gắn nhãn, đồng thời cấm lợi dụng trí tuệ nhân tạo để vi phạm pháp luật trong hoạt động xuất bản. Mỗi biên tập viên phải là người “gác cổng tri thức”, bảo đảm mỗi cuốn sách đến tay bạn đọc đều chính xác, bổ ích.</blockquote>`},
{q:`Viết <b>lời giới thiệu</b> (200–300 chữ) in ở đầu cuốn sách (giả định) <b>“Văn hóa đọc trong kỷ nguyên số”</b> của một nhóm tác giả, do Nhà xuất bản Chính trị quốc gia Sự thật xuất bản năm 2026, gồm bốn chương: lý luận về văn hóa đọc; thực trạng văn hóa đọc ở Việt Nam; kinh nghiệm quốc tế; giải pháp phát triển văn hóa đọc trong bối cảnh chuyển đổi số.`,points:30,
outline:["Mở: vai trò của sách, văn hóa đọc; bối cảnh chuyển đổi số (5 điểm).","Gắn với chủ trương: Chỉ thị 04-CT/TW (lấy người đọc là trung tâm), NQ 80-NQ/TW (07/01/2026), Ngày Sách và Văn hóa đọc Việt Nam 21/4 – trích dẫn chính xác (8 điểm).","Giới thiệu kết cấu 4 chương, giá trị, đối tượng bạn đọc (8 điểm).","Lời mong góp ý; văn phong trang trọng; đúng chính tả, viết hoa (6 điểm).","Độ dài 200–300 chữ (3 điểm)."],
answer:`<p><b>Bài mẫu</b></p><blockquote>Sách là kho tàng tri thức, là cầu nối giữa các thế hệ và các nền văn hóa. Trong kỷ nguyên số, cách con người tiếp cận tri thức đang thay đổi mạnh mẽ: bên cạnh sách in, sách điện tử, sách nói và các nền tảng đọc trực tuyến ngày càng phổ biến. Điều đó mở ra cơ hội lớn nhưng cũng đặt ra không ít thách thức đối với việc nuôi dưỡng thói quen đọc sâu, đọc có chọn lọc.<br><br>Chỉ thị số 04-CT/TW ngày 17/3/2026 của Ban Bí thư khẳng định: “Phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản”. Nghị quyết số 80-NQ/TW ngày 07/01/2026 của Bộ Chính trị về phát triển văn hóa Việt Nam nhấn mạnh: “Đầu tư cho văn hóa là đầu tư cho phát triển bền vững đất nước”.<br><br>Cuốn sách Văn hóa đọc trong kỷ nguyên số gồm bốn chương: làm rõ một số vấn đề lý luận về văn hóa đọc; phân tích thực trạng văn hóa đọc ở Việt Nam; giới thiệu kinh nghiệm quốc tế; đề xuất giải pháp phát triển văn hóa đọc trong bối cảnh chuyển đổi số. Sách là tài liệu tham khảo hữu ích cho cán bộ làm công tác văn hóa, thư viện, xuất bản, giáo dục và đông đảo bạn đọc quan tâm.<br><br>Nhân dịp Ngày Sách và Văn hóa đọc Việt Nam (21/4), Nhà xuất bản Chính trị quốc gia Sự thật trân trọng giới thiệu cuốn sách và mong nhận được ý kiến đóng góp của bạn đọc.</blockquote><p><span class="muted">Bài mẫu viết theo giả định phát hành dịp 21/4; nếu phát hành thời điểm khác thì bỏ câu “Nhân dịp…”.</span></p>`}

intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề tự soạn để luyện tập, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026. Ở câu sửa lỗi, chỉ tính lỗi đã định sẵn; không tính các biến thể viết hoa được chấp nhận như “Huân chương Sao vàng/Sao Vàng”.`,
questions:[
{q:`Trí tuệ nhân tạo (AI) đang tác động đến hoạt động xuất bản như thế nào? Trình bày các quy định pháp luật mới về AI liên quan đến xuất bản và quyền tác giả, và trách nhiệm của biên tập viên khi bản thảo có sử dụng AI.`,points:30,
outline:["Cơ hội: hỗ trợ tra cứu, đối chiếu, kiểm định thông tin, gợi ý chỉnh sửa, chuyển đổi định dạng, sách nói, dịch; NXB CTQG Sự thật đã thử nghiệm AI trong tra cứu, đối chiếu (5 điểm).","Rủi ro: thông tin sai, nguồn trích dẫn không có thật, sao chép trái phép, khó xác định tác giả, nội dung sai lệch chính trị, lộ dữ liệu bản thảo (5 điểm).","Luật 131/2025/QH15 (hiệu lực 01/4/2026): Chính phủ quy định xác lập quyền với đối tượng tạo ra có sử dụng AI; được dùng văn bản, dữ liệu đã công bố hợp pháp để nghiên cứu, thử nghiệm, huấn luyện AI, không ảnh hưởng bất hợp lý quyền tác giả (5 điểm).","Luật 17/2026/QH16 (hiệu lực 01/3/2027): nội dung tạo bằng AI phải thông báo, gắn nhãn, không giảm trách nhiệm; cấm lợi dụng AI vi phạm pháp luật; đối tác liên kết chịu trách nhiệm về việc dùng AI; không dùng dữ liệu trái phép để huấn luyện AI; Nhà nước đầu tư ứng dụng AI (6 điểm).","Chỉ thị 04-CT/TW: bảo vệ bản quyền trong môi trường số và AI (nhiệm vụ 2); ứng dụng AI, nền tảng dữ liệu xuất bản dùng chung (nhiệm vụ 7) (3 điểm).","Trách nhiệm biên tập viên: yêu cầu khai báo, cam kết; xác minh mọi sự kiện, trích dẫn; không đưa bản thảo chưa công bố lên công cụ AI không bảo mật; AI hỗ trợ, không thay thế thẩm định; gắn nhãn đúng luật (6 điểm)."],
answer:`<p><b>Ý chốt:</b> công nghệ “có thể hỗ trợ con người trong nhiều công đoạn” nhưng trách nhiệm pháp lý về nội dung vẫn thuộc nhà xuất bản, tổng biên tập và biên tập viên. Khi trình bày phải phân biệt mốc hiệu lực: Luật Sở hữu trí tuệ sửa đổi đã có hiệu lực từ 01/4/2026; Luật Xuất bản sửa đổi có hiệu lực từ 01/3/2027.</p>`},
{q:`Đọc đoạn văn sau. Đoạn văn có <b>13 lỗi</b> (chính tả, viết hoa, dấu câu, ngữ pháp, dùng từ, sự kiện – số liệu, tên văn bản, logic, chính trị – tư tưởng). Hãy chỉ ra, sửa, giải thích từng lỗi và viết lại đoạn văn hoàn chỉnh.
<blockquote>Ngày 5/12/1945, Nhà xuất bản Sự thật – tiền thân của Nhà xuất bản Chính trị quốc gia Sự thật hiện nay được thành lập. Cuốn sách đầu tiên nhà xuất bản ấn hành là Tuyên Ngôn Của Đảng Cộng Sản của C. Mác và V.I. Lênin. Năm 1992, trên cơ sở sát nhập ba nhà xuất bản, Nhà xuất bản Chính trị quốc gia được thành lập. Là cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước, chịu sự lãnh đạo trực tiếp, thường xuyên của Bộ Văn hóa, Thể thao và Du lịch, đã xuất bản hàng chục triệu đầu sách, trong đó có nhiều bộ sách lớn như V.I. Lênin Toàn tập. Với những đóng góp to lớn, nhà xuất bản được tặng thưởng Huân chương Sao vàng (năm 2005) và danh hiệu Anh hùng lao động (năm 2015). Nghị quyết số 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị bổ sung nhiệm vụ biên dịch và tổ chức tuyên chuyền, giới thiệu xuất bản phẩm. Trong giai đoạn mới, nhà xuất bản đẩy mạnh chuyển đổi số, phát triển xuất bản điện tử, đặt lợi ích kinh tế lên trên định hướng chính trị, tư tưởng. Kỷ niệm 75 năm thành lập (5/12/1945 – 5/12/2025) là dịp để đội ngũ cán bộ, biên tập viên ôn lại truyền thống, tiếp tục xứng đáng là ngọn cờ đầu của xuất bản chính trị, lý luận.</blockquote>`,points:40,
outline:["Mỗi lỗi 2,5 điểm: phát hiện 1, sửa đúng 1, giải thích 0,5 (13 lỗi = 32,5 điểm).","Đoạn văn sửa hoàn chỉnh (7,5 điểm).","Sửa sai chỗ vốn đúng: trừ 1 điểm/lần."],

<p><b>Đoạn văn đã sửa</b></p><blockquote>Ngày 5/12/1945, Nhà xuất bản Sự thật – tiền thân của Nhà xuất bản Chính trị quốc gia Sự thật hiện nay – được thành lập. Cuốn sách đầu tiên nhà xuất bản ấn hành là Tuyên ngôn của Đảng Cộng sản của C. Mác và Ph. Ăngghen. Năm 1992, trên cơ sở hợp nhất bốn nhà xuất bản, Nhà xuất bản Chính trị quốc gia được thành lập. Là cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước, chịu sự lãnh đạo trực tiếp, thường xuyên của Ban Bí thư, nhà xuất bản đã xuất bản hàng chục nghìn đầu sách, trong đó có nhiều bộ sách lớn như V.I. Lênin Toàn tập. Với những đóng góp to lớn, nhà xuất bản được tặng thưởng Huân chương Sao vàng (năm 2005) và danh hiệu Anh hùng Lao động (năm 2015). Quyết định số 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị bổ sung nhiệm vụ biên dịch và tổ chức tuyên truyền, giới thiệu xuất bản phẩm. Trong giai đoạn mới, nhà xuất bản đẩy mạnh chuyển đổi số, phát triển xuất bản điện tử, đồng thời luôn giữ vững định hướng chính trị, tư tưởng, không vì áp lực tiến độ, lợi ích kinh tế mà xem nhẹ chất lượng. Kỷ niệm 80 năm thành lập (5/12/1945 – 5/12/2025) là dịp để đội ngũ cán bộ, biên tập viên ôn lại truyền thống, tiếp tục xứng đáng là ngọn cờ đầu của xuất bản chính trị, lý luận.</blockquote>`},
{q:`Một công ty đề nghị liên kết với nhà xuất bản để xuất bản <b>bản dịch tiếng Việt</b> cuốn sách của một học giả nước ngoài về kinh tế thị trường (xuất bản lần đầu ở nước ngoài năm 2019). Hồ sơ gồm bản dịch; thư điện tử của tác giả đồng ý “về nguyên tắc”; 15 biểu đồ lấy từ các báo cáo quốc tế. Đọc bản thảo, anh/chị thấy: (a) chương 7 cho rằng chế độ đa đảng là điều kiện bắt buộc của kinh tế thị trường; (b) bản đồ minh họa khu vực châu Á không thể hiện quần đảo Hoàng Sa, Trường Sa của Việt Nam; (c) số liệu về Việt Nam chỉ đến năm 2015; (d) bản dịch có nhiều câu dịch sát, khó hiểu. Viết <b>phiếu nhận xét, thẩm định</b> (khoảng 350 chữ) và đề xuất hướng xử lý.`,points:30,
outline:["Pháp lý – bản quyền: tác phẩm nước ngoài xuất bản để kinh doanh tại Việt Nam phải qua nhà xuất bản Việt Nam (Điều 26); dịch là tác phẩm phái sinh – cần hợp đồng/văn bản chấp thuận của chủ sở hữu quyền tác giả (Điều 21 Luật Xuất bản, Điều 20 Luật SHTT); thư “về nguyên tắc” chưa đủ; biểu đồ phải xin phép hoặc trích dẫn hợp lý có nguồn; sách ghi tên nguyên bản, ngôn ngữ (Điều 27) (7 điểm).","Liên kết: nội dung chạm lý luận chính trị nên nhà xuất bản tự biên tập, không giao đối tác biên tập sơ bộ; tổng giám đốc có thể tổ chức thẩm định độc lập (Điều 18) (4 điểm).","(a) Quan điểm trái đường lối kinh tế thị trường định hướng xã hội chủ nghĩa và vai trò lãnh đạo của Đảng: thỏa thuận với chủ sở hữu quyền để lược bỏ (quyền bảo vệ toàn vẹn – phải được đồng ý) hoặc có Lời nhà xuất bản, chú thích định hướng; không thỏa thuận được thì không xuất bản (6 điểm).","(b) Bản đồ thiếu Hoàng Sa, Trường Sa: “không thể hiện hoặc thể hiện không đúng chủ quyền quốc gia” là nội dung bị cấm (Điều 10) – bắt buộc sửa hoặc bỏ bản đồ (5 điểm).","(c) Số liệu cũ: chú thích của nhà xuất bản, cập nhật có nguồn; (d) hiệu đính bản dịch, chuẩn hóa thuật ngữ (4 điểm).","Kết luận: chưa đủ điều kiện đăng ký; liệt kê yêu cầu bổ sung; hình thức phiếu rõ ràng (4 điểm)."],
answer:`<p><b>Phiếu mẫu (rút gọn).</b> Kết luận: bản thảo chưa đủ điều kiện đăng ký xuất bản. Yêu cầu: (1) hợp đồng chuyển nhượng quyền dịch, xuất bản bằng văn bản với chủ sở hữu quyền tác giả; (2) xin phép hoặc thay thế 15 biểu đồ, ghi nguồn đầy đủ; (3) thỏa thuận với chủ sở hữu quyền về việc lược bỏ hoặc chú thích chương 7 – nếu không đạt thỏa thuận thì đề nghị không xuất bản; (4) bỏ hoặc sửa bản đồ để thể hiện đúng chủ quyền của Việt Nam đối với quần đảo Hoàng Sa, Trường Sa; (5) bổ sung chú thích số liệu mới, có nguồn; (6) tổ chức hiệu đính bản dịch. Nhà xuất bản tự biên tập toàn bộ; đối tác chỉ tham gia khai thác bản thảo, in, phát hành.</p>`}
]});

/* ===== NXB Chính trị quốc gia Sự thật: hồ sơ cơ quan, thông tin kỳ thi, chuẩn bị phỏng vấn ===== */
DOCS.push({id:"nxbst",group:"pro",short:"NXB Chính trị quốc gia Sự thật – hồ sơ cơ quan",mmLabel:"NXB CTQG Sự thật (lịch sử, chức năng, sản phẩm)",so:"NXB CTQG ST",
title:"Nhà xuất bản Chính trị quốc gia Sự thật: lịch sử, vị trí, chức năng, tổ chức và hoạt động (cập nhật 10/2026)",
meta:[["Ngày truyền thống","05/12/1945 (tiền thân: Nhà xuất bản Sự thật)"],["Vị trí","Đơn vị sự nghiệp của Trung ương Đảng, đặt dưới sự lãnh đạo trực tiếp và thường xuyên của Ban Bí thư"],["Văn bản quy định chức năng","Quyết định 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị (thay Quyết định 68-QĐ/TW ngày 03/4/2003)"],["Giám đốc – Tổng Biên tập","PGS.TS Vũ Trọng Lâm (nhận quyết định 21/6/2023), Bí thư Đảng ủy"],["Trụ sở","6/86 Duy Tân, Cầu Giấy và 24 Quang Trung, Hoàn Kiếm, Hà Nội (theo website)"],["Khẩu hiệu trên website","“Nâng tầm tri thức, phát triển văn hóa đọc”"],["Khen thưởng gần nhất","Huân chương Lao động hạng Nhất (Lễ kỷ niệm 80 năm, 01/12/2025)"]],
tldr:`Cơ quan <b>xuất bản lý luận, chính trị của Đảng và Nhà nước</b>. Tiền thân là <b>Nhà xuất bản Sự thật</b>, ra đời <mark>05/12/1945</mark> dưới sự lãnh đạo trực tiếp của Tổng Bí thư <b>Trường Chinh</b>. Ngày <mark>20/11/1992</mark>, Quyết định 53-QĐ/TW của Ban Bí thư hợp nhất <mark>4</mark> nhà xuất bản. Hiện là <b>đơn vị sự nghiệp của Trung ương Đảng, đặt dưới sự lãnh đạo trực tiếp và thường xuyên của Ban Bí thư</b>; chức năng, nhiệm vụ theo <mark>Quyết định 223-QĐ/TW ngày 28/12/2024</mark> của Bộ Chính trị (3 nhóm nhiệm vụ: biên tập, <b>biên dịch</b>, xuất bản; nghiên cứu khoa học; tuyên truyền, giới thiệu xuất bản phẩm); đơn vị cấp vụ giảm <mark>17 → 14</mark>. Giám đốc – Tổng Biên tập: <b>PGS.TS Vũ Trọng Lâm</b>. Dịp <mark>80 năm</mark> (lễ ngày 01/12/2025) đón nhận <b>Huân chương Lao động hạng Nhất</b>.`,
sections:[
{h:"Lịch sử: các mốc phải thuộc",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Mốc</th><th>Sự kiện</th></tr></thead><tbody>
<tr><td><b>05/12/1945</b></td><td>Nhà xuất bản <b>Sự thật</b> ra đời tại Hà Nội, dưới sự lãnh đạo trực tiếp của Tổng Bí thư <b>Trường Chinh</b>. Vì Đảng hoạt động bí mật, sách ra mắt dưới danh nghĩa <b>“Hội Những người nghiên cứu chủ nghĩa Mác ở Đông Dương”</b>. Năm 1945–1946 in 33 đầu sách. Cuốn sách được nhắc đến đầu tiên thời kháng chiến: <b>Tuyên ngôn của Đảng Cộng sản</b>.</td></tr>
<tr><td>1946–1954</td><td>Lên chiến khu <b>Việt Bắc</b>. 1950–1952 hình thành ban biên tập chuyên trách do <b>Minh Tranh</b> phụ trách (1952 làm Trưởng ban). Năm 1951 xuất bản văn kiện Đại hội II của Đảng.</td></tr>
<tr><td>Sau 1954</td><td>Trở về Hà Nội; xuất bản có hệ thống kinh điển Mác – Lênin và văn kiện Đảng: <b>V.I. Lênin Toàn tập (55 tập)</b>, C.Mác – Ph.Ăngghen Tuyển tập, bộ <b>Tư bản</b> (8 tập, 1959–1965).</td></tr>
<tr><td><b>24/10/1979</b></td><td>Quyết định <b>53-QĐ/TW</b> của Ban Bí thư: nâng thành cơ quan xuất bản của Đảng trực thuộc Ban Chấp hành Trung ương, vị trí <b>tương đương Tổng cục</b>.</td></tr>
<tr><td>1990</td><td>Hoàn thành <b>Hồ Chí Minh Toàn tập</b> lần thứ nhất (10 tập); dịp 45 năm đón nhận <b>Huân chương Hồ Chí Minh</b>.</td></tr>
<tr><td><b>20/11/1992</b></td><td>Quyết định <b>53-QĐ/TW</b> của Ban Bí thư hợp nhất <b>4</b> nhà xuất bản: Sự thật (Ban Bí thư), Thông tin lý luận (Viện Mác – Lênin và Tư tưởng Hồ Chí Minh), Tư tưởng – Văn hóa (Ban Tư tưởng – Văn hóa Trung ương), Pháp lý (Bộ Tư pháp). Phương châm: <b>“Đoàn kết, ổn định và phát triển”</b>.</td></tr>
<tr><td><b>03/4/2003</b></td><td>Quyết định <b>68-QĐ/TW</b> của Bộ Chính trị về chức năng, nhiệm vụ, tổ chức bộ máy.</td></tr>
<tr><td>Từ 2007</td><td>Chuyển sang cơ chế tự chủ theo Nghị định 43/2006/NĐ-CP (vừa làm nhiệm vụ chính trị vừa bảo đảm tài chính).</td></tr>
<tr><td>2009</td><td>Bắt đầu <b>Đề án trang bị sách cho cơ sở xã, phường, thị trấn</b> (thí điểm 16 tỉnh, thành; từ 2012 mở rộng 63 tỉnh, thành).</td></tr>
<tr><td><b>16/4/2020</b></td><td><b>Chỉ thị 44-CT/TW</b> của Ban Bí thư: xây dựng Nhà xuất bản thành trung tâm xuất bản, phát hành sách lý luận, chính trị, <b>giữ vai trò nòng cốt</b>.</td></tr>
<tr><td><b>28/12/2024</b></td><td><b>Quyết định 223-QĐ/TW</b> của Bộ Chính trị (thay QĐ 68-QĐ/TW); Tổng Bí thư Tô Lâm trao quyết định cho PGS.TS Vũ Trọng Lâm tại hội nghị công bố quyết định cho 13 cơ quan, đơn vị Trung ương cuối tháng 12/2024.</td></tr>
<tr><td><b>01/12/2025</b></td><td>Lễ kỷ niệm <b>80 năm</b> Ngày truyền thống (05/12/1945 – 05/12/2025), đón nhận <b>Huân chương Lao động hạng Nhất</b>.</td></tr>
</tbody></table></div>
<p><span class="muted">Về tên gọi: bài 76 năm trên website Nhà xuất bản ghi năm 1992 thành lập “Nhà xuất bản Chính trị quốc gia”; bài Hà Nội mới (2005) dùng tên “Chính trị quốc gia – Sự thật” ngay từ 1992. Thời điểm chính thức ghép lại chữ “Sự thật” vào tên gọi chưa xác minh được. Tên hiện hành trong các văn bản 2024–2026: “Nhà xuất bản Chính trị quốc gia Sự thật”.</span></p>`},
{h:"Vị trí, chức năng, nhiệm vụ (Quyết định 223-QĐ/TW ngày 28/12/2024)",items:[
"<b>Vị trí (Điều 1):</b> Nhà xuất bản Chính trị quốc gia Sự thật là <b>đơn vị sự nghiệp của Trung ương Đảng</b>, đặt dưới <b>sự lãnh đạo trực tiếp và thường xuyên của Ban Bí thư</b>; là cơ quan xuất bản sách chính trị, lý luận của Đảng và Nhà nước; hoạt động theo đường lối của Đảng và pháp luật của Nhà nước.",
"<b>Nhiệm vụ 1 – Biên tập, biên dịch, xuất bản:</b> sách chính trị, lý luận, xã hội, pháp luật góp phần bảo vệ nền tảng tư tưởng của Đảng, tuyên truyền chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh, nâng cao năng lực lãnh đạo của Đảng; sách thông tin đối ngoại; sách tham khảo phục vụ lãnh đạo, quản lý; sách cho cán bộ, đảng viên và Nhân dân.",
"<b>Nhiệm vụ 2 – Nghiên cứu khoa học:</b> nghiên cứu trực tiếp phục vụ biên tập, xuất bản; <b>tham mưu Bộ Chính trị, Ban Bí thư</b> về xuất bản sách chính trị, lý luận; tham gia chương trình, đề tài khoa học xã hội cấp nhà nước, cấp bộ.",
"<b>Nhiệm vụ 3 – Tuyên truyền, giới thiệu:</b> tổ chức tuyên truyền, giới thiệu xuất bản phẩm chính trị, lý luận, xã hội, pháp luật để nâng cao nhận thức chính trị cho cán bộ, đảng viên và Nhân dân.",
"<b>Điểm mới so với QĐ 68-QĐ/TW (2003):</b> bổ sung từ <b>“biên dịch”</b> vào nhiệm vụ thứ nhất và bổ sung nhiệm vụ <b>tuyên truyền, giới thiệu xuất bản phẩm</b>; số đơn vị cấp vụ giảm từ <b>17 xuống 14</b> (giảm khoảng 18%).",
"Công tác cán bộ lãnh đạo: các quyết định bổ nhiệm năm 2026 do đại diện <b>Ban Tổ chức Trung ương</b> công bố; năm 2025 Phó Trưởng Ban Tuyên giáo và Dân vận Trung ương trao quyết định Ủy viên Hội đồng Biên tập – Xuất bản chuyên trách. Không nguồn nào đã đọc ghi Nhà xuất bản “trực thuộc Ban Tuyên giáo”."]},
{h:"Tổ chức bộ máy và lãnh đạo (10/2026)",items:[
"<b>Ban lãnh đạo</b> (website, đăng 28/3/2026): PGS.TS <b>Vũ Trọng Lâm</b> – Bí thư Đảng ủy, Giám đốc – Tổng Biên tập; ThS <b>Phạm Thị Thinh</b> – Phó Bí thư Đảng ủy, Phó Giám đốc – Phó Tổng Biên tập; ThS <b>Nguyễn Hoài Anh</b>, TS <b>Võ Văn Bé</b>, ThS <b>Nguyễn Thái Bình</b> – Ủy viên Ban Thường vụ Đảng ủy, Phó Giám đốc – Phó Tổng Biên tập.",
"Biến động 2026: <b>Nguyễn Thái Bình</b> (Phó Giám đốc) kiêm Phó Tổng Biên tập từ <b>19/3/2026</b>; <b>Nguyễn Hoài Anh</b> được bổ nhiệm lại Phó Giám đốc – Phó Tổng Biên tập ngày <b>29/4/2026</b> (34 năm làm xuất bản). Cả hai quyết định do đại diện Vụ V, Ban Tổ chức Trung ương công bố.",
"<b>Hội đồng Biên tập – Xuất bản</b> (website, 07/10/2026): Chủ tịch Vũ Trọng Lâm; Ủy viên Thư ký Nguyễn Hoài Anh; Ủy viên Võ Văn Bé, Phạm Thị Thinh, Nguyễn Thái Bình; <b>3 Ủy viên chuyên trách</b>: TS Nguyễn Công Dũng (tuyên truyền), PGS.TS Lê Thị Thục (nghiên cứu khoa học), ThS Phạm Thị Kim Huế (đọc duyệt bản thảo) – bổ nhiệm từ 01/3/2025.",
"<b>Đơn vị trực thuộc</b> (14 đơn vị theo danh mục hiện hành trên website, sau khi sắp xếp theo QĐ 223): <b>Khối Biên tập</b> – Ban sách Xây dựng Đảng; Ban sách Nhà nước và Pháp luật; Ban sách Lý luận, Kinh điển; Ban sách Quốc tế; Ban sách Kinh tế; Ban sách Giáo khoa và Tham khảo; Trung tâm Xuất bản điện tử; Trung tâm Thông tin và Nghiên cứu khoa học. <b>Khối Tham mưu</b> – Vụ Kế hoạch – Tài chính; Văn phòng. <b>Khối Sản xuất – Kinh doanh</b> – Trung tâm Phát hành; Xưởng in (trước đây gọi là Nhà in Sự thật). <b>Chi nhánh</b> – TP. Hồ Chí Minh; Cần Thơ.",
"<b>Mạng lưới:</b> Chi nhánh tại TP. Hồ Chí Minh (72 Trần Quốc Thảo) và Cần Thơ; Trung tâm Phát hành sách Đà Nẵng, Huế, Quảng Ngãi, Nha Trang; Trung tâm Sách quốc gia tại 24 Quang Trung, Hà Nội.",
"<b>Tạp chí Chính trị và Phát triển</b>: Chủ tịch Hội đồng biên tập là PGS.TS Vũ Trọng Lâm; năm 2026 Nhà xuất bản đặt nhiệm vụ nâng cao chất lượng tạp chí."]},
{h:"Sản phẩm và bộ sách chủ lực",items:[
"<b>12 nhóm sách</b> trên website: Kinh điển; Chủ tịch Hồ Chí Minh; Lãnh đạo Đảng, Nhà nước; Văn kiện; Xây dựng Đảng, Nhà nước; Kinh tế; Văn hóa, xã hội; Pháp luật; Những vấn đề quốc tế; Quốc phòng, an ninh, đối ngoại; Sách dành cho xã, phường, thị trấn; Các ấn phẩm khác.",
"<b>Hồ Chí Minh Toàn tập:</b> lần thứ nhất (1990) <mark>10 tập</mark>, khoảng 1.800 tác phẩm; lần thứ ba <mark>15 tập</mark>, khoảng 3.300 tác phẩm (1912–1969). <b>Hồ Chí Minh – Biên niên tiểu sử</b> 10 tập. Tháng 01/2026 tái bản các ấn phẩm này chào mừng Đại hội XIV.",
"<b>Văn kiện Đảng Toàn tập:</b> hoàn thành <mark>54 tập</mark> năm 2007. Năm 2025 triển khai biên tập, xuất bản bộ <b>Văn kiện Đảng toàn tập (80 tập)</b>, xác định là nhiệm vụ chính trị trọng tâm.",
"<b>Văn kiện Đại hội đại biểu toàn quốc lần thứ XIV</b> (tin 07/3/2026): phối hợp với <b>Văn phòng Trung ương Đảng</b>; <mark>2 tập, 823 trang</mark>, gồm <b>10 văn kiện</b> (diễn văn khai mạc, bế mạc; Báo cáo chính trị; Nghị quyết Đại hội; Chương trình hành động; Báo cáo tổng kết 40 năm đổi mới; Báo cáo tổng kết 15 năm thi hành Điều lệ Đảng…). Cùng Ban Tuyên giáo và Dân vận Trung ương, Hội đồng Lý luận Trung ương chuẩn bị sách hỏi – đáp, giải thích thuật ngữ.",
"<b>Đề án trang bị sách cho cơ sở xã, phường, thị trấn</b> (2009–2023, theo chỉ đạo của Ban Bí thư): <mark>593 đầu</mark> (gồm CD-ROM, CD audio), <mark>hơn 14,4 triệu bản</mark>; tổng kết 15 năm ngày 28/12/2023 do Ban Tuyên giáo Trung ương và Nhà xuất bản tổ chức.",
"<b>Sách nổi bật 2026:</b> “80 năm Quốc hội Việt Nam – Những dấu ấn lịch sử” (ra mắt 05/01/2026, phối hợp Văn phòng Quốc hội); “Công tác tư tưởng của Đảng – Nền tảng đưa đất nước tiến bước trong kỷ nguyên mới” của Đại tướng Nguyễn Trọng Nghĩa (ra mắt 08/6/2026, 6 phần, có phần về báo chí, xuất bản “chuyên nghiệp, nhân văn, hiện đại”).",
"Sách ngoại văn và đối ngoại: dịch, xuất bản tác phẩm của Chủ tịch Hồ Chí Minh, cố Tổng Bí thư Nguyễn Phú Trọng ra tiếng nước ngoài; trên stbook.vn có tủ sách tiếng Lào, tiếng Tây Ban Nha, tủ sách thông tin đối ngoại."]},
{h:"Chuyển đổi số và nền tảng số",items:[
"<b>stbook.vn</b> – “Hệ thống xuất bản, phát hành xuất bản phẩm điện tử” của Nhà xuất bản: sách điện tử, sách nói, sách đa phương tiện; ứng dụng đọc trên iOS, Android. Tủ sách: của và về Chủ tịch Hồ Chí Minh; của và về đồng chí Nguyễn Phú Trọng; bảo vệ nền tảng tư tưởng của Đảng; học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh; tủ sách chi bộ; thông tin đối ngoại; chào mừng Đại hội XIV…",
"<b>thuviencoso.vn</b> – thư viện điện tử sách xã, phường, thị trấn, xây dựng từ đầu năm 2020, số hóa hơn 500 đầu sách của Đề án.",
"Kênh khác: <b>sachquocgia.vn</b>, <b>STstore.vn</b> (ra mắt năm 2025), livestream và các nền tảng Facebook, TikTok, Zalo, Shopee, Tiki.",
"Mốc số: xuất bản sách điện tử từ <b>10/2019</b>; tủ sách điện tử Chủ tịch Hồ Chí Minh trên stbook.vn có <b>135 đầu</b> (7/2025); năm 2025 xuất bản <b>hơn 700 sách điện tử</b>, <b>hơn 210 mã QR</b> tích hợp sách nói.",
"Định hướng 2026: <b>số hóa toàn diện quy trình biên tập, xuất bản</b>; phát triển sách nói, sách tương tác, đa phương tiện; ứng dụng AI trong quản trị, xây dựng “cơ quan số”; số hóa cơ sở dữ liệu sách lý luận, chính trị.",
"Bộ máy gắn chuyển đổi số: Trung tâm Xuất bản điện tử, Trung tâm Phát hành, Trung tâm Thông tin và Nghiên cứu khoa học được tổ chức lại theo hướng hiện đại; có hệ thống điều hành điện tử nội bộ."]},

{h:"Số liệu hoạt động gần đây",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Kỳ</th><th>Kết quả</th></tr></thead><tbody>
<tr><td>2015–2020</td><td>Khoảng 6.000 đầu sách (mới, tái bản), hơn 24 triệu bản</td></tr>

<tr><td>6 tháng đầu 2025</td><td>253 bản thảo; 164 đầu sách in (hơn 2,6 triệu bản); 70 sách điện tử</td></tr>
<tr><td>Năm 2025</td><td>685 bản thảo trình duyệt (đến 05/12/2025, bằng 109,4% năm 2024); 529,5 triệu trang in quy đổi; doanh thu phát hành sách tăng 167,9%; hơn 700 sách điện tử; 16 hội thảo, tọa đàm (13 cấp quốc gia)</td></tr>

</tbody></table></div>`},
{h:"Định hướng và yêu cầu đặt ra",items:[
"<b>Thư Tổng Bí thư Tô Lâm (01/12/2025):</b> Nhà xuất bản đã “khẳng định và phát huy xứng đáng vai trò là cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước”; yêu cầu đổi mới mạnh mẽ mô hình quản trị và hoạt động xuất bản theo hướng <b>“chuyên nghiệp, nhân văn, hiện đại”</b>; thích ứng cơ chế thị trường, thị hiếu bạn đọc; cập nhật xu thế xuất bản thế giới; phát triển xuất bản trên nền tảng số; xây dựng đội ngũ biên tập viên giỏi chuyên môn, có đạo đức cách mạng, tinh thần đổi mới.",
"<b>Chủ tịch Quốc hội Trần Thanh Mẫn:</b> <b>“mỗi trang sách là một hàng rào tư tưởng, mỗi công trình là một pháo đài lý luận”</b>; nghiên cứu khoa học là <b>trụ cột chiến lược</b> song hành với biên tập, xuất bản; chuyển đổi số toàn diện, ứng dụng AI và dữ liệu lớn; trở thành nhà xuất bản hàng đầu, dẫn dắt.",
"<b>Kế hoạch 2026:</b> 5 định hướng, 10 nhiệm vụ trọng tâm; 6 tháng cuối 2026 hoàn thành kế hoạch xuất bản phục vụ triển khai Nghị quyết Đại hội XIV và triển khai <b>Chỉ thị 04-CT/TW ngày 17/3/2026</b> của Ban Bí thư về xuất bản.",
"<b>Khung chính sách ngành:</b> Chỉ thị 44-CT/TW (16/4/2020) về đổi mới, nâng cao chất lượng, hiệu quả xuất bản, phát hành và nghiên cứu, học tập sách lý luận, chính trị; Chỉ thị 04-CT/TW (17/3/2026); Luật sửa đổi, bổ sung một số điều của Luật Xuất bản số 17/2026/QH16 (thông qua 24/8/2026, hiệu lực 01/3/2027)."]}
],

ESSAY.push(
{doc:"nxbst",q:"Trình bày vị trí, chức năng, nhiệm vụ của Nhà xuất bản Chính trị quốc gia Sự thật theo Quyết định 223-QĐ/TW. Liên hệ trách nhiệm của người biên tập viên.",outline:["Mở bài: 80 năm truyền thống (05/12/1945); QĐ 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị thay QĐ 68-QĐ/TW (2003).","Vị trí: đơn vị sự nghiệp của Trung ương Đảng, Ban Bí thư lãnh đạo trực tiếp và thường xuyên; cơ quan xuất bản sách chính trị, lý luận của Đảng và Nhà nước.","Ba nhóm nhiệm vụ: biên tập, biên dịch, xuất bản; nghiên cứu khoa học, tham mưu Bộ Chính trị, Ban Bí thư; tuyên truyền, giới thiệu xuất bản phẩm. Điểm mới: “biên dịch”, nhiệm vụ tuyên truyền; cấp vụ 17 → 14.","Kết quả minh họa: Hồ Chí Minh Toàn tập 15 tập; Văn kiện Đại hội XIV (2 tập, 823 trang); Đề án sách cơ sở (593 đầu, 14,4 triệu bản); stbook.vn.","Liên hệ biên tập viên: bản lĩnh chính trị, “mỗi trang sách là một hàng rào tư tưởng”; chính xác trích dẫn văn kiện; tuân thủ quy trình, Luật Xuất bản; chủ động chuyển đổi số; làm sách lý luận gần bạn đọc."]},
{doc:"nxbst",q:"Phân tích yêu cầu chuyển đổi số trong hoạt động của Nhà xuất bản Chính trị quốc gia Sự thật. Người biên tập viên cần chuẩn bị gì?",outline:["Căn cứ: Thư Tổng Bí thư (“chuyên nghiệp, nhân văn, hiện đại”, phát triển xuất bản trên nền tảng số); phát biểu Chủ tịch Quốc hội (AI, dữ liệu lớn, thư viện số); Chỉ thị 04-CT/TW (100% nhà xuất bản tham gia xuất bản điện tử đến 2030).","Thực trạng: stbook.vn, thuviencoso.vn, STstore.vn; từ 10/2019 xuất bản sách điện tử; 2025 hơn 700 sách điện tử, hơn 210 mã QR sách nói; livestream, mạng xã hội.","Định hướng 2026: số hóa toàn diện quy trình biên tập, xuất bản; sách nói, sách tương tác, đa phương tiện; AI trong quản trị; số hóa cơ sở dữ liệu sách lý luận, chính trị.","Rủi ro: “không để công nghệ đi trước kỷ luật nội dung”; bản quyền trên môi trường số; nội dung do AI tạo phải công bố, gắn nhãn (Luật 17/2026/QH16).","Biên tập viên: kỹ năng số (theo dõi sửa đổi, quản lý tệp, dữ liệu), biên tập đa định dạng, kiểm chứng nguồn, dùng AI có kiểm soát, viết nội dung giới thiệu sách trên nền tảng số."]},
{doc:"nxbst",q:"80 năm Nhà xuất bản Chính trị quốc gia Sự thật: những dấu mốc chính và bài học cho đội ngũ biên tập viên hôm nay.",outline:["Dấu mốc: 1945 ra đời (Trường Chinh); kháng chiến ở Việt Bắc; sau 1954 xuất bản kinh điển (Lênin Toàn tập 55 tập); 1979 tương đương Tổng cục; 1992 hợp nhất 4 nhà xuất bản; 2003 QĐ 68; 2020 Chỉ thị 44; 2024 QĐ 223; 2025 Huân chương Lao động hạng Nhất.","Thành tựu: Hồ Chí Minh Toàn tập, Văn kiện Đảng Toàn tập, sách phục vụ các kỳ Đại hội, Đề án sách cơ sở, sách đối ngoại.","Bài học: kiên định nền tảng tư tưởng; chính xác, cẩn trọng từng câu chữ; gắn nghiên cứu khoa học với biên tập; đổi mới phương thức, hướng tới bạn đọc; đoàn kết, kỷ cương.","Trách nhiệm cá nhân: học tập lý luận, nghiệp vụ; có chứng chỉ hành nghề; giữ đạo đức nghề nghiệp; chủ động chuyển đổi số."]}

{h:"Đã xác minh: các thông báo tuyển dụng gần nhất của NXB CTQG Sự thật",html:`<p><b>Thông báo tuyển dụng viên chức năm 2026</b> đã đăng ngày <mark>23/9/2026</mark> trên nxbctqg.org.vn, kèm Phiếu đăng ký dự tuyển theo <b>Nghị định 259/2026</b>. Nội dung (vị trí, chỉ tiêu, môn thi, hạn nộp) nằm trong 4 trang ảnh scan nên tài liệu này chưa có chi tiết; hãy mở trực tiếp để đối chiếu. Nghị định 259 (Điều 17) cho nhận Phiếu trong <mark>30 ngày</mark> kể từ ngày thông báo công khai: nếu tính từ 23/9 thì hạn chót khoảng <mark>23/10/2026</mark>.</p><p><b>Ngày 07/10/2026</b> Nhà xuất bản đăng tiếp <b>Thông báo danh mục tài liệu giới hạn nội dung kiến thức</b> (cũng là ảnh scan). Đây là danh mục ôn tập chính thức: đối chiếu với các văn bản trong sổ tay này.</p><p>Hai đợt trước:</p>
<div class="tablewrap"><table class="nums"><thead><tr><th>Năm</th><th>Vị trí, chỉ tiêu</th><th>Hình thức, nội dung</th></tr></thead><tbody>
<tr><td><b>2025</b><br>(đăng 21/3/2025)</td><td>Viên chức quản lý (Huế, Quảng Ngãi, Nha Trang), viên chức quản lý phát hành, kế toán viên. <b>Không có vị trí biên tập.</b></td><td><b>Thi 2 vòng.</b> Vòng 1: trắc nghiệm trên máy tính <mark>60 câu / 60 phút</mark> (pháp luật viên chức, chủ trương, đường lối của Đảng, chính sách, pháp luật ngành). Vòng 2: <mark>vấn đáp môn nghiệp vụ chuyên ngành 30 phút</mark>, thang 100. Điều kiện: đại học loại khá trở lên đúng chuyên ngành; tuổi nữ 22 đến dưới 35, nam 22 đến dưới 40; ưu tiên đảng viên, người có kinh nghiệm biên tập, xuất bản, phát hành. Phiếu theo NĐ 85/2023; lệ phí 500.000 đồng.</td></tr>
<tr><td><b>2020</b><br>(TB 420-TB/NXBCTQGST, 17/3/2020)</td><td>24 chỉ tiêu, trong đó <b>Biên tập: 15</b> (Hà Nội 14, TP. Hồ Chí Minh 01).</td><td><b>Xét tuyển.</b> Vòng 1 kiểm tra điều kiện; vòng 2 <b>phỏng vấn hoặc thực hành</b>. Biên tập: đại học trở lên chuyên ngành khoa học xã hội và nhân văn; ưu tiên loại giỏi, thạc sĩ, tiến sĩ; tin học cơ bản (TT 03/2014/TT-BTTTT); ngoại ngữ bậc 2. Lệ phí 500.000 đồng; nộp tại Vụ Tổ chức – Cán bộ, 6/86 Duy Tân.</td></tr>
</tbody></table></div>
<p><span class="muted">Nguồn: nxbctqg.org.vn/thong-bao-tuyen-dung-vien-chuc-nha-xuat-ban-chinh-tri-quoc-gia-su-that.html (2020); nxbctqg.org.vn/nha-xuat-ban-chinh-tri-quoc-gia-su-that-tuyen-dung-vien-chuc-899.html (2025, văn bản dạng ảnh, không đọc được ảnh gốc); nội dung chữ của thông báo 2025 lấy theo congchuc247.vn/tuyen-dung-vien-chuc-nha-xuat-ban-chinh-tri-quoc-gia-su-that-2025/. Thông báo 2026: nxbctqg.org.vn/thong-bao-tuyen-dung-vien-chuc-nam-2026.html; danh mục tài liệu: nxbctqg.org.vn/thong-bao-danh-muc-tai-lieu-gioi-han-noi-dung-kien-thuc.html.</span></p>`},
{h:"Khung thi theo Nghị định 259/2026/NĐ-CP (hiệu lực 01/7/2026)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Vòng</th><th>Hình thức</th><th>Thời gian, điểm</th></tr></thead><tbody>
<tr><td>Thi tuyển – Vòng 1</td><td>Trắc nghiệm trên máy tính: kiến thức chung (pháp luật viên chức, đường lối của Đảng, chính sách, pháp luật ngành, lĩnh vực tuyển dụng); ngoại ngữ nếu có (miễn khi có văn bằng, chứng chỉ phù hợp)</td><td><mark>60 câu / 60 phút</mark>; ngoại ngữ tối đa 60 phút. Qua vòng khi đúng <mark>từ 50%</mark> số câu ở từng phần</td></tr>
<tr><td>Thi tuyển – Vòng 2, cách A</td><td><b>Thực hành</b> môn nghiệp vụ chuyên ngành</td><td>Thời gian do người đứng đầu cơ quan tuyển dụng quyết định; thang 100</td></tr>
<tr><td>Thi tuyển – Vòng 2, cách B</td><td><b>Viết + phỏng vấn</b></td><td>Viết <mark>180 phút</mark> (không kể chép đề), hoặc viết trên máy tính <mark>60–120 câu, 90–180 phút</mark>; phỏng vấn <mark>tối đa 30 phút</mark>, chuẩn bị không quá 15 phút; quy đổi <mark>viết 70% – phỏng vấn 30%</mark></td></tr>
<tr><td>Trúng tuyển</td><td>Thi tuyển</td><td>Điểm nghiệp vụ từ 50 trở lên; cách B phải dự đủ 2 bài, mỗi bài đạt từ 50%; xếp theo tổng điểm vòng 2 cộng điểm ưu tiên. Bằng điểm: ưu tiên điểm nghiệp vụ, rồi điểm bài viết</td></tr>
<tr><td>Xét tuyển – Vòng 2</td><td>Vấn đáp hoặc thực hành</td><td>Vấn đáp 30 phút, chuẩn bị không quá 15 phút; thang 100; đạt từ 50</td></tr>
</tbody></table></div>
<p><span class="muted">Suy luận: Nhà xuất bản là đơn vị sự nghiệp của Trung ương Đảng nhưng thông báo 2025 dùng mẫu phiếu của NĐ 85/2023 (Chính phủ), nên kỳ tuyển 2026 nhiều khả năng áp dụng NĐ 259/2026. Chưa có văn bản của Nhà xuất bản xác nhận.</span></p>`},
{h:"Vòng viết 90 phút: chưa xác nhận được",html:`<ul>
<li><b>Chưa tìm thấy</b> thông báo nào của Nhà xuất bản ghi vòng thi viết 90 phút. Thông báo 2025 dùng <b>vấn đáp 30 phút</b>; thông báo 2020 là <b>xét tuyển</b> (phỏng vấn hoặc thực hành).</li>
<li>Theo NĐ 259/2026, mốc <b>90 phút chỉ khớp với hình thức thi viết trên máy tính</b> (60–120 câu, 90–180 phút), là mức thấp nhất. Bài viết trên giấy là <b>180 phút</b>. Nếu Thông báo 2026 ghi “viết 90 phút”, nhiều khả năng đó là bài viết trên máy tính dạng câu hỏi (suy luận).</li>
<li>Nếu vòng 2 là viết + phỏng vấn, bài viết chiếm <b>70%</b>, phỏng vấn <b>30%</b>; phải đạt từ 50% ở cả hai bài.</li>
<li><b>Việc cần làm:</b> đọc kỹ Thông báo 2026 khi công bố (mục “nội dung, hình thức, thời gian thi”) và danh mục tài liệu ôn tập nếu có; hỏi Vụ Tổ chức – Cán bộ của Nhà xuất bản khi nộp phiếu.</li>
<li>Trong lúc chờ, ôn theo cả ba khả năng: (a) viết trên máy tính 60–120 câu, 90 phút trở lên; (b) viết trên giấy 180 phút (tự luận và sửa bản thảo); (c) thực hành biên tập; kèm phỏng vấn tối đa 30 phút.</li></ul>`},
{h:"Lời khuyên vòng 1: trắc nghiệm kiến thức chung",html:`<ul>
<li>60 câu trong 60 phút: khoảng <b>1 phút/câu</b>. Cần đúng tối thiểu <b>30 câu</b>. Không bỏ trống câu nào; đánh dấu câu khó để quay lại.</li>
<li>Ba mảng: <b>pháp luật viên chức</b> (Luật Viên chức 2025, NĐ 259/2026 và các nghị định 2026 trong sổ tay); <b>chủ trương, đường lối</b> (văn kiện Đại hội XIV, NQ 25-NQ/TW, Chỉ thị 04-CT/TW, Chỉ thị 05-CT/TW, các nghị quyết “trụ cột”); <b>pháp luật ngành</b>: Luật Xuất bản 2012 (Điều 10, 19, 20, 23…) và Luật sửa đổi 17/2026/QH16.</li>
<li>Câu hỏi trắc nghiệm hay hỏi: <b>cơ quan ban hành, ngày ban hành, con số, mốc năm, cụm từ nguyên văn</b>. Học bằng thẻ ghi nhớ và phần “Dễ nhầm” của sổ tay.</li>
<li>Luyện trên máy tính trong điều kiện bấm giờ ít nhất 3 lần trước ngày thi; kết quả có ngay sau khi làm bài.</li></ul>`},
{h:"Lời khuyên vòng 2: viết hoặc thực hành biên tập",html:`<ul>
<li><b>Kiến thức nền:</b> quy trình biên tập – xuất bản (nhận bản thảo, thẩm định sơ bộ, biên tập nội dung và hình thức, duyệt cấp ban, thư ký, Hội đồng Biên tập – Xuất bản, ký duyệt in, đọc bông, duyệt sách mẫu); nhiệm vụ, quyền hạn biên tập viên (Điều 19 Luật Xuất bản); nội dung bị cấm (Điều 10); liên kết xuất bản; điểm mới Luật 17/2026 (thẩm định bản thảo nhạy cảm, gắn nhãn nội dung AI).</li>
<li><b>Dạng bài nên luyện (suy luận):</b> trình bày quy trình; xử lý tình huống nghiệp vụ; sửa một đoạn bản thảo (chính tả, ngữ pháp, logic, số liệu, tên riêng, chức danh, ngày tháng, trích dẫn văn kiện); viết lời giới thiệu sách hoặc đề xuất đề tài sách.</li>
<li><b>Với bài viết 180 phút:</b> 10 phút lập dàn ý, chia thời gian theo thang điểm từng câu, chừa 10 phút soát lỗi. Mở bài nêu căn cứ (văn bản, ngày), thân bài theo ý đánh số, kết bài liên hệ vị trí biên tập viên.</li>
<li><b>Với bài viết trên máy tính 60–120 câu:</b> luyện tốc độ đọc đoạn văn và phát hiện lỗi; ôn chắc số hiệu, ngày ban hành văn bản.</li>
<li><b>Với thực hành biên tập:</b> dùng ký hiệu sửa bản thảo thống nhất, ghi chú lý do sửa ngắn gọn, đánh dấu chỗ cần hỏi tác giả thay vì tự ý viết lại.</li></ul>`},
{h:"Lời khuyên phỏng vấn / vấn đáp (tối đa 30 phút, chuẩn bị không quá 15 phút)",html:`<ul>
<li>Dùng thời gian chuẩn bị để ghi <b>dàn ý 3 ý chính</b> cho mỗi câu hỏi, kèm 1–2 số liệu hoặc văn bản để dẫn.</li>
<li>Trả lời theo cấu trúc: <b>nêu ý chính – dẫn căn cứ – liên hệ bản thân / vị trí biên tập</b>. Mỗi câu 2–3 phút, không đọc nguyên văn giấy nháp.</li>
<li>Thuộc “hồ sơ 60 giây” về Nhà xuất bản: 05/12/1945; QĐ 223-QĐ/TW; 3 nhiệm vụ; Vũ Trọng Lâm; 80 năm – Huân chương Lao động hạng Nhất; stbook.vn; Văn kiện Đại hội XIV 2 tập 823 trang.</li>
<li>Không biết thì nói thật và nêu cách sẽ tìm hiểu; không bịa số liệu, không phát biểu tùy tiện về nhân sự, chính trị.</li>
<li>Xem phần <b>Phỏng vấn</b> của sổ tay: 8 nhóm câu hỏi kèm gợi ý trả lời.</li></ul>`}
);

INTERVIEW.push(
{h:"1. Giới thiệu bản thân",intro:"Thường là câu mở đầu. Nói 90–120 giây, có số liệu, kết bằng lý do gắn với Nhà xuất bản.",items:[
{q:"Anh/chị hãy giới thiệu ngắn về bản thân.",a:`<p><b>Khung điền sẵn:</b></p><blockquote>Kính thưa Hội đồng, tôi là [Họ tên], sinh năm [ ], quê [ ]. Tôi tốt nghiệp [cử nhân/thạc sĩ] ngành [ ] tại [trường] năm [ ], loại [ ]. [Đảng viên từ năm … / Đoàn viên]. Trong [ ] năm qua tôi làm [công việc] tại [đơn vị], trực tiếp [biên tập / soạn thảo / hiệu đính / dịch / nghiên cứu] với kết quả [con số cụ thể: số bản thảo, bài báo, đề tài]. Tôi có [ngoại ngữ: chứng chỉ …], sử dụng thành thạo [công cụ: theo dõi sửa đổi, chú thích PDF, tra cứu văn bản]. Tôi dự tuyển vị trí biên tập viên tại Nhà xuất bản Chính trị quốc gia Sự thật vì [lý do gắn với chức năng xuất bản lý luận, chính trị]. Nếu trúng tuyển, tôi mong được làm việc ở [ban sách …] và cam kết [hoàn thành bồi dưỡng nghiệp vụ, tuân thủ quy trình, kỷ luật nội dung].</blockquote><ul><li><b>Nên:</b> chọn 1–2 thành tích đo được; nhắc chuyên ngành khớp với ban sách (lý luận, xây dựng Đảng, nhà nước – pháp luật, kinh tế, quốc tế).</li><li><b>Tránh:</b> kể lại toàn bộ lý lịch; nói chung chung “ham học hỏi, nhiệt tình”; nhắc chuyện riêng không liên quan.</li></ul>`},
{q:"Điểm mạnh và điểm yếu của anh/chị đối với công việc biên tập?",a:`<ul><li><b>Điểm mạnh nên chọn:</b> cẩn thận, kiên nhẫn với văn bản dài; nền tảng lý luận hoặc chuyên ngành; khả năng tra cứu, kiểm chứng nguồn; ngoại ngữ. Mỗi điểm kèm một ví dụ.</li><li><b>Điểm yếu nên chọn:</b> điểm có thật nhưng sửa được, ví dụ “chưa có kinh nghiệm làm việc với tác giả cấp cao”, “chưa có chứng chỉ hành nghề biên tập” – nói luôn kế hoạch khắc phục (học bồi dưỡng, học hỏi biên tập viên lâu năm).</li><li><b>Tránh:</b> điểm yếu nguy hiểm với nghề (cẩu thả, ngại đọc), hoặc “điểm yếu là quá cầu toàn”.</li></ul>`},
{q:"Chuyên ngành của anh/chị không phải xuất bản – biên tập, vì sao vẫn phù hợp?",a:`<ul><li>Nhà xuất bản từng tuyển biên tập viên theo nhóm <b>khoa học xã hội và nhân văn</b> (thông báo 2020), không giới hạn ngành xuất bản.</li><li>Biên tập sách lý luận, chính trị cần <b>kiến thức chuyên môn của lĩnh vực</b> để thẩm định nội dung; kỹ năng nghề được bồi dưỡng theo quy định (Điều 19 Luật Xuất bản: hoàn thành khóa bồi dưỡng, có chứng chỉ hành nghề biên tập).</li><li>Nêu kế hoạch cụ thể: khóa bồi dưỡng nghiệp vụ biên tập, đọc giáo trình biên tập, học từ người hướng dẫn.</li></ul>`},
{q:"Anh/chị đã có chứng chỉ hành nghề biên tập chưa?",a:`<ul><li><b>Căn cứ:</b> Điều 19 Luật Xuất bản 2012: biên tập viên phải là công dân Việt Nam, có phẩm chất chính trị, đạo đức tốt, trình độ đại học trở lên, hoàn thành khóa bồi dưỡng pháp luật xuất bản và nghiệp vụ biên tập, có chứng chỉ hành nghề biên tập.</li><li>Theo Luật 17/2026/QH16 (hiệu lực 01/3/2027), <b>Bộ Văn hóa, Thể thao và Du lịch</b> cấp chứng chỉ; Tổng biên tập, phó tổng biên tập cũng phải có chứng chỉ.</li><li><b>Trả lời:</b> nếu chưa có, nói rõ sẽ đăng ký khóa bồi dưỡng ngay khi được tuyển và trong thời gian chờ sẽ làm việc dưới sự hướng dẫn của biên tập viên có chứng chỉ.</li></ul>`},
{q:"Anh/chị đã có kinh nghiệm nào liên quan đến xử lý bản thảo, văn bản?",a:`<ul><li>Kể theo mô hình <b>tình huống – việc làm – kết quả</b>: ví dụ biên tập kỷ yếu hội thảo, hiệu đính bản dịch, soạn văn bản hành chính, phản biện bài báo.</li><li>Nêu con số: số trang, số bài, thời hạn đã đáp ứng, lỗi đã phát hiện.</li><li><b>Tránh:</b> phóng đại; Hội đồng có thể hỏi sâu chi tiết.</li></ul>`}
]},
{h:"2. Hiểu biết về Nhà xuất bản Chính trị quốc gia Sự thật",intro:"Câu hỏi gần như chắc chắn có. Thuộc các mốc, văn bản và con số trong mục hồ sơ cơ quan.",items:[
{q:"Anh/chị biết gì về Nhà xuất bản Chính trị quốc gia Sự thật?",a:`<ul><li><b>Câu trả lời 60 giây:</b> cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước; ngày truyền thống <b>05/12/1945</b> (Nhà xuất bản Sự thật, Tổng Bí thư Trường Chinh chỉ đạo); năm <b>1992</b> hợp nhất 4 nhà xuất bản; hiện là <b>đơn vị sự nghiệp của Trung ương Đảng</b>, đặt dưới sự lãnh đạo trực tiếp và thường xuyên của <b>Ban Bí thư</b>; chức năng theo <b>QĐ 223-QĐ/TW ngày 28/12/2024</b>.</li><li><b>Dẫn chứng:</b> Hồ Chí Minh Toàn tập 15 tập; Văn kiện Đảng Toàn tập; Văn kiện Đại hội XIV (2 tập, 823 trang); Đề án sách cơ sở (593 đầu, 14,4 triệu bản); stbook.vn.</li><li><b>Kết:</b> năm 2025 kỷ niệm 80 năm, đón nhận Huân chương Lao động hạng Nhất; Giám đốc – Tổng Biên tập là PGS.TS Vũ Trọng Lâm.</li></ul>`},
{q:"Vị trí, chức năng, nhiệm vụ của Nhà xuất bản theo quy định hiện hành?",a:`<ul><li><b>Văn bản:</b> Quyết định 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị (thay QĐ 68-QĐ/TW ngày 03/4/2003).</li><li><b>Vị trí:</b> đơn vị sự nghiệp của Trung ương Đảng; Ban Bí thư lãnh đạo trực tiếp và thường xuyên; cơ quan xuất bản sách chính trị, lý luận của Đảng và Nhà nước.</li><li><b>3 nhóm nhiệm vụ:</b> biên tập, <b>biên dịch</b>, xuất bản; nghiên cứu khoa học và tham mưu Bộ Chính trị, Ban Bí thư; tuyên truyền, giới thiệu xuất bản phẩm.</li><li><b>Điểm mới:</b> thêm “biên dịch” và nhiệm vụ tuyên truyền; cấp vụ giảm 17 → 14.</li><li><b>Tránh:</b> nói Nhà xuất bản “trực thuộc Bộ Văn hóa” hay “trực thuộc Ban Tuyên giáo”.</li></ul>`},
{q:"Kể tên một số bộ sách, ấn phẩm tiêu biểu của Nhà xuất bản.",a:`<ul><li><b>Kinh điển, lãnh tụ:</b> V.I. Lênin Toàn tập (55 tập); Hồ Chí Minh Toàn tập (15 tập, khoảng 3.300 tác phẩm); Hồ Chí Minh – Biên niên tiểu sử (10 tập).</li><li><b>Văn kiện:</b> Văn kiện Đảng Toàn tập (54 tập, 2007; bộ 80 tập triển khai từ 2025); Văn kiện Đại hội XIV (3/2026).</li><li><b>Sách 2026:</b> “80 năm Quốc hội Việt Nam – Những dấu ấn lịch sử” (05/01/2026); sách của Đại tướng Nguyễn Trọng Nghĩa về công tác tư tưởng (08/6/2026).</li><li><b>Sách cơ sở, số:</b> Đề án trang bị sách cho xã, phường, thị trấn; tủ sách bảo vệ nền tảng tư tưởng của Đảng trên stbook.vn.</li><li><b>Mẹo:</b> nói tên 1 cuốn mình đã thực sự đọc và nhận xét ngắn về cách trình bày.</li></ul>`},
{q:"Nhà xuất bản vừa kỷ niệm 80 năm. Anh/chị biết gì về sự kiện này?",a:`<ul><li>Lễ kỷ niệm sáng <b>01/12/2025</b> tại Hà Nội (ngày truyền thống 05/12); Chủ tịch Quốc hội <b>Trần Thanh Mẫn</b> dự, trao <b>Huân chương Lao động hạng Nhất</b>.</li><li>Tổng Bí thư Tô Lâm gửi Thư chúc mừng: Nhà xuất bản “khẳng định và phát huy xứng đáng vai trò là cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước”; yêu cầu đổi mới theo hướng <b>“chuyên nghiệp, nhân văn, hiện đại”</b>, phát triển xuất bản trên nền tảng số, xây dựng đội ngũ biên tập viên giỏi.</li><li>Chủ tịch Quốc hội: <b>“mỗi trang sách là một hàng rào tư tưởng, mỗi công trình là một pháo đài lý luận”</b>.</li><li><b>Liên hệ:</b> biên tập viên mới phải hiểu mình nối tiếp truyền thống đó bằng sự chính xác trong từng trang sách.</li></ul>`},
{q:"Nhà xuất bản đang chuyển đổi số thế nào? Anh/chị đã dùng nền tảng nào chưa?",a:`<ul><li><b>Nền tảng:</b> stbook.vn (xuất bản, phát hành sách điện tử, sách nói, đa phương tiện; ứng dụng iOS, Android); thuviencoso.vn (thư viện sách cơ sở); STstore.vn (ra mắt 2025); sachquocgia.vn; livestream, Facebook, TikTok, Zalo, Shopee, Tiki.</li><li><b>Số liệu:</b> sách điện tử từ 10/2019; năm 2025 hơn 700 sách điện tử, hơn 210 mã QR sách nói; 6 tháng đầu 2026: 109 sách điện tử, sách nói.</li><li><b>Định hướng 2026:</b> số hóa toàn diện quy trình biên tập, xuất bản; AI trong quản trị.</li><li><b>Nên:</b> trước ngày thi hãy cài ứng dụng, đọc thử một cuốn và nêu một nhận xét cụ thể (giao diện, tìm kiếm, tủ sách).</li></ul>`},
{q:"Đề án trang bị sách cho cơ sở xã, phường, thị trấn là gì?",a:`<ul><li>Đề án triển khai theo chỉ đạo của Ban Bí thư từ <b>2009</b>: thí điểm 2009–2011 ở 16 tỉnh, thành; từ 2012 mở rộng 63 tỉnh, thành.</li><li>Tổng kết 15 năm (28/12/2023): <b>593 đầu</b> (gồm CD-ROM, CD audio), <b>hơn 14,4 triệu bản</b>, 8 nhóm chủ đề; thư viện điện tử <b>thuviencoso.vn</b> từ 2020.</li><li><b>Liên hệ:</b> sách cho cơ sở đòi hỏi biên tập ngắn gọn, dễ hiểu, sát nhu cầu người dân; sau sắp xếp chính quyền hai cấp, nhu cầu sách cho cấp xã càng lớn (nêu như nhận định cá nhân).</li></ul>`},
{q:"Anh/chị biết gì về cơ cấu tổ chức và lãnh đạo của Nhà xuất bản? Muốn làm ở ban nào?",a:`<ul><li><b>Lãnh đạo:</b> GĐ – TBT PGS.TS Vũ Trọng Lâm; các Phó GĐ – Phó TBT: Phạm Thị Thinh, Nguyễn Hoài Anh, Võ Văn Bé, Nguyễn Thái Bình. Hội đồng Biên tập – Xuất bản 8 người, có 3 ủy viên chuyên trách.</li><li><b>Khối biên tập</b> (theo danh mục trên website): các ban sách Xây dựng Đảng; Nhà nước và Pháp luật; Lý luận, Kinh điển; Quốc tế; Kinh tế; Giáo khoa và Tham khảo; Trung tâm Xuất bản điện tử; Trung tâm Thông tin và Nghiên cứu khoa học. Sau QĐ 223 có 14 đơn vị cấp vụ.</li><li><b>Trả lời nguyện vọng:</b> nêu ban phù hợp chuyên ngành, đồng thời khẳng định sẵn sàng nhận phân công.</li></ul>`},
{q:"Theo anh/chị, Nhà xuất bản Chính trị quốc gia Sự thật khác gì một nhà xuất bản thương mại?",a:`<ul><li><b>Nhiệm vụ chính trị là hàng đầu:</b> xuất bản sách chính trị, lý luận, văn kiện, sách phục vụ học tập nghị quyết; tham mưu Bộ Chính trị, Ban Bí thư về xuất bản sách lý luận.</li><li><b>Yêu cầu chính xác cao nhất:</b> văn kiện, tác phẩm lãnh tụ, số liệu, chức danh; quy trình duyệt nhiều cấp, có Hội đồng Biên tập – Xuất bản.</li><li><b>Vẫn phải gắn bạn đọc và thị trường:</b> Thư Tổng Bí thư yêu cầu thích ứng cơ chế thị trường và thị hiếu bạn đọc; doanh thu phát hành 2025 tăng 167,9%.</li><li><b>Tránh:</b> chê bai nhà xuất bản khác.</li></ul>`}
]},
{h:"3. Động cơ, định hướng nghề nghiệp",intro:"Hội đồng muốn biết anh/chị có gắn bó lâu dài và hiểu đúng tính chất công việc không.",items:[
{q:"Vì sao anh/chị muốn làm biên tập viên tại Nhà xuất bản này?",a:`<ul><li><b>Ba lý do nên nói:</b> (1) vai trò của Nhà xuất bản – cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước; (2) phù hợp năng lực chuyên môn của bản thân; (3) môi trường có truyền thống 80 năm, đội ngũ biên tập viên lâu năm để học hỏi.</li><li>Nêu một kỷ niệm cụ thể với sách của Nhà xuất bản (cuốn sách đã dùng khi học, ôn thi, nghiên cứu).</li><li><b>Tránh:</b> lý do “ổn định, gần nhà, biên chế”.</li></ul>`},
{q:"Anh/chị hình dung một ngày làm việc của biên tập viên như thế nào?",a:`<ul><li>Đọc, biên tập bản thảo theo kế hoạch; ghi nhận xét, đề xuất sửa; trao đổi với tác giả hoặc dịch giả; kiểm tra trích dẫn, số liệu; đọc bông; phối hợp thiết kế, chế bản, phát hành, truyền thông.</li><li>Tham gia nghiên cứu, hội thảo (Nhà xuất bản coi nghiên cứu khoa học là trụ cột song hành).</li><li>Làm việc trên nền tảng số: quản lý tệp, sửa trên bản điện tử, nội dung cho sách điện tử, sách nói.</li></ul>`},
{q:"Định hướng phát triển của anh/chị trong 3–5 năm tới?",a:`<ul><li>Năm đầu: hoàn thành bồi dưỡng, có chứng chỉ hành nghề biên tập, nắm quy trình, biên tập độc lập sách tham khảo.</li><li>2–3 năm: phụ trách mảng sách theo chuyên ngành; tham gia bộ sách lớn, sách điện tử.</li><li>3–5 năm: nâng trình độ (học cao học hoặc bồi dưỡng lý luận chính trị), viết bài cho Tạp chí Chính trị và Phát triển, tham gia đề tài.</li><li><b>Tránh:</b> nói muốn làm lãnh đạo ngay hoặc coi đây là bước đệm sang nơi khác.</li></ul>`},
{q:"Nếu thu nhập không bằng khu vực tư nhân, anh/chị nghĩ sao?",a:`<ul><li>Thừa nhận thẳng thắn đã tìm hiểu chế độ tiền lương viên chức; động lực chính là ý nghĩa công việc và môi trường chuyên môn.</li><li>Nói về hướng tăng thu nhập chính đáng: nâng năng lực để đảm nhận việc khó, tham gia dự án, đề tài theo quy định.</li><li><b>Tránh:</b> nói sẽ nhận việc ngoài cho nhà xuất bản khác hoặc đối tác liên kết – dễ gây nghi ngờ xung đột lợi ích.</li></ul>`},
{q:"Nếu được phân công vào ban sách không đúng chuyên ngành, anh/chị xử lý thế nào?",a:`<ul><li>Chấp hành phân công; chủ động học kiến thức lĩnh vực mới; nhờ biên tập viên lâu năm hướng dẫn; dựa vào chuyên gia, tác giả và Hội đồng Biên tập – Xuất bản khi gặp nội dung chuyên sâu.</li><li>Đề xuất sau một thời gian làm việc nếu thấy mình phát huy tốt hơn ở mảng khác, theo đúng kênh tổ chức.</li></ul>`},
{q:"Có những đợt phải làm gấp sách phục vụ nhiệm vụ chính trị (ví dụ văn kiện Đại hội). Anh/chị có sẵn sàng không?",a:`<ul><li>Sẵn sàng; nêu ví dụ: bộ Văn kiện Đại hội XIV (2 tập, 823 trang) được phát hành để kịp phục vụ học tập, quán triệt Nghị quyết.</li><li>Nhấn mạnh: <b>gấp nhưng không bỏ bước</b> – làm việc theo ca, chia việc kiểm tra chéo, ưu tiên khâu đối chiếu với bản gốc.</li></ul>`}
]},
{h:"4. Nghiệp vụ biên tập",intro:"Phần dễ ghi điểm nhất nếu trả lời có quy trình và căn cứ pháp lý. Dẫn số điều luật ngắn gọn.",items:[
{q:"Trình bày quy trình biên tập – xuất bản một cuốn sách.",a:`<ul><li><b>Các khâu</b> (theo mô tả quy trình tại một nhà xuất bản chính trị trên báo An ninh Thủ đô): nhận bản thảo → <b>thẩm định sơ bộ</b> (nội dung, bố cục, đề nghị sửa) → <b>biên tập nội dung và hình thức</b> → lãnh đạo ban duyệt → thư ký đọc → phó tổng biên tập, Hội đồng Biên tập – Xuất bản duyệt → Giám đốc – Tổng Biên tập ký duyệt, cho in → <b>biên tập kỹ thuật, đọc bông</b> → duyệt sách mẫu sau in → nộp lưu chiểu → phát hành. Mỗi khâu ghi nhận trên phiếu bản thảo.</li><li><b>Căn cứ pháp lý:</b> đăng ký xuất bản và xác nhận đăng ký (Điều 22 Luật Xuất bản); quyết định xuất bản; nộp lưu chiểu.</li><li><b>Điểm mới 2026:</b> Luật 17/2026/QH16 yêu cầu <b>thẩm định bản thảo có nội dung nhạy cảm</b> (lịch sử cách mạng, chủ quyền, an ninh quốc gia, lãnh tụ…) trước khi đăng ký kế hoạch xuất bản (hiệu lực 01/3/2027).</li></ul>`},
{q:"Biên tập viên có nhiệm vụ, quyền hạn gì theo Luật Xuất bản?",a:`<ul><li><b>Điều 19 Luật Xuất bản 2012:</b> biên tập bản thảo; <b>từ chối biên tập</b> bản thảo có dấu hiệu vi phạm khoản 1 Điều 10 và <b>báo cáo bằng văn bản</b> với tổng giám đốc (giám đốc) hoặc tổng biên tập; được đứng tên trên xuất bản phẩm mình biên tập; tham gia tập huấn định kỳ; không để lộ nội dung tác phẩm trước khi phát hành nếu ảnh hưởng quyền lợi tác giả; <b>chịu trách nhiệm trước tổng biên tập và trước pháp luật</b> về phần nội dung mình biên tập.</li><li><b>Điều 20 (thu hồi chứng chỉ):</b> xuất bản phẩm bị cấm lưu hành, thu hồi, tịch thu, tiêu hủy; trong 1 năm có 2 xuất bản phẩm, hoặc 2 năm liên tiếp có xuất bản phẩm sai phạm phải sửa; bị kết án. Luật sửa đổi 2026 thêm trường hợp <b>không trực tiếp biên tập 36 tháng liên tục</b>; xét cấp lại sau 2 năm.</li></ul>`},
{q:"Những nội dung nào bị cấm trong xuất bản phẩm?",a:`<ul><li><b>Khoản 1 Điều 10 Luật Xuất bản 2012:</b> tuyên truyền chống Nhà nước, phá hoại khối đại đoàn kết; kích động chiến tranh, bạo lực, hận thù dân tộc, truyền bá tư tưởng phản động, lối sống đồi trụy, mê tín dị đoan; tiết lộ bí mật nhà nước, bí mật đời tư; xuyên tạc lịch sử, phủ nhận thành tựu cách mạng, xúc phạm dân tộc, anh hùng, <b>thể hiện sai chủ quyền quốc gia</b>, vu khống, xúc phạm uy tín cơ quan, danh dự cá nhân.</li><li><b>Khoản 2:</b> các hành vi bị cấm như xuất bản khi chưa đăng ký, <b>sửa nội dung bản thảo đã được duyệt</b>, in lậu, phát hành xuất bản phẩm chưa nộp lưu chiểu.</li><li><b>Luật 17/2026:</b> cấm dùng AI để thực hiện hành vi vi phạm trong hoạt động xuất bản.</li><li><b>Mẹo:</b> chú ý bản đồ, tên gọi biển đảo, chú thích ảnh – lỗi chủ quyền thường nằm ở đây.</li></ul>`},
{q:"Khi biên tập sách lý luận, chính trị cần đặc biệt chú ý gì?",a:`<ul><li><b>Quan điểm:</b> đúng đường lối, không trái nghị quyết hiện hành; phát hiện quan điểm mơ hồ, dễ bị xuyên tạc.</li><li><b>Chính xác:</b> tên văn kiện, số hiệu, ngày ban hành, cơ quan ban hành, chức danh lãnh đạo tại thời điểm nói; số liệu có nguồn; trích dẫn nguyên văn.</li><li><b>Cập nhật:</b> văn bản đã bị thay thế (ví dụ QĐ 68 → QĐ 223), tên cơ quan sau sắp xếp (ví dụ Ban Tuyên giáo và Dân vận Trung ương, từ 8/2026 là Ban Tuyên giáo Trung ương).</li><li><b>Dễ đọc:</b> câu ngắn, rõ, có tóm tắt, chỉ mục, phù hợp đối tượng (cán bộ cơ sở khác giới nghiên cứu).</li><li><b>Câu nên trích:</b> “Sách là văn bia để đời nên phải cẩn trọng, tỉ mỉ trong từng câu, từng chữ” (lời cố Tổng Bí thư Nguyễn Phú Trọng được dẫn trên báo).</li></ul>`},
{q:"Anh/chị kiểm tra trích dẫn văn kiện Đảng, tác phẩm Hồ Chí Minh như thế nào?",a:`<ul><li>Đối chiếu với <b>bản gốc chính thức</b>: Văn kiện Đảng Toàn tập, Hồ Chí Minh Toàn tập (ghi rõ tập, trang, lần xuất bản), sách văn kiện Đại hội do Nhà xuất bản phát hành, văn bản đăng trên cổng thông tin chính thống.</li><li>Kiểm tra từng yếu tố: nguyên văn, dấu câu, chữ in nghiêng, tên văn bản, ngày, cơ quan; trích đúng ngữ cảnh, không cắt câu làm sai nghĩa.</li><li>Thống nhất quy cách chú thích nguồn trong toàn cuốn; lập bảng theo dõi trích dẫn cho sách dài.</li><li>Không dùng nguồn trung gian (mạng xã hội, trang tổng hợp) làm căn cứ cuối cùng.</li></ul>`},
{q:"Phân biệt biên tập nội dung và biên tập kỹ thuật?",a:`<ul><li><b>Biên tập nội dung:</b> quan điểm, cấu trúc, lập luận, tính chính xác, bản quyền, đề xuất tác giả sửa.</li><li><b>Biên tập kỹ thuật:</b> chính tả, thống nhất cách viết, trình bày, đọc bông (bản in thử), kiểm tra mục lục, chú thích, hình ảnh trước khi in; duyệt sách mẫu sau in.</li><li>Hai khâu bổ sung cho nhau; lỗi lọt ở khâu nào thì cả người biên tập nội dung vẫn chịu trách nhiệm về phần mình biên tập (Điều 19).</li></ul>`},
{q:"Khi biên tập sách dịch (biên dịch), cần chú ý gì?",a:`<ul><li>QĐ 223-QĐ/TW bổ sung nhiệm vụ <b>biên dịch</b>; Nhà xuất bản có tủ sách tiếng Lào, tiếng Tây Ban Nha, sách thông tin đối ngoại.</li><li>Kiểm tra bản quyền dịch; đối chiếu bản gốc ở các đoạn khó; thống nhất thuật ngữ chính trị (lập bảng thuật ngữ); giữ đúng cách gọi tên văn kiện, chức danh Việt Nam khi dịch ra nước ngoài.</li><li>Với sách nước ngoài viết về Việt Nam: rà quan điểm, chủ quyền, số liệu; có chú thích của Nhà xuất bản khi cần.</li></ul>`},
{q:"Những điểm mới của Luật Xuất bản sửa đổi năm 2026 mà biên tập viên cần biết?",a:`<ul><li><b>Luật 17/2026/QH16</b>, thông qua <b>24/8/2026</b> (472/475 đại biểu tán thành), hiệu lực <b>01/3/2027</b>.</li><li><b>AI:</b> xuất bản phẩm có nội dung do AI tạo toàn bộ hoặc một phần phải công bố, <b>gắn nhãn</b>; việc dùng AI <b>không giảm trách nhiệm</b> của nhà xuất bản, tổng biên tập, biên tập viên; cấm dùng AI để vi phạm.</li><li><b>Thẩm định:</b> bản thảo nhạy cảm phải thẩm định trước khi đăng ký kế hoạch xuất bản.</li><li><b>Liên kết:</b> doanh nghiệp công nghệ được tham gia liên kết; nhà xuất bản giữ vai trò chủ trì, <b>không chuyển giao quyền quyết định nội dung</b>.</li><li><b>Chứng chỉ:</b> Bộ Văn hóa, Thể thao và Du lịch cấp; thu hồi khi không trực tiếp biên tập 36 tháng liên tục.</li><li><b>Lưu ý:</b> đến 28/02/2027 vẫn áp dụng Luật Xuất bản 2012.</li></ul>`},
{q:"Anh/chị xử lý một bản thảo liên kết xuất bản thế nào?",a:`<ul><li>Nhà xuất bản <b>chịu trách nhiệm cuối cùng về nội dung</b>; biên tập viên biên tập như bản thảo do Nhà xuất bản tự tổ chức.</li><li>Kiểm tra hồ sơ đối tác, hợp đồng, bản quyền; theo Luật 17/2026 đối tác liên kết chịu trách nhiệm về việc dùng AI khi tạo lập tác phẩm.</li><li>Không chấp nhận sửa nội dung sau khi đã duyệt (Điều 10 khoản 2); kiểm tra sách mẫu trước khi phát hành.</li></ul>`},
{q:"Theo anh/chị, khâu yếu nhất trong hoạt động xuất bản hiện nay là gì?",a:`<ul><li><b>Dẫn chứng:</b> Hội nghị giao ban xuất bản 07/8/2026 đánh giá khâu yếu nhất là <b>biên tập, thẩm định nội dung</b>; 6 tháng đầu 2026 có <b>25 xuất bản phẩm</b> vi phạm nội dung bị xử lý.</li><li>Yêu cầu nêu tại hội nghị: “<b>Không để công nghệ đi trước kỷ luật nội dung</b>”; không để áp lực thị trường làm suy giảm trách nhiệm chính trị; phòng ngừa từ đầu.</li><li><b>Liên hệ:</b> biên tập viên là “người gác cổng” đầu tiên; cam kết tuân thủ quy trình và tự học nghiệp vụ.</li></ul>`}
]},
{h:"5. Tình huống nghiệp vụ và đạo đức nghề nghiệp",intro:"Khung trả lời chung: (1) xác định vấn đề và căn cứ; (2) việc làm ngay; (3) báo cáo ai; (4) phối hợp; (5) rút kinh nghiệm. Luôn đặt nguyên tắc trước, giải pháp sau.",items:[
{q:"Bản thảo có đoạn đề cập vấn đề nhạy cảm (lịch sử, chủ quyền, lãnh tụ). Anh/chị làm gì?",a:`<ul><li>Đánh dấu, đối chiếu nguồn chính thống; ghi nhận xét cụ thể vì sao nhạy cảm.</li><li>Báo cáo lãnh đạo ban; đề nghị lấy ý kiến chuyên gia hoặc Hội đồng Biên tập – Xuất bản. Theo Luật 17/2026 loại bản thảo này phải được thẩm định trước khi đăng ký xuất bản.</li><li>Nếu có dấu hiệu vi phạm khoản 1 Điều 10: <b>từ chối biên tập và báo cáo bằng văn bản</b> (Điều 19).</li><li><b>Tránh:</b> tự ý cắt bỏ mà không trao đổi, hoặc “cho qua” vì tác giả có uy tín.</li></ul>`},
{q:"Tác giả (có uy tín, chức vụ cao) không đồng ý sửa theo ý kiến biên tập. Anh/chị xử lý ra sao?",a:`<ul><li>Tôn trọng tác giả, trao đổi bằng <b>căn cứ cụ thể</b> (văn kiện, số liệu, quy định), đưa phương án sửa thay thế để tác giả chọn.</li><li>Phân biệt: vấn đề văn phong có thể nhường tác giả; vấn đề <b>quan điểm, sai sự thật, pháp luật</b> thì không nhượng bộ.</li><li>Không thống nhất được: báo cáo lãnh đạo ban, Tổng Biên tập quyết định; lưu ý kiến bằng văn bản trên phiếu bản thảo.</li><li><b>Tránh:</b> tranh luận gay gắt, hoặc tự sửa mà tác giả không biết.</li></ul>`},
{q:"Sách đã in, đang phát hành thì anh/chị phát hiện một sai sót. Làm gì?",a:`<ul><li><b>Báo cáo ngay</b> lãnh đạo ban và Tổng Biên tập, nêu rõ vị trí, mức độ sai sót, số bản đã in, đã phát hành.</li><li>Đề xuất phương án theo mức độ: tạm dừng phát hành; đính chính (tờ đính chính, cập nhật bản điện tử); thu hồi, sửa nếu sai sót nghiêm trọng – theo chỉ đạo của lãnh đạo và cơ quan quản lý.</li><li>Rà soát nguyên nhân, nhận trách nhiệm phần mình; đề xuất bổ sung bước kiểm tra để không lặp lại.</li><li>Biết hậu quả: Điều 20 – chứng chỉ có thể bị thu hồi nếu trong 1 năm có 2 xuất bản phẩm sai phạm phải sửa.</li><li><b>Tránh:</b> giấu lỗi, tự sửa bản điện tử mà không báo cáo.</li></ul>`},
{q:"Sách phục vụ sự kiện chính trị cần phát hành gấp, anh/chị không đủ thời gian đọc kỹ. Xử lý thế nào?",a:`<ul><li>Báo cáo sớm khối lượng và rủi ro, đề nghị bổ sung người đọc chéo, chia bản thảo theo phần.</li><li>Ưu tiên khâu quan trọng nhất: đối chiếu với văn bản gốc, tên, số, ngày, chức danh.</li><li>Làm thêm giờ khi cần; không bỏ bước ký duyệt, đọc bông.</li><li>Câu chốt: “Tiến độ quan trọng, nhưng sai sót trong sách chính trị không thể sửa bằng tốc độ.”</li></ul>`},
{q:"Anh/chị nghi ngờ bản thảo được viết bằng AI tạo sinh hoặc có đoạn sao chép. Làm gì?",a:`<ul><li>Kiểm tra: đối chiếu trích dẫn (AI hay tạo nguồn không có thật), dùng công cụ kiểm tra trùng lặp, so sánh văn phong.</li><li>Trao đổi với tác giả, yêu cầu cung cấp nguồn, bản nháp; đề nghị cam kết về quyền tác giả.</li><li>Theo Luật 17/2026: nội dung do AI tạo phải <b>công bố, gắn nhãn</b>; trách nhiệm của nhà xuất bản và biên tập viên <b>không giảm</b>.</li><li>Báo cáo lãnh đạo nếu có dấu hiệu vi phạm quyền tác giả; không đưa vào xuất bản khi chưa làm rõ.</li></ul>`},
{q:"Đối tác liên kết đề nghị bổ sung vài trang sau khi bản thảo đã được duyệt để kịp in. Anh/chị trả lời thế nào?",a:`<ul><li>Từ chối: sửa nội dung bản thảo đã được duyệt là hành vi bị cấm (khoản 2 Điều 10 Luật Xuất bản 2012).</li><li>Hướng dẫn đối tác: nội dung bổ sung phải đi lại quy trình biên tập, duyệt.</li><li>Báo cáo lãnh đạo ban; ghi nhận bằng văn bản.</li></ul>`},
{q:"Anh/chị phát hiện trích dẫn văn kiện sai trong bản thảo của một cán bộ lãnh đạo. Xử lý thế nào?",a:`<ul><li>Đối chiếu bản gốc, chuẩn bị bằng chứng (tập, trang, ngày văn bản).</li><li>Trao đổi lịch sự qua thư ký hoặc đầu mối của tác giả; đề xuất câu trích đúng.</li><li>Báo cáo lãnh đạo ban để thống nhất cách làm việc; ghi lại trên phiếu biên tập.</li><li>Thể hiện thái độ: tôn trọng tác giả nhưng trung thành với văn bản gốc.</li></ul>`},
{q:"Tác giả gửi quà hoặc đề nghị “hỗ trợ” để bản thảo được ưu tiên. Anh/chị xử lý ra sao?",a:`<ul><li>Từ chối dứt khoát, lịch sự; giải thích quy trình duyệt công khai theo kế hoạch.</li><li>Báo cáo lãnh đạo nếu đối phương tiếp tục.</li><li>Liên hệ: đạo đức nghề nghiệp, nghĩa vụ của viên chức về những việc không được làm, phòng chống tham nhũng, tiêu cực.</li></ul>`},
{q:"Anh/chị không đồng ý với ý kiến biên tập của trưởng ban. Làm thế nào?",a:`<ul><li>Trình bày ý kiến bằng căn cứ, trực tiếp với trưởng ban, đúng nơi, đúng lúc.</li><li>Nếu trưởng ban vẫn giữ ý kiến: chấp hành (nguyên tắc tập trung dân chủ), đồng thời được bảo lưu ý kiến bằng văn bản nếu vấn đề liên quan nội dung quan trọng.</li><li><b>Tránh:</b> bàn tán sau lưng, vượt cấp khi chưa trao đổi.</li></ul>`},
{q:"Nội dung bản thảo bị lộ lên mạng xã hội trước khi phát hành. Anh/chị làm gì?",a:`<ul><li>Điều 19: biên tập viên không để lộ nội dung tác phẩm trước khi phát hành nếu ảnh hưởng quyền lợi tác giả.</li><li>Báo cáo ngay lãnh đạo; rà soát ai đã tiếp cận bản thảo; phối hợp bộ phận truyền thông để xử lý.</li><li>Phòng ngừa: phân quyền truy cập tệp, không gửi bản thảo qua kênh cá nhân, đánh dấu bản lưu hành nội bộ.</li></ul>`}
]},
{h:"6. Chính trị – tư tưởng – thời sự",intro:"Trả lời ngắn, đúng tên văn bản, ngày, cơ quan ban hành, rồi liên hệ với công việc xuất bản.",items:[
{q:"Anh/chị nêu những nét chính của Đại hội XIV và ý nghĩa với Nhà xuất bản.",a:`<ul><li><b>Thông tin:</b> Đại hội đại biểu toàn quốc lần thứ XIV của Đảng họp tại Hà Nội, dự kiến 19–25/01/2026, sau đó rút ngắn và bế mạc chiều <b>23/01/2026</b>; <b>1.586 đại biểu</b> đại diện hơn 5,6 triệu đảng viên; Nghị quyết Đại hội được thông qua với 100% đại biểu tán thành; đồng chí <b>Tô Lâm</b> được bầu lại làm Tổng Bí thư.</li><li><b>Với Nhà xuất bản:</b> bộ Văn kiện Đại hội XIV (2 tập, 823 trang, 10 văn kiện) phối hợp Văn phòng Trung ương Đảng; sách hỏi – đáp, giải thích thuật ngữ; nhiệm vụ 6 tháng cuối 2026 là xuất bản tài liệu phục vụ triển khai Nghị quyết.</li><li>Nêu 1–2 điểm của văn kiện mà anh/chị nhớ chắc (tham khảo mục Đại hội XIV của sổ tay); không nói khi không chắc.</li></ul>`},
{q:"Nghị quyết 25-NQ/TW năm 2026 có nội dung gì? Liên hệ với xuất bản.",a:`<ul><li><b>NQ 25-NQ/TW ngày 22/8/2026</b> của Bộ Chính trị về <b>Chiến lược công tác tư tưởng trong bối cảnh mới</b>; Tổng Bí thư, Chủ tịch nước Tô Lâm ký. Phương châm <b>“Chủ động – Sắc bén – Thuyết phục – Hiệu quả”</b>; chuyển từ <b>“quản lý thông tin” sang “dẫn dắt nhận thức xã hội”</b>; kết hợp “xây” và “chống”, lấy thuyết phục làm phương thức chủ đạo.</li><li><b>Mục tiêu 2030:</b> giảm tối thiểu 70% mức lan tỏa nội dung xấu độc so với năm 2026.</li><li><b>Liên hệ xuất bản:</b> nghị quyết yêu cầu hỗ trợ sáng tác, quảng bá <b>xuất bản phẩm có giá trị cao</b>; cấp ủy trong cơ quan báo chí, xuất bản triển khai; xây dựng cơ sở dữ liệu lập luận khoa học, tài liệu lý luận số; mỗi nghị quyết có tài liệu học tập ngắn gọn, dễ hiểu – đúng thế mạnh của Nhà xuất bản.</li></ul>`},
{q:"Chỉ thị 04-CT/TW năm 2026 về xuất bản có những điểm chính nào?",a:`<ul><li><b>Chỉ thị 04-CT/TW ngày 17/3/2026 của Ban Bí thư</b> “về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới”; Thường trực Ban Bí thư Trần Cẩm Tú ký. Hướng dẫn triển khai: <b>HD 22-HD/BTGDVTW ngày 28/5/2026</b>.</li><li><b>Quan điểm:</b> xuất bản là “vũ khí tư tưởng sắc bén của Đảng, Nhà nước và nhân dân”; “lấy người đọc là trung tâm”; xuất bản là công cụ chủ đạo trong giáo dục, đào tạo; nhân lực là ưu tiên.</li><li><b>Mục tiêu 2030:</b> hệ thống xuất bản tinh gọn, hiện đại, có tập đoàn đa nền tảng; <b>100% nhà xuất bản tham gia xuất bản điện tử</b>; 80% cơ sở in dùng công nghệ hiện đại; ứng dụng AI, dữ liệu lớn. Đến 2045: công nghiệp xuất bản số mạnh.</li><li><b>Khác:</b> đưa đọc sách thành môn tự chọn từ tiểu học đến THCS; tổ chức hội chợ sách quốc tế tại Việt Nam; xử lý in lậu, xâm phạm bản quyền; bảo vệ biên tập viên trước vu khống, tấn công mạng.</li><li><b>Liên hệ:</b> Nhà xuất bản đưa triển khai Chỉ thị 04 vào nhiệm vụ 6 tháng cuối 2026.</li></ul>`},
{q:"Chỉ thị 05-CT/TW năm 2026 liên quan gì đến công việc của nhà xuất bản?",a:`<ul><li><b>Chỉ thị 05-CT/TW ngày 30/3/2026 của Bộ Chính trị</b> về tăng cường lãnh đạo của Đảng đối với <b>báo chí, truyền thông trên không gian mạng</b>; hướng dẫn: HD 21-HD/BTGDVTW (28/5/2026). Báo chí là lực lượng “tiên phong, xung kích, trụ cột” trên mặt trận tư tưởng; chuyển đổi số là “giải pháp chiến lược”; 10 nhóm nhiệm vụ.</li><li><b>Phân biệt:</b> Chỉ thị 05 (Bộ Chính trị, báo chí) và Chỉ thị 04 (Ban Bí thư, xuất bản) ban hành cách nhau 13 ngày, được tuyên truyền đi cặp.</li><li><b>Liên hệ:</b> sách điện tử, sách nói, livestream của Nhà xuất bản cũng hoạt động trên không gian mạng – cần cùng kỷ luật nội dung và chủ quyền số.</li></ul>`},
{q:"Quan điểm của anh/chị về chuyển đổi số trong xuất bản?",a:`<ul><li><b>Ủng hộ và có điều kiện:</b> chuyển đổi số mở rộng bạn đọc (stbook.vn, sách nói QR, thư viện số), giảm chi phí, phục vụ cơ sở.</li><li><b>Nguyên tắc:</b> “không để công nghệ đi trước kỷ luật nội dung” (giao ban xuất bản 8/2026); bảo vệ bản quyền trên môi trường số; gắn nhãn nội dung AI (Luật 17/2026).</li><li><b>Biên tập viên làm được gì:</b> chuẩn hóa dữ liệu sách khi số hóa; biên tập cho nhiều định dạng (in, điện tử, âm thanh); viết mô tả, từ khóa giúp tìm kiếm.</li></ul>`},
{q:"Vai trò của sách lý luận, chính trị trong bảo vệ nền tảng tư tưởng của Đảng?",a:`<ul><li>Sách lý luận cung cấp lập luận khoa học, hệ thống, có giá trị lâu dài; là “hàng rào tư tưởng”, “pháo đài lý luận” (Chủ tịch Quốc hội, 01/12/2025).</li><li>Nhà xuất bản có tủ sách “bảo vệ nền tảng tư tưởng của Đảng” trên stbook.vn và hưởng ứng cuộc thi chính luận về bảo vệ nền tảng tư tưởng.</li><li>Phương châm NQ 25: lấy “xây” làm gốc, thuyết phục là chủ đạo – sách phải hấp dẫn, dễ tiếp cận mới thuyết phục được.</li></ul>`},
{q:"Làm thế nào để sách lý luận, chính trị hấp dẫn người trẻ?",a:`<ul><li>Hình thức: sách mỏng, hỏi – đáp, đồ họa thông tin, sách nói, video ngắn giới thiệu sách; tủ sách theo chủ đề.</li><li>Nội dung: gắn vấn đề thời sự, câu chuyện thực tế; ngôn ngữ trong sáng, ít thuật ngữ.</li><li>Phân phối: mạng xã hội, livestream, sự kiện ở trường đại học (Nhà xuất bản đã ký kết phối hợp tuyên truyền với các trường).</li><li>Hội thảo 11/2025 về Chỉ thị 44 đã chỉ ra hạn chế: một số sách chậm đổi mới, chưa hấp dẫn – đây là chỗ biên tập viên trẻ đóng góp được.</li></ul>`},
{q:"Theo anh/chị, biên tập viên Nhà xuất bản cần phẩm chất chính trị gì?",a:`<ul><li>Kiên định chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh; nắm vững đường lối; tỉnh táo trước quan điểm sai trái.</li><li>Trung thực, khách quan, chịu trách nhiệm đến cùng với trang sách mình đứng tên.</li><li>Ý thức tổ chức kỷ luật, giữ bí mật nội dung chưa phát hành.</li><li>Dẫn: Thư Tổng Bí thư yêu cầu đội ngũ biên tập viên “giỏi chuyên môn, có đạo đức cách mạng, tinh thần đổi mới”.</li></ul>`}
]},
{h:"7. Kỹ năng bổ trợ: ngoại ngữ, tin học, công cụ số, AI",intro:"Nói cụ thể công cụ, mức độ và ví dụ đã dùng; tránh liệt kê suông.",items:[
{q:"Trình độ ngoại ngữ của anh/chị giúp gì cho công việc?",a:`<ul><li>Nêu chứng chỉ, mức độ (đọc tài liệu chuyên ngành, hiệu đính bản dịch).</li><li>Liên hệ: nhiệm vụ <b>biên dịch</b> trong QĐ 223; sách thông tin đối ngoại; tủ sách tiếng Lào, tiếng Tây Ban Nha; hợp tác với Lào; tham gia hội chợ sách nước ngoài (nhiệm vụ 2026).</li><li>Thông báo 2020 yêu cầu ngoại ngữ bậc 2; nếu cao hơn, nói rõ lợi thế.</li></ul>`},
{q:"Anh/chị sử dụng những công cụ tin học nào cho biên tập?",a:`<ul><li>Soạn thảo: theo dõi sửa đổi, chú thích, so sánh văn bản, quản lý kiểu định dạng; chú thích trên PDF bản bông.</li><li>Tra cứu: cơ sở dữ liệu văn bản pháp luật, văn kiện; công cụ kiểm tra chính tả, trùng lặp.</li><li>Quản lý: lưu trữ đám mây theo phân quyền, bảng theo dõi tiến độ bản thảo.</li><li>Nhà xuất bản đang có hệ thống điều hành điện tử, hướng tới số hóa toàn diện quy trình biên tập – nêu sẵn sàng học hệ thống nội bộ.</li></ul>`},
{q:"Anh/chị nghĩ gì về việc dùng AI tạo sinh trong biên tập?",a:`<ul><li><b>Dùng được:</b> gợi ý lỗi chính tả, ngữ pháp; tóm tắt để nắm bố cục; đối chiếu dữ liệu; phát hiện trùng lặp; hỗ trợ dịch nháp.</li><li><b>Không được:</b> giao AI quyết định quan điểm, thay thế việc đối chiếu bản gốc; đưa bản thảo chưa công bố hoặc tài liệu mật lên công cụ AI công cộng.</li><li><b>Pháp lý:</b> Luật 17/2026: nội dung do AI tạo phải gắn nhãn; AI không giảm trách nhiệm của biên tập viên; cấm dùng AI để vi phạm.</li><li><b>Câu chốt:</b> AI là công cụ kiểm tra, người biên tập vẫn là người chịu trách nhiệm.</li></ul>`},
{q:"Anh/chị có thể viết bài giới thiệu sách, nội dung truyền thông không?",a:`<ul><li>QĐ 223 giao nhiệm vụ <b>tuyên truyền, giới thiệu xuất bản phẩm</b>; năm 2025 mỗi sự kiện của Nhà xuất bản có trung bình 20–25 cơ quan báo chí đưa tin.</li><li>Nêu kỹ năng: viết lời giới thiệu 150–300 chữ, bài điểm sách, kịch bản video ngắn; ví dụ bài đã viết.</li><li>Nguyên tắc: chính xác như nội dung sách, không giật tít.</li></ul>`},
{q:"Kỹ năng làm việc với tác giả của anh/chị?",a:`<ul><li>Lắng nghe, tôn trọng; trao đổi bằng căn cứ; ghi lại thống nhất bằng văn bản; giữ đúng hẹn.</li><li>Biết “nói không” với yêu cầu trái quy trình, nhưng đưa ra phương án thay thế.</li><li>Kể một ví dụ đã thuyết phục được người khác sửa văn bản.</li></ul>`}
]},
{h:"8. Câu hỏi nên hỏi lại Hội đồng và lưu ý tác phong",intro:"Cuối buổi Hội đồng thường hỏi “Anh/chị có câu hỏi gì không?”. Chuẩn bị 1–2 câu ngắn, thể hiện quan tâm đến công việc.",items:[
{q:"Anh/chị có câu hỏi gì cho Hội đồng không?",a:`<ul><li>“Nếu trúng tuyển, biên tập viên mới được hướng dẫn và bồi dưỡng nghiệp vụ theo lộ trình nào?”</li><li>“Ban sách tôi dự tuyển đang ưu tiên những đề tài, bộ sách nào trong năm 2026–2027?”</li><li>“Nhà xuất bản kỳ vọng biên tập viên mới tham gia mảng sách điện tử, sách nói ở mức nào?”</li><li><b>Tránh:</b> hỏi lương, ngày nghỉ, chế độ ngay tại buổi phỏng vấn; hỏi điều đã có trên website.</li></ul>`},
{q:"Tác phong, trang phục khi phỏng vấn?",a:`<ul><li>Trang phục công sở lịch sự, màu trung tính; đến sớm 30 phút; mang giấy tờ tùy thân, giấy báo dự thi, bút.</li><li>Chào Hội đồng, ngồi khi được mời; nhìn người hỏi; nói rõ, vừa đủ nghe; gọi “Hội đồng” hoặc “thầy/cô, anh/chị” theo cách Hội đồng xưng hô.</li><li>Tắt điện thoại; không mang tài liệu vào phòng nếu không được phép.</li></ul>`},
{q:"Gặp câu hỏi không biết hoặc chưa chắc thì xử lý thế nào?",a:`<ul><li>Xin vài giây suy nghĩ; trả lời phần mình chắc chắn, nói rõ phần chưa nắm và cách sẽ tìm hiểu.</li><li>Không bịa số liệu, tên văn bản; một câu sai rõ ràng ảnh hưởng nhiều hơn một câu “em chưa nắm chắc”.</li><li>Nếu Hội đồng gợi ý, tiếp thu và bổ sung.</li></ul>`},
{q:"Dùng thời gian chuẩn bị (tối đa 15 phút) như thế nào?",a:`<ul><li>Đọc kỹ toàn bộ câu hỏi, gạch chân từ khóa.</li><li>Mỗi câu ghi 3 ý chính, 1 căn cứ (văn bản, ngày, điều luật), 1 liên hệ bản thân.</li><li>Sắp thứ tự trả lời: câu chắc nhất trước để tạo ấn tượng.</li><li>Theo NĐ 259/2026: phỏng vấn tối đa 30 phút; xét tuyển vấn đáp 30 phút; đều được chuẩn bị không quá 15 phút.</li></ul>`},
{q:"Kết thúc buổi phỏng vấn nên nói gì?",a:`<ul><li>Cảm ơn Hội đồng; tóm 1 câu cam kết: “Nếu được tuyển dụng, tôi sẽ hoàn thành bồi dưỡng nghiệp vụ, tuân thủ quy trình và góp phần vào nhiệm vụ xuất bản lý luận, chính trị của Nhà xuất bản.”</li><li>Đứng dậy chào, không hỏi kết quả tại chỗ.</li></ul>`}
]}
);
