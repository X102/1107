ESSAY.push(
{doc:"ct05",q:"Phân tích quan điểm chỉ đạo của Chỉ thị 05-CT/TW (2026). Liên hệ trách nhiệm của viên chức khi tham gia mạng xã hội.",outline:["Bối cảnh: Internet, mạng xã hội, AI, tin giả, nền tảng xuyên biên giới; Luật Báo chí 2025.","Báo chí cách mạng là tiên phong, xung kích, trụ cột trên mặt trận tư tưởng.","Đảng lãnh đạo trực tiếp, toàn diện; Nhà nước kiến tạo; hệ thống chính trị tạo điều kiện, tăng kỷ cương thông tin.","Chuyển đổi số – chiến lược; đổi mới tư duy – then chốt; nhân lực – quan trọng.","Liên hệ viên chức: kiểm chứng trước khi chia sẻ, không phát tán tin sai (Điều 10 Luật Viên chức 2025), tuân thủ quy chế phát ngôn, lan tỏa thông tin tích cực, phản bác thông tin xấu độc đúng kênh, nêu gương văn hóa ứng xử số."]},
{doc:"hd21",q:"Trình bày mục đích, yêu cầu và 5 nội dung trọng tâm cần quán triệt theo Hướng dẫn 21-HD/BTGDVTW.",outline:["Mục đích, yêu cầu: nâng cao nhận thức; khẳng định vai trò Đảng – Nhà nước; khẩn trương, nghiêm túc, tránh hình thức; gắn NQ Đại hội XIV, NQ 57, NQ 80; hành động có kết quả cụ thể.","Thứ nhất – Thứ năm: vai trò báo chí; vai trò các chủ thể; chiến lược – then chốt – quan trọng; 10 nhóm nhiệm vụ; nhân rộng điển hình, chống sản phẩm độc hại, lệch chuẩn.","Tổ chức thực hiện: kế hoạch \"rõ trách nhiệm, rõ thời gian, rõ tiến độ, rõ kết quả\"; báo cáo qua Vụ Báo chí – Xuất bản.","Liên hệ đơn vị: học tập thực chất, đưa vào kế hoạch công tác cá nhân."]},
{doc:"nq25",q:"Phân tích các quan điểm chỉ đạo và điểm mới của NQ 25-NQ/TW về Chiến lược công tác tư tưởng trong bối cảnh mới.",outline:["Giới thiệu: Bộ Chính trị, 22/8/2026; nghị quyết chuyên đề đầu tiên mang tầm chiến lược về công tác tư tưởng.","Phương châm: Chủ động – Sắc bén – Thuyết phục – Hiệu quả.","4 quan điểm: kiên định nền tảng; từ quản lý thông tin sang dẫn dắt nhận thức xã hội, không khoán trắng; lấy xây làm gốc, thuyết phục là chủ đạo, không gian thực và số; con người là trung tâm, niềm tin của Nhân dân là thước đo cao nhất, dữ liệu là năng lực nền tảng.","Điểm mới: chiến lược tổng thể; chỉ tiêu định lượng (70%, 15.000–20.000…); 3 đột phá 1, 2, 8; nguyên tắc 6 rõ.","Liên hệ NQ 35-NQ/TW (2018), Chỉ thị 05-CT/TW (2026) và trách nhiệm của viên chức."]},
{doc:"nq25",q:"Trình bày mục tiêu đến năm 2030 và các nhiệm vụ đột phá của NQ 25-NQ/TW; giải pháp đưa công tác tư tưởng về cơ sở.",outline:["Mục tiêu tổng quát và 5 nhóm chỉ tiêu đến 2030 (100% cấp ủy, ≥70%, 15.000–20.000, 4.000–6.000, dữ liệu trong nước).","Ba đột phá: nhóm 1, 2, 8 và nội dung chính.","Cơ chế ở cơ sở: ủy viên ban thường vụ phụ trách từng xã; sinh hoạt chi bộ bắt buộc; một vụ việc – một đầu mối – một thông điệp; thông tin hai chiều.","Kế hoạch 08-KH/TW: 2 nhóm nền tảng; không phát sinh biên chế.","Liên hệ địa phương, đơn vị."]}
);

OVERVIEW.mustKnow.push(
"<b>Luật Viên chức 129/2025/QH15</b>: thông qua 10/12/2025, hiệu lực <mark>01/7/2026</mark>, <b>6 chương 43 điều</b>; viên chức hưởng lương từ quỹ lương ĐVSNCL <b>và nguồn thu hợp pháp khác</b>; chỉ ký hợp đồng làm việc với <b>01</b> đơn vị; bỏ tập sự, bỏ thăng hạng.",
"<b>Kỷ luật viên chức</b>: 4 hình thức (cách chức chỉ với viên chức quản lý); thời hiệu <mark>05/10 năm</mark>; thời hạn <mark>90/150 ngày</mark>; quyết định có hiệu lực <mark>12 tháng</mark>; Hội đồng kỷ luật <b>03</b> người.",
"<b>Thi tuyển (NĐ 259)</b>: vòng 1 kiến thức chung <mark>60 câu/60 phút</mark>, đạt <mark>≥50% mỗi phần</mark>; vòng 2 thực hành hoặc viết 180' + phỏng vấn 30' (70/30); trúng tuyển <mark>≥50/100</mark>; ưu tiên 7,5 / 5 / 2,5 / 1,5.",
"<b>Thời hạn tuyển dụng</b>: nhận Phiếu <mark>30 ngày</mark>; hoàn thiện hồ sơ <mark>15 ngày</mark>; ký hợp đồng <mark>05 ngày làm việc</mark>; hợp đồng làm việc có giá trị như quyết định tuyển dụng.",
"<b>Đánh giá (NĐ 233)</b>: 100 = 30 + 70; <mark>≥90 / 70 / 50</mark>; xuất sắc ≤ <mark>20%</mark> số \"hoàn thành tốt\" (tối đa 25%); xếp loại trước <mark>15/12</mark>; chưa đủ 06 tháng thì không xếp loại.",
"<b>Tổ chức ĐVSNCL (NĐ 299)</b>: hiệu lực <mark>28/7/2026</mark>; thành lập cần <mark>≥15 người</mark>; phòng cần ≥2 mảng và <mark>≥7 người</mark>; giải thể khi <mark>3 năm liên tiếp</mark> không hoàn thành nhiệm vụ.",
"<b>NQ 27-NQ/TW</b> (09/11/2022, <b>BCH Trung ương</b>): 5 quan điểm, 3 trọng tâm, 10 nhiệm vụ, <b>8 đặc trưng</b>; đến 2030 thượng tôn Hiến pháp và pháp luật là chuẩn mực ứng xử.",
"<b>NQ 57-NQ/TW</b> (22/12/2024, Bộ Chính trị): \"đột phá quan trọng hàng đầu\"; thể chế là điều kiện tiên quyết; kinh tế số <mark>30% / 50% GDP</mark>; R&D <mark>2% GDP</mark>; <mark>≥3%</mark> tổng chi ngân sách.",
"<b>NQ 66-NQ/TW</b> (30/4/2025, Bộ Chính trị): \"đột phá của đột phá\"; mốc 2025 / 2027 / 2028; <mark>≥0,5%</mark> tổng chi ngân sách cho xây dựng pháp luật; dứt khoát từ bỏ \"không quản được thì cấm\".",
"<b>Chỉ thị 05-CT/TW</b> (30/3/2026, Bộ Chính trị): báo chí \"tiên phong, xung kích, trụ cột\"; chuyển đổi số là <b>chiến lược</b>, đổi mới tư duy là <b>then chốt</b>, nhân lực là <b>quan trọng</b>; <mark>10 nhóm</mark> nhiệm vụ; \"tinh, gọn, mạnh, hiện đại\".",
"<b>HD 21-HD/BTGDVTW</b> (28/5/2026, Ban Tuyên giáo và Dân vận TW): 5 nội dung quán triệt; gắn NQ Đại hội XIV, NQ 57, NQ 80; từ 01/8/2026 Ban đổi tên thành <b>Ban Tuyên giáo Trung ương</b>.",
"<b>NQ 25-NQ/TW</b> (22/8/2026, Bộ Chính trị, Tô Lâm ký): \"Chủ động – Sắc bén – Thuyết phục – Hiệu quả\"; <b>từ quản lý thông tin sang dẫn dắt nhận thức xã hội</b>; lấy \"xây\" làm gốc; 4 quan điểm, 8 nhóm nhiệm vụ, đột phá nhóm <b>1, 2, 8</b>; giảm <mark>≥70%</mark> nội dung xấu độc so với 2026."

/* ===== ĐẠI HỘI ĐẠI BIỂU TOÀN QUỐC LẦN THỨ XIV CỦA ĐẢNG (01/2026) VÀ VĂN KIỆN ===== */
DOCS.push({id:"dh14",group:"congress",short:"Đại hội XIV của Đảng (01/2026) và văn kiện",mmLabel:"Đại hội XIV (19–23/01/2026)",so:"XIV",
title:"Đại hội đại biểu toàn quốc lần thứ XIV của Đảng Cộng sản Việt Nam và các văn kiện Đại hội (Báo cáo chính trị, Chương trình hành động, Nghị quyết Đại hội)",
meta:[["Thời gian","19–23/01/2026: phiên trù bị sáng 19/1, khai mạc sáng 20/1, bế mạc chiều 23/1"],["Địa điểm","Trung tâm Hội nghị Quốc gia, Thủ đô Hà Nội"],["Đại biểu","1.586 đại biểu, thay mặt hơn 5,6 triệu đảng viên"],["Phương châm","Đoàn kết – Dân chủ – Kỷ cương – Đột phá – Phát triển"],["Tổng Bí thư khóa XIV","Tô Lâm (Hội nghị Trung ương 1, sáng 23/01/2026, 180/180 phiếu)"],["Văn kiện chính","Báo cáo chính trị (tích hợp 3 báo cáo, kèm Chương trình hành động); Báo cáo tổng kết 40 năm đổi mới; Báo cáo tổng kết 15 năm thi hành Điều lệ Đảng; Nghị quyết Đại hội"],["Sách Văn kiện","NXB Chính trị quốc gia Sự thật phối hợp Văn phòng Trung ương Đảng: 2 tập, 823 trang, 10 văn kiện (tin ngày 07/3/2026)"]],
tldr:`Đại hội XIV họp <mark>19–23/01/2026</mark> tại Trung tâm Hội nghị Quốc gia, gồm <mark>1.586 đại biểu</mark> thay mặt hơn <mark>5,6 triệu đảng viên</mark>, phương châm "Đoàn kết – Dân chủ – Kỷ cương – <b>Đột phá</b> – Phát triển". Chủ đề (cũng là tên Báo cáo chính trị) mở đầu bằng "Dưới lá cờ vẻ vang của Đảng…" và có cụm <b>"tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình của dân tộc"</b>. Lần đầu tiên Báo cáo chính trị <b>tích hợp 3 báo cáo</b> và có <b>Chương trình hành động</b>; Đại hội <b>không sửa đổi Điều lệ Đảng</b>. Chỉ tiêu 2026–2030: GDP tăng <mark>từ 10%/năm trở lên</mark>, GDP/người năm 2030 <mark>khoảng 8.500 USD</mark>, kinh tế số <mark>khoảng 30% GDP</mark>, đô thị hóa <mark>trên 50%</mark>, HDI <mark>khoảng 0,8</mark>; mốc <mark>2030</mark> nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao, <mark>2045</mark> nước phát triển, thu nhập cao. Nhân sự: BCH TW <mark>200</mark> (180 chính thức, 20 dự khuyết), Bộ Chính trị <mark>19</mark>, Ban Bí thư <mark>13</mark>, Tô Lâm tiếp tục là Tổng Bí thư.`,
sections:[
{h:"Thông tin chung về Đại hội",items:[
"<b>Thời gian:</b> 19–23/01/2026. Phiên trù bị <b>sáng 19/1</b>; khai mạc chính thức <b>sáng 20/1</b>; bế mạc <b>chiều 23/1</b>. Theo kế hoạch Đại hội diễn ra <b>19–25/01/2026</b>; chiều 21/1 Đại hội thông qua chương trình điều chỉnh, <b>rút ngắn 1,5 ngày</b>. Diễn văn bế mạc nói đến \"5 ngày làm việc khẩn trương, nghiêm túc, khoa học\".",
"<b>Địa điểm:</b> Trung tâm Hội nghị Quốc gia, Thủ đô Hà Nội.",
"<b>Đại biểu:</b> <mark>1.586</mark> đại biểu thay mặt hơn <mark>5,6 triệu</mark> đảng viên. Đương nhiên 163 (10,28%), được bầu 353 (22,25%), được chỉ định 1.070 (67,47%); nữ 301 (18,98%); dân tộc thiểu số 167 (10,53%). Để so sánh: Đại hội XIII có 1.587 đại biểu, hơn 5,1 triệu đảng viên.",
"<b>Phiên trù bị (sáng 19/1):</b> bầu Đoàn Chủ tịch gồm <b>16</b> đồng chí Ủy viên Bộ Chính trị, Đoàn Thư ký <b>5</b> đồng chí, Ban Thẩm tra tư cách đại biểu <b>13</b> đồng chí; thông qua quy chế làm việc, chương trình và quy chế bầu cử.",
"<b>Phiên khai mạc (sáng 20/1):</b> Thủ tướng Phạm Minh Chính thay mặt Đoàn Chủ tịch điều hành; Chủ tịch nước <b>Lương Cường</b> trình bày <b>Diễn văn khai mạc</b>; Tổng Bí thư <b>Tô Lâm</b> trình bày <b>Báo cáo của BCH TW khóa XIII về các văn kiện trình Đại hội XIV</b>; Thường trực Ban Bí thư <b>Trần Cẩm Tú</b> trình bày <b>Báo cáo kiểm điểm sự lãnh đạo, chỉ đạo của BCH TW khóa XIII</b>. Dự có 111 đại sứ, đại biện, 205 khách mời trong nước; Đại hội nhận 559 thư, điện mừng (109 chính đảng, 6 tổ chức quốc tế và khu vực).",
"<b>Chủ đề:</b> \"Dưới lá cờ vẻ vang của Đảng, chung sức, đồng lòng thực hiện thắng lợi các mục tiêu phát triển đất nước đến năm 2030; tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình của dân tộc vì hòa bình, độc lập, dân chủ, giàu mạnh, phồn vinh, văn minh, hạnh phúc, vững bước đi lên chủ nghĩa xã hội\".",
"<b>Phương châm:</b> \"Đoàn kết – Dân chủ – Kỷ cương – <b>Đột phá</b> – Phát triển\" (Đại hội XIII: \"Đoàn kết – Dân chủ – Kỷ cương – <b>Sáng tạo</b> – Phát triển\").",
"<b>Nhiệm vụ của Đại hội</b> (diễn văn khai mạc): kiểm điểm việc thực hiện Nghị quyết Đại hội XIII gắn với tổng kết 40 năm đổi mới; thảo luận, thông qua phương hướng, mục tiêu, nhiệm vụ trọng tâm, đột phá chiến lược giai đoạn 2026–2030, tầm nhìn đến năm 2045; bầu BCH TW khóa XIV. Đại hội \"quyết định những vấn đề mang tầm chiến lược đối với tương lai và vận mệnh của dân tộc\".",
"<b>Phiên bế mạc (chiều 23/1):</b> đồng chí Phạm Gia Túc (Chánh Văn phòng Trung ương Đảng) thay mặt Đoàn Thư ký đọc dự thảo Nghị quyết; Đại hội <b>nhất trí thông qua Nghị quyết</b>. Tổng Bí thư <b>Tô Lâm</b> đọc Diễn văn bế mạc: Đại hội \"đánh dấu một mốc son mới trong lịch sử Đảng\"; tinh thần nhiệm kỳ <b>\"Tự chủ chiến lược, nắm chắc thời cơ, chung sức đồng lòng\"</b>; \"biến ý chí thành hành động, biến quyết sách thành kết quả cụ thể\"."]},
{h:"Các văn kiện và những điểm mới",items:[
"<b>Lấy ý kiến:</b> dự thảo văn kiện được công bố tại họp báo quốc tế chiều <b>15/10/2025</b>; lấy ý kiến cán bộ, đảng viên và Nhân dân từ <b>15/10 đến 15/11/2025</b>, có kênh góp ý qua ứng dụng <b>VNeID</b>. Gồm: dự thảo Báo cáo chính trị, dự thảo Báo cáo tổng kết 40 năm đổi mới, dự thảo Báo cáo tổng kết 15 năm thi hành Điều lệ Đảng (2011–2025).",
"<b>Báo cáo chính trị</b> của BCH TW khóa XIII mang tên đúng bằng chủ đề Đại hội. Lần đầu tiên <b>tích hợp nội dung 3 văn kiện</b>: Báo cáo chính trị, Báo cáo kinh tế – xã hội, Báo cáo tổng kết công tác xây dựng Đảng. Kết cấu theo vấn đề như các đại hội gần đây, gồm <b>15 vấn đề</b>.",
"<b>Chương trình hành động</b> thực hiện Nghị quyết Đại hội của BCH TW khóa XIV được xây dựng <b>lần đầu tiên</b>, là bộ phận cấu thành của Báo cáo chính trị; xác định \"chủ thể, lộ trình, nguồn lực, đích đến\". Tổng Bí thư gọi đây là \"đột phá\" so với các đại hội trước.",
"<b>Báo cáo tổng kết</b> một số vấn đề lý luận và thực tiễn về công cuộc đổi mới theo định hướng xã hội chủ nghĩa trong <b>40 năm</b> qua ở Việt Nam.",
"<b>Báo cáo tổng kết 15 năm thi hành Điều lệ Đảng (2011–2025)</b> và phương hướng bổ sung, sửa đổi: Đại hội <b>\"đồng ý không bổ sung, sửa đổi Điều lệ Đảng hiện hành\"</b>.",
"<b>Điểm mới về lý luận</b> (theo Tổ Biên tập văn kiện): lần đầu xác định <b>\"lý luận về đường lối đổi mới\"</b> là bộ phận cấu thành nền tảng tư tưởng của Đảng; bổ sung <b>\"bảo vệ môi trường\"</b> cùng phát triển kinh tế, xã hội là nhiệm vụ <b>trung tâm</b>; đưa <b>đối ngoại, hội nhập quốc tế</b> cùng quốc phòng, an ninh là <b>trọng yếu, thường xuyên</b>; kinh tế nhà nước <b>giữ vững vai trò chủ đạo</b>, kinh tế tư nhân là <b>\"một động lực quan trọng nhất\"</b>; khẳng định <b>vai trò quyết định của thị trường</b> trong phân bổ nguồn lực; lần đầu đặt vấn đề <b>đột phá phát triển công nghiệp quốc phòng</b>.",
"<b>Báo cáo về các văn kiện</b> (Tô Lâm, 20/1): thể chế là <b>\"điểm nghẽn của điểm nghẽn\"</b> nhưng cũng là <b>\"đột phá của đột phá\"</b>; \"Điểm yếu lớn nhất của chúng ta là nhiều chủ trương đúng nhưng tổ chức thực hiện chưa đạt yêu cầu\"; \"Nhân dân là trung tâm, là chủ thể, là mục tiêu, là động lực và là nguồn lực của phát triển\"; đề xuất tổng kết <b>100 năm Đảng lãnh đạo (1930–2030)</b> và <b>40 năm thực hiện Cương lĩnh</b>.",
"<b>Nghị quyết Đại hội</b> gồm 7 phần (I–VII): I. Đánh giá kết quả thực hiện Nghị quyết XIII và 40 năm đổi mới; II. Tầm nhìn và định hướng phát triển (quan điểm, mục tiêu, chỉ tiêu, 12 định hướng, 6 nhiệm vụ trọng tâm, 3 đột phá); III. thông qua Báo cáo chính trị và Báo cáo tổng kết 40 năm đổi mới; IV. thông qua Báo cáo tổng kết 15 năm thi hành Điều lệ, không sửa Điều lệ; V. thông qua Báo cáo kiểm điểm của BCH TW khóa XIII; VI. thông qua kết quả bầu BCH TW khóa XIV; VII. giao BCH TW khóa XIV và các cấp ủy cụ thể hóa, tổ chức thực hiện.",
"<b>Bộ sách Văn kiện Đại hội XIV</b> (tin ngày 07/3/2026): NXB Chính trị quốc gia Sự thật phối hợp Văn phòng Trung ương Đảng xuất bản, <b>2 tập, 823 trang, 10 văn kiện</b> (diễn văn khai mạc, báo cáo về các văn kiện, Báo cáo chính trị, Chương trình hành động, 2 báo cáo tổng kết, báo cáo tiếp thu ý kiến và báo cáo kiểm điểm, Nghị quyết, phát biểu của Tổng Bí thư, diễn văn bế mạc). NXB phối hợp Ban Tuyên giáo và Dân vận Trung ương, Hội đồng Lý luận Trung ương biên soạn sách hỏi – đáp, tập bài nói, thuật ngữ phục vụ học tập Nghị quyết."]},
{h:"Đánh giá 5 năm thực hiện Nghị quyết XIII và 40 năm đổi mới",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Chỉ số (Báo cáo chính trị)</th><th>Kết quả</th><th>Ghi chú</th></tr></thead><tbody>
<tr><td>Tăng trưởng GDP bình quân 2021–2025</td><td><b>khoảng 6,2%/năm</b></td><td>mục tiêu XIII: 6,5–7%; riêng năm 2025: 8,02%</td></tr>
<tr><td>Quy mô GDP năm 2025</td><td><b>trên 514 tỉ USD</b></td><td>gấp 1,48 lần năm 2020; xếp thứ <b>32</b> thế giới</td></tr>
<tr><td>GDP bình quân đầu người 2025</td><td><b>5.026 USD</b></td><td>gia nhập nhóm nước thu nhập trung bình cao (mục tiêu XIII: 4.700–5.000 USD)</td></tr>
<tr><td>Đóng góp của TFP vào tăng trưởng</td><td>khoảng 47%</td><td>mục tiêu XIII: khoảng 45%</td></tr>
<tr><td>Tăng năng suất lao động bình quân</td><td>5,3%/năm</td><td>thấp hơn mục tiêu (XIII: trên 6,5%); ICOR 6,4</td></tr>
<tr><td>Tỉ lệ đô thị hóa 2025</td><td>45%</td><td></td></tr>
<tr><td>HDI</td><td>0,766</td><td>tăng 14 bậc</td></tr>
<tr><td>Chỉ số hạnh phúc 2025</td><td>46/143</td><td>tăng 33 bậc so với 2021</td></tr>
<tr><td>Tỉ lệ nghèo đa chiều</td><td>4,2% (2022) → 1,3% (2025)</td><td></td></tr>
<tr><td>Bao phủ bảo hiểm y tế</td><td>90,9% (2020) → 95,2% (2025)</td><td></td></tr>
<tr><td>Tuổi thọ trung bình 2025</td><td>74,8 tuổi</td><td>số năm sống khỏe khoảng 67</td></tr>
<tr><td>Sắp xếp đơn vị hành chính</td><td>giảm 46% cấp tỉnh, 66,9% cấp xã</td><td>lần đầu từ 1945 giảm một cấp hành chính (không tổ chức cấp huyện)</td></tr>
</tbody></table></div>
<ul>
<li><b>Thành tựu (Nghị quyết):</b> Đảng \"vững vàng lãnh đạo đất nước tiếp tục đạt được những kết quả rất quan trọng, toàn diện\"; kinh tế vĩ mô cơ bản ổn định; lạm phát, bội chi, nợ công được kiểm soát tốt; thặng dư thương mại cao; \"Việt Nam là điểm sáng về ổn định chính trị, an ninh, an toàn và ổn định xã hội\"; sắp xếp bộ máy theo hướng \"tinh, gọn, mạnh, hiệu năng, hiệu lực, hiệu quả\" – Báo cáo chính trị gọi là cuộc cách mạng \"sắp xếp lại giang sơn\".</li>
<li><b>Hạn chế:</b> hoàn thiện thể chế kinh tế thị trường còn chậm; năng suất, chất lượng, hiệu quả, khả năng chống chịu và sức cạnh tranh của nền kinh tế chưa cao; ngập lụt, ô nhiễm môi trường chưa được kiểm soát hiệu quả; văn hóa chưa thực sự trở thành nguồn lực, sức mạnh nội sinh; công tác cán bộ còn bất cập, \"trước hết là khâu đánh giá cán bộ\".</li>
<li><b>40 năm đổi mới:</b> công cuộc đổi mới \"là sự lựa chọn mang tính lịch sử\"; \"những thành tựu to lớn, có ý nghĩa lịch sử\" đã \"mở ra kỷ nguyên mới, nâng tầm vị thế cho đất nước\"; \"cơ đồ, tiềm lực, vị thế và uy tín quốc tế đã được nâng lên một tầm cao mới\".</li>
<li><b>5 bài học kinh nghiệm sau 40 năm đổi mới:</b> (1) kiên định, vận dụng và phát triển sáng tạo chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh; (2) giữ vững và tăng cường vai trò lãnh đạo, cầm quyền và sức chiến đấu của Đảng; (3) quán triệt sâu sắc và thực hành triệt để quan điểm <b>\"Dân là gốc\"</b>; (4) bám sát thực tiễn, nắm chắc và dự báo đúng tình hình, phản ứng chính sách chủ động, linh hoạt, kịp thời; (5) không ngừng đổi mới tư duy, nhất là tư duy chiến lược, tôn trọng quy luật khách quan.</li>
<li><b>Dự báo tình hình:</b> thế giới \"đa cực, đa trung tâm, đa tầng, phân mảnh và phân tuyến mạnh\"; \"Hòa bình, hợp tác, phát triển vẫn là xu thế lớn\"; trong nước <b>\"Nguy cơ bao trùm là nguy cơ tụt hậu, nhất là về công nghệ và rơi vào bẫy thu nhập trung bình\"</b>; già hóa dân số nhanh hơn dự báo.</li>
</ul>`},
{h:"5 quan điểm chỉ đạo và mục tiêu phát triển",items:[
"<b>(1)</b> Kiên định, vận dụng và phát triển sáng tạo chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh, <b>lý luận về đường lối đổi mới</b>; kiên định mục tiêu độc lập dân tộc và chủ nghĩa xã hội; kiên định đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới; <b>tự chủ chiến lược</b>, đổi mới mô hình phát triển, <b>lấy phát triển để ổn định, ổn định để thúc đẩy phát triển nhanh, bền vững</b>.",
"<b>(2)</b> Nhận diện sớm, tận dụng mọi thuận lợi, thời cơ, vượt qua mọi khó khăn, thách thức; <b>\"Phát triển kinh tế, xã hội, bảo vệ môi trường là trung tâm; xây dựng Đảng là then chốt; phát triển văn hóa, con người là nền tảng; tăng cường quốc phòng, an ninh và đẩy mạnh đối ngoại, hội nhập quốc tế là trọng yếu, thường xuyên\"</b>.",
"<b>(3)</b> Khơi dậy mạnh mẽ truyền thống yêu nước, khát vọng phát triển, tinh thần đoàn kết, ý chí tự chủ, tự tin, tự lực, tự cường, tự hào dân tộc; phát huy sức mạnh văn hóa, con người thành nguồn lực nội sinh; <b>lấy khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số quốc gia là động lực chính</b>; phát huy <b>vai trò chủ đạo của kinh tế nhà nước</b>, phát triển <b>kinh tế tư nhân là một động lực quan trọng nhất</b>.",
"<b>(4)</b> Phát huy sức mạnh, bản lĩnh, trí tuệ…; bảo vệ Tổ quốc <b>\"từ sớm, từ xa\"</b>; <b>bảo đảm và bảo vệ cao nhất lợi ích quốc gia – dân tộc</b>, kết hợp sức mạnh dân tộc với sức mạnh thời đại.",
"<b>(5)</b> <b>Tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện</b>; kiểm soát chặt chẽ quyền lực.",
"<b>Mục tiêu phát triển:</b> \"Giữ vững môi trường hòa bình, ổn định; phát triển nhanh, bền vững đất nước và bảo vệ vững chắc Tổ quốc; cải thiện và nâng cao toàn diện đời sống Nhân dân; tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên mới của dân tộc; thực hiện thắng lợi mục tiêu <b>đến năm 2030 trở thành nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao</b>; hiện thực hóa tầm nhìn <b>đến năm 2045 trở thành nước phát triển, thu nhập cao</b>; vì một nước Việt Nam hòa bình, độc lập, dân chủ, giàu mạnh, phồn vinh, văn minh, hạnh phúc, vững bước đi lên chủ nghĩa xã hội\".",
"<b>Hai mốc 100 năm:</b> 2030 – 100 năm thành lập Đảng (1930–2030); 2045 – 100 năm thành lập nước Việt Nam Dân chủ Cộng hòa, nay là nước Cộng hòa XHCN Việt Nam (1945–2045). Nghị quyết nhận định giai đoạn tới là <b>\"bước ngoặt mới, vận hội mới mang tính lịch sử\"</b> đối với sự nghiệp xây dựng, phát triển đất nước và bảo vệ Tổ quốc <b>\"trong kỷ nguyên vươn mình của dân tộc\"</b>."]},
{h:"Chỉ tiêu chủ yếu 5 năm 2026–2030",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Nhóm</th><th>Chỉ tiêu</th><th>Mức</th></tr></thead><tbody>
<tr><td>Kinh tế</td><td>Tăng trưởng GDP bình quân</td><td><b>từ 10%/năm trở lên</b></td></tr>
<tr><td>Kinh tế</td><td>GDP bình quân đầu người năm 2030</td><td><b>khoảng 8.500 USD</b></td></tr>
<tr><td>Kinh tế</td><td>Tỉ trọng công nghiệp chế biến, chế tạo</td><td>khoảng 28% GDP</td></tr>
<tr><td>Kinh tế</td><td>Tỉ trọng kinh tế số</td><td><b>khoảng 30% GDP</b></td></tr>
<tr><td>Kinh tế</td><td>Đóng góp của TFP vào tăng trưởng</td><td>trên 55%</td></tr>
<tr><td>Kinh tế</td><td>Tốc độ tăng năng suất lao động bình quân</td><td>khoảng 8,5%/năm</td></tr>
<tr><td>Kinh tế</td><td>Giảm tiêu hao năng lượng trên đơn vị GDP</td><td>1–1,5%/năm</td></tr>
<tr><td>Kinh tế</td><td>Tỉ lệ đô thị hóa</td><td><b>trên 50%</b></td></tr>
<tr><td>Kinh tế</td><td>Tích lũy tài sản / tiêu dùng cuối cùng</td><td>khoảng 35–36% GDP / khoảng 61–62% GDP</td></tr>
<tr><td>Kinh tế</td><td>Tổng vốn đầu tư toàn xã hội bình quân 5 năm</td><td>khoảng 40% GDP, trong đó đầu tư công chiếm 20–22%</td></tr>
<tr><td>Kinh tế</td><td>Huy động vào ngân sách nhà nước / bội chi</td><td>18% GDP / khoảng 5% GDP</td></tr>
<tr><td>Xã hội</td><td>Chỉ số phát triển con người (HDI)</td><td><b>khoảng 0,8</b></td></tr>
<tr><td>Xã hội</td><td>Tuổi thọ trung bình tính từ lúc sinh</td><td>khoảng 75,5 tuổi; thời gian sống khỏe mạnh tối thiểu 68 năm</td></tr>
<tr><td>Xã hội</td><td>Tỉ lệ lao động nông nghiệp trong tổng lao động xã hội</td><td>dưới 20%</td></tr>
<tr><td>Xã hội</td><td>Lao động qua đào tạo có bằng cấp, chứng chỉ</td><td>35–40%</td></tr>
<tr><td>Xã hội</td><td>Tỉ lệ nghèo đa chiều</td><td>giảm 1–1,5 điểm %/năm</td></tr>
<tr><td>Xã hội</td><td>Chỉ số hạnh phúc</td><td>thuộc nhóm 40 quốc gia cao nhất</td></tr>
<tr><td>Môi trường</td><td>Tỉ lệ che phủ rừng</td><td>duy trì mức 42%</td></tr>
<tr><td>Môi trường</td><td>Xử lý và tái sử dụng nước thải ra môi trường lưu vực các sông</td><td>65–70%</td></tr>
<tr><td>Môi trường</td><td>Phát thải khí nhà kính</td><td>giảm 8–9%</td></tr>
<tr><td>Môi trường</td><td>Cơ sở sản xuất, kinh doanh đạt quy chuẩn môi trường</td><td>khoảng 98–100%</td></tr>
<tr><td>Môi trường</td><td>Khu bảo tồn biển, ven biển</td><td>tối thiểu 6% diện tích tự nhiên vùng biển quốc gia</td></tr>
</tbody></table></div>
<p><span class="muted">Các chỉ tiêu được nhóm theo ba tiêu đề "Về kinh tế", "Về xã hội", "Về môi trường" tại mục II.3 Nghị quyết. Chương trình hành động cụ thể hóa thành 30 chỉ tiêu cho cả nước và 38 chỉ tiêu cho ngành, lĩnh vực, địa phương.</span></p>`},
{h:"3 đột phá chiến lược, 6 nhiệm vụ trọng tâm, 12 định hướng",html:`<p><b>Ba đột phá chiến lược</b> (Thủ tướng tóm tắt: \"thể chế thông thoáng, hạ tầng thông suốt, con người thông minh\"):</p>
<ol>
<li><b>Thể chế:</b> \"Đột phá mạnh mẽ về thể chế phát triển, nâng cao năng lực hoạch định và tổ chức thực hiện chủ trương\"; phân cấp, phân quyền giữa trung ương và địa phương.</li>
<li><b>Nhân lực:</b> \"Tập trung chuyển đổi cơ cấu và nâng cao chất lượng nguồn nhân lực, phát triển nguồn nhân lực chất lượng cao\"; thu hút, trọng dụng nhân tài; đổi mới đánh giá cán bộ theo tinh thần \"có vào, có ra\", \"có lên, có xuống\".</li>
<li><b>Hạ tầng:</b> \"Tiếp tục hoàn thiện đồng bộ và đột phá mạnh mẽ trong xây dựng kết cấu hạ tầng kinh tế – xã hội\": giao thông đa phương thức, hạ tầng số, hạ tầng xanh, chuyển đổi năng lượng, thích ứng biến đổi khí hậu.</li>
</ol>
<p><b>Sáu nhiệm vụ trọng tâm trong nhiệm kỳ Đại hội XIV:</b></p>
<ol>
<li>Tập trung ưu tiên xây dựng đồng bộ thể chế phát triển, trọng tâm là hệ thống pháp luật, cơ chế, chính sách (phù hợp mô hình chính quyền 3 cấp).</li>
<li>Tiếp tục đẩy mạnh xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện.</li>
<li>Đẩy mạnh phát triển nền kinh tế thị trường định hướng XHCN hiện đại, hội nhập quốc tế.</li>
<li>Tập trung triển khai đột phá về khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.</li>
<li>Phát triển nguồn lực con người, phát triển văn hóa thực sự trở thành nền tảng tinh thần…</li>
<li>Tiếp tục xây dựng lực lượng Quân đội nhân dân, Công an nhân dân cách mạng, chính quy, tinh nhuệ, hiện đại…</li>
</ol>
<p><b>Mười hai định hướng phát triển đất nước giai đoạn 2026–2030</b> (mục II.4):</p>
<ol>
<li>Tiếp tục đổi mới mạnh mẽ tư duy, thúc đẩy đột phá chiến lược, kiến tạo hệ sinh thái phát triển mới (thể chế).</li>
<li>Xác lập mô hình tăng trưởng mới với mục tiêu nâng cao năng suất, chất lượng, hiệu quả; KHCN, ĐMST, CĐS là động lực chính.</li>
<li>Xây dựng và phát triển nền văn hóa Việt Nam…</li>
<li>Xây dựng nền giáo dục quốc dân hiện đại…</li>
<li>Đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số…</li>
<li>Quản lý phát triển xã hội bền vững… (tiến bộ, công bằng xã hội).</li>
<li>Quản lý và sử dụng hiệu quả tài nguyên… (môi trường, thích ứng biến đổi khí hậu).</li>
<li>Củng cố, tăng cường quốc phòng, an ninh…</li>
<li>Thực hiện nhất quán đường lối đối ngoại… (hội nhập quốc tế).</li>
<li>Phát huy mạnh mẽ vai trò chủ thể của Nhân dân, dân chủ xã hội chủ nghĩa, sức mạnh của Nhân dân…</li>
<li>Tiếp tục đẩy mạnh xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam của Nhân dân…</li>
<li>Tiếp tục đẩy mạnh xây dựng, chỉnh đốn Đảng…</li>
</ol>
<p><span class="muted">Ghi các cụm mở đầu theo văn bản; phần trong ngoặc là ý tóm tắt. 12 định hướng tương ứng 12 nhóm nhiệm vụ chủ yếu của Chương trình hành động. Trong Nghị quyết, mục "Các đột phá chiến lược" đứng sau mục 5 (nhiệm vụ trọng tâm).</span></p>`},
{h:"Nhân sự khóa XIV",items:[
"<b>BCH TW khóa XIV</b> (bầu ngày 22/01/2026): <mark>200</mark> đồng chí – <b>180 chính thức, 20 dự khuyết</b> (cùng số lượng như khóa XIII).",
"<b>Hội nghị lần thứ nhất BCH TW khóa XIV (sáng 23/01/2026):</b> bầu đồng chí <b>Tô Lâm</b> tiếp tục giữ chức <b>Tổng Bí thư</b> (180/180 Ủy viên chính thức, 100%); bầu <b>Bộ Chính trị 19</b> đồng chí (khóa XIII: 18); bầu <b>Ủy ban Kiểm tra Trung ương 23</b> ủy viên (khóa XIII: 19), <b>Chủ nhiệm: Trần Sỹ Thanh</b>; bầu 3 Ủy viên Ban Bí thư: <b>Võ Thị Ánh Xuân, Phạm Thị Thanh Trà, Nguyễn Văn Quảng</b>. Đồng chí <b>Trần Cẩm Tú</b> tiếp tục là Thường trực Ban Bí thư.",
"<b>Ban Bí thư khóa XIV: 13</b> đồng chí = 10 Ủy viên Bộ Chính trị được phân công (Quyết định 05-QĐNS/TW ngày 30/01/2026: Tô Lâm, Trần Cẩm Tú, Lê Minh Hưng, Bùi Thị Minh Hoài, Nguyễn Trọng Nghĩa, Trịnh Văn Quyết, Lê Minh Trí, Phạm Gia Túc, Trần Sỹ Thanh, Nguyễn Thanh Nghị) + 3 đồng chí do Trung ương bầu.",
"<b>19 Ủy viên Bộ Chính trị</b> (thứ tự công bố): Tô Lâm, Trần Thanh Mẫn, Trần Cẩm Tú, Lê Minh Hưng, Đỗ Văn Chiến, Bùi Thị Minh Hoài, Phan Văn Giang, Lương Tam Quang, Nguyễn Duy Ngọc, Nguyễn Trọng Nghĩa, Trịnh Văn Quyết, Lê Hoài Trung, Lê Minh Trí, Trần Lưu Quang, Phạm Gia Túc, Trần Sỹ Thanh, Nguyễn Thanh Nghị, Đoàn Minh Huấn, Trần Đức Thắng.",
"<b>Chức danh nhà nước sau Đại hội:</b> sáng <b>07/4/2026</b>, kỳ họp thứ nhất Quốc hội khóa XVI bầu Tổng Bí thư <b>Tô Lâm giữ chức Chủ tịch nước</b> (495/495 đại biểu có mặt tán thành); Trần Thanh Mẫn tiếp tục là Chủ tịch Quốc hội; <b>Lê Minh Hưng</b> được bầu làm <b>Thủ tướng Chính phủ</b>. Từ đó văn bản dùng danh xưng \"Tổng Bí thư, Chủ tịch nước Tô Lâm\"."]},
{h:"Sau Đại hội: quán triệt, Chương trình hành động, các Hội nghị Trung ương",items:[
"<b>Hội nghị toàn quốc nghiên cứu, học tập, quán triệt Nghị quyết Đại hội XIV</b> (07/02/2026, Hội trường Diên Hồng, kết nối 31.097 điểm cầu): 5 chuyên đề do Trịnh Văn Quyết (những vấn đề mới, cốt lõi và kinh nghiệm 40 năm đổi mới), Thủ tướng Phạm Minh Chính (Chương trình hành động), Lê Minh Hưng (xây dựng Đảng, 15 năm thi hành Điều lệ), Nguyễn Thanh Nghị (kinh tế – xã hội 2026–2030), Bùi Thị Minh Hoài (đại đoàn kết toàn dân tộc) trình bày.",
"<b>Chương trình hành động:</b> 12 nhóm nhiệm vụ chủ yếu, 6 nhiệm vụ trọng tâm, 3 đột phá chiến lược; <b>3 phụ lục</b>: <b>30 chỉ tiêu</b> cho cả nước, <b>38 chỉ tiêu</b> cho ngành, lĩnh vực, địa phương, <b>272</b> nhiệm vụ, đề án, dự án, công trình quan trọng giai đoạn 2026–2030; ngay trong năm 2026 hoàn thành <b>18 luật</b>. Thủ tướng: lần đầu tiên trong lịch sử các kỳ đại hội, Đại hội ban hành Chương trình hành động.",
"<b>Hội nghị Trung ương 2 (khai mạc 23/3, bế mạc chiều 25/3/2026, 3 ngày làm việc):</b> Chương trình làm việc toàn khóa; Quy chế làm việc của BCH TW, Bộ Chính trị, Ban Bí thư; Quy định thi hành Điều lệ Đảng; quy định về kiểm tra, giám sát, kỷ luật đảng; quy định về công tác chính trị, tư tưởng; tổng kết 20 năm Nghị quyết TW 5 khóa X (kiểm tra, giám sát) và Nghị quyết TW 3 khóa X (phòng, chống tham nhũng, lãng phí); nhân sự lãnh đạo cơ quan nhà nước nhiệm kỳ 2026–2031; kế hoạch phát triển KT–XH, tài chính quốc gia, đầu tư công trung hạn 5 năm 2026–2030; thành lập thành phố Đồng Nai trực thuộc Trung ương.",
"<b>Hội nghị Trung ương 3 (20–24/7/2026, 5 ngày):</b> 13 nội dung; sơ kết 1 năm vận hành mô hình tổ chức tổng thể của hệ thống chính trị và <b>chính quyền địa phương 2 cấp</b>; Đề án đổi mới mô hình phát triển Việt Nam; Chiến lược an ninh quốc gia; Nghị quyết về xây dựng và phát triển Việt Nam trở thành <b>quốc gia biển mạnh</b>; Đề án xây dựng xã hội kỷ cương, an toàn, văn minh, hài hòa, phát triển; sửa đổi Quy định số 20, Quy định mới về những điều đảng viên không được làm; chủ trương thành lập thành phố Quảng Ninh, thành phố Bắc Ninh; kết luận sơ kết Nghị quyết 18 (đất đai) và tổng kết Nghị quyết 24 (môi trường, biến đổi khí hậu). Thông điệp: \"biến tốc độ ban hành thành tốc độ thực hiện\".",
"<b>Hội nghị Trung ương 4:</b> bế mạc chiều 08/10/2026; Tổng Bí thư, Chủ tịch nước Tô Lâm nhấn mạnh \"Đã nhận việc phải làm, đã cam kết phải thực hiện\". <span class=\"muted\">(Danh mục nội dung chi tiết chưa xác minh.)</span>"]},

CONFUSE.push(
{doc:"dh14",a:"Phương châm Đại hội XIV là \"Đoàn kết – Dân chủ – Kỷ cương – Sáng tạo – Phát triển\"?",b:"Sai. Đại hội XIV: \"Đoàn kết – Dân chủ – Kỷ cương – <b>Đột phá</b> – Phát triển\". Chữ <b>\"Sáng tạo\"</b> là của Đại hội XIII.",tip:"XIV đột phá, XIII sáng tạo."},
{doc:"dh14",a:"Đại hội XIV có 1.587 đại biểu thay mặt hơn 5,1 triệu đảng viên?",b:"Đó là số liệu Đại hội XIII. Đại hội XIV: <b>1.586</b> đại biểu, thay mặt <b>hơn 5,6 triệu</b> đảng viên.",tip:"XIV ít hơn 1 đại biểu nhưng nhiều hơn khoảng nửa triệu đảng viên."},
{doc:"dh14",a:"Đại hội XIV diễn ra 19–25/01/2026?",b:"19–25/01 là <b>kế hoạch</b>. Đại hội rút ngắn 1,5 ngày, <b>bế mạc chiều 23/01/2026</b>; khai mạc chính thức sáng 20/1, phiên trù bị sáng 19/1.",tip:""},
{doc:"dh14",a:"\"Trung tâm\" theo Đại hội XIV là \"phát triển kinh tế – xã hội\" như Đại hội XIII?",b:"Đại hội XIV bổ sung: <b>\"Phát triển kinh tế, xã hội, bảo vệ môi trường là trung tâm\"</b>. Nền tảng là <b>văn hóa, con người</b> (XIII: văn hóa là nền tảng tinh thần). Trọng yếu, thường xuyên là <b>quốc phòng, an ninh và đối ngoại, hội nhập quốc tế</b> (XIII: chỉ quốc phòng, an ninh).",tip:"XIV thêm 3 thứ: môi trường, con người, đối ngoại."},
{doc:"dh14",a:"Kinh tế tư nhân là \"động lực chính\" của nền kinh tế?",b:"Không. <b>Động lực chính</b> là <b>khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số quốc gia</b>. Kinh tế tư nhân là <b>\"một động lực quan trọng nhất\"</b>; kinh tế nhà nước <b>giữ vai trò chủ đạo</b>.",tip:"KHCN: động lực chính. Tư nhân: một động lực quan trọng nhất. Nhà nước: chủ đạo."},
{doc:"dh14",a:"Mục tiêu tăng trưởng 2026–2030 là \"khoảng 6,5–7%/năm\"?",b:"Đó là mục tiêu Đại hội XIII (2021–2025); thực hiện đạt khoảng <b>6,2%/năm</b>. Đại hội XIV: <b>từ 10%/năm trở lên</b>.",tip:""},
{doc:"dh14",a:"GDP bình quân đầu người khoảng 8.500 USD là kết quả năm 2025?",b:"Không. <b>8.500 USD</b> là <b>mục tiêu năm 2030</b>. Kết quả năm 2025 là <b>5.026 USD</b> (mục tiêu XIII cho 2025: 4.700–5.000 USD).",tip:""},
{doc:"dh14",a:"Kinh tế số khoảng 20% GDP là chỉ tiêu của Đại hội XIV?",b:"20% là chỉ tiêu XIII (đến 2025). Đại hội XIV: <b>khoảng 30% GDP</b> (khớp với NQ 57-NQ/TW: tối thiểu 30% GDP năm 2030).",tip:""},
{doc:"dh14",a:"Đô thị hóa \"khoảng 45%\" là chỉ tiêu 2026–2030?",b:"45% là chỉ tiêu XIII và cũng là mức thực hiện năm 2025. Chỉ tiêu XIV: <b>trên 50%</b>.",tip:""},
{doc:"dh14",a:"Đại hội XIV sửa đổi, bổ sung Điều lệ Đảng?",b:"Không. Đại hội thông qua Báo cáo tổng kết <b>15 năm thi hành Điều lệ (2011–2025)</b> và <b>đồng ý không bổ sung, sửa đổi Điều lệ Đảng hiện hành</b>.",tip:""},
{doc:"dh14",a:"Bộ Chính trị khóa XIV có 18 ủy viên; UBKT TW có 19 ủy viên?",b:"Đó là khóa XIII. Khóa XIV: <b>Bộ Chính trị 19</b>, <b>UBKT TW 23</b> (Chủ nhiệm Trần Sỹ Thanh), <b>Ban Bí thư 13</b>. BCH TW vẫn <b>200 (180 + 20)</b> như khóa XIII.",tip:"Đoàn Chủ tịch Đại hội có 16 người, đừng nhầm với 19 Ủy viên Bộ Chính trị."},
{doc:"dh14",a:"Năm 2030 là mốc \"nước phát triển, thu nhập cao\"?",b:"Không. <b>2030</b> (100 năm thành lập Đảng): nước đang phát triển có <b>công nghiệp hiện đại, thu nhập trung bình cao</b>. <b>2045</b> (100 năm thành lập nước): <b>nước phát triển, thu nhập cao</b>.",tip:"30 trung bình cao, 45 phát triển cao."},
{doc:"dh14",a:"Chương trình hành động là văn kiện riêng ban hành sau Đại hội?",b:"Chương trình hành động được xây dựng <b>lần đầu tiên</b>, là <b>bộ phận cấu thành của Báo cáo chính trị</b>, trình Đại hội cùng văn kiện; Thủ tướng trình bày chuyên đề về nó tại Hội nghị toàn quốc 07/02/2026.",tip:""},
{doc:"dh14",a:"Tổng Bí thư Tô Lâm được bầu tại phiên bế mạc Đại hội?",b:"Đại hội bầu <b>BCH TW</b> (22/1). Tổng Bí thư, Bộ Chính trị, UBKT TW do <b>Hội nghị lần thứ nhất BCH TW khóa XIV</b> bầu (<b>sáng 23/01/2026</b>). Việc giữ chức Chủ tịch nước do <b>Quốc hội khóa XVI</b> bầu ngày <b>07/4/2026</b>.",tip:""}
);

FLASH.push(
{doc:"dh14",q:"Đại hội XIV: thời gian, địa điểm?",a:"<b>19–23/01/2026</b> (trù bị sáng 19/1, khai mạc sáng 20/1, bế mạc chiều 23/1) tại <b>Trung tâm Hội nghị Quốc gia</b>, Hà Nội."},
{doc:"dh14",q:"Số đại biểu, số đảng viên đại diện?",a:"<b>1.586</b> đại biểu, thay mặt hơn <b>5,6 triệu</b> đảng viên (XIII: 1.587 / hơn 5,1 triệu)."},
{doc:"dh14",q:"Chủ đề Đại hội XIV?",a:"\"Dưới lá cờ vẻ vang của Đảng, chung sức, đồng lòng thực hiện thắng lợi các mục tiêu phát triển đất nước đến năm 2030; <b>tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình của dân tộc</b> vì hòa bình, độc lập, dân chủ, giàu mạnh, phồn vinh, văn minh, hạnh phúc, vững bước đi lên chủ nghĩa xã hội\"."},
{doc:"dh14",q:"Phương châm Đại hội XIV?",a:"<b>Đoàn kết – Dân chủ – Kỷ cương – Đột phá – Phát triển</b>."},
{doc:"dh14",q:"Ai đọc diễn văn khai mạc, ai trình bày báo cáo về văn kiện, ai đọc diễn văn bế mạc?",a:"Khai mạc: Chủ tịch nước <b>Lương Cường</b>. Báo cáo về các văn kiện: Tổng Bí thư <b>Tô Lâm</b>. Báo cáo kiểm điểm BCH TW khóa XIII: <b>Trần Cẩm Tú</b>. Bế mạc: Tổng Bí thư <b>Tô Lâm</b>."},
{doc:"dh14",q:"Báo cáo chính trị Đại hội XIV tích hợp những báo cáo nào?",a:"3 văn kiện: <b>Báo cáo chính trị, Báo cáo kinh tế – xã hội, Báo cáo tổng kết công tác xây dựng Đảng</b>; kết cấu <b>15 vấn đề</b>."},
{doc:"dh14",q:"Điểm mới \"lần đầu tiên\" về tổ chức thực hiện Nghị quyết?",a:"Xây dựng <b>Chương trình hành động</b> thực hiện Nghị quyết Đại hội của BCH TW khóa XIV, là bộ phận cấu thành Báo cáo chính trị; xác định \"chủ thể, lộ trình, nguồn lực, đích đến\"."},
{doc:"dh14",q:"Đại hội XIV quyết định gì về Điều lệ Đảng?",a:"Thông qua Báo cáo tổng kết 15 năm thi hành Điều lệ (2011–2025); <b>không bổ sung, sửa đổi Điều lệ Đảng hiện hành</b>."},
{doc:"dh14",q:"Điểm mới lý luận về nền tảng tư tưởng?",a:"Lần đầu xác định <b>\"lý luận về đường lối đổi mới\"</b> là bộ phận cấu thành nền tảng tư tưởng của Đảng (cùng chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh)."},
{doc:"dh14",q:"Công thức \"trung tâm – then chốt – nền tảng – trọng yếu, thường xuyên\" của Đại hội XIV?",a:"Phát triển kinh tế, xã hội, <b>bảo vệ môi trường</b> là trung tâm; xây dựng Đảng là then chốt; phát triển văn hóa, <b>con người</b> là nền tảng; tăng cường quốc phòng, an ninh và <b>đẩy mạnh đối ngoại, hội nhập quốc tế</b> là trọng yếu, thường xuyên."},
{doc:"dh14",q:"Động lực chính; vai trò kinh tế nhà nước và kinh tế tư nhân?",a:"<b>KHCN, ĐMST, chuyển đổi số quốc gia là động lực chính</b>; kinh tế nhà nước giữ <b>vai trò chủ đạo</b>; kinh tế tư nhân là <b>\"một động lực quan trọng nhất\"</b>."},
{doc:"dh14",q:"Mục tiêu 2030 và tầm nhìn 2045?",a:"2030: <b>nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao</b>. 2045: <b>nước phát triển, thu nhập cao</b>."},
{doc:"dh14",q:"Các chỉ tiêu kinh tế phải thuộc lòng 2026–2030?",a:"GDP <b>từ 10%/năm trở lên</b>; GDP/người 2030 <b>khoảng 8.500 USD</b>; kinh tế số <b>khoảng 30% GDP</b>; CN chế biến, chế tạo <b>khoảng 28% GDP</b>; TFP <b>trên 55%</b>; năng suất lao động <b>khoảng 8,5%/năm</b>; đô thị hóa <b>trên 50%</b>."},
{doc:"dh14",q:"Chỉ tiêu xã hội 2026–2030?",a:"HDI <b>khoảng 0,8</b>; tuổi thọ <b>khoảng 75,5</b> (sống khỏe <b>tối thiểu 68 năm</b>); lao động nông nghiệp <b>dưới 20%</b>; lao động có bằng cấp, chứng chỉ <b>35–40%</b>; nghèo đa chiều giảm <b>1–1,5 điểm %/năm</b>; nhóm <b>40</b> nước hạnh phúc nhất."},
{doc:"dh14",q:"Chỉ tiêu môi trường 2026–2030?",a:"Che phủ rừng <b>42%</b>; xử lý, tái sử dụng nước thải lưu vực sông <b>65–70%</b>; giảm phát thải khí nhà kính <b>8–9%</b>; cơ sở đạt quy chuẩn môi trường <b>khoảng 98–100%</b>; khu bảo tồn biển <b>tối thiểu 6%</b> diện tích vùng biển."},
{doc:"dh14",q:"Ba đột phá chiến lược của Đại hội XIV?",a:"(1) <b>Thể chế phát triển</b> (nâng năng lực hoạch định và tổ chức thực hiện); (2) <b>nguồn nhân lực</b> (chuyển đổi cơ cấu, nâng chất lượng, nhân lực chất lượng cao); (3) <b>kết cấu hạ tầng kinh tế – xã hội</b>."},
{doc:"dh14",q:"Sáu nhiệm vụ trọng tâm nhiệm kỳ XIV (gọi tắt)?",a:"(1) Thể chế phát triển; (2) xây dựng, chỉnh đốn Đảng và hệ thống chính trị; (3) kinh tế thị trường định hướng XHCN hiện đại; (4) đột phá KHCN, ĐMST, CĐS; (5) nguồn lực con người, văn hóa; (6) Quân đội, Công an cách mạng, chính quy, tinh nhuệ, hiện đại."},
{doc:"dh14",q:"Kết quả kinh tế 2021–2025 theo Báo cáo chính trị?",a:"Tăng trưởng <b>khoảng 6,2%/năm</b>; GDP 2025 <b>trên 514 tỉ USD</b> (gấp 1,48 lần 2020, thứ 32 thế giới); GDP/người <b>5.026 USD</b>; năng suất lao động tăng 5,3%/năm; ICOR 6,4."},
{doc:"dh14",q:"Đánh giá 40 năm đổi mới (cụm từ khóa)?",a:"Đổi mới <b>\"là sự lựa chọn mang tính lịch sử\"</b>; thành tựu <b>\"to lớn, có ý nghĩa lịch sử\"</b>; cơ đồ, tiềm lực, vị thế, uy tín quốc tế <b>\"được nâng lên một tầm cao mới\"</b>."},
{doc:"dh14",q:"Năm bài học kinh nghiệm sau 40 năm đổi mới?",a:"(1) Kiên định, vận dụng, phát triển sáng tạo chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh; (2) giữ vững, tăng cường vai trò lãnh đạo, cầm quyền, sức chiến đấu của Đảng; (3) <b>\"Dân là gốc\"</b>; (4) bám sát thực tiễn, dự báo đúng, phản ứng chính sách kịp thời; (5) đổi mới tư duy, nhất là tư duy chiến lược, tôn trọng quy luật khách quan."},
{doc:"dh14",q:"\"Nguy cơ bao trùm\" theo Báo cáo chính trị?",a:"<b>Nguy cơ tụt hậu</b>, nhất là về công nghệ và rơi vào <b>bẫy thu nhập trung bình</b>."},
{doc:"dh14",q:"Thể chế được Tổng Bí thư gọi là gì trong Báo cáo về các văn kiện?",a:"<b>\"Điểm nghẽn của điểm nghẽn\"</b> nhưng cũng là <b>\"đột phá của đột phá\"</b>."},
{doc:"dh14",q:"Nhân sự chủ chốt khóa XIV?",a:"BCH TW <b>200</b> (180 + 20); Tổng Bí thư <b>Tô Lâm</b> (180/180); Bộ Chính trị <b>19</b>; Ban Bí thư <b>13</b>; UBKT TW <b>23</b>, Chủ nhiệm <b>Trần Sỹ Thanh</b>; Thường trực Ban Bí thư <b>Trần Cẩm Tú</b>."},
{doc:"dh14",q:"Ban Bí thư khóa XIV gồm những ai ngoài 10 Ủy viên Bộ Chính trị?",a:"3 đồng chí do Hội nghị TW 1 bầu: <b>Võ Thị Ánh Xuân, Phạm Thị Thanh Trà, Nguyễn Văn Quảng</b> (phân công theo QĐ 05-QĐNS/TW ngày 30/01/2026)."},
{doc:"dh14",q:"Chương trình hành động có những con số nào?",a:"12 nhóm nhiệm vụ, 6 nhiệm vụ trọng tâm, 3 đột phá; 3 phụ lục: <b>30</b> chỉ tiêu cả nước, <b>38</b> chỉ tiêu ngành, lĩnh vực, địa phương, <b>272</b> nhiệm vụ, đề án, dự án; hoàn thành <b>18 luật</b> ngay trong 2026."},
{doc:"dh14",q:"Bộ sách Văn kiện Đại hội XIV?",a:"NXB <b>Chính trị quốc gia Sự thật</b> phối hợp <b>Văn phòng Trung ương Đảng</b> xuất bản: <b>2 tập, 823 trang, 10 văn kiện</b> (tin ngày 07/3/2026)."},
{doc:"dh14",q:"Hội nghị toàn quốc quán triệt Nghị quyết Đại hội XIV?",a:"<b>07/02/2026</b>, Hội trường Diên Hồng, trực tuyến 31.097 điểm cầu; 5 chuyên đề (Trịnh Văn Quyết, Phạm Minh Chính, Lê Minh Hưng, Nguyễn Thanh Nghị, Bùi Thị Minh Hoài)."},
{doc:"dh14",q:"Hội nghị Trung ương 2 và 3 khóa XIV?",a:"TW 2: <b>23–25/3/2026</b> (quy chế, quy định thi hành Điều lệ, chương trình toàn khóa, nhân sự nhà nước 2026–2031, kế hoạch 5 năm). TW 3: <b>20–24/7/2026</b> (13 nội dung; sơ kết 1 năm chính quyền địa phương 2 cấp; quốc gia biển mạnh; Chiến lược an ninh quốc gia)."},
{doc:"dh14",q:"Tinh thần nhiệm kỳ nêu trong diễn văn bế mạc?",a:"<b>\"Tự chủ chiến lược, nắm chắc thời cơ, chung sức đồng lòng\"</b>; \"biến ý chí thành hành động, biến quyết sách thành kết quả cụ thể\"; \"tổ chức thực hiện là khâu yếu\"."}
);

{doc:"dh14",q:"Cụm từ nào có trong chủ đề Đại hội XIV?",opts:["Tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình của dân tộc","Tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh","Tiếp tục đẩy mạnh toàn diện, đồng bộ công cuộc đổi mới theo hướng hiện đại","Phấn đấu sớm đưa nước ta cơ bản trở thành nước công nghiệp theo hướng hiện đại"],ans:0,ex:"Chủ đề XIV có cụm \"tự chủ chiến lược\" và \"kỷ nguyên vươn mình của dân tộc\". Phương án 2 thuộc chủ đề Đại hội XIII.",ref:"Chủ đề Đại hội"},

{doc:"dh14",q:"Báo cáo tổng kết thi hành Điều lệ Đảng trình Đại hội XIV tổng kết giai đoạn:",opts:["15 năm (2011–2025)","10 năm (2016–2025)","20 năm (2006–2025)","5 năm (2021–2025)"],ans:0,ex:"Điều lệ hiện hành được Đại hội XI thông qua năm 2011.",ref:"Nghị quyết, phần IV"},
{doc:"dh14",q:"Theo Tổ Biên tập, lần đầu tiên Đảng xác định nội dung nào là bộ phận cấu thành nền tảng tư tưởng của Đảng?",opts:["Lý luận về đường lối đổi mới","Tư tưởng Hồ Chí Minh","Cương lĩnh xây dựng đất nước trong thời kỳ quá độ","Học thuyết về kinh tế thị trường định hướng XHCN"],ans:0,ex:"Tư tưởng Hồ Chí Minh đã là nền tảng tư tưởng từ trước. Quan điểm (1) của Nghị quyết XIV ghi \"chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới\".",ref:"Quan điểm (1)"},
{doc:"dh14",q:"Theo quan điểm chỉ đạo của Đại hội XIV, nhiệm vụ \"trung tâm\" là:",opts:["Phát triển kinh tế, xã hội, bảo vệ môi trường","Phát triển kinh tế – xã hội","Xây dựng Đảng","Phát triển văn hóa, con người"],ans:0,ex:"Đại hội XIV bổ sung \"bảo vệ môi trường\" vào nhiệm vụ trung tâm; Đại hội XIII chỉ ghi \"phát triển kinh tế – xã hội là trung tâm\".",ref:"Quan điểm (2)"},
{doc:"dh14",q:"Theo Đại hội XIV, nội dung nào là \"then chốt\"?",opts:["Xây dựng Đảng","Phát triển kinh tế, xã hội, bảo vệ môi trường","Hoàn thiện thể chế phát triển","Phát triển khoa học, công nghệ"],ans:0,ex:"Thể chế là đột phá chiến lược thứ nhất, không phải nội dung \"then chốt\" trong công thức của quan điểm (2).",ref:"Quan điểm (2)"},
{doc:"dh14",q:"Theo Đại hội XIV, nội dung nào là \"nền tảng\"?",opts:["Phát triển văn hóa, con người","Phát triển giáo dục và đào tạo","Khoa học, công nghệ, đổi mới sáng tạo","Khối đại đoàn kết toàn dân tộc"],ans:0,ex:"Đại hội XIII ghi \"phát triển văn hóa là nền tảng tinh thần\"; Đại hội XIV ghi \"phát triển văn hóa, con người là nền tảng\".",ref:"Quan điểm (2)"},
{doc:"dh14",q:"Theo Đại hội XIV, nội dung nào là \"trọng yếu, thường xuyên\"?",opts:["Tăng cường quốc phòng, an ninh và đẩy mạnh đối ngoại, hội nhập quốc tế","Bảo đảm quốc phòng, an ninh","Đẩy mạnh đối ngoại, hội nhập quốc tế","Xây dựng Đảng và hệ thống chính trị"],ans:0,ex:"Điểm mới: đối ngoại, hội nhập quốc tế được đặt cùng quốc phòng, an ninh. Đại hội XIII chỉ ghi quốc phòng, an ninh.",ref:"Quan điểm (2)"},
{doc:"dh14",q:"Nghị quyết Đại hội XIV xác định động lực chính để phát triển là:",opts:["Khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số quốc gia","Kinh tế tư nhân","Kinh tế nhà nước","Đầu tư công"],ans:0,ex:"Kinh tế tư nhân là \"một động lực quan trọng nhất\"; kinh tế nhà nước giữ vai trò chủ đạo.",ref:"Quan điểm (3)"},
{doc:"dh14",q:"Nghị quyết Đại hội XIV xác định kinh tế tư nhân là:",opts:["Một động lực quan trọng nhất","Động lực chính","Lực lượng giữ vai trò chủ đạo","Nền tảng của nền kinh tế"],ans:0,ex:"Động lực chính là KHCN, ĐMST, CĐS; vai trò chủ đạo thuộc kinh tế nhà nước.",ref:"Quan điểm (3)"},
{doc:"dh14",q:"Theo Đại hội XIV, kinh tế nhà nước giữ vai trò:",opts:["Chủ đạo","Quyết định","Trung tâm","Một động lực quan trọng nhất"],ans:0,ex:"Văn kiện XIV cũng khẳng định thị trường có vai trò quyết định trong phân bổ nguồn lực.",ref:"Quan điểm (3)"},
{doc:"dh14",q:"Quan điểm (4) của Nghị quyết Đại hội XIV yêu cầu bảo vệ Tổ quốc:",opts:["Từ sớm, từ xa","Từ cơ sở, từ địa bàn","Từ trong lòng dân, từ cơ sở","Từ biên giới, từ biển đảo"],ans:0,ex:"Kèm yêu cầu \"bảo đảm và bảo vệ cao nhất lợi ích quốc gia – dân tộc\".",ref:"Quan điểm (4)"},
{doc:"dh14",q:"Mục tiêu đến năm 2030 theo Nghị quyết Đại hội XIV là:",opts:["Nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao","Nước phát triển, thu nhập cao","Nước đang phát triển có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp","Nước công nghiệp theo hướng hiện đại, thu nhập trung bình"],ans:0,ex:"Phương án 3 là mục tiêu đến 2025 của Đại hội XIII; phương án 2 là tầm nhìn 2045.",ref:"Mục II.2"},
{doc:"dh14",q:"Tầm nhìn đến năm 2045 theo Nghị quyết Đại hội XIV là:",opts:["Nước phát triển, thu nhập cao","Nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao","Nước công nghiệp hiện đại, thu nhập trung bình cao","Nước phát triển, thu nhập trung bình cao"],ans:0,ex:"2045 là dịp 100 năm thành lập nước.",ref:"Mục II.2"},
{doc:"dh14",q:"Mốc năm 2030 trong văn kiện Đại hội XIV gắn với sự kiện nào?",opts:["100 năm thành lập Đảng (1930–2030)","100 năm thành lập nước (1945–2045)","100 năm Ngày sinh Chủ tịch Hồ Chí Minh","45 năm công cuộc đổi mới"],ans:0,ex:"Hai mục tiêu 100 năm: 2030 (thành lập Đảng) và 2045 (thành lập nước).",ref:"Mục II"},
{doc:"dh14",q:"Chỉ tiêu tốc độ tăng trưởng GDP bình quân giai đoạn 2026–2030 là:",opts:["Từ 10%/năm trở lên","Khoảng 6,5–7%/năm","Khoảng 8%/năm","Từ 8–10%/năm"],ans:0,ex:"6,5–7%/năm là chỉ tiêu của Đại hội XIII cho giai đoạn 2021–2025.",ref:"Mục II.3"},
{doc:"dh14",q:"GDP bình quân đầu người đến năm 2030 theo Nghị quyết Đại hội XIV đạt khoảng:",opts:["8.500 USD","7.500 USD","5.026 USD","10.000 USD"],ans:0,ex:"5.026 USD là kết quả năm 2025.",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ trọng kinh tế số trong GDP đến năm 2030 theo Nghị quyết Đại hội XIV:",opts:["Khoảng 30%","Khoảng 20%","Khoảng 25%","Khoảng 50%"],ans:0,ex:"20% là chỉ tiêu XIII đến 2025; 50% là tầm nhìn 2045 trong NQ 57-NQ/TW.",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ trọng công nghiệp chế biến, chế tạo trong GDP giai đoạn 2026–2030:",opts:["Khoảng 28%","Trên 25%","Khoảng 30%","Khoảng 35%"],ans:0,ex:"\"Trên 25%\" là chỉ tiêu XIII.",ref:"Mục II.3"},
{doc:"dh14",q:"Đóng góp của năng suất nhân tố tổng hợp (TFP) vào tăng trưởng giai đoạn 2026–2030:",opts:["Trên 55%","Khoảng 45%","Khoảng 47%","Trên 60%"],ans:0,ex:"45% là chỉ tiêu XIII; khoảng 47% là mức thực hiện 2021–2025.",ref:"Mục II.3"},
{doc:"dh14",q:"Tốc độ tăng năng suất lao động bình quân giai đoạn 2026–2030:",opts:["Khoảng 8,5%/năm","Trên 6,5%/năm","Khoảng 5,3%/năm","Khoảng 7%/năm"],ans:0,ex:"5,3% là mức thực hiện bình quân 2021–2025 (thấp hơn mục tiêu \"trên 6,5%\" của XIII).",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ lệ đô thị hóa theo chỉ tiêu Đại hội XIV:",opts:["Trên 50%","Khoảng 45%","Trên 55%","Khoảng 60%"],ans:0,ex:"45% là chỉ tiêu XIII và cũng là mức đạt năm 2025.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ số phát triển con người (HDI) mục tiêu giai đoạn 2026–2030:",opts:["Khoảng 0,8","Khoảng 0,766","Khoảng 0,75","Trên 0,85"],ans:0,ex:"0,766 là HDI đạt được theo Báo cáo chính trị.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ tiêu tuổi thọ trung bình tính từ lúc sinh giai đoạn 2026–2030:",opts:["Khoảng 75,5 tuổi, thời gian sống khỏe mạnh tối thiểu 68 năm","Khoảng 74,5 tuổi","Khoảng 74,8 tuổi, thời gian sống khỏe mạnh khoảng 67 năm","Khoảng 76 tuổi, thời gian sống khỏe mạnh tối thiểu 70 năm"],ans:0,ex:"74,5 là chỉ tiêu XIII; 74,8 tuổi và khoảng 67 năm sống khỏe là mức năm 2025.",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ lệ lao động nông nghiệp trong tổng lao động xã hội đến 2030 giảm xuống:",opts:["Dưới 20%","Khoảng 25%","Dưới 15%","Khoảng 22%"],ans:0,ex:"Khoảng 25% là chỉ tiêu XIII (2025).",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ lệ lao động qua đào tạo có bằng cấp, chứng chỉ theo chỉ tiêu Đại hội XIV:",opts:["35–40%","28–30%","70%","45–50%"],ans:0,ex:"Chỉ tiêu XIII \"70%\" là tỉ lệ lao động qua đào tạo nói chung.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ tiêu tỉ lệ che phủ rừng giai đoạn 2026–2030:",opts:["Duy trì mức 42%","Tăng lên 45%","Duy trì mức 40%","Đạt 43–44%"],ans:0,ex:"Cả Đại hội XIII và XIV đều giữ 42%.",ref:"Mục II.3"},
{doc:"dh14",q:"Mục tiêu về chỉ số hạnh phúc trong Nghị quyết Đại hội XIV:",opts:["Thuộc nhóm 40 quốc gia có chỉ số hạnh phúc cao nhất","Thuộc nhóm 30 quốc gia có chỉ số hạnh phúc cao nhất","Thuộc nhóm 50 quốc gia có chỉ số hạnh phúc cao nhất","Giữ vững vị trí 46/143"],ans:0,ex:"46/143 là thứ hạng năm 2025 theo Báo cáo chính trị.",ref:"Mục II.3"},
{doc:"dh14",q:"Diện tích các khu bảo tồn biển, ven biển đến 2030 đạt:",opts:["Tối thiểu 6% diện tích tự nhiên vùng biển quốc gia","Tối thiểu 3% diện tích tự nhiên vùng biển quốc gia","Tối thiểu 10% diện tích tự nhiên vùng biển quốc gia","Tối thiểu 5% diện tích tự nhiên vùng biển quốc gia"],ans:0,ex:"Chỉ tiêu thuộc nhóm \"Về môi trường\".",ref:"Mục II.3"},
{doc:"dh14",q:"Tỉ lệ huy động vào ngân sách nhà nước giai đoạn 2026–2030 theo Nghị quyết Đại hội XIV:",opts:["18% GDP","16% GDP","20% GDP","15% GDP"],ans:0,ex:"Đi kèm bội chi ngân sách khoảng 5% GDP.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ tiêu bội chi ngân sách nhà nước giai đoạn 2026–2030:",opts:["Khoảng 5% GDP","Khoảng 3% GDP","Khoảng 3,6% GDP","Khoảng 4% GDP"],ans:0,ex:"Thu ngân sách 18% GDP; bội chi khoảng 5% GDP.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ tiêu về phát thải khí nhà kính trong Nghị quyết Đại hội XIV:",opts:["Giảm 8–9%","Giảm 15%","Giảm 1–1,5%/năm","Giảm 5–6%"],ans:0,ex:"1–1,5%/năm là chỉ tiêu giảm tiêu hao năng lượng trên đơn vị GDP.",ref:"Mục II.3"},
{doc:"dh14",q:"Chỉ tiêu về tỉ lệ nghèo đa chiều giai đoạn 2026–2030:",opts:["Giảm 1–1,5 điểm %/năm","Giảm 2–3 điểm %/năm","Giảm 0,5 điểm %/năm","Dưới 1% vào năm 2030"],ans:0,ex:"Năm 2025 tỉ lệ nghèo đa chiều còn 1,3% (2022: 4,2%).",ref:"Mục II.3"},
{doc:"dh14",q:"Đột phá chiến lược thứ nhất trong Nghị quyết Đại hội XIV là:",opts:["Đột phá mạnh mẽ về thể chế phát triển, nâng cao năng lực hoạch định và tổ chức thực hiện chủ trương","Tập trung chuyển đổi cơ cấu và nâng cao chất lượng nguồn nhân lực","Hoàn thiện đồng bộ và đột phá mạnh mẽ trong xây dựng kết cấu hạ tầng","Đột phá về khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số"],ans:0,ex:"Ba đột phá: thể chế – nhân lực – hạ tầng. KHCN, ĐMST, CĐS là nhiệm vụ trọng tâm thứ tư và là động lực chính.",ref:"Các đột phá chiến lược"},
{doc:"dh14",q:"Nghị quyết Đại hội XIV xác định bao nhiêu nhiệm vụ trọng tâm trong nhiệm kỳ?",opts:["6","5","7","12"],ans:0,ex:"6 nhiệm vụ trọng tâm, 3 đột phá chiến lược, 12 định hướng phát triển, 5 quan điểm chỉ đạo.",ref:"Mục II.5"},
{doc:"dh14",q:"Nghị quyết Đại hội XIV nêu bao nhiêu định hướng phát triển đất nước giai đoạn 2026–2030?",opts:["12","10","15","6"],ans:0,ex:"15 là số vấn đề của Báo cáo chính trị; 6 là số nhiệm vụ trọng tâm.",ref:"Mục II.4"},
{doc:"dh14",q:"Nhiệm vụ trọng tâm thứ nhất trong nhiệm kỳ Đại hội XIV là:",opts:["Tập trung ưu tiên xây dựng đồng bộ thể chế phát triển, trọng tâm là hệ thống pháp luật, cơ chế, chính sách","Tiếp tục đẩy mạnh xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện","Đẩy mạnh phát triển nền kinh tế thị trường định hướng XHCN hiện đại, hội nhập quốc tế","Tập trung triển khai đột phá về khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số"],ans:0,ex:"Các phương án còn lại lần lượt là nhiệm vụ trọng tâm thứ 2, 3, 4.",ref:"Mục II.5"},
{doc:"dh14",q:"Theo Báo cáo chính trị, tăng trưởng kinh tế bình quân giai đoạn 2021–2025 đạt khoảng:",opts:["6,2%/năm","6,5–7%/năm","8,02%/năm","5,3%/năm"],ans:0,ex:"6,5–7% là mục tiêu XIII; 8,02% là tăng trưởng riêng năm 2025; 5,3% là tốc độ tăng năng suất lao động.",ref:"Báo cáo chính trị, phần I"},
{doc:"dh14",q:"Quy mô GDP năm 2025 theo Báo cáo chính trị Đại hội XIV:",opts:["Trên 514 tỉ USD, xếp thứ 32 thế giới","Trên 514 tỉ USD, xếp thứ 30 thế giới","Trên 476 tỉ USD, xếp thứ 34 thế giới","Khoảng 600 tỉ USD, xếp thứ 32 thế giới"],ans:0,ex:"Gấp 1,48 lần năm 2020.",ref:"Báo cáo chính trị, phần I"},
{doc:"dh14",q:"GDP bình quân đầu người năm 2025 theo Báo cáo chính trị:",opts:["5.026 USD","4.700 USD","8.500 USD","5.500 USD"],ans:0,ex:"Việt Nam gia nhập nhóm nước thu nhập trung bình cao; 8.500 USD là mục tiêu năm 2030.",ref:"Báo cáo chính trị, phần I"},
{doc:"dh14",q:"Theo Báo cáo chính trị, \"nguy cơ bao trùm\" đối với nước ta là:",opts:["Nguy cơ tụt hậu, nhất là về công nghệ và rơi vào bẫy thu nhập trung bình","Nguy cơ \"diễn biến hòa bình\" của các thế lực thù địch","Nguy cơ chệch hướng xã hội chủ nghĩa","Nguy cơ suy thoái về tư tưởng chính trị trong một bộ phận cán bộ"],ans:0,ex:"Phần dự báo tình hình trong nước của Báo cáo chính trị.",ref:"Báo cáo chính trị, phần II.1"},
{doc:"dh14",q:"Bài học kinh nghiệm thứ ba sau 40 năm đổi mới theo Báo cáo chính trị Đại hội XIV là:",opts:["Quán triệt sâu sắc và thực hành triệt để quan điểm \"Dân là gốc\"","Kiên định, vận dụng và phát triển sáng tạo chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh","Bám sát thực tiễn, nắm chắc và dự báo đúng tình hình","Không ngừng đổi mới tư duy, nhất là tư duy chiến lược"],ans:0,ex:"Các phương án còn lại lần lượt là bài học thứ nhất, thứ tư, thứ năm.",ref:"Báo cáo chính trị, phần I.3"},
{doc:"dh14",q:"Trong Báo cáo về các văn kiện, Tổng Bí thư Tô Lâm gọi nội dung nào là \"điểm nghẽn của điểm nghẽn\" nhưng cũng là \"đột phá của đột phá\"?",opts:["Thể chế","Nguồn nhân lực","Kết cấu hạ tầng","Công tác cán bộ"],ans:0,ex:"Trùng với đột phá chiến lược thứ nhất (thể chế) và nhiệm vụ trọng tâm thứ nhất.",ref:"Báo cáo về các văn kiện, 20/1"},

ESSAY.push(
{doc:"dh14",q:"Trình bày chủ đề, phương châm và những điểm mới nổi bật trong các văn kiện Đại hội XIV của Đảng. Liên hệ trách nhiệm của biên tập viên Nhà xuất bản Chính trị quốc gia Sự thật trong việc xuất bản, tuyên truyền văn kiện Đại hội.",outline:[
"Mở bài: Đại hội XIV (19–23/01/2026, Trung tâm Hội nghị Quốc gia; 1.586 đại biểu, hơn 5,6 triệu đảng viên); \"mốc son mới\", mở đầu kỷ nguyên vươn mình.",
"Chủ đề: phân tích ba vế – (i) chung sức, đồng lòng thực hiện mục tiêu đến 2030; (ii) tự chủ chiến lược, tự cường, tự tin, tiến mạnh trong kỷ nguyên vươn mình; (iii) vì hòa bình, độc lập, dân chủ, giàu mạnh, phồn vinh, văn minh, hạnh phúc, vững bước đi lên CNXH. Phương châm: chữ \"Đột phá\" thay \"Sáng tạo\".",
"Điểm mới về phương pháp: Báo cáo chính trị tích hợp 3 báo cáo, 15 vấn đề; lần đầu có Chương trình hành động (chủ thể, lộ trình, nguồn lực, đích đến); không sửa Điều lệ.",
"Điểm mới về nội dung: lý luận về đường lối đổi mới là bộ phận nền tảng tư tưởng; bảo vệ môi trường vào nhiệm vụ trung tâm; văn hóa, con người là nền tảng; đối ngoại cùng QP-AN là trọng yếu, thường xuyên; KHCN, ĐMST, CĐS là động lực chính; kinh tế tư nhân một động lực quan trọng nhất; tăng trưởng từ 10%/năm.",
"Liên hệ biên tập viên NXB CTQG Sự thật: bảo đảm chính xác tuyệt đối văn bản gốc (đối chiếu bản chính thức, thống nhất con số, chữ viết hoa, trích dẫn); quy trình biên tập, đọc duyệt nhiều vòng; tham gia bộ sách Văn kiện (2 tập, 823 trang, 10 văn kiện) và các ấn phẩm hỏi – đáp, tập bài nói, thuật ngữ phục vụ học tập Nghị quyết.",
"Liên hệ thêm: xuất bản điện tử, sách nói, đa phương tiện để văn kiện \"thực sự đi vào cuộc sống\"; cảnh giác với xuyên tạc văn kiện trên không gian mạng (gắn Chỉ thị 05-CT/TW, Chỉ thị 04-CT/TW về xuất bản).",
"Kết luận: biên tập viên là người \"giữ cửa\" tư tưởng; tự học, nâng bản lĩnh chính trị và năng lực chuyên môn."]},
{doc:"dh14",q:"Phân tích hệ quan điểm chỉ đạo của Đại hội XIV, đặc biệt mối quan hệ \"trung tâm – then chốt – nền tảng – trọng yếu, thường xuyên\". So sánh với Đại hội XIII.",outline:[
"Nêu 5 quan điểm: (1) kiên định nền tảng tư tưởng (thêm lý luận về đường lối đổi mới), tự chủ chiến lược, lấy phát triển để ổn định; (2) công thức trung tâm – then chốt – nền tảng – trọng yếu; (3) khơi dậy khát vọng, văn hóa con người là nguồn lực nội sinh, KHCN là động lực chính, kinh tế nhà nước chủ đạo, tư nhân một động lực quan trọng nhất; (4) bảo vệ Tổ quốc từ sớm, từ xa, lợi ích quốc gia – dân tộc cao nhất; (5) xây dựng, chỉnh đốn Đảng, hệ thống chính trị.",
"Phân tích công thức XIV: phát triển KT, XH, bảo vệ môi trường là trung tâm; xây dựng Đảng là then chốt; văn hóa, con người là nền tảng; QP-AN và đối ngoại, hội nhập là trọng yếu, thường xuyên.",
"So sánh XIII: kinh tế – xã hội là trung tâm; văn hóa là nền tảng tinh thần; chỉ QP-AN là trọng yếu, thường xuyên. Ba bổ sung: môi trường, con người, đối ngoại – lý do (biến đổi khí hậu, ngập lụt, ô nhiễm; con người là chủ thể; vị thế quốc tế mới).",
"Mối quan hệ biện chứng: không tách rời, phát triển là trung tâm nhưng Đảng là then chốt quyết định; nền tảng văn hóa, con người tạo sức mạnh nội sinh.",
"Liên hệ ngành xuất bản: sách là công cụ phát triển văn hóa, con người (nền tảng); xuất bản sách lý luận chính trị góp phần xây dựng Đảng (then chốt) và bảo vệ nền tảng tư tưởng."]},
{doc:"dh14",q:"Trình bày mục tiêu phát triển đến năm 2030, tầm nhìn đến năm 2045 và các chỉ tiêu chủ yếu giai đoạn 2026–2030 theo Nghị quyết Đại hội XIV. Căn cứ kết quả 2021–2025, phân tích cơ sở và thách thức thực hiện.",outline:[
"Mục tiêu: giữ vững hòa bình, ổn định; phát triển nhanh, bền vững; tự chủ chiến lược, tiến mạnh trong kỷ nguyên mới; 2030 nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao; 2045 nước phát triển, thu nhập cao (hai mốc 100 năm).",
"Chỉ tiêu kinh tế: GDP từ 10%/năm; 8.500 USD/người; CN chế biến, chế tạo ~28%; kinh tế số ~30%; TFP >55%; năng suất lao động ~8,5%/năm; đô thị hóa >50%; thu ngân sách 18% GDP, bội chi ~5% GDP.",
"Chỉ tiêu xã hội và môi trường: HDI ~0,8; tuổi thọ ~75,5 (sống khỏe ≥68 năm); lao động nông nghiệp <20%; lao động có bằng cấp, chứng chỉ 35–40%; nhóm 40 nước hạnh phúc nhất; rừng 42%; nước thải 65–70%; giảm phát thải 8–9%; bảo tồn biển ≥6%.",
"Cơ sở: 2021–2025 tăng trưởng ~6,2%/năm; 2025 tăng 8,02%; GDP >514 tỉ USD, thứ 32; GDP/người 5.026 USD; HDI 0,766; nghèo đa chiều 1,3%; bộ máy tinh gọn, chính quyền địa phương 2 cấp.",
"Thách thức: năng suất lao động mới tăng 5,3%/năm, ICOR 6,4; thể chế kinh tế thị trường hoàn thiện chậm; nguy cơ tụt hậu và bẫy thu nhập trung bình; già hóa dân số nhanh.",
"Giải pháp: 3 đột phá, mô hình tăng trưởng mới dựa vào KHCN, ĐMST, CĐS; Chương trình hành động với 30 chỉ tiêu, 272 nhiệm vụ. Liên hệ: NXB góp phần nâng tỉ trọng kinh tế số qua xuất bản điện tử, nâng chất lượng nguồn nhân lực qua sách tri thức."]},
{doc:"dh14",q:"Phân tích ba đột phá chiến lược và sáu nhiệm vụ trọng tâm của nhiệm kỳ Đại hội XIV. Vì sao thể chế được xác định là \"điểm nghẽn của điểm nghẽn\" nhưng cũng là \"đột phá của đột phá\"? Liên hệ lĩnh vực xuất bản.",outline:[
"Ba đột phá: thể chế phát triển (nâng năng lực hoạch định và tổ chức thực hiện, phân cấp, phân quyền); nguồn nhân lực (chuyển đổi cơ cấu, chất lượng cao, nhân tài, \"có vào, có ra\", \"có lên, có xuống\"); hạ tầng (đa phương thức, số, xanh, năng lượng, thích ứng khí hậu). So với XIII: giữ 3 trụ cột nhưng nhấn \"đột phá mạnh mẽ\".",
"Sáu nhiệm vụ trọng tâm: thể chế; xây dựng Đảng; kinh tế thị trường hiện đại; KHCN, ĐMST, CĐS; nguồn lực con người và văn hóa; Quân đội, Công an.",
"Thể chế là điểm nghẽn: chồng chéo, tư duy quản lý cũ, \"nhiều chủ trương đúng nhưng tổ chức thực hiện chưa đạt yêu cầu\"; là đột phá vì khơi thông nguồn lực, tạo hệ sinh thái phát triển mới (gắn NQ 66-NQ/TW).",
"Liên hệ xuất bản: hoàn thiện pháp luật xuất bản, phân cấp cấp phép; nhân lực biên tập số; hạ tầng số cho sách điện tử; phát hiện, đề xuất sửa quy trình nội bộ chồng chéo tại đơn vị.",
"Trách nhiệm cá nhân: chủ động đề xuất sáng kiến, làm việc theo kết quả đầu ra, chấp hành kỷ luật, kỷ cương."]},
{doc:"dh14",q:"Trình bày đánh giá của Đại hội XIV về 40 năm đổi mới và 5 bài học kinh nghiệm. Phân tích ý nghĩa của bài học \"Dân là gốc\" đối với hoạt động xuất bản sách chính trị.",outline:[
"Đánh giá: đổi mới \"là sự lựa chọn mang tính lịch sử\"; thành tựu \"to lớn, có ý nghĩa lịch sử\"; cơ đồ, tiềm lực, vị thế, uy tín quốc tế \"được nâng lên một tầm cao mới\"; mở ra kỷ nguyên mới.",
"Số liệu minh họa 2021–2025: GDP >514 tỉ USD (thứ 32), 5.026 USD/người, HDI 0,766, hạnh phúc 46/143, nghèo đa chiều 1,3%, BHYT 95,2%; sắp xếp bộ máy \"sắp xếp lại giang sơn\".",
"Năm bài học: kiên định nền tảng tư tưởng; tăng cường lãnh đạo, cầm quyền, sức chiến đấu của Đảng; Dân là gốc; bám sát thực tiễn, phản ứng chính sách kịp thời; đổi mới tư duy chiến lược, tôn trọng quy luật khách quan.",
"\"Dân là gốc\": Nhân dân là trung tâm, chủ thể, mục tiêu, động lực, nguồn lực của phát triển; \"hiệu quả phục vụ Nhân dân là thước đo năng lực lãnh đạo\".",
"Liên hệ xuất bản: sách chính trị viết dễ hiểu, gần dân; khảo sát nhu cầu bạn đọc; phát hành sách về cơ sở, vùng sâu, vùng xa; sách hỏi – đáp, sách điện tử miễn phí; tiếp nhận phản hồi bạn đọc."]},
{doc:"dh14",q:"\"Tổ chức thực hiện là khâu yếu.\" Phân tích điểm mới về Chương trình hành động trong văn kiện Đại hội XIV và trách nhiệm của viên chức, biên tập viên trong việc đưa Nghị quyết vào cuộc sống.",outline:[
"Thực trạng: Báo cáo về các văn kiện thừa nhận \"Điểm yếu lớn nhất ... nhiều chủ trương đúng nhưng tổ chức thực hiện chưa đạt yêu cầu\"; diễn văn bế mạc: \"tổ chức thực hiện là khâu yếu\".",
"Điểm mới: lần đầu Chương trình hành động là bộ phận cấu thành Báo cáo chính trị; 12 nhóm nhiệm vụ, 6 nhiệm vụ trọng tâm, 3 đột phá; 30 chỉ tiêu cả nước, 38 chỉ tiêu ngành, địa phương, 272 nhiệm vụ, đề án; 18 luật trong 2026; nguyên tắc rõ người, rõ việc, rõ thời gian, rõ trách nhiệm, rõ thẩm quyền, rõ kết quả.",
"Triển khai sau Đại hội: Hội nghị toàn quốc 07/02/2026; Hội nghị TW 2 (quy chế, quy định, chương trình toàn khóa), TW 3 (13 nội dung, sơ kết chính quyền địa phương 2 cấp); thông điệp \"biến tốc độ ban hành thành tốc độ thực hiện\".",
"Trách nhiệm viên chức, biên tập viên: học tập, quán triệt; xây dựng kế hoạch cá nhân gắn chỉ tiêu đơn vị; bảo đảm tiến độ, chất lượng xuất bản sách phục vụ Nghị quyết; ứng dụng chuyển đổi số; chịu đánh giá theo kết quả, sản phẩm.",
"Kết luận: \"biến ý chí thành hành động, biến quyết sách thành kết quả cụ thể\"."]}
);

/* ===== Các kỳ Đại hội I–XIV, Cương lĩnh, Đại hội XIII, Đại hội XI–XII ===== */
DOCS.push({id:"lsdh",group:"congress",short:"Các kỳ Đại hội I–XIV",mmLabel:"Các kỳ Đại hội Đảng I–XIV (1935–2026)",so:"I–XIV",
title:"Đảng Cộng sản Việt Nam qua 14 kỳ Đại hội đại biểu toàn quốc (1935–2026) và các mốc lịch sử",
meta:[["Phạm vi","14 kỳ Đại hội: I (3/1935) đến XIV (1/2026)"],["Tên Đảng","Đảng Cộng sản Việt Nam (2/1930) → Đảng Cộng sản Đông Dương (10/1930) → Đảng Lao động Việt Nam (Đại hội II, 1951) → Đảng Cộng sản Việt Nam (Đại hội IV, 1976)"],["Đại hội họp ở nước ngoài","Chỉ Đại hội I (Ma Cao, Trung Quốc)"],["Đại hội họp ở chiến khu","Đại hội II (Chiêm Hóa, Tuyên Quang)"],["Từ Đại hội III (1960)","Đều họp tại Hà Nội"],["Nguồn chính","Tư liệu văn kiện Đảng (tulieuvankien.dangcongsan.vn)"]],
tldr:`Đến năm 2026 Đảng đã tiến hành <mark>14 kỳ Đại hội</mark>. Đại hội I (<mark>27–31/3/1935</mark>) họp ở <b>Ma Cao</b>, 13 đại biểu, bầu Tổng Bí thư <b>Lê Hồng Phong</b>. Đại hội II (<mark>2/1951</mark>, Chiêm Hóa, Tuyên Quang) đưa Đảng ra hoạt động công khai với tên <b>Đảng Lao động Việt Nam</b>. Đại hội III (<mark>9/1960</mark>) đề ra đường lối cách mạng hai miền và lấy ngày <b>3/2</b> làm ngày kỷ niệm thành lập Đảng. Đại hội IV (<mark>12/1976</mark>) đổi tên thành <b>Đảng Cộng sản Việt Nam</b>. Đại hội VI (<mark>12/1986</mark>) khởi xướng <b>đổi mới</b>; Đại hội VII (<mark>6/1991</mark>) thông qua <b>Cương lĩnh 1991</b>; Đại hội XI (<mark>1/2011</mark>) thông qua <b>Cương lĩnh bổ sung, phát triển năm 2011</b>. Số đại biểu: XII <mark>1.510</mark>, XIII <mark>1.587</mark>, XIV <mark>1.586</mark>.`,
sections:[
{h:"Bảng tổng hợp 14 kỳ Đại hội",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Đại hội</th><th>Thời gian – địa điểm</th><th>Đại biểu (đảng viên)</th><th>BCH TW</th><th>Người đứng đầu được bầu</th><th>Tên Đảng</th><th>Dấu ấn</th></tr></thead><tbody>
<tr><td><b>I</b></td><td>27–31/3/1935, phố Quan Công, Ma Cao (Trung Quốc)</td><td>13 (khoảng 500 đảng viên)</td><td>13 (9 chính thức, 4 dự khuyết)</td><td>Tổng Bí thư Lê Hồng Phong</td><td>Đảng Cộng sản Đông Dương</td><td>Nghị quyết chính trị, Điều lệ Đảng; 3 nhiệm vụ: củng cố, phát triển Đảng; tranh thủ quần chúng; chống chiến tranh đế quốc. Cử Nguyễn Ái Quốc làm đại biểu của Đảng bên cạnh Quốc tế Cộng sản</td></tr>
<tr><td><b>II</b></td><td>11–19/2/1951, xã Vinh Quang (nay là Kim Bình), Chiêm Hóa, Tuyên Quang</td><td>158 chính thức, 53 dự khuyết (766.349)</td><td>19 + 10; BCT 7 + 1</td><td>Chủ tịch Đảng Hồ Chí Minh; Tổng Bí thư Trường Chinh</td><td>Đảng Lao động Việt Nam</td><td>Đảng ra hoạt động công khai; mỗi nước Việt Nam, Lào, Campuchia xây dựng một đảng riêng; Chính cương, Tuyên ngôn, Điều lệ Đảng Lao động Việt Nam; báo cáo "Bàn về cách mạng Việt Nam" (Trường Chinh)</td></tr>
<tr><td><b>III</b></td><td>5–10/9/1960, Hà Nội</td><td>525 chính thức, 51 dự khuyết (hơn 500.000)</td><td>47 + 31; BCT 11 + 2</td><td>Chủ tịch Đảng Hồ Chí Minh; Bí thư thứ nhất Lê Duẩn</td><td>Đảng Lao động Việt Nam</td><td>Hai chiến lược cách mạng: cách mạng XHCN ở miền Bắc, cách mạng dân tộc dân chủ nhân dân ở miền Nam; Kế hoạch 5 năm lần thứ nhất (1961–1965); lấy ngày 3/2 làm ngày kỷ niệm thành lập Đảng</td></tr>
<tr><td><b>IV</b></td><td>14–20/12/1976, Hà Nội</td><td>1.008 (hơn 1.550.000)</td><td>101 + 32; BCT 14 + 3</td><td>Tổng Bí thư Lê Duẩn</td><td>Đổi tên thành Đảng Cộng sản Việt Nam</td><td>Đường lối chung cách mạng XHCN; dùng lại chức danh Tổng Bí thư thay "Bí thư thứ nhất"; Kế hoạch 5 năm 1976–1980</td></tr>
<tr><td><b>V</b></td><td>27–31/3/1982, Hà Nội</td><td>1.033 (1.727.000)</td><td>116 + 36; BCT 13 + 2</td><td>Tổng Bí thư Lê Duẩn</td><td>Đảng Cộng sản Việt Nam</td><td>Hai nhiệm vụ chiến lược: xây dựng thành công CNXH và sẵn sàng chiến đấu, bảo vệ vững chắc Tổ quốc Việt Nam XHCN; phương hướng KT-XH 1981–1985</td></tr>
<tr><td><b>VI</b></td><td>15–18/12/1986, Hà Nội</td><td>1.129 (gần 1,9 triệu)</td><td>124 + 49</td><td>Tổng Bí thư Nguyễn Văn Linh; Cố vấn BCH TW: Trường Chinh, Phạm Văn Đồng, Lê Đức Thọ</td><td>Đảng Cộng sản Việt Nam</td><td>Khởi xướng đường lối đổi mới, bắt đầu từ đổi mới tư duy, trước hết là tư duy kinh tế; 4 bài học (có "lấy dân làm gốc"); 3 chương trình kinh tế</td></tr>
<tr><td><b>VII</b></td><td>24–27/6/1991, Hội trường Ba Đình, Hà Nội</td><td>1.176 (2.155.022)</td><td>146; BCT 13</td><td>Tổng Bí thư Đỗ Mười</td><td>Đảng Cộng sản Việt Nam</td><td>Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH; Chiến lược ổn định và phát triển KT-XH đến năm 2000; lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng</td></tr>
<tr><td><b>VIII</b></td><td>28/6–1/7/1996, Hội trường Ba Đình, Hà Nội</td><td>1.198 (gần 2.130.000)</td><td>170</td><td>Tổng Bí thư Đỗ Mười (12/1997, Hội nghị TW 4: Lê Khả Phiêu)</td><td>Đảng Cộng sản Việt Nam</td><td>Nước ta đã ra khỏi khủng hoảng KT-XH, chuyển sang thời kỳ đẩy mạnh CNH, HĐH; phấn đấu đến 2020 cơ bản trở thành nước công nghiệp</td></tr>
<tr><td><b>IX</b></td><td>19–22/4/2001, Hà Nội</td><td>1.168 (2.479.719)</td><td>150; BCT 13</td><td>Tổng Bí thư Nông Đức Mạnh</td><td>Đảng Cộng sản Việt Nam</td><td>Kinh tế thị trường định hướng XHCN là mô hình kinh tế tổng quát; Chiến lược KT-XH 2001–2010; kinh tế tư bản tư nhân được khuyến khích phát triển không hạn chế về quy mô (trong ngành nghề luật không cấm)</td></tr>
<tr><td><b>X</b></td><td>18–25/4/2006, Hà Nội</td><td>1.176 (hơn 3,1 triệu)</td><td>160 + 21; BCT 14</td><td>Tổng Bí thư Nông Đức Mạnh</td><td>Đảng Cộng sản Việt Nam</td><td>Tổng kết 20 năm đổi mới; mục tiêu sớm đưa nước ta ra khỏi tình trạng kém phát triển; chính thức nêu vấn đề đảng viên làm kinh tế tư nhân</td></tr>
<tr><td><b>XI</b></td><td>12–19/1/2011, Trung tâm Hội nghị quốc gia (Mỹ Đình), Hà Nội</td><td>1.377 (hơn 3,6 triệu)</td><td>175 + 25; BCT 14</td><td>Tổng Bí thư Nguyễn Phú Trọng</td><td>Đảng Cộng sản Việt Nam</td><td>Cương lĩnh (bổ sung, phát triển năm 2011); Chiến lược KT-XH 2011–2020 với 3 đột phá chiến lược; Điều lệ bổ sung, sửa đổi</td></tr>
<tr><td><b>XII</b></td><td>20–28/1/2016, Hà Nội</td><td>1.510 (hơn 4,5 triệu)</td><td>180 + 20</td><td>Tổng Bí thư Nguyễn Phú Trọng (tái cử)</td><td>Đảng Cộng sản Việt Nam</td><td>Tổng kết 30 năm đổi mới; 6 nhiệm vụ trọng tâm; không sửa đổi Điều lệ</td></tr>
<tr><td><b>XIII</b></td><td>25/1–1/2/2021 (khai mạc 26/1), Trung tâm Hội nghị quốc gia, Hà Nội</td><td>1.587 (gần 5,2 triệu)</td><td>180 + 20; BCT 18</td><td>Tổng Bí thư Nguyễn Phú Trọng (tái cử); từ 3/8/2024: Tô Lâm</td><td>Đảng Cộng sản Việt Nam</td><td>Khơi dậy khát vọng phát triển đất nước; mốc 2025 – 2030 – 2045; Chiến lược KT-XH 2021–2030; 6 nhiệm vụ trọng tâm, 3 đột phá, 12 định hướng</td></tr>
<tr><td><b>XIV</b></td><td>19–23/1/2026 (khai mạc 20/1), Trung tâm Hội nghị quốc gia, Hà Nội</td><td>1.586 (hơn 5,6 triệu)</td><td>180 + 20; BCT 19</td><td>Tổng Bí thư Tô Lâm</td><td>Đảng Cộng sản Việt Nam</td><td>Kỷ nguyên vươn mình; 3 đột phá: thể chế và thực thi; nhân lực chất lượng cao gắn với KHCN, đổi mới sáng tạo; hạ tầng đồng bộ, hiện đại (xem mục Đại hội XIV)</td></tr>
</tbody></table></div>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Đại hội I: Nghị quyết chính trị ghi "ngày 27 – 31/3/1935"; bài giới thiệu trên tulieuvankien ghi "từ ngày 28 đến 31-3-1935". Số đảng viên Đại hội I lấy theo Tạp chí Quản lý nhà nước.</p>`},
{h:"Các mốc ngoài Đại hội cần nhớ",items:[
"<b>Hội nghị thành lập Đảng</b>: tại bán đảo Cửu Long (Hương Cảng, Trung Quốc), do <b>Nguyễn Ái Quốc</b> chủ trì thay mặt Quốc tế Cộng sản; tài liệu hiện hành ghi họp <b>từ 6/1 đến 7/2/1930</b> (một số tài liệu ghi 3–7/2/1930). Hợp nhất <b>Đông Dương Cộng sản Đảng, An Nam Cộng sản Đảng, Đông Dương Cộng sản Liên đoàn</b> thành <b>Đảng Cộng sản Việt Nam</b>; thông qua Chánh cương vắn tắt, Sách lược vắn tắt (Cương lĩnh chính trị đầu tiên), Chương trình tóm tắt, Điều lệ vắn tắt, Lời kêu gọi.",
"<b>Hội nghị lần thứ nhất BCH TW lâm thời</b>: <b>14–31/10/1930</b>, Hương Cảng; thông qua <b>Luận cương chính trị</b> do <b>Trần Phú</b> khởi thảo; đổi tên thành <b>Đảng Cộng sản Đông Dương</b>; Trần Phú là Tổng Bí thư đầu tiên (10/1930 – 4/1931), mất ngày 6/9/1931.",
"<b>Đại hội III (9/1960)</b> quyết nghị lấy <b>ngày 3/2 dương lịch</b> hằng năm làm Ngày kỷ niệm thành lập Đảng.",
"<b>Hội nghị đại biểu toàn quốc giữa nhiệm kỳ</b> (khóa VII): 20–25/1/1994, Hà Nội – không phải là một kỳ Đại hội.",
"<b>12/1997</b>: Hội nghị TW 4 khóa VIII bầu <b>Lê Khả Phiêu</b> làm Tổng Bí thư thay Đỗ Mười.",
"<b>19/7/2024</b>: Tổng Bí thư Nguyễn Phú Trọng từ trần; <b>3/8/2024</b>: BCH TW khóa XIII bầu <b>Tô Lâm</b> làm Tổng Bí thư; Đại hội XIV (1/2026) bầu lại Tô Lâm."]},
{h:"Tên Đảng và chức danh người đứng đầu",items:[
"<b>Ba lần đổi tên:</b> Đảng Cộng sản Việt Nam (2/1930) → <b>Đảng Cộng sản Đông Dương</b> (Hội nghị TW lần thứ nhất, 10/1930) → <b>Đảng Lao động Việt Nam</b> (Đại hội II, 2/1951) → <b>Đảng Cộng sản Việt Nam</b> (Đại hội IV, 12/1976).",
"Đổi tên năm 10/1930 diễn ra tại <b>Hội nghị Trung ương</b>, không phải tại Đại hội; các lần 1951 và 1976 diễn ra tại <b>Đại hội</b>.",
"<b>Chủ tịch Đảng</b>: Hồ Chí Minh, được bầu tại Đại hội II và bầu lại tại Đại hội III.",
"<b>Bí thư thứ nhất</b>: Lê Duẩn, tại Đại hội III (1960). Đại hội IV (1976) dùng lại chức danh <b>Tổng Bí thư</b>.",
"Các Tổng Bí thư được Đại hội (hoặc Hội nghị TW 1 ngay sau Đại hội) bầu: Lê Hồng Phong (I), Trường Chinh (II), Lê Duẩn (IV, V), Nguyễn Văn Linh (VI), Đỗ Mười (VII, VIII), Nông Đức Mạnh (IX, X), Nguyễn Phú Trọng (XI, XII, XIII), Tô Lâm (XIV)."]},
{h:"Những Đại hội mang tính bước ngoặt",items:[
"<b>Đại hội II (1951)</b>: Đảng ra hoạt động công khai; đường lối cách mạng dân tộc dân chủ nhân dân trong báo cáo \"Bàn về cách mạng Việt Nam\".",
"<b>Đại hội III (1960)</b>: cách mạng XHCN ở miền Bắc là \"nhiệm vụ quyết định nhất đối với sự phát triển của toàn bộ cách mạng nước ta\"; cách mạng ở miền Nam \"có tác dụng quyết định trực tiếp đối với sự nghiệp giải phóng miền Nam\".",
"<b>Đại hội VI (1986)</b>: tinh thần <b>\"nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật\"</b>; đổi mới toàn diện, bắt đầu từ đổi mới tư duy, trước hết là tư duy kinh tế; 3 chương trình kinh tế: lương thực – thực phẩm, hàng tiêu dùng, hàng xuất khẩu.",
"<b>Đại hội VII (1991)</b>: Cương lĩnh 1991; tư tưởng Hồ Chí Minh cùng chủ nghĩa Mác – Lênin là nền tảng tư tưởng, kim chỉ nam cho hành động.",
"<b>Đại hội VIII (1996)</b>: ra khỏi khủng hoảng KT-XH, chuyển sang <b>thời kỳ đẩy mạnh CNH, HĐH</b>.",
"<b>Đại hội IX (2001)</b>: <b>kinh tế thị trường định hướng XHCN</b> là mô hình kinh tế tổng quát; động lực chủ yếu là đại đoàn kết toàn dân trên cơ sở liên minh công nhân – nông dân – trí thức.",
"<b>Đại hội XI (2011)</b>: Cương lĩnh bổ sung, phát triển năm 2011; Chiến lược 2011–2020.",
"<b>Đại hội XIII (2021)</b>: tầm nhìn 2045 – nước phát triển, thu nhập cao."]},
{h:"So sánh số liệu thường bị hỏi",items:[
"Đại biểu: I – <b>13</b>; IV – <b>1.008</b> (lần đầu vượt 1.000); XI – <b>1.377</b>; XII – <b>1.510</b> (nhiều nhất trong 12 kỳ đến lúc đó); XIII – <b>1.587</b> (tăng 77 so với XII); XIV – <b>1.586</b>.",
"Đảng viên được đại diện: II – 766.349; VII – 2.155.022; IX – 2.479.719; XI – hơn 3,6 triệu; XII – hơn 4,5 triệu; XIII – gần 5,2 triệu; XIV – hơn 5,6 triệu.",
"BCH TW <b>180 chính thức + 20 dự khuyết</b> ở các khóa XII, XIII, XIV; khóa XI: 175 + 25; khóa X: 160 + 21.",
"Bộ Chính trị: khóa XIII <b>18</b>; khóa XIV <b>19</b>.",
"Đại hội XIII kết thúc sớm gần 2 ngày so với kế hoạch (7 ngày làm việc); Đại hội XIV kết thúc sớm 1,5 ngày (5 ngày làm việc)."]},
{h:"Mẹo nhớ",items:[
"<b>Địa điểm:</b> I ở <b>Ma Cao</b> – II ở <b>Tuyên Quang</b> – từ III đến XIV ở <b>Hà Nội</b>.",
"<b>Tên Đảng:</b> \"30 Việt Nam – 30 Đông Dương – 51 Lao động – 76 Cộng sản Việt Nam\".",
"<b>Bước ngoặt:</b> VI đổi mới – VII Cương lĩnh 1991 – VIII CNH, HĐH – IX kinh tế thị trường định hướng XHCN – XI Cương lĩnh 2011.",

DOCS.push({id:"cuongling",group:"congress",short:"Cương lĩnh 1930 · Luận cương · Cương lĩnh 1991, 2011",mmLabel:"Cương lĩnh của Đảng (1930, 1991, 2011)",so:"1930·1991·2011",
title:"Các cương lĩnh chính trị của Đảng: Cương lĩnh đầu tiên (1930), Luận cương chính trị (10/1930), Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (1991) và Cương lĩnh bổ sung, phát triển năm 2011",
meta:[["Cương lĩnh đầu tiên","Hội nghị thành lập Đảng, đầu năm 1930, Cửu Long (Hương Cảng); Nguyễn Ái Quốc soạn thảo, chủ trì"],["Luận cương chính trị","Hội nghị lần thứ nhất BCH TW lâm thời, 14–31/10/1930, Hương Cảng; Trần Phú khởi thảo"],["Cương lĩnh 1991","Đại hội VII (24–27/6/1991): \"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội\""],["Cương lĩnh 2011","Đại hội XI (12–19/1/2011): \"... (bổ sung, phát triển năm 2011)\""],["Con số cốt lõi","1991: 6 đặc trưng, 7 phương hướng, 5 bài học. 2011: 8 đặc trưng, 8 phương hướng, 8 mối quan hệ lớn, 5 bài học"],["Bố cục 1991 và 2011","4 phần: I. Quá trình cách mạng và bài học – II. Quá độ lên CNXH – III. Định hướng lớn về kinh tế, văn hóa, xã hội, quốc phòng, an ninh, đối ngoại – IV. Hệ thống chính trị và vai trò lãnh đạo của Đảng"]],
tldr:`<b>Cương lĩnh chính trị đầu tiên</b> gồm <b>Chánh cương vắn tắt, Sách lược vắn tắt</b> do Nguyễn Ái Quốc soạn thảo, thông qua tại Hội nghị thành lập Đảng đầu năm <mark>1930</mark>. <b>Luận cương chính trị</b> (<mark>10/1930</mark>) do <b>Trần Phú</b> khởi thảo, kèm việc đổi tên thành Đảng Cộng sản Đông Dương. <b>Cương lĩnh 1991</b> (Đại hội VII) nêu <mark>6 đặc trưng</mark>, <mark>7 phương hướng cơ bản</mark>. <b>Cương lĩnh 2011</b> (Đại hội XI) nêu <mark>8 đặc trưng</mark>, <mark>8 phương hướng</mark>, <mark>8 mối quan hệ lớn</mark>; Đại hội XII nâng lên <mark>9</mark>, Đại hội XIII nêu <mark>10</mark> mối quan hệ lớn. Cả hai Cương lĩnh 1991 và 2011 đều có <b>5 bài học</b>.`,
sections:[
{h:"Cương lĩnh chính trị đầu tiên (đầu năm 1930)",items:[
"<b>Hoàn cảnh:</b> Hội nghị hợp nhất các tổ chức cộng sản họp tại bán đảo Cửu Long (Hương Cảng, Trung Quốc), do <b>Nguyễn Ái Quốc</b> chủ trì thay mặt Quốc tế Cộng sản; hợp nhất Đông Dương Cộng sản Đảng, An Nam Cộng sản Đảng, Đông Dương Cộng sản Liên đoàn thành <b>Đảng Cộng sản Việt Nam</b>.",
"<b>Văn kiện:</b> Chánh cương vắn tắt, Sách lược vắn tắt (phản ánh nội dung Cương lĩnh chính trị đầu tiên), Chương trình tóm tắt, Điều lệ vắn tắt và Lời kêu gọi.",
"<b>Phương hướng chiến lược:</b> làm <b>tư sản dân quyền cách mạng và thổ địa cách mạng</b> để đi tới xã hội cộng sản (tiến lên chủ nghĩa cộng sản mà giai đoạn đầu là CNXH).",
"<b>Nhiệm vụ:</b> chống đế quốc và phong kiến, làm cho nước Việt Nam <b>hoàn toàn độc lập</b> (đặt lên hàng đầu), người cày có ruộng; về xã hội: dân chúng được tự do, nam nữ bình quyền, phổ thông giáo dục.",
"<b>Lực lượng:</b> \"vô sản giai cấp và nông dân là hai động lực chánh\", giai cấp công nhân lãnh đạo; thu phục tiểu tư sản, trí thức, trung nông; lợi dụng hoặc trung lập phú nông, trung, tiểu địa chủ.",
"<b>Lãnh đạo:</b> \"Đảng là đội tiên phong của vô sản giai cấp\". <b>Phương pháp:</b> bạo lực cách mạng của quần chúng, không thỏa hiệp. <b>Quốc tế:</b> cách mạng Việt Nam là bộ phận của cách mạng thế giới, liên lạc với các dân tộc bị áp bức và vô sản giai cấp thế giới.",
"<b>Ngày kỷ niệm 3/2</b> do <b>Đại hội III (1960)</b> quyết định."]},
{h:"Luận cương chính trị (10/1930)",items:[
"<b>Hội nghị:</b> Hội nghị lần thứ nhất BCH TW lâm thời, <b>14–31/10/1930</b>, Hương Cảng. Thông qua Luận cương do <b>Trần Phú</b> khởi thảo (được giao từ 7/1930); đổi tên Đảng thành <b>Đảng Cộng sản Đông Dương</b>; Trần Phú là Tổng Bí thư (10/1930 – 4/1931).",
"<b>Tính chất cách mạng:</b> cách mạng tư sản dân quyền, sau đó tiến lên cách mạng XHCN.",
"<b>Nhiệm vụ:</b> đánh đổ các di tích phong kiến, thực hành thổ địa cách mạng triệt để; đánh đổ đế quốc chủ nghĩa Pháp, làm cho Đông Dương hoàn toàn độc lập – hai nhiệm vụ gắn bó với nhau.",
"<b>Lực lượng:</b> giai cấp vô sản và nông dân là hai động lực chính; giai cấp vô sản lãnh đạo; Đảng phải có \"đường chánh trị đúng, có kỷ luật, tập trung\".",
"<b>Hạn chế:</b> nhận thức về <b>vấn đề dân tộc</b> và <b>lực lượng cách mạng</b> chưa đầy đủ: nặng về đấu tranh giai cấp và cách mạng ruộng đất hơn giải phóng dân tộc, thu hẹp lực lượng chủ yếu là công – nông; chịu ảnh hưởng của Quốc tế Cộng sản. Tuy vậy, về cơ bản thống nhất với Chánh cương vắn tắt."]},

<tr><td>Lực lượng</td><td>Công nhân, nông dân là gốc; tranh thủ tiểu tư sản, trí thức, trung nông; trung lập phú nông, trung, tiểu địa chủ</td><td>Chủ yếu vô sản và nông dân</td></tr>
