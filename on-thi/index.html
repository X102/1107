DOCS.push({id:"nd234",group:"law",short:"NĐ 234/2026 – Xử lý kỷ luật viên chức",mmLabel:"NĐ 234/2026 (xử lý kỷ luật)",so:"234/2026/NĐ-CP",
title:"Nghị định quy định về xử lý kỷ luật viên chức",
meta:[["Cơ quan ban hành","Chính phủ (KT. Thủ tướng, Phó Thủ tướng Phạm Thị Thanh Trà ký)"],["Ngày ký","26/6/2026"],["Hiệu lực","01/7/2026 (Điều 25)"],["Thay thế","Toàn bộ NĐ 112/2020/NĐ-CP (đã sửa bởi NĐ 71/2023)"],["Đối tượng","Viên chức; người đã thôi việc, nghỉ hưu"],["Bố cục","5 chương, 26 điều"]],
tldr:`<mark>4 hình thức</mark>: khiển trách, cảnh cáo, <b>cách chức (chỉ viên chức quản lý)</b>, buộc thôi việc. Thời hiệu <mark>05 năm</mark> (mức khiển trách) / <mark>10 năm</mark>; thời hạn <mark>90 ngày</mark> (phức tạp <mark>150 ngày</mark>). Quyết định kỷ luật có hiệu lực <mark>12 tháng</mark>, hết hạn tự chấm dứt. Mỗi hành vi chỉ bị xử lý một lần bằng một hình thức. Quy trình 3 bước: <b>họp kiểm điểm → Hội đồng kỷ luật (03 thành viên, bỏ phiếu kín) → quyết định</b>. Phải xử lý kỷ luật hành chính trong <mark>30 ngày</mark> sau khi công bố kỷ luật Đảng.`,
sections:[
{h:"Nguyên tắc (Điều 2)",items:[
"Khách quan, công bằng, công khai, nghiêm minh, kịp thời, đúng thẩm quyền, trình tự.",
"<b>Mỗi hành vi chỉ bị xử lý một lần bằng một hình thức.</b> Nhiều hành vi xem xét cùng lúc thì kết luận từng hành vi nhưng quyết định <b>chung một hình thức cao nhất</b>.",
"Đang thi hành kỷ luật mà vi phạm tiếp: áp dụng hình thức <b>nặng hơn một mức</b>.",
"<b>Không dùng xử phạt vi phạm hành chính thay cho kỷ luật</b>; kỷ luật không thay thế truy cứu trách nhiệm hình sự.",
"<b>Liên thông kỷ luật Đảng:</b> xử lý kỷ luật hành chính trong <mark>30 ngày</mark> kể từ ngày công bố quyết định kỷ luật Đảng; viên chức <b>không giữ chức vụ</b> bị Đảng cách chức thì kỷ luật hành chính là <b>cảnh cáo</b>.",
"<b>Tái phạm</b> = trong <mark>12 tháng</mark> kể từ ngày quyết định kỷ luật có hiệu lực lại vi phạm đúng hành vi đó.",
"<b>Quyết định kỷ luật có hiệu lực <mark>12 tháng</mark></b>; hết thời hạn không vi phạm mới thì <b>tự chấm dứt hiệu lực, không cần văn bản</b>.",
"Vi phạm ở nơi cũ phát hiện sau khi chuyển công tác: <b>nơi mới xử lý</b>. Người có quan hệ thân thuộc không được làm thành viên Hội đồng."]},
{h:"Chưa xem xét, loại trừ, miễn, tăng nặng, giảm nhẹ (Điều 3–4)",items:[
"<b>Chưa xem xét kỷ luật:</b> đang điều trị bệnh hiểm nghèo, mất khả năng nhận thức, ốm nặng điều trị nội trú; <b>nữ</b> mang thai, nghỉ thai sản, nuôi con <mark>dưới 12 tháng tuổi</mark>; nam nuôi con dưới 12 tháng khi vợ đã chết hoặc không thể nuôi con; đang bị khởi tố, tạm giữ, tạm giam.",
"<b>Loại trừ trách nhiệm:</b> mất năng lực hành vi dân sự <b>tại thời điểm vi phạm</b>; tình thế cấp thiết, bất khả kháng, trở ngại khách quan.",
"<b>Miễn trách nhiệm:</b> thực hiện đề xuất nghiên cứu khoa học, đổi mới sáng tạo đã được phép, vì lợi ích chung nhưng có thiệt hại; làm đúng quy trình, không vụ lợi nhưng thiệt hại do khách quan; <b>đã qua đời</b>.",
"<b>Tăng nặng (4 nhóm):</b> không sửa chữa sau kiểm điểm; cản trở thanh tra, trù dập người tố cáo; vi phạm có tổ chức, làm giả chứng cứ; lợi dụng thiên tai, dịch bệnh để trục lợi.",
"<b>Giảm nhẹ:</b> chủ động báo cáo, tự nhận trách nhiệm; cung cấp thông tin về người cùng vi phạm; chủ động chấm dứt vi phạm, khắc phục hậu quả."]},
{h:"Hình thức kỷ luật và trường hợp áp dụng (Điều 6–11)",items:[
"<b>3 mức hậu quả:</b> ít nghiêm trọng (nội bộ); nghiêm trọng (ra ngoài nội bộ, <b>làm giảm</b> uy tín); rất nghiêm trọng (tác động toàn xã hội, <b>làm mất</b> uy tín).",
"<b>Khiển trách:</b> vi phạm <b>lần đầu</b>, hậu quả <b>ít nghiêm trọng</b> (10 nhóm hành vi: vi phạm quy trình chuyên môn, nội quy đã bị nhắc nhở bằng văn bản; hách dịch, cửa quyền; né tránh, đùn đẩy; vi phạm bí mật nhà nước…).",
"<b>Cảnh cáo:</b> đã bị khiển trách mà <b>tái phạm</b>; lần đầu nhưng hậu quả <b>nghiêm trọng</b>; viên chức quản lý không làm hết trách nhiệm để cấp dưới vi phạm nghiêm trọng.",
"<b>Cách chức (chỉ viên chức quản lý):</b> đã bị cảnh cáo mà tái phạm; lần đầu, hậu quả <b>rất nghiêm trọng</b> nhưng có thái độ tiếp thu, khắc phục; <b>dùng văn bằng giả để được bổ nhiệm</b>.",
"<b>Buộc thôi việc:</b> đã bị cách chức (VC quản lý) hoặc cảnh cáo (VC thường) mà tái phạm; lần đầu, rất nghiêm trọng, không khắc phục, có tình tiết tăng nặng; <b>dùng văn bằng giả để được tuyển dụng</b>; <b>nghiện ma túy</b>.",
"<b>Đương nhiên buộc thôi việc</b> khi bị phạt tù không hưởng án treo hoặc bị kết án về tội tham nhũng; ra quyết định trong <mark>15 ngày làm việc</mark> kể từ khi nhận bản án."]},
{h:"Thời hiệu, thời hạn (Điều 5)",items:[
"<b>Thời hiệu</b> tính từ khi có hành vi vi phạm đến khi có kết luận vi phạm: <mark>05 năm (60 tháng)</mark> với mức khiển trách; <mark>10 năm (120 tháng)</mark> với hành vi khác. Có vi phạm mới trong thời hiệu thì tính lại.",
"<b>Không áp dụng thời hiệu:</b> đảng viên vi phạm đến mức khai trừ; vi phạm bảo vệ chính trị nội bộ; xâm hại lợi ích quốc gia về quốc phòng, an ninh, đối ngoại; dùng văn bằng, chứng chỉ giả hoặc không hợp pháp.",
"<b>Thời hạn xử lý</b> (từ khi phát hiện đến khi ra quyết định): <mark>không quá 90 ngày</mark>; phức tạp <mark>không quá 150 ngày</mark>.",
"Không tính vào thời hiệu, thời hạn: thời gian chưa xem xét kỷ luật; thời gian điều tra, truy tố, xét xử; thời gian khiếu nại, khởi kiện."]},
{h:"Thẩm quyền và trình tự (Điều 12–18)",items:[
"<b>Thẩm quyền:</b> viên chức quản lý – người đứng đầu cơ quan có <b>thẩm quyền bổ nhiệm</b>; viên chức thường – <b>người đứng đầu ĐVSNCL</b> sử dụng viên chức; viên chức biệt phái – nơi được cử đến xử lý (thống nhất với nơi cử đi), riêng buộc thôi việc do <b>nơi cử đi</b> quyết định.",
"<b>Bước 1 – Họp kiểm điểm:</b> người vi phạm trình bày bản kiểm điểm, tự nhận hình thức; <b>không biểu quyết, không bỏ phiếu</b>; gửi biên bản lên cấp trên trong <mark>03 ngày làm việc</mark>. Vắng mặt sau triệu tập lần 2 vẫn họp.",
"<b>Bước 2 – Hội đồng kỷ luật:</b> thành lập chậm nhất <mark>05 ngày làm việc</mark>; <b>03 thành viên</b> (viên chức thường: Chủ tịch là lãnh đạo đơn vị, 01 đại diện công đoàn, 01 đại diện bộ phận tổ chức cán bộ); họp khi có đủ 03 thành viên trong đó có Chủ tịch; giấy triệu tập gửi trước <mark>05 ngày làm việc</mark>; kiến nghị bằng <b>bỏ phiếu kín</b>; Hội đồng chỉ <b>tư vấn</b>.",
"<b>Bước 3 – Quyết định:</b> Hội đồng gửi kiến nghị trong 05 ngày làm việc; cấp có thẩm quyền ra quyết định trong <mark>05 ngày làm việc</mark>.",
"<b>Không cần họp kiểm điểm và Hội đồng</b> khi: đã có kết luận đề xuất cụ thể hình thức kỷ luật; bị phạt tù không án treo hoặc kết án tham nhũng; đã có quyết định kỷ luật Đảng."]},
{h:"Người đã nghỉ, hệ quả, chuyển tiếp",items:[
"<b>Người đã thôi việc, nghỉ hưu:</b> khiển trách, cảnh cáo, <b>xóa tư cách chức vụ đã đảm nhiệm</b> (do cấp bổ nhiệm chức vụ cao nhất quyết định).",
"Đến tuổi nghỉ hưu khi đang bị xem xét kỷ luật <b>vẫn được giải quyết nghỉ hưu</b>.",
"<b>Buộc thôi việc:</b> không hưởng chế độ thôi việc; sau <mark>12 tháng</mark> mới được dự tuyển lại; nếu do tham nhũng, vi phạm đạo đức nghề nghiệp thì không được dự tuyển vào vị trí liên quan.",
"<b>Kỷ luật oan, sai:</b> công khai kết luận trong <mark>10 ngày làm việc</mark>, xin lỗi, phục hồi quyền lợi.",
"<b>Chuyển tiếp:</b> vụ việc đang xử lý trước 01/7/2026 tiếp tục theo NĐ 112/2020; vi phạm trước nhưng xử lý sau thì theo NĐ 234, <b>trừ khi quy định cũ có lợi hơn</b>."]},
{h:"Điểm mới so với NĐ 112/2020, NĐ 71/2023",items:[
"Nghị định riêng cho viên chức (kỷ luật cán bộ, công chức đã tách sang NĐ 172/2025).",
"Bổ sung <b>miễn trách nhiệm</b> cho người đổi mới sáng tạo vì lợi ích chung.",
"Liệt kê cụ thể 4 nhóm tình tiết tăng nặng, 5 tình tiết giảm nhẹ.",
"Thời hiệu tính đến khi <b>có kết luận vi phạm</b>, tính lại khi có vi phạm mới; quy đổi 60/120 tháng.",
"Hội đồng kỷ luật thu gọn còn <b>03 thành viên</b> (trước đây 05 với viên chức quản lý).",
"Rút gọn thủ tục khi đã có kết luận, bản án, hoặc kỷ luật Đảng."]}
],

CONFUSE.push(
{doc:"nd233",a:"Tỷ lệ xuất sắc 20% tính trên tổng số viên chức?",b:"Không. 20% tính trên <b>số viên chức được xếp \"hoàn thành tốt nhiệm vụ\"</b>, trong cùng đơn vị và theo nhóm nhiệm vụ tương đồng. Tối đa 25% khi đơn vị được công nhận \"hoàn thành xuất sắc\".",tip:""},
{doc:"nd233",a:"Làm việc chưa đủ 6 tháng thì bị xếp \"không hoàn thành\"?",b:"Không. Chưa đủ 06 tháng thì <b>không xếp loại</b>. Nghỉ ốm, nghỉ thai sản vẫn được xếp loại theo thời gian làm việc thực tế.",tip:""},
{doc:"nd233",a:"Ai xếp loại viên chức làm ở đơn vị cấu thành (khoa, phòng)?",b:"Người đứng đầu đơn vị cấu thành chỉ <b>theo dõi, đánh giá</b>; <b>người đứng đầu ĐVSNCL</b> mới <b>xếp loại</b>.",tip:"Theo dõi (tháng/quý) ≠ xếp loại (năm)."},
{doc:"nd233",a:"Ngưỡng điểm: 70 điểm là hoàn thành hay hoàn thành tốt?",b:"Đúng 90 → xuất sắc; đúng 70 → <b>hoàn thành tốt</b>; đúng 50 → hoàn thành; dưới 50 → không hoàn thành. Mốc dưới thuộc về mức trên.",tip:"\"Từ … đến dưới …\"."},
{doc:"nd233",a:"Điểm cao thì chắc chắn không bị xếp \"không hoàn thành\"?",b:"Không. Bị kỷ luật <b>từ khiển trách trở lên</b> vì vi phạm liên quan đến nhiệm vụ trong năm thì vẫn xếp \"không hoàn thành\" dù điểm cao.",tip:""},
{doc:"nd234",a:"Chưa xem xét – loại trừ – miễn trách nhiệm",b:"<b>Chưa xem xét</b>: bệnh hiểm nghèo, nuôi con dưới 12 tháng, đang bị tạm giam… (tạm hoãn). <b>Loại trừ</b>: mất năng lực hành vi dân sự <b>tại thời điểm vi phạm</b>, bất khả kháng. <b>Miễn</b>: <b>đã qua đời</b>, đổi mới sáng tạo vì lợi ích chung.",tip:"Hoãn – Không có lỗi – Có lỗi nhưng được miễn."},
{doc:"nd234",a:"Văn bằng giả: cách chức hay buộc thôi việc?",b:"Dùng văn bằng giả <b>để được bổ nhiệm</b> → <b>cách chức</b>. Dùng <b>để được tuyển dụng</b> → <b>buộc thôi việc</b>. Cả hai đều <b>không áp dụng thời hiệu</b>.",tip:"Bổ nhiệm → mất chức; tuyển dụng → mất việc."},
{doc:"nd234",a:"Họp kiểm điểm và Hội đồng kỷ luật đều bỏ phiếu?",b:"Họp kiểm điểm <b>không biểu quyết, không bỏ phiếu</b>. Hội đồng kỷ luật <b>bỏ phiếu kín</b> nhưng chỉ <b>kiến nghị</b>; người có thẩm quyền mới quyết định.",tip:""},
{doc:"nd234",a:"Viên chức không giữ chức vụ bị Đảng kỷ luật cách chức thì kỷ luật hành chính là cách chức?",b:"Không. Kỷ luật hành chính tương ứng là <b>cảnh cáo</b> (vì cách chức chỉ áp dụng với viên chức quản lý).",tip:""}
);
FLASH.push(
{doc:"nd233",q:"Thang điểm đánh giá viên chức theo NĐ 233/2026?",a:"<b>100 điểm</b>: tiêu chí chung tối đa <b>30</b>; kết quả thực hiện nhiệm vụ tối đa <b>70</b> (số lượng, chất lượng, tiến độ)."},
{doc:"nd233",q:"Ngưỡng điểm 4 mức xếp loại chất lượng viên chức?",a:"Xuất sắc <b>≥90</b>; tốt <b>70 – dưới 90</b>; hoàn thành <b>50 – dưới 70</b>; không hoàn thành <b>dưới 50</b>."},
{doc:"nd233",q:"Tỷ lệ viên chức \"hoàn thành xuất sắc nhiệm vụ\" tối đa?",a:"Không quá <b>20%</b> số viên chức xếp \"hoàn thành tốt\"; tối đa <b>25%</b> nếu đơn vị được công nhận \"hoàn thành xuất sắc\"."},
{doc:"nd233",q:"Viên chức được theo dõi, chấm điểm theo chu kỳ nào?",a:"<b>Hằng tháng hoặc hằng quý</b>; cuối năm xếp loại dựa trên điểm trung bình."},
{doc:"nd233",q:"Hạn hoàn thành xếp loại chất lượng viên chức hằng năm?",a:"<b>Trước 15/12</b>; đơn vị đặc thù trước <b>15/01 năm sau</b>; ngành giáo dục theo Bộ GD&ĐT."},
{doc:"nd233",q:"Kết quả 06 tháng dùng để làm gì?",a:"Rà soát phân công; xem xét <b>thay đổi bậc nghề nghiệp, vị trí việc làm</b>; xác định thu nhập tăng thêm, tiền thưởng."},
{doc:"nd233",q:"Điều kiện để ĐVSNCL được xếp \"hoàn thành xuất sắc\"?",a:"Từ <b>90 điểm</b> và: hoàn thành 100% nhiệm vụ đúng hạn, <b>≥30% vượt mức</b>; không có đơn vị cấu thành \"không hoàn thành\"; đã khắc phục hết hạn chế."},
{doc:"nd234",q:"Hiệu lực của quyết định kỷ luật viên chức?",a:"<b>12 tháng</b> kể từ ngày có hiệu lực; hết thời hạn không vi phạm mới thì <b>tự chấm dứt hiệu lực</b>, không cần văn bản."},
{doc:"nd234",q:"Thế nào là tái phạm?",a:"Đã bị kỷ luật mà trong <b>12 tháng</b> kể từ ngày quyết định có hiệu lực lại vi phạm <b>đúng hành vi đó</b>."},
{doc:"nd234",q:"Hội đồng kỷ luật viên chức (không giữ chức vụ) gồm những ai?",a:"<b>03 thành viên</b>: Chủ tịch là người đứng đầu hoặc cấp phó đơn vị có thẩm quyền; 01 đại diện Ban chấp hành <b>công đoàn</b>; 01 đại diện <b>bộ phận tổ chức cán bộ</b>."},
{doc:"nd234",q:"Ba bước xử lý kỷ luật viên chức?",a:"(1) <b>Họp kiểm điểm</b> (không bỏ phiếu) → (2) <b>Hội đồng kỷ luật</b> tư vấn (bỏ phiếu kín) → (3) <b>Quyết định kỷ luật</b> của cấp có thẩm quyền."},
{doc:"nd234",q:"Các trường hợp chưa xem xét xử lý kỷ luật?",a:"Điều trị bệnh hiểm nghèo, mất khả năng nhận thức, ốm nặng nội trú; nữ mang thai, nghỉ thai sản, nuôi con <b>dưới 12 tháng</b> (nam nếu vợ chết/không thể nuôi con); đang bị khởi tố, tạm giữ, tạm giam."},
{doc:"nd234",q:"Sau khi công bố kỷ luật Đảng, phải xử lý kỷ luật hành chính trong bao lâu?",a:"<b>30 ngày</b>."},
{doc:"nd234",q:"Viên chức bị buộc thôi việc được dự tuyển lại sau bao lâu?",a:"Sau <b>12 tháng</b> kể từ ngày quyết định có hiệu lực (do tham nhũng, vi phạm đạo đức nghề nghiệp thì không được dự tuyển vào vị trí liên quan)."}
);

{doc:"nd234",q:"Trường hợp nào thuộc diện CHƯA xem xét xử lý kỷ luật?",opts:["Nữ viên chức đang nuôi con dưới 12 tháng tuổi","Viên chức đã qua đời","Viên chức mất năng lực hành vi dân sự tại thời điểm vi phạm","Vi phạm do tình thế cấp thiết"],ans:0,ex:"Đã qua đời là miễn trách nhiệm; mất năng lực hành vi và tình thế cấp thiết là loại trừ trách nhiệm.",ref:"Điều 3, 4"},
{doc:"nd234",q:"Hội đồng kỷ luật viên chức gồm bao nhiêu thành viên và họp khi nào?",opts:["03 thành viên; họp khi có đủ 03 thành viên, trong đó có Chủ tịch","05 thành viên; có mặt 2/3","03 thành viên; có mặt quá nửa","07 thành viên"],ans:0,ex:"Hội đồng tư vấn bằng bỏ phiếu kín và tự giải thể sau khi xong nhiệm vụ.",ref:"Điều 15, 16"},
{doc:"nd234",q:"Giấy triệu tập họp Hội đồng kỷ luật phải gửi viên chức vi phạm chậm nhất:",opts:["05 ngày làm việc trước ngày họp","03 ngày làm việc","07 ngày","10 ngày làm việc"],ans:0,ex:"Vắng mặt có giấy đề nghị hoặc vắng lần 2 thì vẫn họp.",ref:"Điều 17"},
{doc:"nd234",q:"Viên chức dùng bằng đại học giả để được tuyển dụng sẽ bị xử lý:",opts:["Buộc thôi việc, không áp dụng thời hiệu","Cách chức","Cảnh cáo","Khiển trách vì đã hết thời hiệu"],ans:0,ex:"Dùng bằng giả để được bổ nhiệm thì cách chức.",ref:"Điều 5, 11"},
{doc:"nd234",q:"Tại cuộc họp kiểm điểm viên chức vi phạm:",opts:["Không biểu quyết, không bỏ phiếu về hình thức kỷ luật","Bỏ phiếu kín về hình thức kỷ luật","Biểu quyết công khai","Chỉ người vi phạm phát biểu"],ans:0,ex:"Chỉ Hội đồng kỷ luật mới bỏ phiếu kín.",ref:"Điều 14"},
{doc:"nd234",q:"Viên chức bị buộc thôi việc (không do tham nhũng, vi phạm đạo đức nghề nghiệp) được đăng ký dự tuyển sau:",opts:["12 tháng kể từ ngày quyết định có hiệu lực","06 tháng","24 tháng","60 tháng"],ans:0,ex:"Và không được hưởng chế độ thôi việc.",ref:"Điều 22"},
{doc:"nd234",q:"Viên chức biệt phái vi phạm đến mức buộc thôi việc thì ai ra quyết định?",opts:["Người đứng đầu nơi cử viên chức đi biệt phái","Người đứng đầu nơi viên chức được cử đến","Bộ Nội vụ","Chủ tịch UBND cấp tỉnh"],ans:0,ex:"Các hình thức khác do nơi được cử đến xử lý, thống nhất với nơi cử đi.",ref:"Điều 12"}
);
ESSAY.push(
{doc:"nd233",q:"Trình bày khung tiêu chí và các mức xếp loại chất lượng viên chức theo NĐ 233/2026; nêu điểm mới so với NĐ 90/2020.",outline:["Căn cứ: Luật Viên chức 2025 Điều 25–26; NĐ 233 hiệu lực 01/7/2026, thay NĐ 90/2020.","Thang 100: tiêu chí chung 30 (3 nhóm, Phụ lục I); kết quả nhiệm vụ 70 (số lượng, chất lượng, tiến độ; viên chức quản lý thêm 3 tiêu chí).","4 mức theo ngưỡng 90/70/50; các trường hợp không hoàn thành; tỷ lệ 20%/25%; người đứng đầu không cao hơn đơn vị.","Theo dõi tháng/quý; trường hợp đặc biệt (chưa đủ 06 tháng không xếp loại).","Điểm mới: định lượng, đánh giá liên tục, trần tỷ lệ có số, số hóa, phân cấp quy chế.","Ý nghĩa: chống cào bằng, gắn thu nhập với kết quả; liên hệ bản thân khi trúng tuyển."]},
{doc:"nd233",q:"Trình bày trình tự, thẩm quyền xếp loại chất lượng viên chức và việc sử dụng kết quả.",outline:["Giao nhiệm vụ theo tháng, quý, năm.","Thẩm quyền theo dõi và xếp loại (người đứng đầu ĐVSNCL xếp loại; cấp trên xếp loại người đứng đầu).","Thời điểm: sau khi đơn vị được xếp loại, trước 15/12.","Quy trình người đứng đầu, cấp phó (có ý kiến cấp ủy) và viên chức thường; công khai điện tử; kiến nghị 05 ngày/10 ngày làm việc.","Sử dụng kết quả quý, 06 tháng, năm; hệ quả \"không hoàn thành\": bố trí thấp hơn hoặc chấm dứt hợp đồng.","Lưu trữ, đồng bộ CSDL quốc gia trong 05 ngày."]},
{doc:"nd234",q:"Trình bày các hình thức kỷ luật viên chức và trường hợp áp dụng theo NĐ 234/2026. Phân biệt cách chức với buộc thôi việc.",outline:["Cơ sở: Luật Viên chức 2025 Điều 35; NĐ 234 Điều 6–11.","4 nhóm hành vi vi phạm, 3 mức hậu quả.","Khiển trách: lần đầu, ít nghiêm trọng. Cảnh cáo: tái phạm hoặc nghiêm trọng; trách nhiệm người quản lý.","Cách chức: chỉ viên chức quản lý; tái phạm sau cảnh cáo; rất nghiêm trọng nhưng có khắc phục; bằng giả để bổ nhiệm.","Buộc thôi việc: tái phạm sau cách chức/cảnh cáo; rất nghiêm trọng, không khắc phục; bằng giả để tuyển dụng; nghiện ma túy; đương nhiên khi phạt tù không án treo, tội tham nhũng.","Phân biệt: đối tượng, hậu quả (mất chức vụ hay mất việc, không hưởng chế độ thôi việc, 12 tháng mới được dự tuyển)."]},
{doc:"nd234",q:"Trình bày nguyên tắc, thời hiệu, thời hạn và trình tự xử lý kỷ luật viên chức theo NĐ 234/2026.",outline:["Nguyên tắc: mỗi hành vi một lần, một hình thức; nặng hơn một mức khi đang thi hành kỷ luật; không thay bằng xử phạt hành chính; liên thông kỷ luật Đảng 30 ngày; hiệu lực 12 tháng.","Thời hiệu 05/10 năm; 4 trường hợp không áp dụng; thời hạn 90/150 ngày; thời gian không tính.","Chưa xem xét, loại trừ, miễn; tăng nặng, giảm nhẹ.","Trình tự 3 bước: họp kiểm điểm (03 ngày làm việc), Hội đồng 03 người (05 ngày làm việc, bỏ phiếu kín), quyết định (05 ngày làm việc).","Các trường hợp rút gọn thủ tục; người đã nghỉ hưu; kỷ luật oan sai."]}
);

/* ===== NĐ 299/2026/NĐ-CP ===== */
DOCS.push({id:"nd299",group:"law",short:"NĐ 299/2026 – Tổ chức ĐVSNCL",mmLabel:"NĐ 299/2026 (tổ chức ĐVSNCL)",so:"299/2026/NĐ-CP",
title:"Nghị định quy định tổ chức đơn vị sự nghiệp công lập",
meta:[["Cơ quan ban hành","Chính phủ (Phạm Thị Thanh Trà ký)"],["Ngày ký","28/7/2026"],["Hiệu lực","28/7/2026 (trùng ngày ký)"],["Thay thế","NĐ 120/2020/NĐ-CP và NĐ 283/2025/NĐ-CP (sửa đổi NĐ 120)"],["Không thay thế","NĐ 60/2021 về cơ chế tự chủ tài chính (vẫn dẫn chiếu)"],["Bố cục","4 chương, 31 điều"]],
tldr:`Quy định "khung" cho việc <b>thành lập, tổ chức lại, giải thể, chuyển giao, phân loại, xếp hạng</b> và <b>tự chủ tổ chức bộ máy</b> của ĐVSNCL, phù hợp chính quyền địa phương <b>2 cấp</b> (UBND cấp xã được thành lập ĐVSNCL). Ba con số then chốt: thành lập cần tối thiểu <mark>15 người</mark> làm việc; thành lập phòng cần <mark>≥ 2 mảng công tác và ≥ 7 người</mark>; giải thể khi <mark>3 năm liên tiếp</mark> không hoàn thành nhiệm vụ. Đơn vị mới thành lập phải <b>tự bảo đảm chi thường xuyên trở lên</b> (trừ đơn vị cung cấp dịch vụ cơ bản, thiết yếu).`,
sections:[
{h:"Phạm vi, đối tượng, khái niệm",items:[
"<b>Phạm vi:</b> thành lập, tổ chức lại, giải thể, chuyển giao; phân loại, xếp hạng; tự chủ về tổ chức bộ máy của ĐVSNCL.",
"<b>Đối tượng:</b> ĐVSNCL thuộc bộ, cơ quan ngang bộ (trừ Bộ Công an, Bộ Quốc phòng); thuộc UBND cấp tỉnh; <b>thuộc UBND cấp xã</b> (xã, phường, đặc khu).",
"<b>Khái niệm ĐVSNCL</b> không nằm trong NĐ 299 mà ở <b>khoản 1 Điều 5 Luật Viên chức 2025</b>.",
"<b>Tổ chức lại</b> = chia, tách, sáp nhập, hợp nhất hoặc điều chỉnh tên gọi, chức năng… <b>Chuyển giao</b> = chuyển thẩm quyền quản lý ĐVSNCL giữa các cơ quan, các cấp.",
"<b>Dịch vụ cơ bản</b>: Nhà nước <b>hỗ trợ</b> kinh phí; <b>dịch vụ thiết yếu</b>: Nhà nước <b>bảo đảm</b> kinh phí; dịch vụ theo nhu cầu: người thụ hưởng chi trả.",
"<b>Đơn vị đa ngành, đa lĩnh vực</b>: cung cấp dịch vụ thuộc phạm vi quản lý của <b>từ 2 bộ trở lên</b>."]},
{h:"Nguyên tắc (Điều 4) và điều kiện (Điều 5)",items:[
"Đơn vị <b>mới thành lập phải tự bảo đảm chi thường xuyên trở lên</b>, trừ đơn vị cung cấp dịch vụ cơ bản, thiết yếu.",
"Tổ chức lại đơn vị do NSNN bảo đảm hoặc tự bảo đảm một phần <b>không được tăng số người hưởng lương từ NSNN</b>.",
"Chuyển giao theo nguyên tắc <b>nguyên trạng</b>.",
"<b>Thành lập phải đủ TẤT CẢ điều kiện:</b> phù hợp quy hoạch ngành hoặc <b>phương án phát triển mạng lưới ĐVSNCL</b>; đáp ứng tiêu chí chuyên ngành; rõ mục tiêu, chức năng, nhiệm vụ; số người làm việc tối thiểu <mark>15 người</mark> (trừ đơn vị dịch vụ cơ bản, thiết yếu theo luật chuyên ngành; đơn vị tự chủ và đơn vị ở nước ngoài theo đề án).",
"<b>Tổ chức lại chỉ cần 1 trường hợp:</b> điều chỉnh cho phù hợp phương án mạng lưới; không còn đáp ứng tiêu chí hoặc mốc 15 người; <b>không bảo đảm mức tự chủ tài chính</b> theo phương án đã duyệt (trừ nguyên nhân khách quan, thiên tai, dịch bệnh).",
"<b>Giải thể chỉ cần 1 trường hợp:</b> không còn chức năng cung cấp dịch vụ; không đáp ứng điều kiện thành lập; <mark>3 năm liên tiếp</mark> không hoàn thành nhiệm vụ; theo quy hoạch, phương án mạng lưới."]},
{h:"Tự chủ tổ chức bộ máy, khung cấp phó (Điều 6)",items:[
"Đơn vị <b>tự bảo đảm chi thường xuyên (và chi đầu tư)</b> được <b>tự quyết định</b> thành lập, tổ chức lại, giải thể đơn vị trực thuộc; số cấp phó, phó trưởng phòng theo đề án tự chủ.",
"Đơn vị tự bảo đảm một phần hoặc NSNN bảo đảm: <b>thành lập phòng</b> phải phụ trách <mark>≥ 02 mảng công tác</mark> có quy trình riêng và cần <mark>≥ 07 người</mark> làm việc.",
"<b>Cấp phó người đứng đầu</b> (đơn vị chưa tự chủ chi thường xuyên): đơn vị thuộc cơ cấu tổ chức của bộ <b>bình quân ≤ 03</b>; đơn vị trực thuộc bộ, thuộc UBND tỉnh: <b>≤ 20 người → tối đa 02, > 20 người → tối đa 03</b>; đơn vị thuộc cục, sở, UBND xã: <b>tối đa 02</b>; bệnh viện hạng I trở lên, trường phổ thông nhiều cấp học <b>≥ 40 lớp</b>: tối đa 03.",
"<b>Phó trưởng phòng:</b> phòng <mark>07–09 người → 01</mark>; <mark>≥ 10 người → tối đa 02</mark>.",
"Số cấp phó cụ thể do <b>Bộ trưởng</b>, <b>UBND</b> tỉnh, <b>UBND</b> xã quyết định trong khung.",
"<b>Đề án tự chủ</b>: lộ trình theo giai đoạn <mark>5 năm</mark>; cơ quan nội vụ và tài chính thẩm định.",
"<b>Chuyển tiếp (Điều 29):</b> cấp phó dôi dư sau sắp xếp phải về khung chậm nhất sau <mark>5 năm</mark>."]},
{h:"Phân loại (Điều 7), xếp hạng (Điều 8)",items:[
"<b>4 tiêu chí phân loại:</b> vị trí pháp lý (thuộc bộ / tỉnh / xã); lĩnh vực (giáo dục đào tạo; y tế; văn hóa, thể thao, du lịch; KHCN; sự nghiệp kinh tế và khác; đa ngành); tính chất nhiệm vụ (phục vụ xã hội / hỗ trợ quản lý nhà nước); mức độ tự chủ tài chính.",
"<b>4 nhóm tự chủ tài chính</b> (theo NĐ 60/2021): tự bảo đảm chi thường xuyên và chi đầu tư; tự bảo đảm chi thường xuyên; tự bảo đảm một phần chi thường xuyên; NSNN bảo đảm chi thường xuyên.",
"<b>Tiêu chí xếp hạng:</b> quy mô, khối lượng công việc; cơ cấu, trình độ lao động; hạ tầng, <b>mức số hóa</b>; hiệu quả hoạt động (gồm <b>khảo sát mức hài lòng của người dân</b>, mức tự chủ); tiêu chí đặc thù ngành.",
"<b>Thời hạn xếp hạng <mark>5 năm</mark></b>; đạt tiêu chí cao hơn có thể được xếp lên hạng liền kề sớm. Đơn vị đa ngành xếp theo <b>hạng cao nhất</b>."]},
{h:"Thẩm quyền, trình tự, thời hạn",items:[
"<b>Thủ tướng:</b> phê duyệt phương án phát triển mạng lưới ĐVSNCL; quyết định chuyển giao giữa các bộ, giữa bộ với tỉnh, giữa các tỉnh.",
"<b>Bộ trưởng, Thủ trưởng cơ quan ngang bộ:</b> thành lập, tổ chức lại, giải thể ĐVSNCL thuộc bộ; phê duyệt đề án tự chủ; phân loại, xếp hạng.",
"<b>UBND cấp tỉnh:</b> thành lập, tổ chức lại, giải thể ĐVSNCL thuộc tỉnh; quyết định chuyển giao trong tỉnh, kể cả <b>giữa các UBND xã</b>. <b>Chủ tịch UBND tỉnh</b>: phân loại, xếp hạng.",
"<b>UBND cấp xã:</b> thành lập, tổ chức lại, giải thể ĐVSNCL thuộc xã; phê duyệt đề án tự chủ. <b>Chủ tịch UBND xã</b>: phân loại, xếp hạng.",
"<b>Cơ quan thẩm định là cơ quan nội vụ:</b> Bộ Nội vụ (thẩm quyền Chính phủ, Thủ tướng); đơn vị tổ chức bộ máy của bộ; Sở Nội vụ; cơ quan nội vụ cấp xã.",
"<b>Thời hạn:</b> thẩm định <mark>15 ngày làm việc</mark> (thẩm quyền Chính phủ, Thủ tướng) hoặc <mark>10 ngày làm việc</mark> (còn lại); ra quyết định <mark>25 ngày làm việc</mark>. Tổ chức lại, giải thể, chuyển giao áp dụng thời hạn như thành lập.",
"<b>Đề án thành lập</b> gồm 11 nội dung; giải thể phải có văn bản xác nhận hoàn thành nghĩa vụ tài chính, đất đai, khoản vay, nợ.",
"<b>Báo cáo:</b> bộ, UBND tỉnh gửi số liệu cho bộ quản lý ngành và Bộ Nội vụ <mark>trước 20/11 hằng năm</mark>."]},
{h:"Điểm mới và liên hệ chủ trương",items:[
"Thêm nội dung <b>phân loại, xếp hạng</b> (có tiêu chí số hóa, mức hài lòng người dân) và <b>chuyển giao</b>.",
"Thay \"quy hoạch mạng lưới\" bằng <b>\"phương án phát triển mạng lưới ĐVSNCL theo ngành, lĩnh vực\"</b> do Thủ tướng phê duyệt.",
"Không đạt mức tự chủ tài chính đã duyệt trở thành căn cứ <b>tổ chức lại</b>.",
"Đơn vị tự chủ chi thường xuyên trở lên được tự quyết số cấp phó theo đề án.",
"Phù hợp chính quyền địa phương 2 cấp (Luật Tổ chức chính quyền địa phương 72/2025/QH15): không còn cấp huyện; UBND xã có thẩm quyền với ĐVSNCL cấp xã.",
"Thể chế hóa <b>NQ 19-NQ/TW</b> (25/10/2017) về đổi mới hệ thống tổ chức và quản lý ĐVSNCL và <b>NQ 18-NQ/TW</b> về tinh gọn bộ máy: giảm đầu mối, giảm biên chế hưởng lương NSNN, tăng tự chủ.",
"Giữ nguyên từ NĐ 120: mốc 15 người; tiêu chí phòng 2 mảng/7 người; thời hạn 15/10/25 ngày làm việc."]}
],

ESSAY.push(
{doc:"nd299",q:"Trình bày nguyên tắc và điều kiện thành lập, tổ chức lại, giải thể ĐVSNCL theo NĐ 299/2026. Liên hệ Nghị quyết 19-NQ/TW.",outline:["Khái niệm ĐVSNCL (k1 Điều 5 Luật Viên chức 2025); giới thiệu NĐ 299 (28/7/2026, 4 chương 31 điều, thay NĐ 120/2020, NĐ 283/2025).","Nguyên tắc (Điều 4): đúng thẩm quyền; đơn vị mới tự bảo đảm chi thường xuyên trở lên; không tăng người hưởng lương NSNN; chuyển giao nguyên trạng.","Điều kiện thành lập (đủ tất cả): phù hợp phương án mạng lưới, tiêu chí chuyên ngành, rõ chức năng, tối thiểu 15 người.","Tổ chức lại (1 trường hợp): điều chỉnh theo phương án mạng lưới, không còn đủ điều kiện, không đạt mức tự chủ.","Giải thể (1 trường hợp): hết chức năng, không đủ điều kiện, 3 năm liên tiếp không hoàn thành nhiệm vụ, theo quy hoạch.","Liên hệ NQ 19-NQ/TW (2017): giảm đầu mối, giảm biên chế, tăng đơn vị tự chủ; NĐ 299 cụ thể hóa các mục tiêu đó.","Trách nhiệm của viên chức: chấp hành sắp xếp, nâng cao năng lực để đáp ứng vị trí việc làm."]},
{doc:"nd299",q:"Phân tích quy định về tự chủ tổ chức bộ máy và khung số lượng cấp phó trong ĐVSNCL; sự phù hợp với mô hình chính quyền địa phương 2 cấp.",outline:["Bối cảnh: NQ 18-NQ/TW về tinh gọn bộ máy; Luật Tổ chức chính quyền địa phương 72/2025/QH15 bỏ cấp huyện.","Hai nhóm theo mức tự chủ: nhóm tự chủ chi thường xuyên trở lên được tự quyết; nhóm còn lại do cấp có thẩm quyền quy định.","Tiêu chí thành lập phòng: 2 mảng, 7 người; khung cấp phó đơn vị và phó trưởng phòng.","Thẩm quyền quyết định số cấp phó; đề án tự chủ lộ trình 5 năm; chuyển tiếp 5 năm với cấp phó dôi dư.","Phù hợp mô hình 2 cấp: UBND xã thành lập ĐVSNCL; cơ quan nội vụ cấp xã thẩm định; đơn vị đa ngành cấp xã.","Đánh giá: phân quyền gắn trách nhiệm; khó khăn về năng lực cấp xã và áp lực tự chủ."]}
);

/* ===== NQ 27-NQ/TW, 57-NQ/TW, 66-NQ/TW ===== */
DOCS.push({id:"nq27",group:"party",short:"NQ 27-NQ/TW (2022) – Nhà nước pháp quyền XHCN",mmLabel:"NQ 27-NQ/TW (Nhà nước pháp quyền XHCN)",so:"27-NQ/TW",
title:"Nghị quyết Hội nghị lần thứ sáu Ban Chấp hành Trung ương Đảng khóa XIII về tiếp tục xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam trong giai đoạn mới",
meta:[["Cơ quan ban hành","Ban Chấp hành Trung ương (Hội nghị Trung ương 6 khóa XIII)"],["Ngày ban hành","09/11/2022"],["Người ký","Tổng Bí thư Nguyễn Phú Trọng"],["Chương trình hành động của Chính phủ","Nghị quyết 77/NQ-CP ngày 12/5/2023"],["Bố cục","I. Tình hình – II. 5 quan điểm – III. Mục tiêu (2030, 2045) và 3 trọng tâm – IV. 10 nhiệm vụ – V. 6 điểm tổ chức thực hiện"]],
tldr:`Nghị quyết của <b>Ban Chấp hành Trung ương</b> (khác NQ 57, 66 của Bộ Chính trị). Xác định <mark>5 quan điểm, 3 trọng tâm, 10 nhiệm vụ</mark> và <mark>8 đặc trưng</mark> của Nhà nước pháp quyền XHCN Việt Nam. Hai cụm phải thuộc: quyền lực nhà nước <b>"thống nhất, có sự phân công rành mạch, phối hợp chặt chẽ, kiểm soát hiệu quả"</b>; đến <b>2030</b> <b>"thượng tôn Hiến pháp và pháp luật trở thành chuẩn mực ứng xử của mọi chủ thể trong xã hội"</b>. Mốc <b>2045</b>: nước phát triển, thu nhập cao theo định hướng XHCN. Không có chỉ tiêu phần trăm.`,
sections:[
{h:"Tình hình",items:[
"Qua <b>hơn 35 năm đổi mới</b> và <b>hơn 30 năm</b> thực hiện Cương lĩnh, nhận thức về Nhà nước pháp quyền ngày càng thống nhất; hệ thống pháp luật hoàn thiện một bước cơ bản; bộ máy từng bước tinh gọn.",
"<b>Hạn chế:</b> quyền lực nhà nước <b>chưa được kiểm soát hiệu quả</b>; giám sát của MTTQ, Nhân dân chưa phát huy mạnh; ý thức chấp hành pháp luật của một bộ phận chưa nghiêm; cải cách hành chính, tư pháp chưa đáp ứng yêu cầu.",
"<b>Nguyên nhân:</b> tổng kết thực tiễn, hoàn thiện lý luận chưa được quan tâm đúng mức; quyết tâm chính trị của một số cấp ủy chưa tương xứng. (Trong 3 nghị quyết 27, 57, 66 chỉ NQ 27 có đoạn nguyên nhân riêng.)",
"Xây dựng Nhà nước pháp quyền XHCN là vấn đề <b>\"lớn, phức tạp, lâu dài\"</b>."]},
{h:"5 quan điểm chỉ đạo",items:[
"<b>(1)</b> Kiên định chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh, đường lối đổi mới; bảo đảm sự lãnh đạo, cầm quyền của Đảng; xử lý tốt quan hệ <b>Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ</b>.",
"<b>(2)</b> <b>Tất cả quyền lực nhà nước thuộc về Nhân dân</b>; quyền lực nhà nước là <b>thống nhất, có sự phân công rành mạch, phối hợp chặt chẽ, kiểm soát hiệu quả</b> giữa các cơ quan thực hiện quyền lập pháp, hành pháp, tư pháp, dưới sự giám sát của Nhân dân.",
"<b>(3)</b> <b>Bảo đảm thượng tôn Hiến pháp và pháp luật</b>; thể chế hóa kịp thời đường lối của Đảng; <b>lấy con người là trung tâm, mục tiêu, chủ thể và động lực phát triển</b>.",
"<b>(4)</b> Bám sát thực tiễn đất nước và xu thế thời đại; <b>tiếp thu có chọn lọc kinh nghiệm quốc tế</b>; bảo đảm cao nhất lợi ích quốc gia – dân tộc.",
"<b>(5)</b> Bảo đảm tổng thể, đồng bộ, liên thông giữa <b>đổi mới lập pháp, cải cách hành chính, cải cách tư pháp</b>; có trọng tâm, trọng điểm, lộ trình, bước đi vững chắc."]},
{h:"Mục tiêu và 3 trọng tâm",items:[
"<b>Mục tiêu tổng quát:</b> hoàn thiện Nhà nước pháp quyền XHCN của Nhân dân, do Nhân dân, vì Nhân dân, do Đảng lãnh đạo; hệ thống pháp luật hoàn thiện, thực hiện nghiêm minh; nền hành chính, tư pháp chuyên nghiệp, pháp quyền, hiện đại; đội ngũ cán bộ, công chức, viên chức đủ phẩm chất, năng lực, liêm chính; đến <mark>2045</mark> trở thành <b>nước phát triển, thu nhập cao theo định hướng XHCN</b>.",
"<b>Mục tiêu đến <mark>2030</mark>:</b> hoàn thiện cơ bản cơ chế bảo đảm quyền làm chủ của Nhân dân; <b>thượng tôn Hiến pháp và pháp luật trở thành chuẩn mực ứng xử của mọi chủ thể trong xã hội</b>; hệ thống pháp luật dân chủ, công bằng, nhân đạo, đầy đủ, đồng bộ, thống nhất, kịp thời, khả thi, công khai, minh bạch, ổn định, dễ tiếp cận; hoàn thành cơ bản nền hành chính phục vụ Nhân dân và nền tư pháp chuyên nghiệp, hiện đại; đội ngũ cán bộ, công chức, viên chức <b>chuyên nghiệp, liêm chính, chí công, vô tư</b>.",
"<b>3 trọng tâm:</b> (1) hoàn thiện hệ thống pháp luật và cơ chế thực hiện pháp luật; (2) hoàn thiện cơ chế kiểm soát quyền lực, phòng chống tham nhũng, đẩy mạnh cải cách hành chính, phân cấp, phân quyền, tinh gọn bộ máy; (3) đẩy mạnh cải cách tư pháp, bảo đảm độc lập của tòa án."]},
{h:"8 đặc trưng của Nhà nước pháp quyền XHCN Việt Nam",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li>Do Đảng Cộng sản Việt Nam lãnh đạo.</li>
<li>Là Nhà nước của Nhân dân, do Nhân dân, vì Nhân dân; tất cả quyền lực nhà nước thuộc về Nhân dân.</li>
<li>Quyền con người, quyền công dân được công nhận, tôn trọng, bảo đảm, bảo vệ theo Hiến pháp và pháp luật.</li>
<li>Tổ chức và hoạt động theo Hiến pháp và pháp luật, quản lý xã hội bằng Hiến pháp và pháp luật.</li>
<li>Quyền lực nhà nước là thống nhất, có sự phân công rành mạch, phối hợp chặt chẽ và kiểm soát hiệu quả.</li>
<li>Có hệ thống pháp luật dân chủ, công bằng, nhân đạo, đầy đủ, đồng bộ, thống nhất, kịp thời, khả thi…</li>
<li>Bảo đảm độc lập của tòa án; thẩm phán, hội thẩm xét xử độc lập và chỉ tuân theo pháp luật.</li>
<li>Tôn trọng và bảo đảm thực hiện các điều ước quốc tế mà Việt Nam là thành viên.</li></ol>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Các đặc trưng nằm trong nhiệm vụ 1, văn bản viết liền một đoạn. Văn bản dùng từ <b>"đặc trưng"</b> và <b>không</b> có cụm "tam quyền phân lập".</p>`},
{h:"10 nhiệm vụ, giải pháp",items:[
"(1) Tuyên truyền, nâng cao nhận thức về Nhà nước pháp quyền XHCN (thống nhất nhận thức 8 đặc trưng).",
"(2) Bảo đảm quyền làm chủ của Nhân dân, thượng tôn Hiến pháp và pháp luật, bảo vệ quyền con người, quyền công dân.",
"(3) Hoàn thiện hệ thống pháp luật: <b>hạn chế đến mức thấp nhất hình thức pháp lệnh</b>; chống \"lợi ích nhóm\" trong xây dựng pháp luật.",
"(4) Đổi mới Quốc hội: tăng hợp lý đại biểu chuyên trách; xây dựng Quốc hội điện tử.",
"(5) Thực hiện tốt thiết chế Chủ tịch nước.",
"(6) Đổi mới Chính phủ, chính quyền địa phương; nền hành chính phục vụ Nhân dân; phân cấp, phân quyền; chính phủ số.",
"(7) Xây dựng nền tư pháp chuyên nghiệp, hiện đại: <b>\"lấy xét xử là trung tâm, tranh tụng là đột phá\"</b>.",
"(8) Hoàn thiện cơ chế kiểm soát quyền lực, phòng chống tham nhũng: <b>\"quyền lực đến đâu trách nhiệm đến đó, quyền lực càng cao trách nhiệm càng lớn\"</b>; cơ chế để không thể tham nhũng, văn hóa liêm chính để không cần, không muốn tham nhũng.",
"(9) Chủ động hội nhập quốc tế.",
"(10) Tăng cường lãnh đạo của Đảng, phát huy MTTQ và Nhân dân: \"dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng\".",
"<b>Tổ chức thực hiện:</b> <b>Ban Nội chính Trung ương</b> chủ trì đôn đốc, kiểm tra, sơ kết, tổng kết, báo cáo Bộ Chính trị, Ban Bí thư."]},
{h:"Liên hệ trách nhiệm của viên chức",items:[
"Gương mẫu thượng tôn Hiến pháp và pháp luật trong hoạt động nghề nghiệp.",
"Rèn luyện \"phẩm chất, năng lực, chuyên nghiệp, liêm chính, chí công, vô tư\"; phục vụ Nhân dân, công khai, minh bạch, chịu sự giám sát của Nhân dân.",
"Không tiếp tay tiêu cực, lợi ích nhóm; ứng dụng chuyển đổi số trong cung ứng dịch vụ sự nghiệp công."]}
],

DOCS.push({id:"nq57",group:"party",short:"NQ 57-NQ/TW (2024) – KHCN, đổi mới sáng tạo, chuyển đổi số",mmLabel:"NQ 57-NQ/TW (KHCN, ĐMST, chuyển đổi số)",so:"57-NQ/TW",
title:"Nghị quyết của Bộ Chính trị về đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia",
meta:[["Cơ quan ban hành","Bộ Chính trị (tiêu đề văn bản ghi \"Ban Chấp hành Trung ương\")"],["Ngày ban hành","22/12/2024"],["Người ký","Tổng Bí thư Tô Lâm"],["Thuộc nhóm","\"Bộ tứ trụ cột\": NQ 57, 59, 66, 68"],["Bố cục","Tình hình – I. 5 quan điểm – II. Mục tiêu 2030, tầm nhìn 2045 – III. 7 nhiệm vụ – IV. 6 điểm tổ chức thực hiện"]],
tldr:`KHCN, đổi mới sáng tạo và chuyển đổi số là <mark>"đột phá quan trọng hàng đầu, là động lực chính"</mark>, là "cuộc cách mạng sâu sắc, toàn diện". <b>Thể chế là điều kiện tiên quyết</b>, cần đi trước một bước; loại bỏ tư duy <b>"không quản được thì cấm"</b>; đưa <b>dữ liệu thành tư liệu sản xuất chính</b>. Con số phải thuộc: kinh tế số <mark>≥30% GDP</mark> (2030) và <mark>≥50%</mark> (2045); R&D <mark>2% GDP</mark>; bố trí <mark>≥3% tổng chi ngân sách</mark> hằng năm; <mark>12 người/vạn dân</mark> làm nghiên cứu; top 3 ĐNÁ, top 50 thế giới (2030), top 30 (2045).`,
sections:[
{h:"Tình hình",items:[
"KHCN, đổi mới sáng tạo, chuyển đổi số là <b>\"yếu tố quyết định\"</b> phát triển của các quốc gia; là <b>\"điều kiện tiên quyết, thời cơ tốt nhất\"</b> để nước ta phát triển trong <b>kỷ nguyên vươn mình của Dân tộc</b>.",
"<b>Hạn chế:</b> tốc độ bứt phá còn chậm, khoảng cách xa với nước phát triển; chưa làm chủ công nghệ chiến lược, cốt lõi; thiếu nhân lực chất lượng cao; hạ tầng số còn hạn chế; thể chế chưa đáp ứng; an ninh, an toàn dữ liệu còn nhiều thách thức."]},
{h:"5 quan điểm chỉ đạo",items:[
"<b>(1)</b> Là <b>\"đột phá quan trọng hàng đầu, là động lực chính\"</b> để phát triển lực lượng sản xuất hiện đại, đổi mới quản trị quốc gia, <b>ngăn chặn nguy cơ tụt hậu</b>.",
"<b>(2)</b> Tăng cường sự lãnh đạo toàn diện của Đảng; là <b>\"cuộc cách mạng sâu sắc, toàn diện\"</b>. <b>Người dân và doanh nghiệp là trung tâm, là chủ thể</b>, nguồn lực, động lực chính; <b>nhà khoa học là nhân tố then chốt</b>; <b>Nhà nước giữ vai trò dẫn dắt</b>, thúc đẩy, tạo điều kiện.",
"<b>(3)</b> <b>Thể chế, nhân lực, hạ tầng, dữ liệu, công nghệ chiến lược</b> là trọng tâm, cốt lõi; trong đó <b>thể chế là điều kiện tiên quyết, cần hoàn thiện và đi trước một bước</b>; <b>loại bỏ tư duy \"không quản được thì cấm\"</b>; hạ tầng số \"hiện đại, đồng bộ, an ninh, an toàn, hiệu quả, tránh lãng phí\"; <b>đưa dữ liệu thành tư liệu sản xuất chính</b>.",
"<b>(4)</b> Từng bước <b>tự chủ về công nghệ</b>, nhất là công nghệ chiến lược; ưu tiên nguồn lực quốc gia.",
"<b>(5)</b> <b>Bảo đảm chủ quyền quốc gia trên không gian mạng</b>, an ninh mạng, an ninh dữ liệu là <b>yêu cầu xuyên suốt, không thể tách rời</b>."]},
{h:"Mục tiêu đến 2030 và tầm nhìn 2045",items:[
"<b>Xếp hạng 2030:</b> thuộc <b>nhóm 3 nước dẫn đầu Đông Nam Á</b>, <b>nhóm 50 nước đứng đầu thế giới</b> về năng lực cạnh tranh số và chỉ số phát triển Chính phủ điện tử; nhóm 3 nước dẫn đầu ĐNÁ về nghiên cứu, phát triển trí tuệ nhân tạo; tối thiểu <mark>5</mark> doanh nghiệp công nghệ số ngang tầm nước tiên tiến.",
"<b>Kinh tế 2030:</b> kinh tế số <mark>tối thiểu 30% GDP</mark>; TFP <mark>trên 55%</mark>; xuất khẩu công nghệ cao <mark>tối thiểu 50%</mark>; dịch vụ công trực tuyến <mark>trên 80%</mark>; giao dịch không tiền mặt <mark>80%</mark>; doanh nghiệp có đổi mới sáng tạo <mark>trên 40%</mark>.",
"<b>Nguồn lực 2030:</b> chi R&D <mark>2% GDP</mark>, trong đó xã hội <b>hơn 60%</b>; bố trí <mark>ít nhất 3% tổng chi ngân sách hằng năm</mark> cho KHCN, ĐMST, CĐS; nhân lực nghiên cứu <mark>12 người/1 vạn dân</mark>; <mark>40–50</mark> tổ chức KHCN được xếp hạng khu vực, thế giới; công bố quốc tế tăng 10%/năm; sáng chế tăng 16–18%/năm; thương mại hóa 8–10%.",
"<b>Hạ tầng 2030:</b> <b>phủ sóng 5G toàn quốc</b>; đô thị thông minh ở các thành phố trực thuộc Trung ương; hình thành sàn giao dịch dữ liệu.",
"<b>Tầm nhìn 2045:</b> kinh tế số <mark>tối thiểu 50% GDP</mark>; thuộc <mark>nhóm 30 nước dẫn đầu thế giới</mark> về đổi mới sáng tạo, chuyển đổi số; tối thiểu <mark>10</mark> doanh nghiệp công nghệ số ngang tầm; Việt Nam là nước phát triển, thu nhập cao."]},
{h:"7 nhiệm vụ, giải pháp",items:[
"(1) Nâng cao nhận thức, <b>đột phá về đổi mới tư duy</b>: người đứng đầu trực tiếp phụ trách; kết quả thực hiện là tiêu chí đánh giá; phong trào <b>\"học tập số\"</b>.",
"(2) Hoàn thiện thể chế, <b>đưa thể chế thành lợi thế cạnh tranh</b>: cho phép thí điểm; <b>\"chấp nhận rủi ro, đầu tư mạo hiểm và độ trễ\"</b> trong nghiên cứu; miễn trừ trách nhiệm khi thử nghiệm công nghệ mới.",
"(3) Đầu tư, hoàn thiện hạ tầng: ít nhất <mark>15%</mark> ngân sách chi sự nghiệp khoa học cho công nghệ chiến lược; 5G, 6G; Trung tâm dữ liệu quốc gia; xác lập quyền sở hữu dữ liệu.",
"(4) Phát triển, trọng dụng nhân lực chất lượng cao, nhân tài; cơ chế \"tổng công trình sư\".",
"(5) Chuyển đổi số trong hệ thống chính trị: dịch vụ công trực tuyến <b>toàn trình</b>, dựa trên dữ liệu; bộ quy tắc ứng xử trên không gian mạng; chống lừa đảo trực tuyến.",
"(6) Thúc đẩy KHCN, ĐMST, CĐS trong doanh nghiệp.",
"(7) Tăng cường hợp tác quốc tế.",
"<b>Tổ chức thực hiện:</b> thành lập <b>Ban Chỉ đạo Trung ương</b> do <b>Tổng Bí thư làm Trưởng ban</b> và Hội đồng Tư vấn quốc gia; thể chế hóa cơ bản hoàn thành trong năm 2025; báo cáo định kỳ <b>6 tháng</b>."]},
{h:"Liên hệ trách nhiệm của viên chức",items:[
"Tham gia phong trào \"học tập số\", nâng cao kỹ năng số; cung cấp dịch vụ trực tuyến toàn trình.",
"Bảo đảm an toàn thông tin, bảo vệ dữ liệu là \"yêu cầu xuyên suốt\".",
"Dám đề xuất sáng kiến, cải tiến; Luật Viên chức 2025 và NĐ 234 có cơ chế loại trừ, miễn trách nhiệm cho đổi mới sáng tạo vì lợi ích chung."]}
],

DOCS.push({id:"nq66",group:"party",short:"NQ 66-NQ/TW (2025) – Xây dựng và thi hành pháp luật",mmLabel:"NQ 66-NQ/TW (xây dựng và thi hành pháp luật)",so:"66-NQ/TW",
title:"Nghị quyết của Bộ Chính trị về đổi mới công tác xây dựng và thi hành pháp luật đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới",
meta:[["Cơ quan ban hành","Bộ Chính trị"],["Ngày ban hành","30/4/2025"],["Người ký","Tổng Bí thư Tô Lâm"],["Văn bản thể chế hóa","NQ 140/NQ-CP (17/5/2025); NQ 197/2025/QH15 (17/5/2025); NQ 206/2025/QH15"],["Bố cục","Tình hình – I. 5 quan điểm – II. Mục tiêu (2025, 2027, 2028, 2030, 2045) – III. 7 nhiệm vụ – 7 điểm tổ chức thực hiện"]],
tldr:`Xây dựng và thi hành pháp luật là <mark>"đột phá của đột phá"</mark> trong hoàn thiện thể chế. Thi hành pháp luật vẫn là <b>"khâu yếu"</b>; tư duy xây dựng pháp luật còn <b>"thiên về quản lý"</b>. Giải pháp: <b>dứt khoát từ bỏ tư duy "không quản được thì cấm"</b>; luật chỉ quy định vấn đề khung; <b>"địa phương quyết, địa phương làm, địa phương chịu trách nhiệm"</b>; người dân, doanh nghiệp <b>được làm những gì luật không cấm</b>. Các mốc: <mark>2025</mark> tháo gỡ "điểm nghẽn"; <mark>2027</mark> pháp luật cho mô hình chính quyền 3 cấp; <mark>2028</mark> môi trường đầu tư top 3 ASEAN. Chi cho xây dựng pháp luật <mark>không thấp hơn 0,5% tổng chi ngân sách</mark>.`,
sections:[
{h:"Tình hình",items:[
"<b>Kết quả:</b> hình thành hệ thống pháp luật tương đối đồng bộ, công khai, minh bạch, dễ tiếp cận.",
"<b>Hạn chế:</b> một số chủ trương của Đảng chưa được thể chế hóa kịp thời; <b>tư duy xây dựng pháp luật còn thiên về quản lý</b>; quy định chồng chéo; phân cấp chưa đủ mạnh; thủ tục rườm rà; <b>tổ chức thi hành pháp luật vẫn là khâu yếu</b>; chậm điều chỉnh vấn đề mới."]},
{h:"5 quan điểm chỉ đạo",items:[
"<b>(1)</b> Bảo đảm <b>sự lãnh đạo toàn diện, trực tiếp của Đảng</b> trong xây dựng pháp luật; kiểm soát quyền lực; chống <b>lợi ích nhóm, lợi ích cục bộ</b>, ngăn chặn biểu hiện <b>\"trục lợi, hướng tới chính sách\"</b>.",
"<b>(2)</b> Xây dựng và thi hành pháp luật là <b>\"đột phá của đột phá\"</b> trong hoàn thiện thể chế; là nhiệm vụ trọng tâm của xây dựng Nhà nước pháp quyền XHCN.",
"<b>(3)</b> Bám sát thực tiễn, <b>\"đứng trên mảnh đất thực tiễn của Việt Nam\"</b>; đưa thể chế, pháp luật thành <b>lợi thế cạnh tranh, nền tảng vững chắc, động lực mạnh mẽ</b>; tạo dư địa cho tăng trưởng <b>\"hai con số\"</b>.",
"<b>(4)</b> Nâng cao hiệu quả thi hành pháp luật, xây dựng <b>văn hóa tuân thủ pháp luật</b>; gắn kết xây dựng với thi hành pháp luật.",
"<b>(5)</b> <b>\"Đầu tư cho công tác xây dựng chính sách, pháp luật là đầu tư cho phát triển\"</b>; có chính sách đặc thù, vượt trội cho đội ngũ làm pháp luật."]},
{h:"Mục tiêu: các mốc 2025 – 2045",items:[
"<mark>2025</mark>: cơ bản hoàn thành <b>tháo gỡ những \"điểm nghẽn\" do quy định pháp luật</b>.",
"<mark>2027</mark>: hoàn thành sửa đổi, ban hành văn bản bảo đảm cơ sở pháp lý cho bộ máy nhà nước theo <b>mô hình chính quyền 3 cấp</b> (Trung ương – tỉnh – xã).",
"<mark>2028</mark>: hoàn thiện pháp luật về <b>đầu tư, kinh doanh</b>, môi trường đầu tư thuộc <b>nhóm 3 nước dẫn đầu ASEAN</b>.",
"<mark>2030</mark>: hệ thống pháp luật <b>dân chủ, công bằng, đồng bộ, thống nhất, công khai, minh bạch, khả thi</b>; mở đường cho kiến tạo phát triển; Việt Nam là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao.",
"<mark>2045</mark>: pháp luật <b>chất lượng cao, hiện đại, tiệm cận chuẩn mực, thông lệ quốc tế</b>; <b>thượng tôn Hiến pháp và pháp luật trở thành chuẩn mực ứng xử của mọi chủ thể</b>; nước phát triển, thu nhập cao."]},
{h:"7 nhiệm vụ, giải pháp",items:[
"(1) Bảo đảm lãnh đạo toàn diện, trực tiếp của Đảng: <b>người đứng đầu bộ, cơ quan ngang bộ trực tiếp lãnh đạo</b> xây dựng pháp luật; mỗi bộ có <b>ít nhất một lãnh đạo có chuyên môn pháp luật</b>.",
"(2) Đổi mới tư duy: vừa quản lý vừa khuyến khích sáng tạo; <b>dứt khoát từ bỏ tư duy \"không quản được thì cấm\"</b>; luật chỉ quy định <b>vấn đề khung</b>; phân cấp tối đa, <b>\"địa phương quyết, địa phương làm, địa phương chịu trách nhiệm\"</b>; kinh tế tư nhân là một động lực quan trọng nhất; khung pháp lý cho AI, chuyển đổi số, chuyển đổi xanh, tài sản mã hóa.",
"(3) Đột phá thi hành pháp luật: người dân, doanh nghiệp <b>được làm những gì luật không cấm</b>; <b>tư duy kiến tạo phát triển</b>; <b>không \"hình sự hóa\"</b> quan hệ kinh tế, hành chính, dân sự.",
"(4) Hợp tác quốc tế, pháp luật quốc tế.",
"(5) Nhân lực pháp luật: hỗ trợ hằng tháng <mark>100% mức lương</mark> theo hệ số hiện hưởng cho người trực tiếp làm công tác xây dựng pháp luật tại một số cơ quan.",
"(6) Chuyển đổi số, ứng dụng <b>trí tuệ nhân tạo, dữ liệu lớn</b>; cơ sở dữ liệu lớn về pháp luật.",
"(7) Cơ chế tài chính đặc biệt: <b>khoán chi theo kết quả, sản phẩm</b>; chi cho xây dựng pháp luật <mark>không thấp hơn 0,5% tổng chi ngân sách hằng năm</mark>; Quỹ hỗ trợ xây dựng chính sách, pháp luật.",
"<b>Tổ chức thực hiện:</b> <b>Ban Chỉ đạo Trung ương về hoàn thiện thể chế, pháp luật</b> do <b>Tổng Bí thư</b> làm Trưởng ban; <b>Đảng ủy Bộ Tư pháp</b> là cơ quan thường trực; báo cáo định kỳ <b>6 tháng</b>."]},
{h:"Liên hệ trách nhiệm của viên chức",items:[
"Xây dựng văn hóa tuân thủ pháp luật trong hoạt động nghề nghiệp.",
"Phục vụ theo tư duy kiến tạo phát triển: hướng dẫn, giải thích, không gây phiền hà; tôn trọng nguyên tắc người dân, doanh nghiệp được làm những gì luật không cấm.",
"Góp ý dự thảo văn bản, phản ánh \"điểm nghẽn\" trong thực tiễn ngành mình."]}
],

CONFUSE.push(
{doc:"nq27",a:"NQ 27-NQ/TW do Bộ Chính trị ban hành như NQ 57, NQ 66?",b:"Không. NQ 27 là nghị quyết của <b>Ban Chấp hành Trung ương</b> (Hội nghị TW 6 khóa XIII, Nguyễn Phú Trọng ký). NQ 57 và NQ 66 do <b>Bộ Chính trị</b> ban hành (Tô Lâm ký).",tip:""},
{doc:"nq27",a:"\"Thượng tôn Hiến pháp và pháp luật trở thành chuẩn mực ứng xử của mọi chủ thể\" – mốc năm nào?",b:"Trong <b>NQ 27</b> là mục tiêu đến <b>2030</b>. Trong <b>NQ 66</b> câu gần giống nằm ở tầm nhìn <b>2045</b>.",tip:"27 → 2030; 66 → 2045."},
{doc:"nq27",a:"Nhà nước pháp quyền XHCN Việt Nam tổ chức theo \"tam quyền phân lập\"?",b:"Không. Quyền lực nhà nước là <b>thống nhất</b>, có sự phân công rành mạch, phối hợp chặt chẽ, kiểm soát hiệu quả. NQ 27 dùng từ <b>\"đặc trưng\"</b> (8 đặc trưng).",tip:""},
{doc:"nq27",a:"NQ 27-NQ/TW (2022) và NQ 27-NQ/TW (2026)",b:"<b>NQ 27-NQ/TW ngày 09/11/2022</b> (khóa XIII) về Nhà nước pháp quyền. Sau Đại hội XIV số hiệu đánh lại: có <b>NQ 27-NQ/TW ngày 28/8/2026</b> về phát triển vùng. Luôn kèm ngày ban hành.",tip:""},
{doc:"nq57",a:"\"Đột phá quan trọng hàng đầu\" hay \"đột phá của đột phá\"?",b:"<b>NQ 57</b>: KHCN, ĐMST, CĐS là <b>\"đột phá quan trọng hàng đầu\"</b>. <b>NQ 66</b>: xây dựng và thi hành pháp luật là <b>\"đột phá của đột phá\"</b>.",tip:"57 – hàng đầu; 66 – của đột phá."},
{doc:"nq57",a:"3% hay 0,5% hay 15%?",b:"<b>≥3% tổng chi ngân sách</b> hằng năm cho KHCN, ĐMST, CĐS (NQ 57). <b>≥15% ngân sách chi sự nghiệp khoa học</b> cho công nghệ chiến lược (NQ 57). <b>≥0,5% tổng chi ngân sách</b> cho xây dựng pháp luật (NQ 66). R&D <b>2% GDP</b> (NQ 57).",tip:""},
{doc:"nq57",a:"Trong NQ 57: ai là trung tâm, ai là then chốt, ai dẫn dắt?",b:"<b>Người dân và doanh nghiệp</b>: trung tâm, chủ thể. <b>Nhà khoa học</b>: nhân tố then chốt. <b>Nhà nước</b>: dẫn dắt, thúc đẩy, tạo điều kiện. <b>Thể chế</b>: điều kiện tiên quyết.",tip:""},
{doc:"nq57",a:"\"Không quản được thì cấm\" ở NQ 57 hay NQ 66?",b:"Cả hai. NQ 57 (quan điểm 3): <b>\"loại bỏ\"</b> tư duy. NQ 66 (nhiệm vụ 2): <b>\"dứt khoát từ bỏ\"</b> tư duy.",tip:""},
{doc:"nq57",a:"NQ 71 sửa đổi NQ 57?",b:"<b>71/NQ-CP</b> (01/4/2025, Chính phủ) cập nhật Chương trình hành động thực hiện NQ 57. <b>71-NQ/TW</b> (22/8/2025, Bộ Chính trị) là về <b>giáo dục và đào tạo</b>. <b>Chỉ thị 57-CT/TW</b> (31/12/2025) về an ninh mạng, khác NQ 57.",tip:""},
{doc:"nq66",a:"\"Khoán chi theo kết quả, sản phẩm\" thuộc NQ 57?",b:"Không. Cụm này thuộc <b>NQ 66</b> (nhiệm vụ 7, cơ chế tài chính đặc biệt cho xây dựng pháp luật).",tip:""},
{doc:"nq66",a:"Mô hình chính quyền 2 cấp hay 3 cấp trong NQ 66?",b:"NQ 66 ghi <b>\"mô hình chính quyền 3 cấp\"</b> (Trung ương – tỉnh – xã) cho mốc <b>2027</b>; tương ứng với chính quyền <b>địa phương</b> 2 cấp.",tip:""},
{doc:"nq66",a:"Cơ quan thường trực Ban Chỉ đạo của NQ 57 và NQ 66",b:"NQ 66: <b>Đảng ủy Bộ Tư pháp</b> là cơ quan thường trực BCĐ TW về hoàn thiện thể chế, pháp luật. NQ 57: Văn phòng TW (cùng Ban Kinh tế TW) báo cáo BCĐ TW về KHCN. Cả hai BCĐ đều do <b>Tổng Bí thư</b> làm Trưởng ban.",tip:""}
);
FLASH.push(
{doc:"nq27",q:"NQ 27-NQ/TW: cơ quan, ngày, nội dung?",a:"<b>Ban Chấp hành Trung ương</b> (Hội nghị TW 6 khóa XIII), ngày <b>09/11/2022</b>, về tiếp tục xây dựng và hoàn thiện <b>Nhà nước pháp quyền XHCN Việt Nam</b> trong giai đoạn mới."},
{doc:"nq27",q:"NQ 27 có bao nhiêu quan điểm, trọng tâm, nhiệm vụ, đặc trưng?",a:"<b>5</b> quan điểm, <b>3</b> trọng tâm, <b>10</b> nhiệm vụ, <b>8</b> đặc trưng."},
{doc:"nq27",q:"Nguyên tắc tổ chức quyền lực nhà nước theo NQ 27?",a:"Tất cả quyền lực nhà nước thuộc về Nhân dân; quyền lực nhà nước là <b>thống nhất, có sự phân công rành mạch, phối hợp chặt chẽ, kiểm soát hiệu quả</b>."},
{doc:"nq27",q:"Mục tiêu nổi bật đến 2030 của NQ 27?",a:"<b>Thượng tôn Hiến pháp và pháp luật trở thành chuẩn mực ứng xử của mọi chủ thể trong xã hội.</b>"},
{doc:"nq27",q:"Nguyên tắc về tư pháp và kiểm soát quyền lực trong NQ 27?",a:"<b>\"Lấy xét xử là trung tâm, tranh tụng là đột phá\"</b>; <b>\"quyền lực đến đâu trách nhiệm đến đó, quyền lực càng cao trách nhiệm càng lớn\"</b>."},
{doc:"nq57",q:"NQ 57-NQ/TW xác định KHCN, ĐMST, CĐS là gì?",a:"<b>\"Đột phá quan trọng hàng đầu, là động lực chính\"</b>; là \"cuộc cách mạng sâu sắc, toàn diện\"."},
{doc:"nq57",q:"Theo NQ 57, yếu tố nào là điều kiện tiên quyết, cần đi trước một bước?",a:"<b>Thể chế</b>; đồng thời loại bỏ tư duy \"không quản được thì cấm\"."},
{doc:"nq57",q:"Chỉ tiêu kinh tế số theo NQ 57?",a:"Tối thiểu <b>30% GDP</b> năm 2030; tối thiểu <b>50% GDP</b> năm 2045."},
{doc:"nq57",q:"Chỉ tiêu nguồn lực cho KHCN đến 2030 theo NQ 57?",a:"R&D <b>2% GDP</b> (xã hội >60%); <b>≥3% tổng chi ngân sách</b> hằng năm; nhân lực nghiên cứu <b>12 người/vạn dân</b>."},
{doc:"nq57",q:"Xếp hạng mục tiêu của NQ 57?",a:"2030: <b>top 3 Đông Nam Á, top 50 thế giới</b> về năng lực cạnh tranh số và Chính phủ điện tử. 2045: <b>top 30 thế giới</b> về đổi mới sáng tạo, chuyển đổi số."},
{doc:"nq57",q:"Trong NQ 57, dữ liệu được xác định là gì?",a:"<b>Tư liệu sản xuất chính</b>; an ninh mạng, an ninh dữ liệu là yêu cầu xuyên suốt, không thể tách rời."},
{doc:"nq66",q:"NQ 66-NQ/TW xác định công tác xây dựng và thi hành pháp luật là gì?",a:"<b>\"Đột phá của đột phá\"</b> trong hoàn thiện thể chế phát triển đất nước."},
{doc:"nq66",q:"Các mốc mục tiêu 2025, 2027, 2028 của NQ 66?",a:"<b>2025</b>: tháo gỡ \"điểm nghẽn\" do quy định pháp luật. <b>2027</b>: pháp luật cho mô hình chính quyền 3 cấp. <b>2028</b>: pháp luật đầu tư, kinh doanh; môi trường đầu tư top 3 ASEAN."},
{doc:"nq66",q:"Phương châm phân cấp trong NQ 66?",a:"<b>\"Địa phương quyết, địa phương làm, địa phương chịu trách nhiệm\"</b>."},
{doc:"nq66",q:"Mức chi tối thiểu cho công tác xây dựng pháp luật theo NQ 66?",a:"<b>Không thấp hơn 0,5% tổng chi ngân sách</b> hằng năm; khoán chi theo kết quả, sản phẩm; Quỹ hỗ trợ xây dựng chính sách, pháp luật."},
{doc:"nq66",q:"Quan điểm 5 của NQ 66?",a:"<b>\"Đầu tư cho công tác xây dựng chính sách, pháp luật là đầu tư cho phát triển.\"</b>"}
);

{doc:"nq66",q:"Phương châm phân cấp, phân quyền trong NQ 66-NQ/TW là:",opts:["Địa phương quyết, địa phương làm, địa phương chịu trách nhiệm","Trung ương quyết, địa phương làm","Dân biết, dân bàn, dân làm, dân kiểm tra","Rõ người, rõ việc, rõ trách nhiệm"],ans:0,ex:"\"Dân biết, dân bàn…\" là của NQ 27; \"rõ người, rõ việc…\" gắn với NQ 25 (6 rõ).",ref:"Nhiệm vụ 2"},

{doc:"nq66",q:"Cơ quan thường trực của Ban Chỉ đạo Trung ương về hoàn thiện thể chế, pháp luật theo NQ 66 là:",opts:["Đảng ủy Bộ Tư pháp","Văn phòng Trung ương Đảng","Ban Nội chính Trung ương","Đảng ủy Quốc hội"],ans:0,ex:"Báo cáo định kỳ 6 tháng với Ban Chỉ đạo và Bộ Chính trị.",ref:"Tổ chức thực hiện"}
);
ESSAY.push(
{doc:"nq27",q:"Trình bày quan điểm chỉ đạo và các đặc trưng của Nhà nước pháp quyền XHCN Việt Nam theo NQ 27-NQ/TW. Liên hệ trách nhiệm của viên chức.",outline:["Mở bài: NQ 27-NQ/TW ngày 09/11/2022, Hội nghị TW 6 khóa XIII; vấn đề \"lớn, phức tạp, lâu dài\".","5 quan điểm: nền tảng tư tưởng và vai trò lãnh đạo của Đảng; quyền lực thuộc về Nhân dân, thống nhất, phân công, phối hợp, kiểm soát; thượng tôn Hiến pháp, con người là trung tâm; bám sát thực tiễn, tiếp thu có chọn lọc; đồng bộ lập pháp, hành pháp, tư pháp.","8 đặc trưng; phân biệt với \"tam quyền phân lập\".","Mục tiêu 2030 (thượng tôn Hiến pháp là chuẩn mực ứng xử) và 2045.","Liên hệ viên chức: gương mẫu chấp hành pháp luật, liêm chính, chí công vô tư, phục vụ Nhân dân, chịu sự giám sát của Nhân dân."]},
{doc:"nq57",q:"Vì sao NQ 57-NQ/TW xác định phát triển KHCN, ĐMST và CĐS là \"đột phá quan trọng hàng đầu\"? Trình bày quan điểm và mục tiêu.",outline:["Bối cảnh: \"yếu tố quyết định\", \"điều kiện tiên quyết, thời cơ tốt nhất\", kỷ nguyên vươn mình; hạn chế (chậm, khoảng cách xa, chưa làm chủ công nghệ cốt lõi).","5 quan điểm: đột phá hàng đầu; cách mạng toàn diện, dân và DN là trung tâm; thể chế tiên quyết, bỏ \"không quản được thì cấm\", dữ liệu là tư liệu sản xuất; tự chủ công nghệ; chủ quyền trên không gian mạng.","Mục tiêu 2030: kinh tế số 30% GDP, R&D 2%, 3% ngân sách, top 3 ĐNÁ / top 50 TG, 12 người/vạn dân. Tầm nhìn 2045: 50% GDP, top 30 TG.","Liên hệ viên chức: học tập số, dịch vụ công trực tuyến, bảo mật dữ liệu, sáng kiến cải tiến."]},
{doc:"nq66",q:"Vì sao NQ 66-NQ/TW xác định xây dựng và thi hành pháp luật là \"đột phá của đột phá\"? Phân tích yêu cầu đổi mới tư duy xây dựng pháp luật.",outline:["Hạn chế: tư duy \"thiên về quản lý\"; thi hành pháp luật là \"khâu yếu\"; chồng chéo, thủ tục rườm rà.","5 quan điểm, nhấn mạnh \"đột phá của đột phá\" và \"đầu tư cho pháp luật là đầu tư cho phát triển\".","Các mốc 2025, 2027, 2028, 2030, 2045.","Đổi mới tư duy: dứt khoát từ bỏ \"không quản được thì cấm\"; luật khung; địa phương quyết, làm, chịu trách nhiệm; được làm những gì luật không cấm; không hình sự hóa.","Bảo đảm: 0,5% ngân sách, khoán chi, hỗ trợ 100% lương, AI và dữ liệu lớn.","Liên hệ: Luật Viên chức 2025 và các nghị định 2026 là ví dụ luật khung, phân cấp mạnh; trách nhiệm xây dựng văn hóa tuân thủ pháp luật."]}
);

/* ===== CHỈ THỊ 05-CT/TW, HD 21-HD/BTGDVTW, NQ 25-NQ/TW (2026) ===== */
DOCS.push({id:"ct05",group:"party",short:"Chỉ thị 05-CT/TW (2026) – Báo chí trên không gian mạng",mmLabel:"Chỉ thị 05-CT/TW (báo chí, truyền thông trên không gian mạng)",so:"05-CT/TW",
title:"Chỉ thị của Bộ Chính trị về tăng cường sự lãnh đạo của Đảng đối với báo chí, truyền thông trên không gian mạng trong tình hình mới",
meta:[["Cơ quan ban hành","Bộ Chính trị khóa XIV"],["Ngày ban hành","30/3/2026"],["Văn bản hướng dẫn","Hướng dẫn 21-HD/BTGDVTW ngày 28/5/2026"],["Văn bản đi cặp","Chỉ thị 04-CT/TW ngày 17/3/2026 của Ban Bí thư về hoạt động xuất bản"],["Bố cục","Có phần IV phân công tổ chức thực hiện (toàn văn chưa công bố công khai)"]],
tldr:`Bộ Chính trị khẳng định báo chí cách mạng là lực lượng <mark>"tiên phong, xung kích, trụ cột trên mặt trận tư tưởng của Đảng"</mark>. Đảng <b>lãnh đạo trực tiếp và toàn diện</b>, Nhà nước giữ vai trò <b>kiến tạo</b>. Bộ ba cần nhớ: <b>chuyển đổi số là giải pháp chiến lược</b>, đổi mới tư duy, phương thức lãnh đạo, quản lý là <b>yếu tố then chốt</b>, nhân lực chất lượng cao là <b>nhân tố quan trọng</b>. Chỉ thị đề ra <mark>10 nhóm nhiệm vụ, giải pháp</mark>, xây dựng hệ thống báo chí <b>"tinh, gọn, mạnh, hiện đại"</b>, bảo đảm <b>chủ quyền trên không gian mạng</b>.`,
sections:[
{h:"Bối cảnh",items:[
"Internet, mạng xã hội, dữ liệu lớn, AI làm thay đổi cách tiếp nhận và lan tỏa thông tin; tin giả, deepfake ngày càng tinh vi; các nền tảng xuyên biên giới đặt ra yêu cầu bảo đảm chủ quyền trên không gian mạng.",
"Từ <b>01/4/2026</b>, VTV, VOV, TTXVN trực thuộc Ban Chấp hành Trung ương Đảng (theo Hội nghị Trung ương 2 khóa XIV).",
"<b>Luật Báo chí (sửa đổi) 2025</b>: thông qua 10/12/2025, hiệu lực <b>01/7/2026</b>; lần đầu quy định cơ quan báo chí chủ lực đa phương tiện, nền tảng số báo chí quốc gia, hoạt động báo chí trên không gian mạng.",
"Hạn chế bị phê phán: hình thức, chạy theo phong trào; thương mại hóa báo chí, xa rời tôn chỉ mục đích; sản phẩm \"độc hại, phản văn hóa, lệch chuẩn\" trên không gian mạng."]},
{h:"Quan điểm chỉ đạo",items:[
"Báo chí cách mạng là bộ phận không thể tách rời của sự nghiệp cách mạng, giữ vai trò <b>\"tiên phong, xung kích, trụ cột trên mặt trận tư tưởng của Đảng\"</b>.",
"Đảng <b>lãnh đạo trực tiếp và toàn diện</b> đối với báo chí; Nhà nước giữ vai trò <b>kiến tạo</b> (thể chế, chính sách, pháp luật); cả hệ thống chính trị tạo điều kiện cho báo chí phát triển, đồng thời tăng cường kỷ luật, kỷ cương thông tin.",
"Đổi mới tư duy và phương thức lãnh đạo, chỉ đạo, quản lý theo hướng kiến tạo môi trường để báo chí phát huy bản chất cách mạng.",
"<b>Chuyển đổi số là giải pháp chiến lược</b>; đổi mới tư duy, phương thức là <b>yếu tố then chốt</b>; nguồn nhân lực chất lượng cao là <b>nhân tố quan trọng</b>; cùng với hoàn thiện thể chế, cơ chế đột phá, đầu tư công nghệ và tài chính.",
"Mục đích: báo chí, truyền thông đủ năng lực <b>làm chủ mặt trận thông tin, tuyên truyền trên không gian mạng</b>."]},
{h:"10 nhóm nhiệm vụ, giải pháp",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li>Tăng cường sự lãnh đạo của Đảng đối với báo chí.</li>
<li>Hoàn thiện quy định của Đảng và pháp luật về báo chí, truyền thông; tạo không gian phát triển theo hướng <b>chuyên nghiệp, nhân văn, hiện đại</b>.</li>
<li>Xây dựng chiến lược phát triển, quản lý hệ thống báo chí theo hướng <b>\"tinh, gọn, mạnh, hiện đại\"</b>, phù hợp mô hình tổ chức của hệ thống chính trị.</li>
<li>Cơ chế khuyến khích sáng tạo và phân phối nội dung bằng công nghệ mới.</li>
<li>Củng cố tổ chức bộ máy, công tác cán bộ; phát huy tổ chức đảng, đoàn thể trong cơ quan báo chí.</li>
<li>Tăng cường giám sát, kiểm tra, chấn chỉnh, xử lý sai phạm của cơ quan báo chí.</li>
<li>Xây dựng hạ tầng quản lý hiệu quả <b>các nền tảng xuyên biên giới</b>, bảo đảm <b>chủ quyền trên không gian mạng</b>.</li>
<li><b>Cơ quan chủ quản</b> thực hiện đầy đủ trách nhiệm chỉ đạo, định hướng, quản lý cơ quan báo chí.</li>
<li>Đổi mới hoạt động của cơ quan báo chí; tăng cường <b>kỷ luật, kỷ cương thông tin</b>; đề cao vai trò người đứng đầu.</li>
<li>Tuyên truyền, hướng dẫn người dân sử dụng <b>Internet, mạng xã hội an toàn, lành mạnh, đúng quy định</b>.</li></ol>
<p class="muted" style="margin:.6rem 0 0;font-size:.9rem">Ý cụ thể hay được dẫn: mô hình <b>tòa soạn hội tụ</b>, đa phương tiện, đa nền tảng; ứng dụng AI, dữ liệu lớn; không để xảy ra <b>\"khoảng trống thông tin\"</b> dẫn đến tin đồn, tin giả; hướng dẫn người dân nhận diện tin giả, deepfake, lừa đảo trực tuyến; nghiên cứu xây dựng các <b>tập đoàn báo chí, truyền thông chủ lực quốc gia</b> có tầm ảnh hưởng trong nước và khu vực.</p>`},
{h:"Phân công thực hiện (theo HD 21)",items:[
"<b>Đảng ủy Bộ Văn hóa, Thể thao và Du lịch</b>: tham mưu Chính phủ ban hành <b>Kế hoạch hành động</b>; quản lý nhà nước về báo chí và nền tảng, mạng xã hội xuyên biên giới.",
"<b>Đảng ủy Bộ Khoa học và Công nghệ</b>: quản lý doanh nghiệp viễn thông, Internet, dịch vụ mạng xã hội.",
"<b>Quân ủy Trung ương, Đảng ủy Công an Trung ương</b>: bảo đảm an ninh mạng, an toàn thông tin quốc gia.",
"<b>Đảng ủy Bộ Tài chính</b>: tăng nguồn lực; sửa quy định <b>đặt hàng báo chí theo cơ chế đặc thù, khoán chi</b>.",
"<b>Đảng ủy Bộ Giáo dục và Đào tạo</b>: khung chương trình đào tạo nhân lực báo chí; mục tiêu tạp chí khoa học uy tín quốc tế.",
"<b>Hội Nhà báo Việt Nam</b>: chuẩn mực đạo đức nghề báo; đánh giá giải báo chí toàn quốc, báo cáo trong <b>Quý II/2026</b>.",
"<b>Ban Tuyên giáo và Dân vận Trung ương</b>: chủ trì hướng dẫn, theo dõi, kiểm tra, sơ kết, tổng kết, báo cáo Bộ Chính trị."]},
{h:"Liên hệ trách nhiệm của viên chức",items:[
"Kiểm chứng nguồn trước khi chia sẻ, bình luận; không phát tán tin giả, thông tin chưa được phép công bố; tuân thủ quy chế phát ngôn của cơ quan (gắn Điều 10 Luật Viên chức 2025: cấm đăng tải, phát tán thông tin sai lệch).",
"Chủ động lan tỏa thông tin chính thống, tích cực; dùng AI có trách nhiệm; bảo vệ dữ liệu cá nhân.",
"Phản bác hoặc báo cáo thông tin xấu độc qua kênh phù hợp; nêu gương văn hóa ứng xử trên mạng (gắn Chỉ thị 07-CT/TW ngày 13/7/2026 về kỷ luật phát ngôn, văn hóa ứng xử của cán bộ, đảng viên trên không gian mạng)."]},
{h:"Lưu ý về nguồn",html:`<p class="note-unverified" style="margin:0">Toàn văn Chỉ thị 05 chưa được công bố công khai. Nội dung trên được tổng hợp từ HD 21 và tin chính thống (Tạp chí Công Thương, Tiền Phong, Znews, lsvn). Người ký, phần đánh giá tình hình và các chỉ tiêu định lượng của Chỉ thị chưa xác minh được; nên học chắc các ý có trong nhiều nguồn: ngày ban hành, quan điểm, bộ ba "chiến lược – then chốt – quan trọng", 10 nhóm nhiệm vụ.</p>`}
],

DOCS.push({id:"hd21",group:"party",short:"Hướng dẫn 21-HD/BTGDVTW – Triển khai Chỉ thị 05",mmLabel:"Hướng dẫn 21-HD/BTGDVTW (triển khai Chỉ thị 05)",so:"21-HD/BTGDVTW",
title:"Hướng dẫn quán triệt, tuyên truyền, triển khai thực hiện Chỉ thị số 05-CT/TW của Bộ Chính trị",
meta:[["Cơ quan ban hành","Ban Tuyên giáo và Dân vận Trung ương"],["Ngày ban hành","28/5/2026"],["Hướng dẫn cho","Chỉ thị 05-CT/TW ngày 30/3/2026"],["Ban hành cùng ngày","HD 22-HD/BTGDVTW hướng dẫn Chỉ thị 04-CT/TW (xuất bản)"],["Bố cục","Mục đích, yêu cầu – Nội dung quán triệt (Thứ nhất đến Thứ năm) – Tổ chức thực hiện"]],
tldr:`Văn bản hướng dẫn học tập, quán triệt Chỉ thị 05. Yêu cầu triển khai <b>"khẩn trương, nghiêm túc, đồng bộ, bài bản, tránh hình thức"</b>; chuyển từ "học tập" sang <b>hiểu sâu, hiểu đúng, hành động nhanh, quyết liệt</b>; gắn với <b>Nghị quyết Đại hội XIV, NQ 57-NQ/TW và NQ 80-NQ/TW</b>. Nội dung quán triệt gồm <mark>5 nội dung</mark> (Thứ nhất – Thứ năm), trong đó Thứ tư là 10 nhóm nhiệm vụ. Báo cáo gửi Ban Tuyên giáo và Dân vận Trung ương <b>qua Vụ Báo chí – Xuất bản</b>. Lưu ý: từ <b>01/8/2026</b> Ban đổi tên thành <b>Ban Tuyên giáo Trung ương</b>.`,
sections:[
{h:"Mục đích, yêu cầu",items:[
"Nâng cao nhận thức, trách nhiệm của cấp ủy, chính quyền, đoàn thể, cán bộ, đảng viên và Nhân dân về vai trò của báo chí trong chuyển đổi số.",
"Khẳng định vai trò <b>lãnh đạo trực tiếp, toàn diện của Đảng</b> và vai trò <b>kiến tạo của Nhà nước</b>.",
"Triển khai <b>khẩn trương, nghiêm túc, đồng bộ, bài bản, tránh hình thức</b>; kết hợp phương thức truyền thống với ứng dụng KHCN, chuyển đổi số.",
"Gắn với chương trình hành động thực hiện <b>Nghị quyết Đại hội XIV, NQ 57-NQ/TW, NQ 80-NQ/TW</b> (07/01/2026, phát triển văn hóa Việt Nam).",
"Chuyển từ \"học tập\" sang <b>hiểu sâu, hiểu đúng và hành động nhanh, quyết liệt, có kết quả cụ thể</b>; gắn với bảo vệ nền tảng tư tưởng."]},
{h:"5 nội dung trọng tâm cần quán triệt",items:[
"<b>Thứ nhất:</b> vị trí, vai trò của báo chí cách mạng: \"tiên phong, xung kích, trụ cột\".",
"<b>Thứ hai:</b> Đảng lãnh đạo trực tiếp, toàn diện; Nhà nước kiến tạo; hệ thống chính trị tạo điều kiện; đổi mới tư duy, phương thức lãnh đạo, quản lý.",
"<b>Thứ ba:</b> chuyển đổi số là giải pháp chiến lược; đổi mới quản lý là then chốt; nhân lực chất lượng cao là nhân tố quan trọng.",
"<b>Thứ tư:</b> 10 nhóm nhiệm vụ, giải pháp của Chỉ thị.",
"<b>Thứ năm:</b> nhân rộng mô hình hay, biểu dương điển hình; phê phán hình thức; kiên quyết đấu tranh với sản phẩm báo chí truyền thông <b>\"độc hại, phản văn hóa, lệch chuẩn\"</b>, nhất là trên không gian mạng."]},
{h:"Đối tượng, hình thức, tổ chức thực hiện, báo cáo",items:[
"<b>Đối tượng:</b> cấp ủy, tổ chức đảng, chính quyền, đoàn thể, cán bộ, đảng viên và Nhân dân; cơ quan chủ quản, cơ quan báo chí, người làm báo. Văn bản triển khai tiếp theo mở rộng tới <b>công chức, viên chức</b>, người lao động.",
"<b>Hình thức:</b> lồng ghép vào hội nghị cấp ủy, hội nghị báo cáo viên, sinh hoạt chi bộ; cơ quan báo chí mở chuyên trang, chuyên mục; ứng dụng AI, nền tảng số.",
"<b>Chương trình, kế hoạch</b> của mỗi cấp ủy phải <b>\"rõ trách nhiệm, rõ thời gian, rõ tiến độ, rõ kết quả cụ thể\"</b>.",
"<b>Báo cáo:</b> tỉnh ủy, thành ủy, đảng ủy trực thuộc Trung ương định kỳ gửi báo cáo về Ban Tuyên giáo và Dân vận Trung ương <b>qua Vụ Báo chí – Xuất bản</b>; báo cáo đột xuất khi có vụ việc. Hội Nhà báo báo cáo về giải báo chí toàn quốc trong <b>Quý II/2026</b>.",
"Ban Tuyên giáo và Dân vận Trung ương là đầu mối theo dõi, kiểm tra, đôn đốc, sơ kết, tổng kết, báo cáo Bộ Chính trị."]},
{h:"Bẫy về tên cơ quan",items:[
"Ký hiệu <b>BTGDVTW</b> = Ban Tuyên giáo và Dân vận Trung ương (cơ quan ban hành HD 21 ngày 28/5/2026).",
"Theo Quyết định <b>209-QĐ/TW ngày 31/7/2026</b>, từ <b>01/8/2026</b> Ban đổi tên thành <b>Ban Tuyên giáo Trung ương</b>; chức năng dân vận chuyển về <b>Đảng ủy Mặt trận Tổ quốc và các đoàn thể Trung ương</b>. Vì vậy NQ 25 (22/8/2026) giao việc cho \"Ban Tuyên giáo Trung ương\".",
"Hướng dẫn cấp tỉnh có ký hiệu <b>…/BTGDVTU</b> (TU = tỉnh ủy), khác <b>TW</b>."]}
],

DOCS.push({id:"nq25",group:"party",short:"NQ 25-NQ/TW (2026) – Chiến lược công tác tư tưởng",mmLabel:"NQ 25-NQ/TW (chiến lược công tác tư tưởng)",so:"25-NQ/TW",
title:"Nghị quyết của Bộ Chính trị về Chiến lược công tác tư tưởng trong bối cảnh mới",
meta:[["Cơ quan ban hành","Bộ Chính trị khóa XIV"],["Ngày ban hành","22/8/2026"],["Người ký","Tổng Bí thư, Chủ tịch nước Tô Lâm"],["Kế hoạch thực hiện","Kế hoạch 08-KH/TW ngày 22/8/2026 của Ban Bí thư (Trần Cẩm Tú ký)"],["Hội nghị quán triệt toàn quốc","03/9/2026"],["Bố cục","Tình hình – I. Quan điểm – II. Mục tiêu – III. 8 nhóm nhiệm vụ – IV. Tổ chức thực hiện"]],
tldr:`Lần đầu tiên công tác tư tưởng của Đảng có một <b>nghị quyết chuyên đề mang tầm chiến lược tổng thể</b>. Phương châm <mark>"Chủ động – Sắc bén – Thuyết phục – Hiệu quả"</mark>. Điểm then chốt: chuyển trọng tâm <b>"từ quản lý thông tin sang dẫn dắt nhận thức xã hội"</b>; <b>lấy "xây" làm gốc</b>, lấy thuyết phục làm phương thức chủ đạo; <b>niềm tin của Nhân dân là thước đo cao nhất</b>. <mark>4 quan điểm, 8 nhóm nhiệm vụ, 3 đột phá (nhóm 1, 2, 8)</mark>. Đến 2030 giảm tối thiểu <mark>70%</mark> mức lan tỏa nội dung xấu độc so với 2026.`,
sections:[
{h:"Đánh giá tình hình",items:[
"\"Công tác tư tưởng là bộ phận đặc biệt quan trọng trong toàn bộ hoạt động lãnh đạo của Đảng.\" Qua <b>40 năm đổi mới</b> đạt thành tựu to lớn, có ý nghĩa lịch sử.",
"<b>Hạn chế:</b> một số cấp ủy còn <b>\"khoán trắng\"</b> cho cơ quan chuyên trách; tư duy <b>\"quản lý thông tin\"</b> còn phổ biến; đấu tranh có lúc chưa sắc bén; công tác tư tưởng ở cơ sở chưa theo kịp mô hình chính quyền địa phương 2 cấp; <b>chưa có bộ tiêu chí thống nhất</b> đo lường hiệu quả.",
"<b>Nguyên nhân chủ yếu:</b> <b>chưa có chiến lược tổng thể</b>; nguồn lực chưa tương xứng; đội ngũ chưa đồng đều; phối hợp chưa chặt chẽ."]},
{h:"4 quan điểm chỉ đạo",items:[
"<b>Phương châm:</b> \"Chủ động – Sắc bén – Thuyết phục – Hiệu quả\".",
"<b>(1) Kiên định nền tảng tư tưởng:</b> chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới; học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh là <b>nội dung cốt lõi, xuyên suốt</b>.",
"<b>(2) Vị trí công tác tư tưởng:</b> nội dung đặc biệt quan trọng của công tác xây dựng Đảng; chuyển trọng tâm <b>\"từ quản lý thông tin sang dẫn dắt nhận thức xã hội\"</b>; <b>\"đi trước mở đường, đi cùng trong tổ chức thực hiện, đi sau tổng kết thực tiễn\"</b>; là việc của toàn Đảng, cấp ủy và người đứng đầu trực tiếp lãnh đạo, <b>không \"khoán trắng\"</b>.",
"<b>(3) Kết hợp \"xây\" và \"chống\":</b> <b>lấy \"xây\" làm gốc</b>, lấy \"chống\" làm nhiệm vụ thường xuyên; <b>lấy thuyết phục làm phương thức chủ đạo</b>; triển khai đồng bộ trên <b>không gian thực và không gian số</b>.",
"<b>(4) Con người là trung tâm:</b> đội ngũ cán bộ giữ vai trò then chốt; <b>niềm tin của Nhân dân là thước đo cao nhất</b>; lấy cơ sở, địa bàn dân cư làm trọng tâm; <b>dữ liệu, dự báo, cảnh báo sớm là năng lực nền tảng</b>."]},
{h:"Mục tiêu đến 2030 và tầm nhìn 2045",items:[
"<b>Tổng quát:</b> chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh giữ vai trò chủ đạo trong đời sống tinh thần xã hội; bảo đảm an ninh tư tưởng trong mọi tình huống; tinh thần yêu nước, khát vọng phát triển trở thành <b>nguồn lực nội sinh</b>.",
"<mark>100%</mark> cấp ủy, tổ chức đảng đưa công tác tư tưởng vào chương trình công tác và nội dung kiểm điểm hằng năm.",
"Nhận diện, phản bác <mark>100%</mark> quan điểm sai trái có tác động lớn; ngăn chặn 100% nội dung vi phạm nghiêm trọng; mức lan tỏa nội dung xấu độc trong nước <b>giảm tối thiểu <mark>70%</mark> so với năm 2026</b>; ban hành Quy chế bảo đảm an ninh tư tưởng và cơ chế phản ứng khủng hoảng thông tin.",
"Phấn đấu 100% kiến nghị, phản ánh được trả lời đúng hạn; không để vấn đề ở cơ sở thành \"điểm nóng\".",
"100% cấp xã có lực lượng làm công tác tư tưởng hoạt động thường xuyên và kết nối thông tin hai chiều; mạng lưới <mark>15.000–20.000</mark> người có uy tín, người có ảnh hưởng tích cực.",
"100% cấp xã có cán bộ chuyên trách; đào tạo chuyên sâu <mark>4.000–6.000</mark> cán bộ tuyên giáo nòng cốt; <b>toàn bộ dữ liệu lưu trên hạ tầng số trong nước</b>.",
"<b>Tầm nhìn đến 2045 và xa hơn:</b> công tác tư tưởng trở thành <b>năng lực nội sinh</b> của Đảng và dân tộc; hệ giá trị Việt Nam trở thành <b>sức mạnh mềm quốc gia</b>; giữ vững chủ quyền tư tưởng, văn hóa."]},
{h:"8 nhóm nhiệm vụ (3 đột phá: 1, 2, 8)",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem">
<li><b>(Đột phá)</b> Tăng cường lãnh đạo của Đảng, đổi mới phương thức lãnh đạo công tác tư tưởng: người đứng đầu chịu trách nhiệm; mỗi chủ trương lớn phải <b>đánh giá tác động tư tưởng</b>; dự báo bằng dữ liệu số, AI.</li>
<li><b>(Đột phá)</b> Chuyển trọng tâm về <b>cơ sở, địa bàn dân cư</b>; kết hợp không gian thực và số: mỗi xã, phường, đặc khu có <b>một ủy viên ban thường vụ</b> phụ trách; công tác tư tưởng là <b>nội dung bắt buộc trong sinh hoạt chi bộ</b>; nguyên tắc <b>\"một vụ việc – một đầu mối phát ngôn – một bộ thông điệp thống nhất\"</b>.</li>
<li>Học tập, thực hành tư tưởng, đạo đức, phong cách Hồ Chí Minh; đổi mới giáo dục lý luận chính trị.</li>
<li>Đổi mới quán triệt nghị quyết và <b>truyền thông chính sách</b>: Bí thư cấp ủy trực tiếp quán triệt; từ một chiều sang đối thoại; truyền thông chính sách phải đi trước; chuyển cấp phát dàn trải sang <b>đặt hàng</b>.</li>
<li>Bảo vệ nền tảng tư tưởng, bảo đảm an ninh tư tưởng: lực lượng đấu tranh <b>3 cấp</b> trên cơ sở Ban Chỉ đạo 35; kỷ luật phát ngôn, quy định sử dụng mạng xã hội.</li>
<li>Hệ sinh thái thông tin chính thống, tích cực, nhân văn: đưa <b>văn hóa số, kỹ năng kiểm chứng thông tin</b> vào chương trình giáo dục.</li>
<li>Công tác tư tưởng đối ngoại, thông tin đối ngoại; hướng tới người Việt Nam ở nước ngoài.</li>
<li><b>(Đột phá)</b> Đội ngũ, thể chế, dữ liệu, công nghệ, hạ tầng, kiểm tra, giám sát: khung năng lực; <b>bảo vệ cán bộ dám nói thẳng, dám đấu tranh</b>; số hóa đài truyền thanh cấp xã; bộ chỉ số đánh giá, đánh giá độc lập.</li></ol>`},
{h:"Tổ chức thực hiện",items:[
"Nguyên tắc <b>\"6 rõ\"</b>: rõ người, rõ việc, rõ thời gian, rõ trách nhiệm, rõ sản phẩm, rõ thẩm quyền; <b>mỗi nhiệm vụ chỉ giao một cơ quan chủ trì</b>.",
"<b>Đảng ủy Công an Trung ương</b> chủ trì xây dựng Quy chế bảo đảm an ninh tư tưởng và phản ứng khủng hoảng thông tin; Quân ủy Trung ương cảnh báo sớm thao túng thông tin; Ban Tổ chức Trung ương đưa tiêu chí kỷ luật phát ngôn vào đánh giá cán bộ.",
"<b>Ban Tuyên giáo Trung ương</b>: tham mưu, hướng dẫn, đôn đốc; <b>sơ kết năm 2028</b>; tổng kết trước đại hội đảng bộ các cấp tiến tới <b>Đại hội XV</b>.",
"<b>Kế hoạch 08-KH/TW</b> (Ban Bí thư): ưu tiên nguồn lực cho 2 nhóm nền tảng (giải pháp kỹ thuật bảo vệ nền tảng tư tưởng; hiện đại hóa hạ tầng thông tin cơ sở); <b>không phát sinh tổ chức, biên chế mới</b>.",
"Phát biểu của Tổng Bí thư tại hội nghị 03/9/2026: <b>\"Không lấy cuộc họp, văn bản, báo cáo thay kết quả\"</b>; không gian mạng là \"địa bàn trọng yếu\"."]},
{h:"Liên hệ trách nhiệm của viên chức",items:[
"Mỗi viên chức là một kênh lan tỏa thông tin chính thống; chấp hành kỷ luật phát ngôn và quy định sử dụng mạng xã hội; kiểm chứng trước khi chia sẻ.",
"Giải thích, đối thoại với người dân trong phạm vi công việc; giải quyết kiến nghị đúng hạn để không thành \"điểm nóng\".",
"Học tập và làm theo tư tưởng Hồ Chí Minh gắn với chất lượng công việc và sự hài lòng của người dân."]}
],

CONFUSE.push(
{doc:"ct05",a:"Chỉ thị 05-CT/TW là chỉ thị về học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh?",b:"Đó là <b>Chỉ thị 05-CT/TW ngày 15/5/2016</b> (khóa XII). <b>Chỉ thị 05-CT/TW ngày 30/3/2026</b> (khóa XIV) là về <b>báo chí, truyền thông trên không gian mạng</b>. Sau Đại hội XIV, số hiệu đánh lại từ đầu.",tip:"Luôn kèm năm khi nhắc số hiệu văn bản của Đảng."},
{doc:"ct05",a:"Chỉ thị 05 (báo chí) và Chỉ thị 04 (xuất bản) cùng do Bộ Chính trị ban hành?",b:"Không. <b>Chỉ thị 05</b> (30/3/2026) do <b>Bộ Chính trị</b> ban hành; <b>Chỉ thị 04</b> (17/3/2026) về xuất bản do <b>Ban Bí thư</b> ban hành.",tip:""},
{doc:"ct05",a:"Chiến lược – then chốt – quan trọng",b:"<b>Chuyển đổi số</b> là giải pháp <b>chiến lược</b>; <b>đổi mới tư duy, phương thức</b> là yếu tố <b>then chốt</b>; <b>nhân lực chất lượng cao</b> là nhân tố <b>quan trọng</b>.",tip:"Số – Sách lược lớn; Tư duy – Then chốt; Người – Quan trọng."},
{doc:"ct05",a:"Ai lãnh đạo trực tiếp, toàn diện; ai kiến tạo?",b:"<b>Đảng</b> lãnh đạo trực tiếp và toàn diện. <b>Nhà nước</b> giữ vai trò <b>kiến tạo</b>.",tip:""},
{doc:"hd21",a:"HD 21 và HD 22",b:"<b>HD 21</b>-HD/BTGDVTW hướng dẫn <b>Chỉ thị 05</b> (báo chí). <b>HD 22</b>-HD/BTGDVTW hướng dẫn <b>Chỉ thị 04</b> (xuất bản). Cùng ngày 28/5/2026.",tip:"21 → 05 (báo chí); 22 → 04 (xuất bản)."},
{doc:"nq25",a:"NQ 25-NQ/TW (2026) và NQ 35-NQ/TW (2018)",b:"<b>NQ 35-NQ/TW ngày 22/10/2018</b>: chuyên đề <b>bảo vệ nền tảng tư tưởng</b>, đấu tranh phản bác quan điểm sai trái. <b>NQ 25-NQ/TW ngày 22/8/2026</b>: <b>chiến lược tổng thể</b> về công tác tư tưởng.",tip:"25 bao trùm, 35 chuyên về \"chống\"."},
{doc:"nq25",a:"Ba nhóm đột phá của NQ 25 là 1, 2, 3?",b:"Không. Ba đột phá là nhóm <b>1</b> (lãnh đạo, phương thức), <b>2</b> (về cơ sở, không gian thực và số), <b>8</b> (đội ngũ, thể chế, dữ liệu, công nghệ, hạ tầng).",tip:"1 – 2 – 8."},
{doc:"nq25",a:"Mốc so sánh chỉ tiêu giảm 70% nội dung xấu độc",b:"So với <b>năm 2026</b> (không phải 2025). 15.000–20.000 là số người có uy tín; 4.000–6.000 là số cán bộ tuyên giáo nòng cốt.",tip:""},
{doc:"nq25",a:"Người ký NQ 25 và Kế hoạch 08",b:"NQ 25: <b>Tô Lâm</b> (thay mặt Bộ Chính trị). Kế hoạch 08-KH/TW: <b>Trần Cẩm Tú</b> (thay mặt Ban Bí thư).",tip:""}
);
FLASH.push(
{doc:"ct05",q:"Chỉ thị 05-CT/TW (2026): ai ban hành, ngày nào, về nội dung gì?",a:"<b>Bộ Chính trị</b>, ngày <b>30/3/2026</b>, về tăng cường sự lãnh đạo của Đảng đối với <b>báo chí, truyền thông trên không gian mạng</b> trong tình hình mới."},
{doc:"ct05",q:"Theo Chỉ thị 05, báo chí cách mạng giữ vai trò gì?",a:"<b>Tiên phong, xung kích, trụ cột</b> trên mặt trận tư tưởng của Đảng."},
{doc:"ct05",q:"Bộ ba \"chiến lược – then chốt – quan trọng\" trong Chỉ thị 05?",a:"<b>Chuyển đổi số</b> là giải pháp chiến lược; <b>đổi mới tư duy, phương thức lãnh đạo, quản lý</b> là yếu tố then chốt; <b>nguồn nhân lực chất lượng cao</b> là nhân tố quan trọng."},
{doc:"ct05",q:"Hệ thống báo chí được xây dựng theo hướng nào?",a:"<b>\"Tinh, gọn, mạnh, hiện đại\"</b>; không gian phát triển theo hướng <b>chuyên nghiệp, nhân văn, hiện đại</b>."},
{doc:"ct05",q:"Chỉ thị 05 có bao nhiêu nhóm nhiệm vụ, giải pháp?",a:"<b>10 nhóm</b>."},
{doc:"hd21",q:"HD 21-HD/BTGDVTW: ai ban hành, ngày nào?",a:"<b>Ban Tuyên giáo và Dân vận Trung ương</b>, ngày <b>28/5/2026</b>; hướng dẫn quán triệt, triển khai Chỉ thị 05-CT/TW."},
{doc:"hd21",q:"HD 21 yêu cầu gắn việc quán triệt với những văn bản nào?",a:"<b>Nghị quyết Đại hội XIV</b>, <b>NQ 57-NQ/TW</b> (KHCN, ĐMST, CĐS) và <b>NQ 80-NQ/TW</b> (phát triển văn hóa Việt Nam)."},
{doc:"hd21",q:"Từ 01/8/2026, Ban Tuyên giáo và Dân vận Trung ương có tên gì?",a:"<b>Ban Tuyên giáo Trung ương</b> (QĐ 209-QĐ/TW ngày 31/7/2026); chức năng dân vận chuyển về Đảng ủy MTTQ và các đoàn thể Trung ương."},
{doc:"nq25",q:"Phương châm công tác tư tưởng theo NQ 25-NQ/TW?",a:"<b>\"Chủ động – Sắc bén – Thuyết phục – Hiệu quả\"</b>."},
{doc:"nq25",q:"NQ 25 chuyển trọng tâm công tác tư tưởng như thế nào?",a:"<b>Từ quản lý thông tin sang dẫn dắt nhận thức xã hội</b>; \"đi trước mở đường, đi cùng trong tổ chức thực hiện, đi sau tổng kết thực tiễn\"."},
{doc:"nq25",q:"Quan hệ \"xây\" và \"chống\" theo NQ 25?",a:"<b>Lấy \"xây\" làm gốc</b>, \"chống\" là nhiệm vụ thường xuyên; <b>lấy thuyết phục làm phương thức chủ đạo</b>."},
{doc:"nq25",q:"Thước đo cao nhất của công tác tư tưởng theo NQ 25?",a:"<b>Niềm tin của Nhân dân</b>."},
{doc:"nq25",q:"Ba nhóm nhiệm vụ đột phá của NQ 25?",a:"Nhóm <b>1</b> (lãnh đạo, phương thức lãnh đạo), <b>2</b> (chuyển về cơ sở, kết hợp không gian thực – số), <b>8</b> (đội ngũ, thể chế, dữ liệu, công nghệ, hạ tầng)."},
{doc:"nq25",q:"Nguyên tắc \"6 rõ\" trong NQ 25?",a:"Rõ <b>người</b>, rõ <b>việc</b>, rõ <b>thời gian</b>, rõ <b>trách nhiệm</b>, rõ <b>sản phẩm</b>, rõ <b>thẩm quyền</b>."},
{doc:"nq25",q:"Chỉ tiêu đến 2030 về nội dung xấu độc và mạng lưới người có uy tín?",a:"Giảm <b>tối thiểu 70%</b> mức lan tỏa nội dung xấu độc so với <b>2026</b>; mạng lưới <b>15.000–20.000</b> người có uy tín, có ảnh hưởng tích cực."}
);

{doc:"nq25",q:"Các nhóm nhiệm vụ được xác định là đột phá trong NQ 25-NQ/TW là:",opts:["Nhóm 1, 2 và 8","Nhóm 1, 2 và 3","Nhóm 4, 5 và 6","Nhóm 2, 5 và 8"],ans:0,ex:"Lãnh đạo (1), về cơ sở (2), đội ngũ – thể chế – dữ liệu – hạ tầng (8).",ref:"Mục III"},

{doc:"nq25",q:"Cơ quan nào chủ trì xây dựng Quy chế bảo đảm an ninh tư tưởng và phản ứng khủng hoảng thông tin theo NQ 25?",opts:["Đảng ủy Công an Trung ương","Ban Tuyên giáo Trung ương","Quân ủy Trung ương","Đảng ủy Bộ Văn hóa, Thể thao và Du lịch"],ans:0,ex:"Theo phần Tổ chức thực hiện.",ref:"Mục IV"},
