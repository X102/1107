<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sổ tay ôn thi tuyển dụng viên chức 2026, vị trí Biên tập viên Nhà xuất bản Chính trị quốc gia Sự thật.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231D4E9E' d='M6 5h9a3 3 0 0 1 3 3v19a3 3 0 0 0-3-3H6zM26 5h-5a3 3 0 0 0-3 3v19a3 3 0 0 1 3-3h5z'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Sổ tay ôn thi viên chức 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sổ tay học tập — thanh tab dính trên cùng, mỗi tab là một "trang" của sổ; văn bản đóng khung như công văn có số hiệu đỏ dấu. */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#18202E; --muted:#5B6578; --line:#DCE2EB;
  --accent:#1D4E9E; --accent-soft:#E3ECFA; --seal:#B42318; --seal-soft:#FCE9E7; --mark:#FFE58A; --mark-ink:#18202E;
  --ok:#1E7A46; --ok-soft:#E3F4EA; --party:#9A3412; --party-soft:#FDEEE3; --cong:#9F1D2E; --cong-soft:#FBE7EA; --pro:#0F6E62; --pro-soft:#E1F3EF;
  --f-display:"Literata", "Noto Serif", Georgia, serif;
  --f-body:"Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#161C26; --surface-2:#1C2431; --ink:#E5EAF2; --muted:#9AA5B8; --line:#2A3445;
  --accent:#86AEF5; --accent-soft:#1B2A45; --seal:#F2877C; --seal-soft:#3A1E1D; --mark:#5C4B12; --mark-ink:#FFF3C4;
  --ok:#6FD39A; --ok-soft:#173326; --party:#F5A46B; --party-soft:#3A2416; --cong:#F28B98; --cong-soft:#3A1A20; --pro:#5FD0BD; --pro-soft:#123330;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#161C26; --surface-2:#1C2431; --ink:#E5EAF2; --muted:#9AA5B8; --line:#2A3445;
  --accent:#86AEF5; --accent-soft:#1B2A45; --seal:#F2877C; --seal-soft:#3A1E1D; --mark:#5C4B12; --mark-ink:#FFF3C4;
  --ok:#6FD39A; --ok-soft:#173326; --party:#F5A46B; --party-soft:#3A2416; --cong:#F28B98; --cong-soft:#3A1A20; --pro:#5FD0BD; --pro-soft:#123330;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h2{font-size:1.55rem}
h3{font-size:1.12rem}
a{color:var(--accent)}
mark,.hl{background:var(--mark);color:var(--mark-ink);padding:0 .2em;border-radius:3px}
b,strong{font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* Header */
.masthead{padding-block:28px 18px;display:grid;gap:10px}
.masthead h1{font-size:clamp(1.7rem,3.6vw,2.5rem)}
.masthead p{margin:0;color:var(--muted);max-width:70ch}
.stamp{display:inline-flex;align-items:center;gap:.4em;font-family:var(--f-mono);font-size:.78rem;color:var(--seal);
  border:1.5px solid var(--seal);border-radius:4px;padding:.1em .5em;white-space:nowrap}
.party .stamp,.stamp.party{color:var(--party);border-color:var(--party)}

/* Tabs */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 12px 10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:4px}
main{padding-block:22px 60px}
.view{display:grid;gap:22px}
.view>*,.doc>*,.grid>*,.quiz>*,.qcard>*,.fc-stage>*,.wq>*,.setcard>*,.ivdrill>*{min-width:0}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.view-head p{margin:.3rem 0 0;color:var(--muted);max-width:72ch}

/* Generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
ul.dots{margin:.4rem 0 0;padding-left:1.1rem;display:grid;gap:.35rem}
ul.dots li::marker{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.tag.law{background:var(--accent-soft);color:var(--accent)}
.tag.party{background:var(--party-soft);color:var(--party)}
.tag.congress{background:var(--cong-soft);color:var(--cong)}
.tag.pro{background:var(--pro-soft);color:var(--pro)}
.doc.party .stamp{color:var(--party);border-color:var(--party)}
.doc.congress .stamp{color:var(--cong);border-color:var(--cong)}
.doc.pro .stamp{color:var(--pro);border-color:var(--pro)}
body{margin:0}
.backlink{font-size:.85rem;text-decoration:none;color:var(--muted)}
.backlink:hover{color:var(--accent)}
/* Bộ đề */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.setcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;align-content:start}
.setcard h3{font-size:1.02rem}
.setcard .meta2{font-size:.82rem;color:var(--muted)}
.setcard .best{font-size:.82rem;color:var(--ok)}
.setcard .btn{justify-self:start;margin-top:4px}
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:6px;background:var(--surface-2)}
.timer.low{background:var(--seal-soft);color:var(--seal)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.qgrid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:.8rem;font-variant-numeric:tabular-nums;cursor:pointer}
.qgrid button.ans{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent)}
.qgrid button.right{background:var(--ok-soft);border-color:var(--ok)}
.qgrid button.wrong{background:var(--seal-soft);border-color:var(--seal)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.wq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.wq blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 8px 8px 0;line-height:1.75}
.wq textarea{width:100%;min-height:180px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.wq .pts{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.wq details{border-top:1px dashed var(--line);padding-top:8px}
.wq summary{cursor:pointer;font-weight:600;color:var(--accent)}
/* Phỏng vấn */
.iv details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 15px}
.iv details+details{margin-top:8px}
.iv summary{cursor:pointer;font-weight:600}
.iv .ans{padding-top:8px}
.ivdrill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:10px}
.ivdrill .q{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.callout.warn{border-color:var(--seal);background:var(--seal-soft)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.note-unverified{font-size:.82rem;color:var(--muted);font-style:italic}

/* Overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.checklist{display:grid;gap:2px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:6px;cursor:pointer}
.checklist label:hover{background:var(--surface-2)}
.checklist input{margin-top:.35em;accent-color:var(--ok)}
.plan{width:100%;border-collapse:collapse}
.plan td,.plan th{border-top:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.plan th{font-size:.8rem;color:var(--muted);font-weight:600;border-top:0}
.relmap{display:grid;gap:10px}

/* Docs view */
.docs-layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.doclist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);display:grid;gap:4px;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.doclist .grp{margin:10px 4px 4px}
.docbtn{display:grid;gap:2px;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;cursor:pointer}
.docbtn:hover{background:var(--surface)}
.docbtn[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.docbtn .t{font-weight:500;font-size:.92rem;line-height:1.35}
.docbtn .s{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.docbtn .done{color:var(--ok);font-size:.75rem}
.docselect{display:none}
.golinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.golinks .btn{margin-top:0}
.gsys>*:first-child{margin-top:0}
.gsys ul,.gsys ol{padding-left:1.2em;margin:.3em 0}
.gdlist{display:grid;gap:14px;margin-top:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.gcard>*{min-width:0}
.gcard h3{margin:6px 0 2px;font-family:var(--f-display);font-size:1.12rem;line-height:1.3}
.gstamp{font-family:var(--f-mono);font-size:.74rem;border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-left:8px;color:var(--party)}
.gcard.state .gstamp{color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-radius:8px}
.flow .node{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--surface);overflow-wrap:anywhere}
.flow .node.cur{border-color:var(--party);color:var(--party);font-weight:600}
.gcard.state .flow .node.cur{border-color:var(--accent);color:var(--accent)}
.flow .arr{color:var(--muted)}
.flow .flab{flex-basis:100%;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.flow .flab:last-child{text-align:right}
.gcard details{border-top:1px solid var(--line);padding-top:8px}
.gcard summary{cursor:pointer;font-weight:600}
.gcard details>div{padding-top:6px}
.gcard details>div>*:first-child{margin-top:0}

.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:18px;min-width:0}
.doc-head{display:grid;gap:8px}
.doc-head h2{font-size:1.45rem}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px 18px;margin:0}
.meta div{min-width:0}
.meta dt{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.meta dd{margin:0;font-size:.93rem}
.tldr{background:var(--surface-2);border-radius:8px;padding:12px 16px}
.tldr .eyebrow{margin-bottom:4px}
.sec{display:grid;gap:6px}
.sec h3{display:flex;gap:8px;align-items:baseline}
.sec h3 small{font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted)}
details.acc{border-top:1px solid var(--line);padding-top:10px}
details.acc>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.acc[open]>summary::after{content:"–"}
details.acc>div{padding-top:8px}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srcs{font-size:.84rem;word-break:break-word}

/* Numbers table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.nums{width:100%;border-collapse:collapse;min-width:620px}
table.nums th,table.nums td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.nums th{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
table.nums td.v{font-family:var(--f-display);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
table.nums td.v span{background:var(--mark);color:var(--mark-ink);padding:0 .3em;border-radius:3px}
table.nums td.r{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
@media (max-width:640px){table.bktable{min-width:0}table.bktable thead{display:none}table.bktable,table.bktable tbody,table.bktable tr,table.bktable td{display:block}table.bktable tr{padding:10px 14px;border-bottom:1px solid var(--line)}table.bktable tr:last-child{border-bottom:0}table.bktable td{padding:1px 0;border:0}table.bktable td:empty{display:none}table.bktable td.bt{font-weight:600;margin-bottom:3px}table.bktable td.ba,table.bktable td.bw{display:inline;font-size:.86rem;color:var(--muted)}table.bktable td.ba:not(:empty)::after{content:" · "}table.bktable td.bn{font-size:.9rem;margin-top:3px}}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Confusions */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pair>div{padding:12px 14px;min-width:0}
.pair>div+div{border-left:1px solid var(--line)}
.pair .tip{grid-column:1/-1;border-left:0!important;border-top:1px solid var(--line);background:var(--seal-soft);font-size:.92rem}
.pair .lab{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* Flashcards */
.fc-stage{display:grid;gap:14px;justify-items:center}
.fc{width:min(100%,640px);min-height:250px;perspective:1200px;cursor:pointer;border:0;background:none;padding:0}
.fc-inner{display:grid;width:100%;min-height:250px;transition:transform .45s;transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);padding:22px 26px;display:grid;align-content:center;gap:10px;text-align:left}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.fc-face .q{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.35}
.fc-face .a{font-size:1.05rem}
.fc-meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.fc-ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}

/* Quiz */
.quiz{display:grid;gap:14px;max-width:820px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px}
.qtext{font-family:var(--f-display);font-size:1.15rem;font-weight:700;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.explain{font-size:.94rem}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:2.2rem;font-weight:700}

/* Essay */
.essay{display:grid;gap:10px}
.essay details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.essay summary{cursor:pointer;font-weight:600}
.essay ol{margin:.5rem 0 0;padding-left:1.2rem;display:grid;gap:.3rem}

/* Mind map */
.mm-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:min(74vh,760px);overflow:hidden;touch-action:none}
.mm-wrap svg{width:100%;height:100%;display:block;cursor:grab}
.mm-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mm-link{fill:none;stroke:var(--line);stroke-width:1.5px}
.mm-node rect{fill:var(--surface);stroke:var(--line);stroke-width:1px}

const OVERVIEW={
sub:"Bộ ôn thi cho vị trí Biên tập viên: pháp luật về viên chức, chủ trương của Đảng, văn kiện Đại hội Đảng (trọng tâm Đại hội XIV), kiến thức chuyên môn xuất bản – biên tập. Có tóm tắt, bản đồ tư duy, bảng con số, điểm dễ nhầm, thẻ ghi nhớ, bộ đề thi thử có tính giờ, đề viết 90 phút có đáp án gợi ý và phần chuẩn bị phỏng vấn.",

intro:"Theo Nghị định 259/2026/NĐ-CP, vòng 1 thi tuyển viên chức là <b>trắc nghiệm trên máy tính</b>: phần <b>kiến thức chung 60 câu trong 60 phút</b> (pháp luật viên chức, chủ trương đường lối của Đảng, pháp luật của ngành), phải đúng <b>từ 50% số câu</b> mới vào vòng 2. Vòng 2 thi môn nghiệp vụ chuyên ngành bằng thực hành, hoặc viết kết hợp phỏng vấn; bài viết trên máy tính có thể là 60–120 câu trong 90–180 phút. Ôn theo thứ tự: thuộc con số và cụm từ then chốt của phần kiến thức chung, nắm chắc văn kiện Đại hội XIV, luyện nghiệp vụ biên tập bằng đề viết, cuối cùng tập phỏng vấn.",
relations:[
"<span class=\"tag law\">Pháp luật</span> <b>Luật Viên chức 129/2025/QH15</b> là luật khung, hiệu lực <b>01/7/2026</b>. Ba nghị định hướng dẫn có hiệu lực cùng ngày: <b>NĐ 259</b> (tuyển dụng, sử dụng, quản lý), <b>NĐ 233</b> (đánh giá, xếp loại), <b>NĐ 234</b> (kỷ luật). <b>NĐ 299</b> (tổ chức ĐVSNCL) có hiệu lực muộn hơn, ngày <b>28/7/2026</b>.",
"<span class=\"tag law\">Pháp luật</span> Mỗi nghị định mới thay một nghị định năm 2020: NĐ 259 thay <b>NĐ 115/2020</b>; NĐ 233 thay <b>NĐ 90/2020</b>; NĐ 234 thay <b>NĐ 112/2020</b>; NĐ 299 thay <b>NĐ 120/2020</b>.",
"<span class=\"tag party\">Đảng</span> <b>NQ 27-NQ/TW (2022)</b> về Nhà nước pháp quyền là định hướng chung; <b>NQ 66-NQ/TW (2025)</b> đổi mới xây dựng và thi hành pháp luật để tháo gỡ \"điểm nghẽn\" thể chế; <b>NQ 57-NQ/TW (2024)</b> về KHCN, đổi mới sáng tạo, chuyển đổi số. Các luật, nghị định 2025–2026 về viên chức là sản phẩm thể chế hóa các nghị quyết này.",
"<span class=\"tag party\">Đảng</span> <b>Chỉ thị 05-CT/TW</b> (30/3/2026, báo chí trên không gian mạng) → <b>HD 21-HD/BTGDVTW</b> (28/5/2026) hướng dẫn triển khai → <b>NQ 25-NQ/TW</b> (22/8/2026) chiến lược tổng thể về công tác tư tưởng.",
"<span class=\"tag congress\">Đại hội Đảng</span> <b>Văn kiện Đại hội XIV</b> (01/2026) là nền tảng của mọi văn bản năm 2026: các nghị quyết, chỉ thị sau Đại hội đều cụ thể hóa đường lối này. Với biên tập viên NXB Chính trị quốc gia Sự thật, văn kiện Đại hội vừa là kiến thức thi vừa là chất liệu nghề nghiệp.",
"<span class=\"tag pro\">Chuyên môn</span> <b>Chỉ thị 04-CT/TW</b> (Ban Bí thư, 17/3/2026) về xuất bản đi cặp với <b>Chỉ thị 05-CT/TW</b> (Bộ Chính trị, 30/3/2026) về báo chí; <b>HD 22</b> hướng dẫn Chỉ thị 04, <b>HD 21</b> hướng dẫn Chỉ thị 05. Cùng với pháp luật về xuất bản và nghiệp vụ biên tập, đây là trục của phần chuyên môn.",
"<b>Điểm giao để viết tự luận:</b> Luật Viên chức Điều 10 cấm viên chức <b>đăng tải, phát tán thông tin sai lệch</b>; Chỉ thị 05 và NQ 25 yêu cầu kỷ luật phát ngôn, làm chủ không gian mạng. Đây là chỗ dễ ra câu \"liên hệ trách nhiệm của viên chức\"."

tldr:`Luật "khung", gọn hơn luật 2010 (43 điều so với 62 điều). Ba thay đổi lớn: (1) chuyển từ quản lý theo <b>chức danh nghề nghiệp, hạng</b> sang <b>vị trí việc làm</b> (bỏ thăng hạng, bỏ tập sự); (2) <b>đánh giá định lượng</b> theo kết quả công việc, xếp loại <b>không hoàn thành nhiệm vụ</b> có thể bị chấm dứt hợp đồng; (3) <b>mở quyền</b> cho viên chức được góp vốn, tham gia quản lý, điều hành doanh nghiệp, ký hợp đồng bên ngoài. Kỷ luật: <mark>4 hình thức</mark>, thời hiệu <mark>05 năm</mark> (khiển trách) / <mark>10 năm</mark> (vi phạm khác).`,
sections:[
{h:"Bố cục 6 chương, 43 điều",html:`<div class="tablewrap"><table class="nums" style="min-width:520px"><thead><tr><th>Chương</th><th>Tên</th><th>Điều</th></tr></thead><tbody>
<tr><td>I</td><td>Những quy định chung (viên chức, nguyên tắc, giải thích từ ngữ, chính sách)</td><td class="r">1–6</td></tr>
<tr><td>II</td><td>Nghĩa vụ, quyền của viên chức (Mục 1 nghĩa vụ; Mục 2 quyền)</td><td class="r">7–14</td></tr>
<tr><td>III</td><td>Tuyển dụng, sử dụng viên chức (6 mục: tuyển dụng; vị trí việc làm; đánh giá; đào tạo, bồi dưỡng; bổ nhiệm, biệt phái, từ chức, miễn nhiệm, cho thôi giữ chức vụ, điều động; thôi việc, nghỉ hưu)</td><td class="r">15–32</td></tr>
<tr><td>IV</td><td>Khen thưởng, xử lý kỷ luật</td><td class="r">33–38</td></tr>
<tr><td>V</td><td>Quản lý viên chức</td><td class="r">39–41</td></tr>
<tr><td>VI</td><td>Điều khoản thi hành</td><td class="r">42–43</td></tr></tbody></table></div>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Mẹo nhớ số điều mỗi chương: 6 – 8 – 18 – 6 – 3 – 2.</p>`},
{h:"Khái niệm phải thuộc nguyên văn",items:[
"<b>Viên chức (Điều 1):</b> \"là công dân Việt Nam, được tuyển dụng theo <b>vị trí việc làm</b>, làm việc tại <b>đơn vị sự nghiệp công lập</b> theo chế độ <b>hợp đồng làm việc</b>, hưởng lương từ quỹ tiền lương của đơn vị sự nghiệp công lập <b>và từ các nguồn thu hợp pháp khác</b> theo quy định của pháp luật.\"",
"<b>Đơn vị sự nghiệp công lập (khoản 1 Điều 5):</b> tổ chức do cơ quan có thẩm quyền thành lập, <b>có tư cách pháp nhân</b>, hoạt động <b>không vì mục tiêu lợi nhuận</b>, cung cấp dịch vụ công phục vụ xã hội, hỗ trợ thực hiện nhiệm vụ quản lý nhà nước.",
"<b>Hợp đồng làm việc (khoản 1 Điều 20):</b> sự thỏa thuận bằng văn bản giữa viên chức (hoặc người được tuyển dụng) với <b>người đứng đầu ĐVSNCL</b> về vị trí việc làm, tiền lương, chế độ đãi ngộ, điều kiện làm việc, quyền, nghĩa vụ…",
"<b>Vị trí việc làm (Điều 4):</b> \"là công việc gắn với chức vụ, chức danh viên chức trên cơ sở chức năng, nhiệm vụ của đơn vị sự nghiệp công lập.\"",
"<b>Viên chức quản lý:</b> người được bổ nhiệm giữ chức vụ quản lý <b>có thời hạn</b>, chịu trách nhiệm điều hành, tổ chức thực hiện công việc trong ĐVSNCL.",
"<b>Điều 4 giải thích 11 thuật ngữ:</b> hoạt động nghề nghiệp, viên chức quản lý, đạo đức nghề nghiệp, quy tắc ứng xử, vị trí việc làm, điều động, bổ nhiệm, biệt phái, từ chức, miễn nhiệm, tạm đình chỉ công tác.",
"<b>Từ chức</b> = viên chức quản lý <b>tự nguyện</b> xin thôi giữ chức vụ khi chưa hết thời hạn. <b>Miễn nhiệm</b> = <b>cấp có thẩm quyền quyết định</b> cho thôi giữ chức vụ khi chưa hết thời hạn.",
"Luật mới <b>không còn điều định nghĩa \"chức danh nghề nghiệp\"</b> như Luật 2010."]},
{h:"Nguyên tắc (Điều 2, 3)",items:[
"<b>5 nguyên tắc hoạt động nghề nghiệp:</b> gắn với lĩnh vực của đơn vị; tuân thủ Hiến pháp, pháp luật; đúng quy trình chuyên môn, đạo đức nghề nghiệp, quy tắc ứng xử, chịu sự giám sát của cơ quan có thẩm quyền và của Nhân dân; phục vụ Nhân dân \"tôn trọng, tận tụy, văn minh, lịch sự\"; bảo đảm chất lượng, hiệu quả, không ngừng học tập.",
"<b>5 nguyên tắc quản lý:</b> (1) bảo đảm sự lãnh đạo của Đảng, sự quản lý của Nhà nước; (2) tuyển dụng, sử dụng, quản lý <b>theo vị trí việc làm và căn cứ vào hợp đồng làm việc</b>; (3) phân cấp, phân quyền, bảo đảm <b>quyền tự chủ toàn diện của ĐVSNCL gắn với trách nhiệm người đứng đầu</b>; (4) bình đẳng giới; (5) ứng dụng KHCN, chuyển đổi số, <b>khuyến khích, bảo vệ viên chức dám nghĩ, dám làm, dám đột phá, dám chịu trách nhiệm</b> vì lợi ích chung.",
"<b>Chính sách (Điều 6):</b> bồi dưỡng thường xuyên, định kỳ; <b>liên thông nguồn nhân lực giữa khu vực công và khu vực tư</b>; tiền lương công bằng, cạnh tranh, gắn với vị trí việc làm và hiệu quả công việc."]},
{h:"Nghĩa vụ, quyền, những việc không được làm",items:[
"<b>Nghĩa vụ chung (Điều 7, 5 khoản):</b> trung thành với Đảng, Nhà nước; đạo đức trong sáng, mẫu mực; chấp hành đường lối, pháp luật; bảo vệ bí mật nhà nước, tài sản công; tu dưỡng đạo đức nghề nghiệp, quy tắc ứng xử.",
"<b>Nghĩa vụ trong hoạt động nghề nghiệp (Điều 8):</b> ứng dụng KHCN, chuyển đổi số; báo cáo khi phát hiện vi phạm; không hách dịch, cửa quyền; và <b>chỉ được ký hợp đồng làm việc với <mark>01</mark> ĐVSNCL</b>.",
"<b>Viên chức quản lý (Điều 9)</b> thêm 8 nghĩa vụ: chịu trách nhiệm về kết quả của đơn vị; chịu trách nhiệm khi để xảy ra quan liêu, tham nhũng, lãng phí; cắt giảm tối đa thủ tục hành chính…",
"<b>Những việc không được làm (Điều 10, 7 khoản):</b> trốn tránh, đùn đẩy nhiệm vụ, gây bè phái, <b>tự ý nghỉ việc, bỏ việc, tham gia đình công</b>, <b>đăng tải, phát tán, phát ngôn thông tin sai lệch</b> làm ảnh hưởng uy tín đất nước, đơn vị; lợi dụng hoạt động nghề nghiệp tuyên truyền chống chủ trương của Đảng, pháp luật; tham ô, tham nhũng, trục lợi, nhũng nhiễu; sử dụng trái phép tài sản công; phân biệt đối xử; xúc phạm danh dự người khác; các việc cấm khác theo luật phòng chống tham nhũng, bảo vệ bí mật nhà nước…",
"<b>Quyền về hoạt động nghề nghiệp (Điều 11, 9 khoản):</b> được pháp luật bảo vệ, được đào tạo, được quyết định vấn đề chuyên môn, <b>được từ chối nhiệm vụ trái pháp luật</b>, <b>được đơn phương chấm dứt hợp đồng</b>, được xem xét loại trừ, miễn, giảm trách nhiệm.",
"<b>Quyền về hoạt động kinh doanh (Điều 13):</b> được ký hợp đồng lao động/hợp đồng dịch vụ với tổ chức khác (nếu không cấm, không xung đột lợi ích; cần đồng ý bằng văn bản của người đứng đầu nếu hợp đồng làm việc chưa thỏa thuận); được hành nghề cá nhân; <b>được góp vốn, tham gia quản lý, điều hành</b> doanh nghiệp, hợp tác xã, bệnh viện, trường học ngoài công lập (luật cũ chỉ cho góp vốn, <b>không</b> tham gia quản lý, điều hành).",
"<b>Quyền nghỉ ngơi (Điều 14):</b> ngày phép năm không nghỉ hết vì yêu cầu công việc được thanh toán theo quy chế chi tiêu nội bộ; bị thương hoặc hy sinh khi làm nhiệm vụ được xem xét hưởng chế độ như thương binh hoặc công nhận liệt sĩ."]},
{h:"Tuyển dụng và hợp đồng",items:[
"<b>Căn cứ tuyển dụng (Điều 15):</b> nhu cầu thực tế, vị trí việc làm, quỹ tiền lương và nguồn thu hợp pháp khác.",
"<b>Nguyên tắc tuyển dụng (Điều 16):</b> công khai, minh bạch, khách quan, cạnh tranh, bình đẳng; đúng nhu cầu; người được tuyển phải <b>đáp ứng ngay</b> yêu cầu vị trí việc làm; ưu tiên người có công, người dân tộc thiểu số, quân nhân phục viên…",
"<b>Phương thức (Điều 17):</b> (1) <b>thi tuyển</b>; (2) <b>xét tuyển</b>; (3) <b>tiếp nhận</b> chuyên gia, nhà khoa học, người có tài năng, người đang ký hợp đồng làm việc tại ĐVSNCL. Cán bộ, công chức, người hưởng lương trong Quân đội, Công an, cơ yếu được chuyển sang viên chức <b>không phải qua tuyển dụng</b>.",
"<b>Điều kiện dự tuyển (Điều 19, 8 điểm):</b> có <b>01 quốc tịch</b> Việt Nam; cư trú tại Việt Nam; <b>đủ 18 tuổi</b> (trừ ngành đặc thù); có đăng ký dự tuyển; phẩm chất chính trị, đạo đức tốt, lý lịch rõ ràng; đủ sức khỏe; đáp ứng yêu cầu vị trí việc làm; tiêu chuẩn khác.",
"<b>Không được dự tuyển:</b> mất hoặc hạn chế năng lực hành vi dân sự, có khó khăn trong nhận thức, làm chủ hành vi; đang bị truy cứu trách nhiệm hình sự, đang chấp hành án hoặc <b>chưa được xóa án tích</b>; đang ở cơ sở cai nghiện bắt buộc, cơ sở giáo dục bắt buộc.",
"<b>Hợp đồng làm việc có 2 loại (Điều 20):</b> xác định thời hạn và không xác định thời hạn. Luật <b>bỏ khung 12–60 tháng</b> của luật 2019. Người đứng đầu ĐVSNCL ký hợp đồng.",
"<b>Hợp đồng lao động, hợp đồng dịch vụ (Điều 21):</b> thuê chuyên gia, nhà khoa học, luật sư giỏi, doanh nhân tiêu biểu vào cả <b>vị trí quản lý, điều hành</b>; vị trí hỗ trợ cũng ký loại này. Lĩnh vực văn hóa, nghệ thuật, thể thao có tuổi nghề dưới 18 thì ký theo Bộ luật Lao động. <b>Không ký</b> cho công việc liên quan an ninh quốc gia, bí mật nhà nước.",
"<b>Chấm dứt hợp đồng (Điều 22):</b> ngoài pháp luật lao động, dân sự, còn chấm dứt khi bị kỷ luật <b>buộc thôi việc</b> hoặc bị xếp loại <b>không hoàn thành nhiệm vụ</b> vì lý do chuyên môn hoặc không đáp ứng yêu cầu vị trí việc làm."]},
{h:"Vị trí việc làm và đánh giá",items:[
"<b>Vị trí việc làm (Điều 23):</b> 4 căn cứ xác định (chức năng nhiệm vụ; mức độ phức tạp, quy mô; chuyên môn của ngành; mức độ hiện đại hóa, chuyển đổi số); 2 nội dung (tên gọi; <b>bản mô tả công việc và khung năng lực</b>); <b>3 loại</b>: quản lý; chuyên môn, nghiệp vụ; hỗ trợ.",
"<b>Nguyên tắc đánh giá (Điều 25):</b> dân chủ, công khai, khách quan, <b>xuyên suốt, liên tục, đa chiều</b>; nội dung phải được <b>định lượng</b> theo kết quả công việc của vị trí việc làm; ứng dụng chuyển đổi số; gắn với lương, thưởng.",
"<b>5 nội dung đánh giá:</b> phẩm chất, đạo đức, kỷ luật; năng lực chuyên môn, tinh thần trách nhiệm, thái độ phục vụ; <b>năng lực đổi mới sáng tạo, dám nghĩ, dám làm, dám chịu trách nhiệm</b>; kết quả theo số lượng, chất lượng, tiến độ sản phẩm; nội dung khác.",
"<b>Thẩm quyền:</b> người đứng đầu ĐVSNCL đánh giá viên chức; <b>người đứng đầu ĐVSNCL do cấp trên quản lý trực tiếp đánh giá</b>.",
"<b>4 mức xếp loại hằng năm (Điều 26):</b> hoàn thành xuất sắc nhiệm vụ; hoàn thành tốt nhiệm vụ; hoàn thành nhiệm vụ; không hoàn thành nhiệm vụ. Kết quả dùng để đào tạo, quy hoạch, bổ nhiệm, trả lương, thưởng; không hoàn thành nhiệm vụ thì có thể bố trí vị trí thấp hơn hoặc cho thôi việc.",
"<b>Kiến nghị về kết quả xếp loại (Điều 27, mới):</b> trong <mark>05 ngày</mark> kể từ ngày công khai; giải quyết trong <mark>10 ngày làm việc</mark>; <b>không xem xét lại</b> kết quả giải quyết kiến nghị."]},
{h:"Đào tạo, bổ nhiệm, thôi việc, nghỉ hưu",items:[
"<b>Đào tạo (Điều 28–29):</b> viên chức được cử đi học hưởng lương, thời gian học tính là thời gian công tác liên tục; đã được đào tạo mà tự ý bỏ việc hoặc đơn phương chấm dứt hợp đồng thì <b>phải đền bù chi phí đào tạo</b>.",
"<b>Bổ nhiệm (Điều 30):</b> thời hạn <mark>05 năm</mark> (luật cũ ghi \"không quá 05 năm\"), một số chức danh đặc thù dưới 05 năm. Biệt phái, từ chức, miễn nhiệm, cho thôi giữ chức vụ theo quy định của cấp có thẩm quyền và của Chính phủ.",
"<b>Điều động (Điều 31):</b> chuyển viên chức giữa các ĐVSNCL trong phạm vi quản lý, chỉ trong các trường hợp theo quy định của Đảng hoặc pháp luật về hoạt động nghề nghiệp.",
"<b>Thôi việc, nghỉ hưu (Điều 32):</b> theo pháp luật lao động, BHXH; Luật không ghi tuổi nghỉ hưu cụ thể."]},
{h:"Khen thưởng, kỷ luật, quản lý",items:[
"<b>Khen thưởng (Điều 33):</b> thành tích xuất sắc được <b>nâng lương trước thời hạn</b>, thưởng, ưu tiên khi xét bổ nhiệm chức vụ cao hơn.",
"<b>Loại trừ, miễn, giảm trách nhiệm (Điều 34, mới):</b> làm đúng thẩm quyền, quy trình, không vụ lợi nhưng gây thiệt hại vì lý do khách quan; thực hiện đề xuất đổi mới sáng tạo đã được cho phép, động cơ trong sáng, vì lợi ích chung; bất khả kháng; trường hợp khác.",
"<b>4 hình thức kỷ luật (Điều 35):</b> khiển trách; cảnh cáo; <b>cách chức (chỉ với viên chức quản lý)</b>; buộc thôi việc. <b>Đương nhiên buộc thôi việc</b> khi bị phạt tù không hưởng án treo hoặc bị kết án về <b>tội tham nhũng</b>.",
"<b>Thời hiệu (Điều 36), tính từ khi có hành vi vi phạm:</b> <mark>05 năm</mark> với vi phạm mức khiển trách; <mark>10 năm</mark> với vi phạm khác. <b>Không áp dụng thời hiệu</b>: đảng viên vi phạm đến mức khai trừ; vi phạm bảo vệ chính trị nội bộ; xâm hại lợi ích quốc gia về quốc phòng, an ninh, đối ngoại; dùng văn bằng, chứng chỉ giả hoặc không hợp pháp.",
"<b>Thời hạn xử lý kỷ luật</b>, tính từ khi phát hiện: <mark>không quá 90 ngày</mark>; vụ việc phức tạp <mark>không quá 150 ngày</mark>.",
"<b>Đang trong thời hạn xử lý kỷ luật, đang bị điều tra, truy tố, xét xử</b> thì không được ứng cử, đề cử, bổ nhiệm, điều động, biệt phái, đào tạo, bồi dưỡng (Điều 37). Bị cách chức do tham nhũng thì không được bổ nhiệm vào vị trí quản lý.",
"<b>Viên chức đã nghỉ việc, nghỉ hưu (Điều 42):</b> vi phạm trong thời gian công tác vẫn bị xử lý: khiển trách, cảnh cáo, <b>xóa tư cách chức vụ đã đảm nhiệm</b>.",
"<b>Quản lý (Điều 39–41):</b> Chính phủ thống nhất quản lý nhà nước về viên chức; Bộ, cơ quan ngang bộ, UBND cấp tỉnh thực hiện theo phân công, phân cấp; hồ sơ viên chức gồm <b>hồ sơ giấy và hồ sơ điện tử</b>, cập nhật vào CSDL quốc gia."]},
{h:"Điều khoản chuyển tiếp (Điều 43)",items:[
"Hiệu lực <mark>01/7/2026</mark>; Luật 58/2010/QH12 (sửa đổi 2019) hết hiệu lực.",
"Chậm nhất <mark>01/7/2027</mark>: hoàn thành bố trí vị trí việc làm và xếp lương tương ứng cho viên chức tuyển dụng trước ngày Luật có hiệu lực.",
"Người <b>đang tập sự</b> theo luật cũ được xếp lương tương ứng với vị trí việc làm tuyển dụng.",
"Viên chức tuyển dụng <b>trước 01/7/2003</b> được quản lý như viên chức ký hợp đồng không xác định thời hạn; tuyển dụng từ 01/7/2003 đến trước 01/7/2026 tiếp tục thực hiện hợp đồng đã ký."]},
{h:"Điểm mới so với Luật Viên chức 2010/2019",items:[
"Luật khung 43 điều (giảm 19 điều); nhiều nội dung giao Chính phủ quy định.",
"Khái niệm viên chức thêm nguồn lương <b>\"từ các nguồn thu hợp pháp khác\"</b>.",
"Quản lý theo <b>vị trí việc làm</b>, bỏ chức danh nghề nghiệp, hạng, bỏ thi/xét thăng hạng.",
"<b>Bỏ chế độ tập sự</b> (luật cũ: tập sự 03–12 tháng).",
"Bỏ khung hợp đồng xác định thời hạn 12–60 tháng; tách hợp đồng làm việc với hợp đồng lao động, hợp đồng dịch vụ; chỉ ký hợp đồng làm việc với 01 đơn vị.",
"Thêm phương thức <b>tiếp nhận</b>; chuyển CB, CC, LLVT sang viên chức không qua tuyển dụng; điều kiện <b>01 quốc tịch</b>.",
"Quyền kinh doanh chuyển từ \"cấm để phòng ngừa\" sang \"mở để quản lý\": được góp vốn <b>và</b> quản lý, điều hành.",
"Đánh giá định lượng, đa chiều; thêm cơ chế kiến nghị 05 ngày / 10 ngày làm việc.",
"Thêm Điều 34 loại trừ, miễn, giảm trách nhiệm; bảo vệ người dám nghĩ, dám làm.",
"Thời hiệu kỷ luật tăng từ 02/05 năm lên <b>05/10 năm</b>; tạm đình chỉ giao Chính phủ quy định.",
"Hồ sơ điện tử, cơ sở dữ liệu quốc gia."]}
],

CONFUSE.push(
{doc:"luatvc",a:"Thời hiệu và thời hạn xử lý kỷ luật",b:"<b>Thời hiệu</b> tính từ thời điểm <b>có hành vi vi phạm</b>: 05 năm (khiển trách) / 10 năm (vi phạm khác). <b>Thời hạn</b> tính từ khi <b>phát hiện vi phạm</b> đến khi ra quyết định: 90 ngày / 150 ngày.",tip:"Thời HIỆU tính bằng NĂM, thời HẠN tính bằng NGÀY."},
{doc:"luatvc",a:"Luật Viên chức thay thế Luật Cán bộ, công chức?",b:"Không. Luật 129/2025 thay <b>Luật Viên chức 58/2010/QH12</b> (sửa đổi 2019). Luật Cán bộ, công chức mới là <b>Luật 80/2025/QH15</b>, hiệu lực 01/7/2025.",tip:"Viên chức: 129 – hiệu lực 01/7/2026. Cán bộ, công chức: 80 – hiệu lực 01/7/2025."},
{doc:"luatvc",a:"Viên chức có hình thức kỷ luật hạ bậc lương, giáng chức?",b:"Không. Luật Viên chức chỉ có 4 hình thức: khiển trách, cảnh cáo, <b>cách chức (chỉ với viên chức quản lý)</b>, buộc thôi việc. Người đã nghỉ hưu: khiển trách, cảnh cáo, <b>xóa tư cách chức vụ đã đảm nhiệm</b>.",tip:"\"Giáng chức\", \"hạ bậc lương\" là hình thức của công chức."},
{doc:"luatvc",a:"Phạt tù cho hưởng án treo có đương nhiên bị buộc thôi việc?",b:"Không, <b>trừ khi</b> bị kết án về <b>tội tham nhũng</b>. Đương nhiên buộc thôi việc khi bị phạt tù <b>không hưởng án treo</b> hoặc bị kết án về tội tham nhũng.",tip:"Tham nhũng thì dù án treo vẫn bị buộc thôi việc."},
{doc:"luatvc",a:"Viên chức chỉ được làm việc cho 01 đơn vị?",b:"Chỉ được ký <b>hợp đồng làm việc</b> với 01 ĐVSNCL, nhưng <b>vẫn được</b> ký hợp đồng lao động, hợp đồng dịch vụ với nơi khác và góp vốn, quản lý, điều hành doanh nghiệp ngoài công lập nếu không xung đột lợi ích.",tip:"\"01\" chỉ áp dụng cho hợp đồng làm việc."},
{doc:"luatvc",a:"Mốc hợp đồng không xác định thời hạn: 01/7/2020?",b:"Theo Luật 2025, mốc là <b>trước 01/7/2003</b> (khoản 5 Điều 43). Mốc 01/7/2020 là của Luật sửa đổi 2019 (và được NĐ 259 dùng cho trường hợp đã ký từ 2 lần hợp đồng xác định thời hạn).",tip:"Luật: 2003. Nghị định 259: giai đoạn 2020–2026, ký 2 lần."},
{doc:"luatvc",a:"Từ chức và miễn nhiệm",b:"<b>Từ chức</b>: viên chức quản lý <b>tự nguyện</b> xin thôi giữ chức vụ khi chưa hết thời hạn. <b>Miễn nhiệm</b>: <b>cấp có thẩm quyền</b> quyết định cho thôi giữ chức vụ khi chưa hết thời hạn.",tip:"Từ chức là tự mình, miễn nhiệm là cấp trên."}
);
FLASH.push(
{doc:"luatvc",q:"Khái niệm viên chức theo Điều 1 Luật Viên chức 2025?",a:"Công dân Việt Nam, được tuyển dụng theo <b>vị trí việc làm</b>, làm việc tại <b>ĐVSNCL</b> theo chế độ <b>hợp đồng làm việc</b>, hưởng lương từ quỹ tiền lương của ĐVSNCL <b>và từ các nguồn thu hợp pháp khác</b>."},
{doc:"luatvc",q:"Luật Viên chức 129/2025/QH15: thông qua, hiệu lực, bố cục?",a:"Thông qua <b>10/12/2025</b> (kỳ họp 10, QH khóa XV); hiệu lực <b>01/7/2026</b>; <b>6 chương, 43 điều</b>."},
{doc:"luatvc",q:"Bốn hình thức kỷ luật viên chức?",a:"Khiển trách; cảnh cáo; <b>cách chức</b> (chỉ với viên chức quản lý); buộc thôi việc."},
{doc:"luatvc",q:"Thời hiệu xử lý kỷ luật viên chức?",a:"<b>05 năm</b> với vi phạm mức khiển trách; <b>10 năm</b> với vi phạm khác (tính từ thời điểm có hành vi vi phạm)."},
{doc:"luatvc",q:"Thời hạn xử lý kỷ luật viên chức?",a:"Không quá <b>90 ngày</b>; vụ việc phức tạp không quá <b>150 ngày</b> (tính từ khi phát hiện vi phạm)."},
{doc:"luatvc",q:"4 trường hợp không áp dụng thời hiệu kỷ luật?",a:"Đảng viên vi phạm đến mức khai trừ; vi phạm bảo vệ chính trị nội bộ; xâm hại lợi ích quốc gia về quốc phòng, an ninh, đối ngoại; dùng văn bằng, chứng chỉ giả hoặc không hợp pháp."},
{doc:"luatvc",q:"Ba phương thức tuyển dụng theo Điều 17?",a:"<b>Thi tuyển</b>, <b>xét tuyển</b>, <b>tiếp nhận</b>. Ngoài ra CB, CC, người hưởng lương trong QĐ, CA, cơ yếu được chuyển sang viên chức không qua tuyển dụng."},
{doc:"luatvc",q:"Ba loại vị trí việc làm?",a:"Vị trí <b>quản lý</b>; vị trí <b>chuyên môn, nghiệp vụ</b>; vị trí <b>hỗ trợ</b>."},
{doc:"luatvc",q:"Bốn mức xếp loại chất lượng viên chức?",a:"Hoàn thành xuất sắc nhiệm vụ; hoàn thành tốt nhiệm vụ; hoàn thành nhiệm vụ; không hoàn thành nhiệm vụ."},
{doc:"luatvc",q:"Thời hạn kiến nghị về kết quả xếp loại chất lượng?",a:"Kiến nghị trong <b>05 ngày</b> kể từ ngày công khai; giải quyết trong <b>10 ngày làm việc</b>; không xem xét lại kết quả giải quyết."},
{doc:"luatvc",q:"Điểm mới về quyền kinh doanh của viên chức?",a:"Được góp vốn <b>và tham gia quản lý, điều hành</b> doanh nghiệp, HTX, bệnh viện, cơ sở giáo dục, tổ chức KHCN ngoài công lập; được hành nghề cá nhân; được ký HĐLĐ/HĐDV bên ngoài (luật cũ chỉ cho góp vốn)."},
{doc:"luatvc",q:"Những trường hợp được loại trừ, miễn, giảm trách nhiệm (Điều 34)?",a:"Làm đúng thẩm quyền, quy trình, không vụ lợi nhưng gây thiệt hại vì lý do khách quan; thực hiện đề xuất đổi mới sáng tạo đã được cho phép, vì lợi ích chung; bất khả kháng; trường hợp khác."},
{doc:"luatvc",q:"Hạn chót bố trí vị trí việc làm, xếp lương cho viên chức đã tuyển trước 01/7/2026?",a:"Chậm nhất <b>01/7/2027</b>."},
{doc:"luatvc",q:"Hình thức xử lý viên chức đã nghỉ việc, nghỉ hưu mà phát hiện vi phạm?",a:"Khiển trách, cảnh cáo, <b>xóa tư cách chức vụ đã đảm nhiệm</b>."}
);

{doc:"luatvc",q:"Điểm mới về quyền kinh doanh của viên chức theo Luật 2025 là:",opts:["Được góp vốn và tham gia quản lý, điều hành doanh nghiệp ngoài công lập","Chỉ được góp vốn, không được tham gia quản lý, điều hành","Không được góp vốn vào doanh nghiệp","Chỉ được hành nghề sau giờ hành chính"],ans:0,ex:"Luật 2010 chỉ cho góp vốn mà không tham gia quản lý, điều hành; Luật 2025 cho phép cả hai.",ref:"Điều 13"},
{doc:"luatvc",q:"Điều kiện về quốc tịch để đăng ký dự tuyển viên chức là:",opts:["Có 01 quốc tịch Việt Nam","Có quốc tịch Việt Nam (có thể có thêm quốc tịch khác)","Có quốc tịch Việt Nam hoặc thẻ thường trú","Không yêu cầu"],ans:0,ex:"Luật 2025 yêu cầu \"có 01 quốc tịch Việt Nam theo quy định của Luật Quốc tịch\".",ref:"k1 Điều 19"},

{doc:"luatvc",q:"Thời hạn viên chức kiến nghị về kết quả xếp loại chất lượng là:",opts:["05 ngày kể từ ngày công khai kết quả","10 ngày làm việc kể từ ngày công khai","15 ngày kể từ ngày nhận kết quả","30 ngày kể từ ngày công khai"],ans:0,ex:"Kiến nghị trong 05 ngày; cơ quan giải quyết trong 10 ngày làm việc; không xem xét lại.",ref:"Điều 27"},

{doc:"luatvc",q:"Thời hạn xử lý kỷ luật viên chức đối với vụ việc phức tạp tối đa là:",opts:["150 ngày","90 ngày","120 ngày","180 ngày"],ans:0,ex:"Thông thường không quá 90 ngày; vụ việc phức tạp không quá 150 ngày.",ref:"k3 Điều 36"},
{doc:"luatvc",q:"Trường hợp nào viên chức đương nhiên bị buộc thôi việc?",opts:["Bị kết án về tội tham nhũng","Bị phạt tù cho hưởng án treo về tội vô ý","Bị khiển trách 2 lần trong năm","Bị xử phạt vi phạm hành chính"],ans:0,ex:"Đương nhiên buộc thôi việc khi bị phạt tù không hưởng án treo hoặc bị kết án về tội tham nhũng.",ref:"k3 Điều 35"},

{doc:"luatvc",q:"Viên chức đã nghỉ hưu bị phát hiện vi phạm trong thời gian công tác có thể bị áp dụng hình thức:",opts:["Xóa tư cách chức vụ đã đảm nhiệm","Cách chức","Buộc thôi việc","Hạ bậc lương"],ans:0,ex:"Với người đã nghỉ: khiển trách, cảnh cáo, xóa tư cách chức vụ đã đảm nhiệm.",ref:"Điều 42"},
{doc:"luatvc",q:"Theo Luật Viên chức 2025, chế độ tập sự:",opts:["Không còn quy định; người đang tập sự được xếp lương theo vị trí việc làm","Từ 03 đến 12 tháng","Từ 06 đến 12 tháng","Do người đứng đầu đơn vị quyết định"],ans:0,ex:"Luật mới bỏ chế độ tập sự (luật cũ 03–12 tháng).",ref:"k4 Điều 43"},
{doc:"luatvc",q:"Chậm nhất đến ngày nào phải hoàn thành bố trí vị trí việc làm và xếp lương cho viên chức được tuyển dụng trước ngày Luật có hiệu lực?",opts:["01/7/2027","31/12/2026","01/7/2026","01/01/2028"],ans:0,ex:"Khoản 3 Điều 43.",ref:"k3 Điều 43"}
);
ESSAY.push(
{doc:"luatvc",q:"Phân tích những điểm mới cơ bản của Luật Viên chức 2025 so với Luật Viên chức 2010 (sửa đổi 2019).",outline:["Bối cảnh: chủ trương tinh gọn bộ máy, quản lý theo vị trí việc làm, phân cấp, phân quyền, chuyển đổi số; luật khung 43 điều.","Khái niệm viên chức thêm \"nguồn thu hợp pháp khác\" (Điều 1).","Chuyển từ chức danh nghề nghiệp, hạng sang vị trí việc làm (Điều 3, 23); bỏ thăng hạng, bỏ tập sự.","Tuyển dụng thêm tiếp nhận (Điều 17); 01 quốc tịch; hợp đồng làm việc với 01 đơn vị; HĐLĐ, HĐDV (Điều 21).","Quyền kinh doanh: được góp vốn và quản lý, điều hành (Điều 13).","Đánh giá định lượng, có kiến nghị 05 ngày/10 ngày làm việc; xếp loại không hoàn thành nhiệm vụ có thể chấm dứt hợp đồng (Điều 22, 25–27).","Kỷ luật: thời hiệu 05/10 năm; Điều 34 loại trừ trách nhiệm; Điều 42 xử lý người đã nghỉ.","Đánh giá: chấm dứt \"biên chế suốt đời\", tăng cạnh tranh, tự chủ; liên hệ trách nhiệm bản thân khi trở thành viên chức."]},
{doc:"luatvc",q:"Trình bày nghĩa vụ và những việc viên chức không được làm. Liên hệ việc sử dụng mạng xã hội của viên chức.",outline:["Nghĩa vụ chung (Điều 7): trung thành với Đảng, Nhà nước; đạo đức; chấp hành pháp luật; bảo vệ bí mật nhà nước; quy tắc ứng xử.","Nghĩa vụ trong hoạt động nghề nghiệp (Điều 8): ứng dụng chuyển đổi số, không hách dịch, cửa quyền; chỉ ký hợp đồng làm việc với 01 đơn vị.","Những việc không được làm (Điều 10): đùn đẩy, bè phái, đình công, phát tán thông tin sai lệch, lợi dụng nghề nghiệp chống phá, tham nhũng…","Liên hệ: Chỉ thị 05-CT/TW (2026) về báo chí, truyền thông trên không gian mạng; viên chức không đăng tải, chia sẻ thông tin sai lệch, giữ bí mật công tác, lan tỏa thông tin tích cực.","Hậu quả vi phạm: các hình thức kỷ luật (Điều 35), thời hiệu (Điều 36)."]},
{doc:"luatvc",q:"Trình bày quy định về đánh giá, xếp loại chất lượng viên chức theo Luật 2025 và hệ quả pháp lý của kết quả xếp loại.",outline:["Nguyên tắc (k1 Điều 25): dân chủ, công khai, xuyên suốt, đa chiều, định lượng, gắn với lương thưởng.","Thẩm quyền: người đứng đầu ĐVSNCL; người đứng đầu do cấp trên trực tiếp đánh giá.","5 nội dung đánh giá; viên chức quản lý thêm tiêu chí kết quả đơn vị.","4 mức xếp loại; công khai, lưu hồ sơ (Điều 26).","Sử dụng kết quả: đào tạo, quy hoạch, bổ nhiệm, lương thưởng; không hoàn thành nhiệm vụ → bố trí thấp hơn hoặc chấm dứt hợp đồng (Điều 22).","Kiến nghị 05 ngày, giải quyết 10 ngày làm việc, không xem xét lại (Điều 27).","Liên hệ NĐ 233/2026 và Quy định 366-QĐ/TW về đánh giá cán bộ."]}
);

/* ===== NĐ 259/2026/NĐ-CP ===== */
DOCS.push({id:"nd259",group:"law",short:"NĐ 259/2026 – Tuyển dụng, sử dụng, quản lý VC",mmLabel:"NĐ 259/2026 (tuyển dụng, sử dụng, quản lý)",so:"259/2026/NĐ-CP",
title:"Nghị định quy định về tuyển dụng, sử dụng và quản lý viên chức",
meta:[["Cơ quan ban hành","Chính phủ (KT. Thủ tướng, Phó Thủ tướng Phạm Thị Thanh Trà ký)"],["Ngày ký","30/6/2026"],["Hiệu lực","01/7/2026 (Điều 61)"],["Căn cứ","Luật Tổ chức Chính phủ 63/2025/QH15; Luật Viên chức 129/2025/QH15"],["Thay thế","NĐ 115/2020, NĐ 85/2023, NĐ 101/2017 (đào tạo, bồi dưỡng), NĐ 89/2021"],["Bố cục","5 chương, 63 điều, 4 mẫu phụ lục"]],
tldr:`Nghị định "xương sống" để thi viên chức: quy định <b>ai tuyển, tuyển thế nào</b> (thi tuyển 2 vòng, xét tuyển 2 vòng, tiếp nhận), <b>hợp đồng làm việc</b>, <b>sử dụng</b> (thay đổi bậc nghề nghiệp thay cho thăng hạng, biệt phái, bổ nhiệm, miễn nhiệm, đào tạo bồi dưỡng), <b>thôi việc, nghỉ hưu</b> và <b>phân cấp quản lý</b>. Điểm then chốt: vòng 1 kiến thức chung <mark>60 câu/60 phút</mark>, qua vòng khi đúng <mark>từ 50% mỗi phần</mark>; trúng tuyển khi vòng 2 đạt <mark>từ 50/100</mark>; hợp đồng làm việc <b>có giá trị như quyết định tuyển dụng</b>.`,
sections:[
{h:"Bố cục 5 chương",html:`<div class="tablewrap"><table class="nums" style="min-width:520px"><thead><tr><th>Chương</th><th>Tên</th><th>Điều</th></tr></thead><tbody>
<tr><td>I</td><td>Những quy định chung</td><td class="r">1–2</td></tr>
<tr><td>II</td><td>Tuyển dụng viên chức (6 mục: quy định chung; thi tuyển; xét tuyển; tiếp nhận; trình tự thi tuyển, xét tuyển; hợp đồng làm việc)</td><td class="r">3–23</td></tr>
<tr><td>III</td><td>Sử dụng viên chức (bố trí, thay đổi VTVL, biệt phái; bổ nhiệm; thôi giữ chức vụ, từ chức, miễn nhiệm, tạm đình chỉ; đào tạo, bồi dưỡng; thôi việc, nghỉ hưu)</td><td class="r">24–54</td></tr>
<tr><td>IV</td><td>Quản lý viên chức</td><td class="r">55–60</td></tr>
<tr><td>V</td><td>Điều khoản thi hành</td><td class="r">61–63</td></tr></tbody></table></div>`},
{h:"Tuyển dụng: thẩm quyền, căn cứ, điều kiện",items:[
"<b>Thẩm quyền theo mức tự chủ tài chính (Điều 3):</b> ĐVSNCL <b>nhóm 1</b> (tự bảo đảm chi thường xuyên và chi đầu tư) và <b>nhóm 2</b> (tự bảo đảm chi thường xuyên) <b>tự tuyển dụng</b>; <b>nhóm 3</b> (tự bảo đảm một phần) và <b>nhóm 4</b> (Nhà nước bảo đảm chi thường xuyên) do <b>cơ quan quản lý ĐVSNCL</b> tuyển, trừ khi được phân cấp, ủy quyền.",
"<b>Căn cứ (Điều 4):</b> nhu cầu thực tế, yêu cầu vị trí việc làm, quỹ lương và nguồn thu hợp pháp, biên chế được giao; phải có <b>kế hoạch tuyển dụng</b> (Điều 5: phương thức, chỉ tiêu theo VTVL, chỉ tiêu riêng cho người dân tộc thiểu số, tiêu chuẩn và bậc nghề nghiệp, yêu cầu ngoại ngữ…).",
"<b>Điều kiện dự tuyển (Điều 6):</b> theo Điều 19 Luật Viên chức. Ngoại lệ: lĩnh vực văn hóa, nghệ thuật, thể dục, thể thao được tuyển người <mark>từ đủ 15 tuổi</mark> nếu có văn bản đồng ý của người đại diện theo pháp luật.",
"<b>Xét tuyển (Điều 7)</b> áp dụng cho: người cam kết tình nguyện làm việc <mark>từ đủ 03 năm</mark> ở vùng đặc biệt khó khăn; người học cử tuyển; sinh viên tốt nghiệp xuất sắc, người có tài năng; trường hợp khác theo luật chuyên ngành. Xét riêng từng nhóm.",
"<b>Hội đồng tuyển dụng (Điều 9):</b> <mark>05 hoặc 07</mark> thành viên; làm việc tập thể, quyết định theo đa số, ngang phiếu thì theo ý kiến Chủ tịch đã biểu quyết; tự giải thể khi xong nhiệm vụ. Không cử người có quan hệ thân thuộc với thí sinh, người đang bị kỷ luật, người từng bị xử lý về tham nhũng, tiêu cực trong công tác cán bộ.",
"<b>Xếp lương (Điều 10):</b> xếp lương khởi điểm của <b>bậc nghề nghiệp</b> được tuyển; thời gian công tác phù hợp có đóng BHXH bắt buộc được tính để xếp bậc."]},
{h:"Thi tuyển và xét tuyển (đề hay hỏi nhất)",items:[
"<b>Thi tuyển – Vòng 1 (Điều 11):</b> trắc nghiệm trên máy tính. Kiến thức chung <mark>60 câu / 60 phút</mark> (pháp luật viên chức, chủ trương đường lối của Đảng, chính sách pháp luật ngành). Ngoại ngữ: Hội đồng quyết định số câu, <mark>tối đa 60 phút</mark>, có văn bằng/chứng chỉ phù hợp thì được miễn. Qua vòng 1 khi đúng <mark>từ 50% số câu ở từng phần</mark>. Có kết quả ngay sau khi làm bài.",
"<b>Thi tuyển – Vòng 2:</b> môn nghiệp vụ chuyên ngành theo <b>1 trong 2 hình thức</b>: (1) thực hành, hoặc (2) <b>kết hợp viết và phỏng vấn</b>. Viết <mark>180 phút</mark>; viết trên máy tính <mark>60–120 câu, 90–180 phút</mark>; phỏng vấn <mark>tối đa 30 phút</mark> (chuẩn bị không quá 15 phút). Thang 100; hình thức kết hợp quy đổi <mark>viết 70% – phỏng vấn 30%</mark>.",
"<b>Trúng tuyển thi tuyển (Điều 12):</b> điểm nghiệp vụ <mark>từ 50 điểm</mark>; hình thức kết hợp phải dự đủ 2 bài và mỗi bài từ 50%. Lấy theo tổng điểm vòng 2 + điểm ưu tiên từ cao xuống thấp. Bằng điểm: ưu tiên người có điểm nghiệp vụ cao hơn → điểm bài viết cao hơn → người đứng đầu quyết định. <b>Không bảo lưu</b> kết quả.",
"<b>Xét tuyển (Điều 13–14):</b> vòng 1 kiểm tra điều kiện trên Phiếu; vòng 2 <b>vấn đáp hoặc thực hành</b> (vấn đáp 30 phút); mặc định <b>không kiểm tra ngoại ngữ</b>. Trúng tuyển khi vòng 2 từ 50 điểm.",
"<b>Điểm ưu tiên cộng vào kết quả vòng 2 (Điều 8):</b> <mark>7,5</mark> (Anh hùng LLVTND, Anh hùng Lao động, thương binh, người hưởng chính sách như thương binh, thương binh loại B); <mark>5</mark> (người dân tộc thiểu số, sĩ quan/QNCN phục viên, CAND xuất ngũ, cơ yếu chuyển ngành, con liệt sĩ, con thương binh, con bệnh binh, con người hoạt động cách mạng trước 1945…); <mark>2,5</mark> (hoàn thành nghĩa vụ quân sự/CAND, đội viên TNXP…); <mark>1,5</mark> (cán bộ công đoàn trưởng thành từ cơ sở). Thuộc nhiều diện chỉ cộng <b>mức cao nhất</b>."]},
{h:"Trình tự, thời hạn của kỳ tuyển dụng",items:[
"<b>Thông báo (Điều 17):</b> đăng ít nhất 01 lần trên báo in/báo điện tử/báo nói/báo hình, đồng thời trên cổng thông tin điện tử. Nhận Phiếu đăng ký <mark>30 ngày</mark> kể từ ngày thông báo. Được thay đổi Thông báo <b>01 lần</b>, chậm nhất <mark>10 ngày</mark> trước ngày khai mạc.",
"<b>Danh sách đủ điều kiện, triệu tập (Điều 18):</b> chậm nhất <mark>15 ngày</mark> (hoặc <mark>30 ngày</mark> nếu từ 500 người đăng ký) kể từ hết hạn nhận Phiếu. Vòng 1 tổ chức chậm nhất 30 ngày (45 ngày nếu đã kéo dài). Vòng 2 chậm nhất <mark>10 ngày</mark> sau khi kết thúc vòng 1; người đạt vòng 1 đương nhiên dự vòng 2, không cần giấy triệu tập.",
"<b>Phúc khảo:</b> chỉ bài <b>viết trên giấy</b>. Nhận đơn trong <mark>05 ngày làm việc</mark>, chấm trong 10 ngày (tối đa 20 ngày). Không phúc khảo trắc nghiệm, viết trên máy tính, thực hành, vấn đáp, phỏng vấn.",
"<b>Kết quả (Điều 19):</b> Hội đồng báo cáo trong 05 ngày làm việc → người đứng đầu phê duyệt trong 05 ngày làm việc → công khai và gửi thông báo trúng tuyển trong 02 ngày làm việc.",
"<b>Hoàn thiện hồ sơ (Điều 20):</b> trong <mark>15 ngày</mark> kể từ ngày công khai danh sách (không nộp chứng chỉ tin học, ngoại ngữ; cơ quan tuyển dụng tự yêu cầu cấp Phiếu lý lịch tư pháp). Gian lận Phiếu hoặc văn bằng thì bị hủy kết quả và <b>không được nhận Phiếu trong 01 kỳ tuyển dụng tiếp theo</b>. Được tuyển người có kết quả thấp hơn liền kề.",
"<b>Ký hợp đồng (Điều 21):</b> gửi hồ sơ cho đơn vị sử dụng trong 03 ngày làm việc; người đứng đầu ĐVSNCL ký hợp đồng trong 05 ngày làm việc. <b>Hợp đồng làm việc có giá trị như Quyết định tuyển dụng.</b> Không đến nhận việc đúng hạn thì hợp đồng đương nhiên hết hiệu lực."]},
{h:"Tiếp nhận và hợp đồng làm việc",items:[
"<b>Tiếp nhận (Điều 15–16):</b> chuyên gia, nhà khoa học, luật sư giỏi, doanh nhân tiêu biểu; người làm chuyên môn ở cơ quan, tổ chức khác; người từng là CB, CC, VC; người có tài năng đặc biệt về văn hóa, nghệ thuật, TDTT, nghề truyền thống; <b>người đang làm hợp đồng ở vị trí việc làm viên chức</b>. Với người làm chuyên môn và người đang làm hợp đồng: công tác <mark>từ đủ 05 năm</mark>, có BHXH bắt buộc, <b>không tính thời gian tập sự, thử việc</b>.",
"<b>Mẫu hợp đồng:</b> Mẫu 02 hợp đồng xác định thời hạn; Mẫu 03 cho người dưới 18 tuổi; Mẫu 04 hợp đồng không xác định thời hạn.",
"Viên chức tuyển dụng trong giai đoạn <b>01/7/2020 – 01/7/2026</b> đã ký <b>từ 02 lần</b> hợp đồng xác định thời hạn thì hết hợp đồng lần 2 được ký hợp đồng <b>không xác định thời hạn</b> nếu đáp ứng yêu cầu (Điều 22–23).",
"Chuyển sang ĐVSNCL khác: không tuyển dụng mới, không giải quyết thôi việc, chỉ ký hợp đồng mới."]},
{h:"Sử dụng viên chức: bậc nghề nghiệp, biệt phái, bổ nhiệm",items:[
"<b>Thay đổi bậc nghề nghiệp (Điều 25)</b> thay cho thi/xét <b>thăng hạng chức danh nghề nghiệp</b>. Lên bậc khi: có nhu cầu, còn chỉ tiêu theo tỷ lệ, năm liền trước xếp loại <b>từ hoàn thành tốt nhiệm vụ</b>, không đang bị kỷ luật hoặc bị khởi tố, điều tra, truy tố, xét xử, kết quả công việc đạt tiêu chí bậc mới. Có thể <b>xuống bậc</b>; không còn bậc thấp hơn phù hợp thì giải quyết thôi việc hoặc tinh giản biên chế.",
"<b>Biệt phái (Điều 27):</b> <mark>không quá 03 năm</mark> (trừ luật chuyên ngành). Không biệt phái viên chức nữ đang mang thai, nghỉ thai sản, nuôi con <mark>dưới 36 tháng</mark> (trừ khi tự nguyện). Nơi cử trả lương; nơi nhận trả phụ cấp đặc thù.",
"<b>Bổ nhiệm (Điều 28–34):</b> thời hạn mỗi lần <mark>05 năm</mark>; bổ nhiệm lại <b>không hạn chế số lần</b>. Điều kiện: có quy hoạch, giữ chức vụ liền kề <mark>ít nhất 12 tháng</mark>, <b>hoàn thành tốt nhiệm vụ trở lên 3 năm gần nhất</b>, đủ tuổi công tác trọn thời hạn (lần đầu hoặc lên chức cao hơn).",
"<b>Quy trình nguồn tại chỗ 04 bước</b>: tập thể lãnh đạo → tập thể lãnh đạo mở rộng → hội nghị cán bộ chủ chốt (bỏ phiếu kín, <b>không công bố</b> kết quả) → tập thể lãnh đạo biểu quyết kín. Hội nghị hợp lệ khi có ít nhất <mark>2/3</mark> người được triệu tập; được chọn khi đạt <mark>trên 50%</mark>; không ai quá 50% thì chọn người <mark>từ 30%</mark>. <b>Nguồn từ nơi khác 03 bước</b>, không bỏ phiếu.",
"<b>Giao quyền cấp trưởng:</b> <mark>tối đa 12 tháng</mark>, không tính vào thời gian giữ chức vụ.",
"<b>Kéo dài thời gian giữ chức vụ đến tuổi nghỉ hưu</b> khi còn dưới 24 tháng (thời hạn 5 năm) hoặc dưới 18 tháng (thời hạn 3 năm). Thông báo bổ nhiệm lại trước <mark>90 ngày</mark>."]},
{h:"Từ chức, miễn nhiệm, tạm đình chỉ, đào tạo",items:[
"<b>Từ chức:</b> có <mark>trên 50%</mark> phiếu tín nhiệm thấp; 2 năm <b>không liên tiếp</b> không hoàn thành nhiệm vụ; để xảy ra tham nhũng nghiêm trọng; không dám làm, né tránh trách nhiệm…",
"<b>Miễn nhiệm:</b> có <mark>trên 2/3</mark> phiếu tín nhiệm thấp; 2 năm <b>liên tiếp</b> không hoàn thành nhiệm vụ; khiển trách 2 lần trong một thời hạn bổ nhiệm; cảnh cáo kèm năng lực hạn chế; suy thoái, \"tự diễn biến\", \"tự chuyển hóa\"…",
"<b>Bố trí sau đó (Điều 45):</b> thôi giữ chức vụ → sau <mark>12 tháng</mark> xem xét lại, được bảo lưu phụ cấp; từ chức → sau <mark>24 tháng</mark>; miễn nhiệm → sau <mark>36 tháng</mark>, mất phụ cấp chức vụ.",
"<b>Tạm đình chỉ công tác (Điều 46):</b> không quá <mark>30 ngày làm việc</mark>, gia hạn tối đa 30 ngày làm việc.",
"<b>Đào tạo, bồi dưỡng (Điều 47–50):</b> gộp nội dung NĐ 101/2017; bồi dưỡng 5 nhóm nội dung (lý luận chính trị; quốc phòng an ninh; chuẩn nghề nghiệp; theo VTVL; KHCN, đổi mới sáng tạo, chuyển đổi số); hình thức tập trung, trực tuyến, kết hợp; ứng dụng <b>trí tuệ nhân tạo</b>; đền bù chi phí đào tạo sau đại học do hai bên <b>thỏa thuận trước khi cử đi học</b>."]},
{h:"Thôi việc, nghỉ hưu, phân cấp",items:[
"<b>Thôi việc (Điều 51–53):</b> theo pháp luật lao động; bị kỷ luật buộc thôi việc; không đáp ứng yêu cầu mà không còn vị trí thấp hơn; sắp xếp, giải thể đơn vị. Bị buộc thôi việc hoặc chưa phục vụ đủ thời gian cam kết thì không được trợ cấp.",
"<b>Nghỉ hưu (Điều 54):</b> thời điểm nghỉ hưu là <b>ngày 01 của tháng liền kề</b> sau tháng đủ tuổi. Thông báo trước <mark>06 tháng</mark>; ra quyết định trước <mark>03 tháng</mark>. Lùi thời điểm nghỉ hưu tối đa 01 tháng (trùng Tết, có tang, thiên tai), 03 tháng (bệnh nặng, tai nạn), 06 tháng (bệnh điều trị dài ngày).",
"<b>Phân cấp (Chương IV):</b> Bộ Nội vụ giúp Chính phủ quản lý nhà nước về viên chức, ban hành quy chế, nội quy thi tuyển, xét tuyển, chủ trì CSDL quốc gia về CB, CC, VC. ĐVSNCL nhóm 1, 2 tự thực hiện phần lớn nội dung quản lý (trừ việc liên quan người đứng đầu); nhóm 3, 4 thực hiện theo phân cấp, ủy quyền."]},
{h:"Điểm mới so với NĐ 115/2020 và NĐ 85/2023",items:[
"Một nghị định thay cho 4 nghị định (gộp cả đào tạo, bồi dưỡng).",
"Chuyển từ <b>chức danh nghề nghiệp, hạng</b> sang <b>vị trí việc làm, bậc nghề nghiệp</b>; bỏ thi/xét thăng hạng; có cơ chế xuống bậc.",
"Thẩm quyền tuyển dụng gắn với mức tự chủ tài chính (nhóm 1–4).",
"Ngoại ngữ vòng 1 không còn cố định 30 câu/30 phút, Hội đồng quyết định, tối đa 60 phút.",
"Vòng 2 chỉ còn 2 hình thức (thực hành, hoặc viết + phỏng vấn tỷ lệ 70/30); thêm thi viết trên máy tính.",
"Phá thế hòa bằng điểm nghiệp vụ, rồi điểm bài viết (không còn dùng điểm kiến thức chung vòng 1).",
"Hoàn thiện hồ sơ rút từ 30 ngày xuống 15 ngày; <b>hợp đồng thay quyết định tuyển dụng</b>.",
"Mở rộng tiếp nhận (người đang làm hợp đồng ở vị trí viên chức đủ 5 năm, chuyên gia, doanh nhân…).",
"<b>Không còn điều khoản về chế độ tập sự</b> (người đang tập sự được xếp lương vào bậc tương ứng từ 01/7/2026)."]}
],

CONFUSE.push(
{doc:"nd259",a:"Phỏng vấn và vấn đáp là một?",b:"Không. <b>Phỏng vấn</b> là một bài trong hình thức <b>viết + phỏng vấn</b> của vòng 2 <b>thi tuyển</b>. <b>Vấn đáp</b> là hình thức vòng 2 của <b>xét tuyển</b>.",tip:"Thi tuyển → phỏng vấn; Xét tuyển → vấn đáp."},
{doc:"nd259",a:"Điểm ưu tiên cộng vào vòng 1 để dễ qua 50%?",b:"Không. Điểm ưu tiên cộng vào <b>kết quả vòng 2</b>, và không giúp đạt ngưỡng 50 điểm của vòng 2.",tip:"Ưu tiên chỉ dùng để xếp thứ tự khi đã đạt điểm sàn."},
{doc:"nd259",a:"Từ chức và miễn nhiệm cùng ngưỡng tín nhiệm thấp?",b:"<b>Trên 50%</b> tín nhiệm thấp → căn cứ <b>từ chức</b>. <b>Trên 2/3</b> → căn cứ <b>miễn nhiệm</b>. 2 năm <b>không liên tiếp</b> không hoàn thành nhiệm vụ → từ chức; 2 năm <b>liên tiếp</b> → miễn nhiệm.",tip:"Càng nặng thì ngưỡng càng cao và chữ \"liên tiếp\" đi với miễn nhiệm."},
{doc:"nd259",a:"Ngày và ngày làm việc",b:"Hoàn thiện hồ sơ: <b>15 ngày</b>. Ký hợp đồng: <b>05 ngày làm việc</b>. Nhận đơn phúc khảo: <b>05 ngày làm việc</b>; chấm phúc khảo: <b>10 ngày</b>.",tip:"Việc của thí sinh/hội đồng tính theo \"ngày\"; thủ tục hành chính ngắn thường tính \"ngày làm việc\"."},
{doc:"nd259",a:"Bài nào được phúc khảo?",b:"Chỉ bài <b>thi viết trên giấy</b>. Không phúc khảo trắc nghiệm trên máy tính, viết trên máy tính, thực hành, vấn đáp, phỏng vấn.",tip:"Thi trên máy có điểm ngay nên không phúc khảo."},
{doc:"nd259",a:"Bằng điểm thì xét điểm kiến thức chung vòng 1 (như NĐ 85/2023)?",b:"Theo NĐ 259: xét <b>điểm nghiệp vụ</b> cao hơn, rồi <b>điểm bài viết</b> cao hơn; vẫn bằng thì người đứng đầu quyết định. Không dùng điểm vòng 1.",tip:"Quy định cũ dùng vòng 1, quy định mới dùng vòng 2."},
{doc:"nd259",a:"Phụ cấp chức vụ sau khi thôi giữ chức vụ / miễn nhiệm",b:"Thôi giữ chức vụ: <b>được bảo lưu</b>. Miễn nhiệm: <b>mất</b> từ ngày có quyết định. Tạm đình chỉ: không hưởng trong thời gian tạm đình chỉ.",tip:"12 – 24 – 36 tháng ứng với thôi giữ chức vụ – từ chức – miễn nhiệm."}
);
FLASH.push(
{doc:"nd259",q:"Vòng 1 thi tuyển viên chức gồm những phần nào, bao nhiêu câu, bao lâu?",a:"Trắc nghiệm trên máy tính: <b>kiến thức chung 60 câu/60 phút</b>; <b>ngoại ngữ</b> do Hội đồng quyết định số câu, tối đa 60 phút (được miễn nếu có văn bằng/chứng chỉ phù hợp). Qua vòng khi đúng từ 50% số câu mỗi phần."},
{doc:"nd259",q:"Vòng 2 thi tuyển có những hình thức nào?",a:"Chọn 1 trong 2: <b>thực hành</b>, hoặc <b>kết hợp viết (180 phút) và phỏng vấn (≤30 phút)</b>, quy đổi viết 70% – phỏng vấn 30%."},
{doc:"nd259",q:"Ai tự tuyển dụng viên chức theo NĐ 259?",a:"ĐVSNCL <b>nhóm 1</b> (tự bảo đảm chi thường xuyên và chi đầu tư) và <b>nhóm 2</b> (tự bảo đảm chi thường xuyên). Nhóm 3, 4 do cơ quan quản lý ĐVSNCL tuyển (trừ khi được phân cấp, ủy quyền)."},
{doc:"nd259",q:"Bốn mức điểm ưu tiên?",a:"<b>7,5</b> – <b>5</b> – <b>2,5</b> – <b>1,5</b> điểm, cộng vào kết quả vòng 2; nhiều diện chỉ cộng mức cao nhất."},
{doc:"nd259",q:"Thời hạn nhận Phiếu đăng ký dự tuyển?",a:"<b>30 ngày</b> kể từ ngày thông báo tuyển dụng công khai."},
{doc:"nd259",q:"Văn bản nào có giá trị như Quyết định tuyển dụng?",a:"<b>Hợp đồng làm việc</b> do người đứng đầu ĐVSNCL ký (trong 05 ngày làm việc)."},
{doc:"nd259",q:"Hạn hoàn thiện hồ sơ của người trúng tuyển?",a:"<b>15 ngày</b> kể từ ngày công khai danh sách trúng tuyển (NĐ 115 cũ là 30 ngày)."},
{doc:"nd259",q:"Thay cho thi/xét thăng hạng chức danh nghề nghiệp, NĐ 259 quy định gì?",a:"<b>Thay đổi bậc nghề nghiệp</b> trong cùng vị trí việc làm, dựa trên nhu cầu, tỷ lệ bậc và kết quả đánh giá (năm liền trước từ hoàn thành tốt nhiệm vụ). Có cả xuống bậc."},
{doc:"nd259",q:"Thời hạn biệt phái tối đa?",a:"<b>Không quá 03 năm</b> (trừ pháp luật chuyên ngành có quy định khác)."},
{doc:"nd259",q:"Thời hạn bổ nhiệm viên chức quản lý và số lần bổ nhiệm lại?",a:"<b>05 năm</b> mỗi lần; bổ nhiệm lại <b>không hạn chế số lần</b>."},
{doc:"nd259",q:"Giao quyền cấp trưởng tối đa bao lâu?",a:"<b>12 tháng</b>, không gia hạn (trừ khi người đứng đầu vắng mặt trên 12 tháng), không tính vào thời gian giữ chức vụ."},
{doc:"nd259",q:"Sau thôi giữ chức vụ / từ chức / miễn nhiệm, bao lâu được xem xét bố trí lại?",a:"<b>12 / 24 / 36 tháng</b>."},
{doc:"nd259",q:"Điều kiện thời gian để được tiếp nhận vào viên chức (người đang làm hợp đồng ở VTVL viên chức)?",a:"Công tác <b>từ đủ 05 năm</b>, có đóng BHXH bắt buộc, không tính thời gian tập sự, thử việc."},
{doc:"nd259",q:"Thời điểm nghỉ hưu của viên chức?",a:"<b>Ngày 01 của tháng liền kề</b> sau tháng đủ tuổi nghỉ hưu; thông báo trước 06 tháng, quyết định trước 03 tháng."},
{doc:"nd259",q:"NĐ 259/2026 thay thế những nghị định nào?",a:"<b>NĐ 115/2020</b>, <b>NĐ 85/2023</b>, <b>NĐ 101/2017</b> (đào tạo, bồi dưỡng) và <b>NĐ 89/2021</b>."}
);

{doc:"nd259",q:"Theo NĐ 259/2026, văn bản nào có giá trị như quyết định tuyển dụng?",opts:["Hợp đồng làm việc","Thông báo trúng tuyển","Quyết định công nhận kết quả tuyển dụng","Phiếu đăng ký dự tuyển"],ans:0,ex:"Hợp đồng làm việc do người đứng đầu ĐVSNCL ký có giá trị như Quyết định tuyển dụng.",ref:"Điều 21"},
{doc:"nd259",q:"Hình thức vòng 2 của xét tuyển viên chức là:",opts:["Vấn đáp hoặc thực hành","Thi viết","Viết kết hợp phỏng vấn","Trắc nghiệm trên máy tính"],ans:0,ex:"Xét tuyển: vòng 1 kiểm tra điều kiện; vòng 2 vấn đáp hoặc thực hành, mặc định không thi ngoại ngữ.",ref:"Điều 13"},
{doc:"nd259",q:"Người đang làm hợp đồng ở vị trí việc làm viên chức muốn được tiếp nhận vào viên chức phải có thời gian công tác:",opts:["Từ đủ 05 năm, có đóng BHXH bắt buộc, không tính tập sự, thử việc","Từ đủ 03 năm","Từ đủ 05 năm, kể cả thời gian tập sự","Không yêu cầu thời gian công tác"],ans:0,ex:"Điều kiện 05 năm áp dụng cho người làm chuyên môn ở nơi khác và người đang làm hợp đồng ở VTVL viên chức.",ref:"Điều 15"},
{doc:"nd259",q:"Thời hạn biệt phái viên chức tối đa là:",opts:["Không quá 03 năm, trừ trường hợp pháp luật chuyên ngành quy định khác","Không quá 01 năm","Không quá 02 năm","Không quá 05 năm"],ans:0,ex:"Biệt phái không quá 3 năm; chỉ gia hạn khi nhiệm vụ đột xuất chưa xong vì lý do khách quan.",ref:"Điều 27"},
{doc:"nd259",q:"Thời hạn mỗi lần bổ nhiệm viên chức quản lý và số lần bổ nhiệm lại là:",opts:["05 năm; không hạn chế số lần bổ nhiệm lại","05 năm; tối đa 2 lần","03 năm; không hạn chế","04 năm; tối đa 1 lần"],ans:0,ex:"Mỗi lần bổ nhiệm 5 năm (60 tháng), bổ nhiệm lại không hạn chế số lần.",ref:"Điều 28"},
{doc:"nd259",q:"Viên chức quản lý được xem xét miễn nhiệm khi có tỷ lệ phiếu tín nhiệm thấp:",opts:["Trên 2/3","Trên 50%","Trên 30%","Trên 3/4"],ans:0,ex:"Trên 50% tín nhiệm thấp là căn cứ để từ chức; trên 2/3 là căn cứ miễn nhiệm.",ref:"Điều 42, 43"},
{doc:"nd259",q:"Thời gian giao quyền cấp trưởng tối đa là:",opts:["12 tháng","06 tháng","18 tháng","24 tháng"],ans:0,ex:"Giao quyền tối đa 12 tháng, không tính vào thời gian giữ chức vụ.",ref:"Điều 33"},
{doc:"nd259",q:"Viên chức bị miễn nhiệm thì sau bao lâu mới được xem xét bố trí lại chức vụ?",opts:["36 tháng","12 tháng","24 tháng","48 tháng"],ans:0,ex:"Thôi giữ chức vụ 12 tháng, từ chức 24 tháng, miễn nhiệm 36 tháng.",ref:"Điều 45"},
{doc:"nd259",q:"Quyết định nghỉ hưu phải được ban hành trước thời điểm nghỉ hưu ít nhất:",opts:["03 tháng","06 tháng","01 tháng","03 ngày làm việc"],ans:0,ex:"Thông báo trước 06 tháng, quyết định trước 03 tháng, bàn giao trước ít nhất 03 ngày làm việc.",ref:"Điều 54"},
{doc:"nd259",q:"Nội dung nào KHÔNG còn được quy định trong NĐ 259/2026 so với NĐ 115/2020?",opts:["Thi, xét thăng hạng chức danh nghề nghiệp","Hội đồng tuyển dụng","Điểm ưu tiên trong tuyển dụng","Biệt phái viên chức"],ans:0,ex:"Thăng hạng chức danh nghề nghiệp được thay bằng thay đổi bậc nghề nghiệp của vị trí việc làm.",ref:"Điều 25"}
);
ESSAY.push(
{doc:"nd259",q:"Trình bày trình tự thi tuyển viên chức theo NĐ 259/2026, từ thông báo tuyển dụng đến ký hợp đồng làm việc.",outline:["Căn cứ: Luật Viên chức 129/2025/QH15, NĐ 259/2026; thẩm quyền tuyển dụng theo nhóm tự chủ (Điều 3); phải có kế hoạch tuyển dụng (Điều 5).","Thông báo (Điều 17): đăng báo và cổng TTĐT; nhận Phiếu 30 ngày; thay đổi thông báo 01 lần, trước khai mạc ≥10 ngày.","Thành lập Hội đồng 5 hoặc 7 người và các ban giúp việc (Điều 9, 18); danh sách đủ điều kiện trong 15 ngày (30 ngày nếu ≥500 người).","Vòng 1: kiến thức chung 60 câu/60 phút, ngoại ngữ ≤60 phút, đạt ≥50% mỗi phần. Vòng 2 chậm nhất 10 ngày sau: thực hành hoặc viết + phỏng vấn (70/30); trúng tuyển ≥50 điểm; điểm ưu tiên cộng vòng 2; phúc khảo bài viết.","Công nhận kết quả 05 + 05 + 02 ngày làm việc (Điều 19); hoàn thiện hồ sơ 15 ngày; hủy kết quả và tuyển người kế tiếp (Điều 20).","Ký hợp đồng trong 05 ngày làm việc; hợp đồng có giá trị như quyết định tuyển dụng (Điều 21).","Liên hệ: số hóa (thi trên máy tính), rút ngắn thời hạn, công khai minh bạch; trách nhiệm của thí sinh trung thực khi kê khai Phiếu."]},
{doc:"nd259",q:"Phân tích những điểm mới cơ bản của NĐ 259/2026 so với NĐ 115/2020 (sửa đổi bởi NĐ 85/2023) và ý nghĩa.",outline:["Bối cảnh: Luật Viên chức 2025 chuyển sang quản lý theo vị trí việc làm; NĐ 232/2026 về vị trí việc làm.","Tuyển dụng: thẩm quyền theo mức tự chủ; vòng 2 còn 2 hình thức, có thi viết trên máy tính; phá thế hòa bằng điểm nghiệp vụ; hồ sơ 15 ngày; hợp đồng thay quyết định tuyển dụng; mở rộng tiếp nhận.","Sử dụng: bỏ thăng hạng, thay bằng thay đổi bậc nghề nghiệp (có xuống bậc); bổ nhiệm 4 bước, bổ nhiệm lại không hạn chế; giao quyền ≤12 tháng; từ chức, miễn nhiệm, tạm đình chỉ cụ thể.","Đào tạo: gộp NĐ 101/2017; thêm AI, chuyển đổi số, học trực tuyến; đền bù chi phí theo thỏa thuận.","Ý nghĩa: tăng tự chủ, \"vào – ra\" linh hoạt, gắn thu nhập và vị trí với hiệu quả công việc, phù hợp NQ 18-NQ/TW về tinh gọn bộ máy.","Lưu ý: giai đoạn chuyển tiếp (Điều 62) và các hướng dẫn của Bộ Nội vụ."]},
{doc:"nd259",q:"Trình bày điều kiện và quy trình bổ nhiệm viên chức quản lý từ nguồn tại chỗ; so sánh với nguồn từ nơi khác.",outline:["Thời hạn 05 năm, bổ nhiệm lại không hạn chế (Điều 28).","Điều kiện (Điều 29): có quy hoạch; giữ chức vụ liền kề ≥12 tháng; 3 năm gần nhất hoàn thành tốt nhiệm vụ trở lên; đủ tuổi công tác trọn thời hạn; đủ sức khỏe; không thuộc trường hợp cấm.","Chủ trương (Điều 30): cấp có thẩm quyền quyết định trong 15 ngày làm việc; tiến hành trong 30 ngày.","Nguồn tại chỗ 4 bước (Điều 31): tập thể lãnh đạo → lãnh đạo mở rộng → cán bộ chủ chốt (không công bố) → tập thể lãnh đạo biểu quyết kín; hội nghị hợp lệ khi ≥2/3 có mặt; >50% được chọn; ≥30% đi tiếp.","Nguồn từ nơi khác 3 bước (Điều 32): lấy ý kiến lãnh đạo nơi bổ nhiệm, lấy ý kiến nơi đang công tác và gặp nhân sự, thẩm định và trình; không bỏ phiếu.","Kết luận: dân chủ, công khai, đề cao trách nhiệm người đứng đầu."]}
);

/* ===== NĐ 233/2026/NĐ-CP ===== */
DOCS.push({id:"nd233",group:"law",short:"NĐ 233/2026 – Đánh giá, xếp loại chất lượng",mmLabel:"NĐ 233/2026 (đánh giá, xếp loại)",so:"233/2026/NĐ-CP",
title:"Nghị định quy định về đánh giá, xếp loại chất lượng đối với đơn vị sự nghiệp công lập và viên chức",
meta:[["Cơ quan ban hành","Chính phủ (KT. Thủ tướng, Phó Thủ tướng Phạm Thị Thanh Trà ký)"],["Ngày ký","26/6/2026"],["Hiệu lực","01/7/2026 (Điều 19)"],["Thay thế","Toàn bộ NĐ 90/2020/NĐ-CP (đã sửa bởi NĐ 48/2023/NĐ-CP)"],["Bố cục","4 chương, 21 điều, 2 phụ lục"]],
tldr:`Chấm điểm <b>cả đơn vị lẫn viên chức</b> trên thang <mark>100 = 30 (tiêu chí chung) + 70 (kết quả thực hiện nhiệm vụ)</mark>. Viên chức được <b>theo dõi, chấm điểm hằng tháng hoặc hằng quý</b>, cuối năm xếp loại theo 4 mức: <mark>≥90 xuất sắc; 70–<90 tốt; 50–<70 hoàn thành; <50 không hoàn thành</mark>. Tỷ lệ "xuất sắc" không quá <mark>20%</mark> số viên chức xếp "hoàn thành tốt" (tối đa 25% nếu đơn vị được công nhận xuất sắc). Bị kỷ luật <b>từ khiển trách trở lên</b> vì vi phạm liên quan đến nhiệm vụ thì xếp không hoàn thành. Hạn xếp loại <mark>trước 15/12</mark>.`,
sections:[
{h:"Bố cục và khái niệm",items:[
"<b>Chương I</b> Quy định chung (Điều 1–4); <b>Chương II</b> Khung tiêu chí đánh giá ĐVSNCL (Điều 5–9); <b>Chương III</b> Khung tiêu chí đánh giá viên chức (Điều 10–17); <b>Chương IV</b> Điều khoản thi hành (Điều 18–21). <b>Phụ lục I</b>: khung tiêu chí chung với viên chức; <b>Phụ lục II</b>: mẫu Phiếu xếp loại.",
"<b>Theo dõi, đánh giá viên chức</b> = giao nhiệm vụ, ghi nhận, chấm điểm <b>thường xuyên theo tháng hoặc quý</b>. <b>Xếp loại chất lượng</b> = quyết định mức hoàn thành nhiệm vụ <b>hằng năm</b>, dựa trên kết quả tháng/quý (điểm trung bình).",
"<b>Nguyên tắc (Điều 4):</b> dân chủ, công khai, khách quan; đánh giá <b>liên tục, đa chiều</b>; kết hợp định tính và định lượng, lấy <b>kết quả thực hiện nhiệm vụ làm trọng tâm</b>; kết quả <b>gắn với tiền lương, tiền thưởng</b>; phát hiện thiếu trung thực thì hủy kết quả và đánh giá lại; đề cao trách nhiệm người đứng đầu."]},
{h:"Tiêu chí và mức xếp loại viên chức",items:[
"<b>Tiêu chí chung, tối đa 30 điểm (Điều 10, Phụ lục I):</b> (1) phẩm chất chính trị, đạo đức, ý thức kỷ luật; (2) năng lực chuyên môn, tinh thần trách nhiệm, thái độ phục vụ, phối hợp; (3) năng lực đổi mới sáng tạo, dám nghĩ, dám làm, dám chịu trách nhiệm.",
"<b>Kết quả thực hiện nhiệm vụ, tối đa 70 điểm (Điều 11):</b> viên chức thường chấm theo <b>số lượng, chất lượng, tiến độ</b> sản phẩm; viên chức quản lý thêm kết quả của đơn vị phụ trách, khả năng tổ chức triển khai, năng lực tập hợp, đoàn kết.",
"<b>4 mức (Điều 12):</b> hoàn thành xuất sắc <mark>từ 90 điểm</mark>; hoàn thành tốt <mark>từ 70 đến dưới 90</mark>; hoàn thành <mark>từ 50 đến dưới 70</mark>; không hoàn thành khi <mark>dưới 50 điểm</mark>.",
"<b>Không hoàn thành nhiệm vụ còn khi:</b> bị kết luận suy thoái tư tưởng chính trị, đạo đức, lối sống, \"tự diễn biến\", \"tự chuyển hóa\"; <b>bị kỷ luật từ khiển trách trở lên</b> vì vi phạm liên quan đến thực hiện nhiệm vụ trong năm; (viên chức quản lý) đơn vị phụ trách để xảy ra tham nhũng, lãng phí bị xử lý.",
"<b>Tỷ lệ xuất sắc:</b> không quá <mark>20%</mark> <b>số viên chức xếp \"hoàn thành tốt\"</b> trong cùng đơn vị, theo nhóm nhiệm vụ tương đồng; đơn vị được công nhận \"hoàn thành xuất sắc\" thì tối đa <mark>25%</mark>.",
"Mức xếp loại của <b>người đứng đầu không cao hơn mức xếp loại của đơn vị</b>."]},
{h:"Đánh giá đơn vị sự nghiệp công lập",items:[
"Cũng chấm 100 điểm: tiêu chí chung 30 (chấp hành chủ trương, quản lý tổ chức bộ máy, cải cách hành chính, chuyển đổi số) + kết quả nhiệm vụ 70 (mức hoàn thành kế hoạch, chất lượng dịch vụ, mức hài lòng, hiệu quả sử dụng nguồn lực, đổi mới).",
"<b>Đơn vị xuất sắc:</b> từ 90 điểm <b>và</b> hoàn thành 100% nhiệm vụ đúng hạn, trong đó <mark>ít nhất 30% vượt mức</mark>; không có đơn vị cấu thành \"không hoàn thành\"; đã khắc phục hết hạn chế.",
"<b>Đơn vị hoàn thành nhiệm vụ:</b> 50 đến dưới 70 điểm, nhiệm vụ chậm tiến độ <mark>không quá 20%</mark>. <b>Không hoàn thành:</b> dưới 50 điểm, hoặc hoàn thành <mark>dưới 70%</mark> nhiệm vụ kế hoạch năm, hoặc có sai phạm công tác cán bộ, mất đoàn kết, chạy chức chạy quyền.",
"Tỷ lệ đơn vị xuất sắc ≤ 20% (tối đa 25%); nơi có <b>dưới 05 đơn vị trực thuộc thì tối đa 01</b> đơn vị xuất sắc.",
"Thẩm quyền công nhận: Bộ trưởng (đơn vị thuộc bộ), Chủ tịch UBND tỉnh, <b>Chủ tịch UBND cấp xã</b> (đơn vị thuộc xã), người đứng đầu ĐVSNCL (đơn vị cấu thành)."]},
{h:"Thẩm quyền, trình tự, thời điểm",items:[
"<b>Giao nhiệm vụ</b> theo kế hoạch tháng, quý, năm, có số lượng, chất lượng, tiến độ cụ thể.",
"<b>Theo dõi, đánh giá:</b> cấp trên quản lý đánh giá người đứng đầu ĐVSNCL; người đứng đầu ĐVSNCL đánh giá cấp phó và trưởng đơn vị cấu thành; người đứng đầu đơn vị cấu thành đánh giá viên chức thuộc mình. <b>Xếp loại</b> viên chức ở đơn vị cấu thành do <b>người đứng đầu ĐVSNCL</b> quyết định.",
"<b>Thời điểm:</b> theo năm công tác, <b>sau khi đơn vị đã được xếp loại</b>, hoàn thành <mark>trước 15/12</mark> (đơn vị đặc thù: <mark>trước 15/01 năm sau</mark>; ngành giáo dục theo Bộ GD&ĐT); trước khi đánh giá đảng viên và tổng kết thi đua.",
"<b>Người đứng đầu, cấp phó:</b> tự đánh giá → họp nhận xét → <b>lấy ý kiến cấp ủy</b> → cấp có thẩm quyền quyết định → thông báo, công khai (ưu tiên điện tử). <b>Viên chức thường:</b> tự đánh giá → họp nhận xét → quyết định → công khai (không có bước lấy ý kiến cấp ủy).",
"<b>Trường hợp đặc biệt (Điều 14):</b> làm việc <b>chưa đủ 06 tháng</b> trong năm thì <b>không xếp loại</b>; nghỉ ốm, thai sản thì xếp theo thời gian làm việc thực tế; cùng một hành vi bị kỷ luật Đảng và hành chính trong năm thì chỉ tính một lần; vi phạm ở đơn vị cũ tính vào kết quả đơn vị cũ.",
"<b>Kiến nghị</b> (Luật Viên chức Điều 27): trong 05 ngày; giải quyết trong 10 ngày làm việc."]},
{h:"Sử dụng kết quả, tổ chức thực hiện",items:[
"<b>Kết quả quý:</b> khắc phục hạn chế, xác định <b>thu nhập tăng thêm, tiền thưởng</b>.",
"<b>Kết quả 06 tháng:</b> rà soát phân công, xem xét <b>thay đổi bậc nghề nghiệp, vị trí việc làm</b>, thu nhập tăng thêm.",
"<b>Kết quả năm:</b> đánh giá, xếp loại <b>đảng viên</b>; bố trí, đào tạo, quy hoạch, bổ nhiệm, miễn nhiệm, điều động, biệt phái, thi đua, khen thưởng, kỷ luật; xét bậc nghề nghiệp. Không hoàn thành nhiệm vụ vì lý do chuyên môn có thể bị <b>chấm dứt hợp đồng</b> (Luật Viên chức Điều 22) – luật mới <b>không còn điều kiện \"02 năm liên tiếp\"</b>.",
"ĐVSNCL ban hành <b>Quy chế đánh giá</b> chậm nhất <mark>30/11/2026</mark>; kỳ xếp loại cuối năm 2026 nếu chưa có quy chế mới thì vẫn dùng quy chế theo NĐ 90/2020.",
"Đồng bộ kết quả vào <b>Cơ sở dữ liệu quốc gia</b> về CB, CC, VC <mark>chậm nhất 05 ngày</mark> sau khi có kết quả."]},
{h:"Điểm mới so với NĐ 90/2020, NĐ 48/2023",items:[
"Nghị định riêng cho ĐVSNCL và viên chức; chấm điểm cả đơn vị.",
"Thang điểm 100 (30 + 70) thay cho tiêu chí mô tả định tính.",
"Theo dõi, chấm điểm tháng/quý; kết quả quý và 06 tháng có giá trị sử dụng riêng.",
"Trần tỷ lệ xuất sắc ghi rõ: 20% số \"hoàn thành tốt\", tối đa 25%.",
"\"Không hoàn thành\" được định lượng (dưới 50 điểm) và gắn với kỷ luật <b>từ khiển trách trở lên vì vi phạm liên quan đến nhiệm vụ</b>.",
"Thêm tiêu chí riêng cho viên chức quản lý; người đứng đầu không xếp cao hơn đơn vị.",
"Số hóa: phần mềm theo dõi, đồng bộ CSDL quốc gia, công khai điện tử."]}
],
