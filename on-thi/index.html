title:"Chỉ thị số 04-CT/TW ngày 17/3/2026 của Ban Bí thư về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới",
meta:[["Cơ quan ban hành","Ban Bí thư Trung ương Đảng"],["Ngày ký","17/3/2026"],["Người ký","Đồng chí Trần Cẩm Tú, Ủy viên Bộ Chính trị, Thường trực Ban Bí thư"],["Văn bản hướng dẫn","Hướng dẫn số 22-HD/BTGDVTW ngày 28/5/2026 của Ban Tuyên giáo và Dân vận Trung ương"],["Bố cục","Đánh giá – I. 5 quan điểm – II. Mục tiêu đến 2030, tầm nhìn 2045 – III. 9 nhóm nhiệm vụ, giải pháp – IV. Tổ chức thực hiện"],["Văn bản trước","Chỉ thị 42-CT/TW ngày 25/8/2004 của Ban Bí thư về nâng cao chất lượng toàn diện của hoạt động xuất bản (tổng kết 20 năm ngày 26/8/2025)"],["Ghi chú nguồn","Chưa thấy toàn văn trên cổng thông tin chính thức của Đảng; nội dung tổng hợp từ báo Lào Cai, Tạp chí Công Thương, VnEconomy, Báo Văn hóa, kế hoạch quán triệt của Thành ủy Cần Thơ"]],
tldr:`Văn bản của <b>Ban Bí thư</b> (không phải Bộ Chính trị), ký ngày <mark>17/3/2026</mark>, đồng chí <b>Trần Cẩm Tú</b> ký. Khẳng định xuất bản là <b>“một lĩnh vực hoạt động tư tưởng sắc bén của Đảng, Nhà nước và nhân dân”</b>; <b>“phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản”</b>; xuất bản là <b>“công cụ chủ đạo trong giáo dục, đào tạo”</b>, bộ phận quan trọng của công nghiệp văn hóa; nâng cao chất lượng nhân lực là <b>“nhiệm vụ cấp bách”</b>. Mục tiêu 2030: hệ thống xuất bản <b>“tinh gọn, mạnh, chất lượng, hiện đại hóa”</b>, <mark>100%</mark> nhà xuất bản tham gia xuất bản điện tử, <mark>80%</mark> cơ sở in có công nghệ hiện đại; tầm nhìn <mark>2045</mark>: ngành kinh tế số, vươn ra toàn cầu. Cấu trúc <mark>5 quan điểm – 9 nhóm nhiệm vụ</mark>. Điểm mới đáng nhớ: <b>cơ chế bảo vệ người làm xuất bản, biên tập viên</b> trước vu khống, xuyên tạc, tấn công mạng. Hướng dẫn quán triệt: <b>HD 22-HD/BTGDVTW (28/5/2026)</b>.`,
sections:[
{h:"Bối cảnh và đánh giá",items:[
"“Sau hơn 70 năm xây dựng và phát triển, xuất bản cách mạng Việt Nam đã đạt được những kết quả và thành tựu quan trọng”; xuất bản đã làm tốt vai trò <b>“vũ khí tư tưởng sắc bén”</b> của Đảng, Nhà nước và Nhân dân.",
"Bối cảnh mới: Cách mạng công nghiệp lần thứ tư, bùng nổ trí tuệ nhân tạo, hội nhập quốc tế sâu rộng; các thế lực thù địch lợi dụng không gian mạng; còn những “điểm nghẽn” cần tháo gỡ.",
"Chỉ thị 42-CT/TW (25/8/2004) “tạo nền tảng quan trọng”, còn Chỉ thị 04 “mở ra một giai đoạn mới cao hơn” (Cục trưởng Cục Xuất bản, In và Phát hành Nguyễn Nguyên, Báo Văn hóa). Các bản tin chính thống không nêu Chỉ thị 04 thay thế Chỉ thị 42.",
"Hội nghị tổng kết 20 năm Chỉ thị 42 (26/8/2025) nhận định: chất lượng sách chưa đồng đều, “số lượng sách tăng nhưng chất lượng còn hạn chế”, ít tác phẩm xứng tầm; nền tảng số có thể thành kẽ hở cho sản phẩm vi phạm."]},
{h:"5 quan điểm chỉ đạo",items:[
"<b>(1)</b> <b>“Xuất bản là một lĩnh vực hoạt động tư tưởng sắc bén của Đảng, Nhà nước và nhân dân”</b>: tuyên truyền, bảo vệ nền tảng tư tưởng của Đảng, đường lối, chính sách, pháp luật; giữ gìn, lan tỏa giá trị văn hóa; xây dựng nền tảng tri thức quốc gia.",
"<b>(2)</b> <b>“Phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản.”</b> Xuất bản đáp ứng nhu cầu đọc, học, giải trí; <b>“trở thành ngành kinh tế – công nghệ phát triển”</b>.",
"<b>(3)</b> <b>“Xuất bản là công cụ chủ đạo trong giáo dục, đào tạo; là một bộ phận quan trọng của ngành công nghiệp văn hóa”</b>, gắn với chuỗi giá trị nội dung số, tài sản số; là <b>công cụ ngoại giao văn hóa quan trọng</b>.",
"<b>(4)</b> Đảng và Nhà nước <b>giữ vai trò chủ đạo trong định hướng và kiến tạo</b> hoạt động xuất bản thông qua cơ chế, chính sách; có <b>“chính sách đặc thù đột phá về mô hình thúc đẩy hợp tác công tư”</b>.",
"<b>(5)</b> <b>“Nâng cao chất lượng nguồn nhân lực hoạt động xuất bản là nhiệm vụ cấp bách”</b>: cần “đội ngũ cán bộ, biên tập viên, chuyên gia công nghệ, nhà quản trị giỏi”."]},
{h:"Mục tiêu đến 2030, tầm nhìn 2045",items:[
"<b>Đến 2030:</b> <b>“Xây dựng hệ thống xuất bản tinh gọn, mạnh, chất lượng, hiện đại hóa”</b>; hình thành các <b>tập đoàn xuất bản, truyền thông chủ lực quốc gia</b>; chuyển đổi số sâu rộng, xây dựng thư viện số, tủ sách điện tử; thúc đẩy mạnh mẽ văn hóa đọc; mở rộng hợp tác quốc tế.",
"Chỉ tiêu: <mark>100%</mark> nhà xuất bản tham gia xuất bản điện tử và ứng dụng chuyển đổi số trong quy trình xuất bản; <mark>80%</mark> cơ sở in có công nghệ hiện đại, quy mô, là ngành công nghiệp phụ trợ quan trọng.",
"<b>Tầm nhìn 2045:</b> Việt Nam có hệ thống xuất bản, truyền thông phát triển mạnh, đa dạng, hiện đại; là “trung tâm sáng tạo, giao lưu, hợp tác hàng đầu” trong khu vực; trở thành ngành kinh tế số, có năng lực vươn ra toàn cầu."]},
{h:"9 nhóm nhiệm vụ, giải pháp",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li><b>Lãnh đạo, quản lý, phối hợp:</b> tăng cường sự lãnh đạo của Đảng, quản lý của Nhà nước, sự phối hợp chặt chẽ, đồng bộ của cả hệ thống chính trị.</li>
<li><b>Thể chế:</b> xây dựng, hoàn thiện quy định của Đảng và pháp luật về xuất bản; “tháo gỡ các điểm nghẽn, khơi thông mọi nguồn lực”; bảo vệ bản quyền, nhất là trong môi trường số và trí tuệ nhân tạo.</li>
<li><b>Chiến lược:</b> xây dựng chiến lược phát triển, định vị sản phẩm xuất bản gắn với công nghiệp văn hóa; đầu tư hạ tầng, xuất bản điện tử; hợp tác công tư.</li>
<li><b>Nội dung:</b> đầu tư cho nội dung xuất bản thành sản phẩm cốt lõi của công nghiệp văn hóa; đổi mới quản trị; <b>“có cơ chế bảo vệ những người làm xuất bản, biên tập viên trước các hành vi vu khống”</b>, xuyên tạc, tấn công mạng.</li>
<li><b>Thanh tra, kiểm tra:</b> xử lý kịp thời, nghiêm minh vi phạm đạo đức nghề nghiệp, vi phạm pháp luật; in lậu, phát hành lậu, văn hóa phẩm không lành mạnh.</li>
<li><b>Văn hóa đọc:</b> chăm lo, nuôi dưỡng văn hóa đọc trong các tầng lớp nhân dân; “nâng cao chất lượng Giải thưởng Sách quốc gia ngang tầm khu vực”.</li>
<li><b>Hạ tầng số:</b> nền tảng dữ liệu xuất bản số dùng chung toàn ngành; ứng dụng trí tuệ nhân tạo; cải cách thủ tục hành chính.</li>
<li><b>Hợp tác quốc tế:</b> đưa sách Việt ra thế giới, đưa sách thế giới vào Việt Nam qua bản quyền, xuất bản song ngữ, hội chợ sách quốc tế.</li>
<li><b>Nhân lực:</b> đội ngũ người làm xuất bản có bản lĩnh chính trị, năng lực, trình độ chuyên môn, nhất là cán bộ lãnh đạo, quản lý.</li></ol>`},
{h:"Tổ chức thực hiện",items:[
"<b>Đảng ủy Quốc hội:</b> rà soát, hoàn thiện pháp luật về xuất bản. <b>Đảng ủy Chính phủ:</b> nâng hiệu lực quản lý nhà nước, sắp xếp cơ quan xuất bản, chính sách đầu tư.",
"<b>Đảng ủy Bộ Văn hóa, Thể thao và Du lịch:</b> chủ trì đề án sách quốc gia, xuất bản điện tử, cơ sở dữ liệu toàn ngành (phối hợp Bộ Khoa học và Công nghệ), thanh tra, chương trình dịch thuật, đưa sách ra nước ngoài.",
"<b>Đảng ủy Bộ Tài chính:</b> ưu đãi thuế, nguồn lực, đặt hàng. <b>Đảng ủy Công an Trung ương, Đảng ủy Thanh tra Chính phủ:</b> xử lý in lậu, phát hành lậu, vi phạm bản quyền. <b>Quân ủy Trung ương:</b> hệ thống xuất bản, thư viện trong quân đội. <b>Đảng ủy Bộ Giáo dục và Đào tạo:</b> khung đào tạo nhân lực, đưa tiết đọc sách vào trường học.",
"Tỉnh ủy, thành ủy, đảng ủy trực thuộc, cơ quan xuất bản quán triệt, báo cáo; Đảng ủy Mặt trận Tổ quốc và các đoàn thể; <b>Hội Xuất bản Việt Nam</b> phát huy vai trò.",
"<b>Ban Tuyên giáo và Dân vận Trung ương:</b> rà soát, đề xuất sửa đổi quy định của Đảng về xuất bản; chủ trì tuyên truyền, kiểm tra, giám sát; báo cáo định kỳ Ban Bí thư."]},
{h:"Hướng dẫn 22 và việc quán triệt",items:[
"<b>Hướng dẫn số 22-HD/BTGDVTW ngày 28/5/2026</b> của Ban Tuyên giáo và Dân vận Trung ương hướng dẫn học tập, quán triệt, triển khai Chỉ thị 04 (cùng ngày với HD 21 về Chỉ thị 05 về báo chí).",
"Yêu cầu chung (theo tin lsvn.vn và kế hoạch của Thành ủy Cần Thơ): quán triệt đến cán bộ, đảng viên, người lao động; xây dựng kế hoạch phù hợp từng cơ quan; gắn với Nghị quyết Đại hội XIV, <b>NQ 57-NQ/TW</b> (22/12/2024) và <b>NQ 80-NQ/TW</b> (07/01/2026) về phát triển văn hóa Việt Nam; chuyển từ học tập sang hành động cụ thể.",
"Ở địa phương: Sở Văn hóa, Thể thao và Du lịch quản lý xuất bản, in, phát hành; Sở Khoa học và Công nghệ phụ trách chuyển đổi số, dữ liệu, AI; Công an xử lý in lậu, vi phạm bản quyền; hướng tới phong trào “toàn dân đọc sách”."]},
{h:"Liên hệ: biên tập viên Nhà xuất bản Chính trị quốc gia Sự thật",items:[
"NXB Chính trị quốc gia Sự thật (tiền thân là NXB Sự thật, thành lập 05/12/1945) là <b>cơ quan xuất bản lý luận, chính trị của Đảng và Nhà nước</b>, đặt dưới sự lãnh đạo trực tiếp và thường xuyên của Ban Bí thư; chức năng, nhiệm vụ theo Quyết định 223-QĐ/TW ngày 28/12/2024 của Bộ Chính trị (bổ sung nhiệm vụ biên dịch, tuyên truyền, giới thiệu xuất bản phẩm).",
"Quan điểm 1 đòi hỏi sách chính trị phải bảo vệ nền tảng tư tưởng của Đảng: biên tập viên kiểm tra quan điểm, trích dẫn, sự kiện; không để lọt nội dung thuộc Điều 10 Luật Xuất bản.",
"Quan điểm 2: lấy người đọc làm trung tâm – sách lý luận phải dễ tiếp cận, thuyết phục; đa dạng hình thức (sách điện tử, sách nói).",
"Quan điểm 5 và nhiệm vụ 9: tự học lý luận, ngoại ngữ, công nghệ, kỹ năng xuất bản điện tử; nhiệm vụ 4 có cơ chế bảo vệ biên tập viên – đi kèm trách nhiệm tuân thủ quy trình, lưu vết hồ sơ biên tập."]}
],

title:"Nghiệp vụ biên tập xuất bản phẩm: quy trình, chuẩn trình bày và các lỗi thường gặp trong bản thảo sách chính trị",
meta:[["Căn cứ pháp lý","Luật Xuất bản 2012: khoản 6 Điều 4 (khái niệm biên tập), Điều 18, 19 (trách nhiệm), Điều 23 (liên kết)"],["Chuẩn viết hoa tham chiếu","Phụ lục II Nghị định 30/2020/NĐ-CP ngày 05/3/2020 về công tác văn thư (vẫn được viện dẫn trong kế hoạch văn thư năm 2026)"],["Quy trình tham chiếu","Biên tập và duyệt nhiều cấp tại NXB Chính trị quốc gia Sự thật (báo An ninh Thủ đô; Tuổi Trẻ 25/6/2026)"],["Thời gian xử lý một bản thảo","Khoảng 6–9 tháng từ khi nhận bản thảo (theo bài báo An ninh Thủ đô)"],["Chuỗi trách nhiệm","Biên tập viên (phần mình biên tập) → Tổng biên tập (nội dung) → Tổng giám đốc/Giám đốc (xuất bản phẩm và mọi hoạt động)"]],
tldr:`Biên tập là <b>“việc rà soát, hoàn thiện nội dung và hình thức bản thảo để xuất bản”</b>. Tại NXB Chính trị quốc gia Sự thật, bản thảo đi qua nhiều cấp: biên tập viên → lãnh đạo ban biên tập → thư ký biên tập → Phó Giám đốc – Phó Tổng biên tập (hoặc ủy viên Hội đồng biên tập) duyệt nội dung → <b>Giám đốc – Tổng biên tập duyệt nội dung và duyệt in</b> → biên tập kỹ thuật, <b>đọc morat trước in</b>, đọc sách mẫu sau in; mỗi bước đều <b>lưu vết trên bản thảo</b>. Biên tập viên sách chính trị là <b>“người gác cổng tri thức”</b>, “không phải thợ sửa văn bản”; <b>“mỗi thông tin quan trọng đều phải được xác minh”</b>. Chuẩn viết hoa tham chiếu: <b>Phụ lục II NĐ 30/2020/NĐ-CP</b>. Lỗi thường gặp xếp thành 10 nhóm: chính tả, dùng từ, ngữ pháp, dấu câu, viết hoa, sự kiện – số liệu, trích dẫn văn kiện, logic, chính trị – tư tưởng, bản quyền.`,
sections:[
{h:"Biên tập là gì, ai chịu trách nhiệm gì",items:[
"<b>Khái niệm</b> (khoản 6 Điều 4 Luật Xuất bản): rà soát, hoàn thiện <b>nội dung và hình thức</b> bản thảo để xuất bản. Biên tập nội dung (quan điểm, sự kiện, số liệu, trích dẫn, bố cục, văn phong) đi cùng biên tập kỹ thuật, mỹ thuật (trình bày, bìa, chế bản, sửa morat).",
"<b>Biên tập viên</b>: biên tập bản thảo; được từ chối biên tập bản thảo có dấu hiệu vi phạm khoản 1 Điều 10 và phải báo cáo bằng văn bản; đứng tên trên sách; chịu trách nhiệm trước tổng biên tập và trước pháp luật về phần nội dung mình biên tập.",
"<b>Tổng biên tập</b>: tổ chức biên tập; đọc và ký duyệt từng bản thảo. <b>Tổng giám đốc (giám đốc)</b>: ký duyệt bản thảo hoàn chỉnh trước khi in, ký quyết định xuất bản, quyết định phát hành, lưu trữ hồ sơ biên tập.",
"<b>Liên kết</b> không chuyển trách nhiệm: bản thảo do đối tác biên tập sơ bộ vẫn phải được nhà xuất bản biên tập hoàn chỉnh; tác phẩm lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký không được liên kết biên tập sơ bộ."]},
{h:"Quy trình biên tập một cuốn sách",html:`<ol style="margin:.2rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem">
<li><b>Tổ chức, khai thác bản thảo:</b> xây dựng kế hoạch đề tài, đặt hàng tác giả, ký văn bản chấp thuận/hợp đồng quyền tác giả (Điều 21), đăng ký xuất bản (Điều 22).</li>
<li><b>Tiếp nhận và đánh giá sơ bộ:</b> lãnh đạo ban biên tập và biên tập viên đánh giá nội dung, cấu trúc, đề nghị chỉnh sửa; bản thảo quan trọng, phức tạp được gửi chuyên gia, hội đồng tư vấn thẩm định; tác phẩm thuộc Điều 24 phải thẩm định trước khi tái bản.</li>
<li><b>Biên tập nội dung:</b> biên tập viên biên tập, thống nhất hình thức; đối chiếu nguồn văn kiện của Đảng, văn bản pháp luật, số liệu khoa học; trao đổi với tác giả; ghi vết mọi chỉnh sửa.</li>
<li><b>Đọc kiểm tra:</b> lãnh đạo ban biên tập đọc, hoàn thiện; thư ký biên tập đọc, kiểm tra, đề nghị sửa nếu cần.</li>
<li><b>Duyệt nội dung:</b> Phó Giám đốc – Phó Tổng biên tập hoặc ủy viên Hội đồng biên tập duyệt.</li>
<li><b>Duyệt cuối:</b> Giám đốc – Tổng biên tập duyệt nội dung và duyệt in; ký quyết định xuất bản.</li>
<li><b>Biên tập kỹ thuật, mỹ thuật:</b> trình bày, bìa, chế bản; <b>đọc morat (bản in thử) trước khi in</b>; nhà xuất bản quản lý khâu in.</li>
<li><b>Sau in:</b> đọc sách mẫu, nghiệm thu sản phẩm đúng bản thảo đã duyệt; nộp lưu chiểu chậm nhất 10 ngày trước khi phát hành; ký quyết định phát hành; lưu hồ sơ biên tập.</li></ol>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">Các bước 3–8 theo mô tả quy trình của NXB Chính trị quốc gia Sự thật trên báo An ninh Thủ đô và Tuổi Trẻ; bước 1–2 và các mốc pháp lý theo Luật Xuất bản.</p>`},
{h:"Biên tập viên sách chính trị, lý luận: vai trò và phẩm chất",items:[
"Là <b>“người gác cổng tri thức”</b>: cần bản lĩnh chính trị vững vàng, năng lực chuyên môn và tinh thần trách nhiệm với từng chữ, từng nguồn (PGS.TS Vũ Trọng Lâm, Tuổi Trẻ 25/6/2026).",
"<b>“Không thể vì áp lực tiến độ, lợi ích kinh tế hay sức ép cạnh tranh”</b> mà xem nhẹ tính chính xác và định hướng.",
"“Biên tập viên sách lý luận, chính trị không phải là ‘thợ sửa văn bản’”: cần <b>trình độ lý luận chuyên sâu</b>, bảo đảm “độ chính xác, tính khoa học và chuẩn mực nội dung” (PGS.TS Lê Thị Thục, Ủy viên Hội đồng biên tập).",
"Đội ngũ biên tập viên “chuyên nghiệp, có bản lĩnh chính trị, có tư duy đổi mới”, “am hiểu sâu sắc về kỹ năng, nghiệp vụ” là “điều kiện tiên quyết” để nhà xuất bản hoàn thành sứ mệnh chính trị.",
"“Sách là văn bia để đời nên phải cẩn trọng, tỉ mỉ trong từng câu, từng chữ” (lời Tổng Bí thư Nguyễn Phú Trọng, theo An ninh Thủ đô).",
"Công nghệ, AI hỗ trợ tra cứu, đối chiếu, kiểm định thông tin nhưng không thay thế vai trò và trách nhiệm của biên tập viên."]},
{h:"Kiểm tra trích dẫn, sự kiện, số liệu",items:[
"<b>Văn kiện của Đảng:</b> kiểm tra đủ 4 yếu tố – <b>loại văn bản và số hiệu</b> (Chỉ thị 04-CT/TW, Quyết định 223-QĐ/TW: ký hiệu QĐ thì không gọi là “nghị quyết”), <b>cơ quan ban hành</b> (Chỉ thị 04 của Ban Bí thư; NQ 57, NQ 80 của Bộ Chính trị), <b>ngày ban hành</b>, <b>trích yếu</b>. Văn kiện sau Đại hội XIV đánh số lại từ đầu – luôn kèm ngày.",
"<b>Trích nguyên văn:</b> đối chiếu bản in chính thức (văn kiện, toàn tập), ghi rõ tập, trang, năm xuất bản; không cắt ghép làm sai ý. Trích dẫn hợp lý phải “không làm sai ý tác giả” và “kèm theo chỉ dẫn về nguồn gốc tác phẩm và tên tác giả” (Luật Sở hữu trí tuệ).",
"<b>Sự kiện, nhân vật:</b> đối chiếu ngày, địa điểm, người chủ trì, tên văn kiện (ví dụ: Cương lĩnh chính trị đầu tiên là Chánh cương vắn tắt, Sách lược vắn tắt; Luận cương chính trị tháng 10/1930 do Trần Phú khởi thảo).",
"<b>Số liệu, chỉ tiêu:</b> gắn với năm và văn bản nguồn (100% nhà xuất bản tham gia xuất bản điện tử là chỉ tiêu 2030 của Chỉ thị 04; 7% GDP công nghiệp văn hóa là mục tiêu 2030 của NQ 80, 9% là tầm nhìn 2045); phân biệt <b>đầu sách</b> và <b>bản sách</b>; kiểm tra phép tính khoảng năm (1945–2025 là 80 năm).",
"<b>Văn bản pháp luật:</b> phân biệt ngày thông qua và ngày có hiệu lực (Luật 17/2026/QH16 thông qua 24/8/2026, hiệu lực 01/3/2027)."]},
{h:"Quy tắc viết hoa (Phụ lục II NĐ 30/2020/NĐ-CP)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Trường hợp</th><th>Quy tắc</th><th>Ví dụ đúng</th></tr></thead><tbody>
<tr><td>Đầu câu</td><td>Viết hoa chữ đầu sau dấu chấm, chấm hỏi, chấm than, khi xuống dòng; sau dấu chấm phẩy không viết hoa (trừ tên riêng)</td><td></td></tr>
<tr><td>Tên người Việt</td><td>Viết hoa chữ đầu mọi âm tiết</td><td>Hồ Chí Minh, Nguyễn Ái Quốc, Bác Hồ, Vua Hùng</td></tr>
<tr><td>Tên người nước ngoài</td><td>Qua âm Hán Việt: như tên người Việt; phiên âm trực tiếp: viết hoa chữ đầu mỗi thành phần, nối các âm tiết bằng gạch nối</td><td>Mao Trạch Đông; Phri-đrích Ăng-ghen, Vla-đi-mia I-lích Lê-nin</td></tr>
<tr><td>Đơn vị hành chính</td><td>Danh từ chung viết thường; tên riêng viết hoa. Danh từ chung đi với số, tên người, tên sự kiện thì viết hoa</td><td>tỉnh Thái Bình, thành phố Lạng Sơn; Quận 3, Phường Điện Biên Phủ; Thủ đô Hà Nội, Thành phố Hồ Chí Minh</td></tr>
<tr><td>Địa danh có danh từ chỉ địa hình</td><td>Địa hình + một âm tiết riêng thành tên: viết hoa cả; địa hình đứng trước tên riêng: viết thường</td><td>Cửa Lò, Vũng Tàu; sông Vàm Cỏ, vịnh Hạ Long, chợ Bến Thành</td></tr>
<tr><td>Vùng, miền</td><td>Viết hoa các âm tiết</td><td>Tây Bắc, Đông Bắc, Bắc Bộ</td></tr>
<tr><td>Cơ quan, tổ chức</td><td>Viết hoa chữ đầu của từ, cụm từ chỉ loại hình, chức năng, lĩnh vực</td><td>Ban Chấp hành Trung ương Đảng Cộng sản Việt Nam, Văn phòng Trung ương Đảng, Bộ Tài nguyên và Môi trường, Hội đồng nhân dân tỉnh Cà Mau</td></tr>
<tr><td>Tổ chức nước ngoài</td><td>Dịch nghĩa: như tổ chức Việt Nam; viết tắt giữ nguyên chữ in hoa</td><td>Liên hợp quốc, Tổ chức Y tế thế giới; WTO, UNESCO, ASEAN</td></tr>
<tr><td>Danh từ đặc biệt</td><td>Luôn viết hoa</td><td>Nhân dân, Nhà nước</td></tr>
<tr><td>Danh từ chung dùng thay tên riêng</td><td>Viết hoa khi dùng một mình với nghĩa tôn kính, chỉ đối tượng cụ thể</td><td>Bác, Người (Chủ tịch Hồ Chí Minh); Đảng (Đảng Cộng sản Việt Nam)</td></tr>
<tr><td>Chức vụ, học hàm, danh hiệu</td><td>Viết hoa khi đi với tên người; danh hiệu, huân chương viết hoa chữ đầu âm tiết tên gọi</td><td>Chủ tịch Quốc hội, Giáo sư Tôn Thất Tùng; Anh hùng Lao động, Nghệ sĩ Nhân dân</td></tr>
<tr><td>Ngày lễ, kỷ niệm</td><td>Viết hoa chữ cái đầu âm tiết tạo thành tên gọi</td><td>Ngày Quốc khánh 2/9, Ngày Quốc tế Lao động 1/5</td></tr>
<tr><td>Văn bản</td><td>Viết hoa loại văn bản và chữ đầu tên gọi; viện dẫn phần, chương, mục, điều thì viết hoa</td><td>Bộ luật Dân sự, Luật Xuất bản; điểm b khoản 2 Điều 103 Mục 5 Chương XII Phần I Bộ luật Hình sự</td></tr>
<tr><td>Thứ, tháng (ghi bằng chữ)</td><td>Viết hoa chữ chỉ thứ, tháng</td><td>thứ Hai, tháng Năm</td></tr>
<tr><td>Sự kiện, triều đại; năm âm lịch</td><td>Viết hoa chữ đầu âm tiết tạo thành tên</td><td>Triều Lý, Triều Trần; Mậu Thân, Tân Hợi</td></tr>
<tr><td>Tác phẩm, sách báo</td><td>Viết hoa chữ đầu âm tiết thứ nhất của tên (và tên riêng trong đó)</td><td>tạp chí Cộng sản, từ điển Bách khoa toàn thư</td></tr>
</tbody></table></div>
<p class="muted" style="margin:.5rem 0 0;font-size:.88rem">NĐ 30/2020 áp dụng cho văn bản hành chính; nhà xuất bản có thể có quy ước riêng (ví dụ sách kinh điển dùng dạng quen thuộc C. Mác, Ph. Ăngghen, V.I. Lênin). Nguyên tắc nghề nghiệp: chọn một chuẩn và thống nhất trong toàn cuốn.</p>`},
{h:"Các nhóm lỗi thường gặp và cách sửa",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Nhóm lỗi</th><th>Ví dụ sai → đúng</th></tr></thead><tbody>
<tr><td>Chính tả</td><td>dành độc lập → giành độc lập; sát nhập → sáp nhập; sử lý → xử lý; bổ xung → bổ sung; nghành → ngành; lịch xử → lịch sử</td></tr>
<tr><td>Dùng từ</td><td>vô hình chung → vô hình trung; yếu điểm (nghĩa gốc: điểm quan trọng) ≠ điểm yếu; bàng quang → bàng quan (thờ ơ); “hậu quả” (sắc thái xấu) dùng cho kết quả tốt → thành quả; tham vọng → khát vọng</td></tr>
<tr><td>Ngữ pháp</td><td>“Qua thực tiễn đã chứng minh…” (thiếu chủ ngữ) → “Thực tiễn đã chứng minh…”; câu chỉ có trạng ngữ, không có nòng cốt; “Nhờ đổi mới mà đã đưa…” → “Công cuộc đổi mới đã đưa…”</td></tr>
<tr><td>Dấu câu</td><td>“đổi mới tư duy nhất là tư duy kinh tế” → “đổi mới tư duy, nhất là tư duy kinh tế”; thiếu ngoặc đóng, ngoặc kép đóng; dấu phẩy tách chủ ngữ với vị ngữ</td></tr>
<tr><td>Viết hoa</td><td>Ban chấp hành Trung ương → Ban Chấp hành Trung ương; Luật xuất bản → Luật Xuất bản; người (chỉ Bác) → Người</td></tr>
<tr><td>Sự kiện, số liệu</td><td>sai ngày, địa điểm, người chủ trì; sai chỉ tiêu (80% cơ sở in ≠ 100% nhà xuất bản)</td></tr>
<tr><td>Trích dẫn văn kiện</td><td>sai cơ quan ban hành (Chỉ thị 04 của Ban Bí thư), sai loại văn bản, sai năm (Cương lĩnh bổ sung, phát triển năm 2011), sửa nguyên văn</td></tr>
<tr><td>Logic</td><td>từ nối sai quan hệ (“Vì vậy” thay cho “Tuy nhiên”); con số tự mâu thuẫn; đảo quan hệ nhân quả</td></tr>
<tr><td>Chính trị – tư tưởng</td><td>“tam quyền phân lập” (quyền lực nhà nước là thống nhất, có phân công, phối hợp, kiểm soát); “kinh tế thị trường tự do” → kinh tế thị trường định hướng xã hội chủ nghĩa; hạ thấp vai trò lãnh đạo của Đảng; coi xuất bản là kinh doanh thuần túy</td></tr>
<tr><td>Bản quyền</td><td>ảnh lấy từ Internet không rõ chủ sở hữu; trích dài không ghi nguồn; sách dịch thiếu hợp đồng bản quyền</td></tr>
</tbody></table></div>`},
{h:"Danh mục tự kiểm trước khi trình duyệt",items:[
"Văn bản chấp thuận/hợp đồng quyền tác giả; số xác nhận đăng ký còn hiệu lực trong năm; bản thảo thuộc diện thẩm định chưa.",
"Quan điểm, thuật ngữ chính trị đúng văn kiện; không có nội dung thuộc khoản 1 Điều 10; bản đồ, chủ quyền thể hiện đúng.",

DOCS.push({id:"qtg",group:"pro",short:"Quyền tác giả trong xuất bản (Luật SHTT 2022, 2025)",mmLabel:"Quyền tác giả trong hoạt động xuất bản",so:"131/2025/QH15",
title:"Quyền tác giả trong hoạt động xuất bản theo Luật Sở hữu trí tuệ (sửa đổi, bổ sung năm 2022 và năm 2025) và Luật Xuất bản",
meta:[["Luật gốc","Luật Sở hữu trí tuệ số 50/2005/QH11"],["Sửa đổi năm 2022","Luật số 07/2022/QH15, thông qua 16/6/2022, hiệu lực 01/01/2023 (trừ một số điều khoản)"],["Sửa đổi gần nhất","Luật số 131/2025/QH15, thông qua 10/12/2025, hiệu lực 01/4/2026"],["Văn bản hướng dẫn quyền tác giả","Nghị định 17/2023/NĐ-CP"],["Liên quan trong Luật Xuất bản","Điều 21: xuất bản, tái bản phải có văn bản chấp thuận của tác giả, chủ sở hữu quyền tác giả"],["Cơ quan quản lý","Bộ VHTTDL – Cục Công nghiệp văn hóa và Bản quyền tác giả (NĐ 298/2026/NĐ-CP)"]],
tldr:`Quyền tác giả <b>phát sinh kể từ khi tác phẩm được sáng tạo và được thể hiện dưới một hình thức vật chất nhất định</b>, “đã công bố hay chưa công bố, đã đăng ký hay chưa đăng ký”. Có <mark>4 quyền nhân thân</mark> (đặt tên, đứng tên, công bố, bảo vệ toàn vẹn) và <mark>6 quyền tài sản</mark>. Quyền đặt tên, đứng tên, bảo vệ toàn vẹn được bảo hộ <b>vô thời hạn</b>; quyền công bố và quyền tài sản: phần lớn tác phẩm <mark>suốt đời tác giả + 50 năm</mark>; điện ảnh, nhiếp ảnh, mỹ thuật ứng dụng, khuyết danh <mark>75 năm</mark> từ khi công bố lần đầu; hết hạn vào <mark>24 giờ ngày 31/12</mark>. Trích dẫn hợp lý: <b>không làm sai ý tác giả</b>, để bình luận, giới thiệu, minh họa, <b>ghi tên tác giả và nguồn</b>. Luật <b>131/2025/QH15</b> (hiệu lực <mark>01/4/2026</mark>) cho phép dùng văn bản, dữ liệu đã công bố hợp pháp để <b>huấn luyện hệ thống trí tuệ nhân tạo</b> (với dữ liệu có bản quyền theo quy định của Chính phủ).`,
sections:[
{h:"Quyền tác giả phát sinh khi nào; cái gì không được bảo hộ",items:[
"<b>Điều 6:</b> quyền tác giả phát sinh kể từ khi tác phẩm được sáng tạo và thể hiện dưới hình thức vật chất nhất định, đã công bố hay chưa, <b>đã đăng ký hay chưa đăng ký</b> – đăng ký không phải điều kiện để được bảo hộ, nhưng là chứng cứ khi tranh chấp.",
"Luật 131/2025 bổ sung vào nhóm đối tượng không được bảo hộ quyền tác giả: <b>“Ý tưởng; khẩu hiệu; tên tác phẩm một cách độc lập”</b>.",
"Luật Xuất bản Điều 21: muốn xuất bản tác phẩm, tái bản xuất bản phẩm phải có <b>văn bản chấp thuận</b> của tác giả, chủ sở hữu quyền tác giả."]},
{h:"Quyền nhân thân (Điều 19)",items:[
"<b>(1) Đặt tên cho tác phẩm.</b> Từ Luật 07/2022: tác giả có thể chuyển quyền sử dụng quyền đặt tên cho tổ chức, cá nhân nhận chuyển giao quyền tài sản.",
"<b>(2) Đứng tên thật hoặc bút danh</b>; được nêu tên khi tác phẩm được công bố, sử dụng.",
"<b>(3) Công bố tác phẩm</b> hoặc cho phép người khác công bố.",
"<b>(4) Bảo vệ sự toàn vẹn của tác phẩm</b>: không cho người khác xuyên tạc, sửa đổi, cắt xén gây phương hại danh dự, uy tín tác giả. Biên tập viên sửa bản thảo phải được tác giả đồng ý."]},
{h:"Quyền tài sản (Điều 20)",items:[
"(a) Làm tác phẩm phái sinh (dịch, phóng tác, cải biên, chuyển thể…).",
"(b) Biểu diễn tác phẩm trước công chúng. (c) <b>Sao chép</b> toàn bộ hoặc một phần bằng bất kỳ phương tiện nào.",
"(d) Phân phối, nhập khẩu để phân phối bản gốc, bản sao. (đ) Phát sóng, truyền đạt đến công chúng bằng mọi phương tiện, kể cả theo yêu cầu. (e) Cho thuê bản gốc, bản sao tác phẩm điện ảnh, chương trình máy tính.",
"Tác phẩm đồng tác giả: thực hiện quyền phải có thỏa thuận của các đồng tác giả, trừ phần có thể tách riêng."]},
{h:"Thời hạn bảo hộ (Điều 27)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Loại quyền / tác phẩm</th><th>Thời hạn</th></tr></thead><tbody>
<tr><td>Đặt tên, đứng tên, bảo vệ toàn vẹn (khoản 1, 2, 4 Điều 19)</td><td><b>Vô thời hạn</b></td></tr>
<tr><td>Điện ảnh, nhiếp ảnh, mỹ thuật ứng dụng, tác phẩm khuyết danh</td><td><mark>75 năm</mark> kể từ khi công bố lần đầu; nếu chưa công bố trong 25 năm từ khi định hình thì <mark>100 năm</mark> kể từ khi định hình</td></tr>
<tr><td>Văn học, khoa học, âm nhạc, kiến trúc, mỹ thuật (trừ mỹ thuật ứng dụng)… – một tác giả</td><td><mark>Suốt cuộc đời tác giả + 50 năm</mark> tiếp theo năm tác giả chết</td></tr>
<tr><td>Đồng tác giả</td><td>Đến hết 50 năm sau năm đồng tác giả cuối cùng chết</td></tr>
<tr><td>Thời điểm chấm dứt</td><td><mark>24 giờ ngày 31/12</mark> của năm chấm dứt thời hạn bảo hộ</td></tr>
</tbody></table></div>`},
{h:"Ngoại lệ: không phải xin phép, không phải trả tiền (Điều 25)",items:[
"Điều kiện chung: tác phẩm <b>đã công bố</b>; phải <b>thông tin về tên tác giả và nguồn gốc</b> tác phẩm; không ảnh hưởng bất hợp lý đến quyền lợi hợp pháp của tác giả.",
"<b>Trích dẫn hợp lý</b> tác phẩm <b>“mà không làm sai ý tác giả để bình luận, giới thiệu hoặc minh họa trong tác phẩm của mình”</b>; để viết báo, dùng trong ấn phẩm định kỳ, phim tài liệu. Phần trích phù hợp mục đích, “kèm theo chỉ dẫn về nguồn gốc tác phẩm và tên tác giả”.",
"Tự sao chép một bản để nghiên cứu, học tập cá nhân, không thương mại; sao chép hợp lý một phần bằng thiết bị sao chép (NĐ 17/2023: với tác phẩm viết, tối đa <b>10%</b> số trang).",
"Sử dụng hợp lý để minh họa bài giảng; sử dụng trong <b>hoạt động công vụ của cơ quan nhà nước</b>; sử dụng trong thư viện không vì mục đích thương mại; người khuyết tật nhìn, khuyết tật đọc chữ in được dùng định dạng dễ tiếp cận (Điều 25a)."]},
{h:"Điểm mới Luật 131/2025/QH15 (hiệu lực 01/4/2026)",items:[
"<b>AI:</b> Chính phủ quy định việc xác lập quyền khi đối tượng được tạo ra <b>có sử dụng hệ thống trí tuệ nhân tạo</b> (khoản 5 Điều 6).",
"Được sử dụng văn bản, dữ liệu đã công bố hợp pháp <b>“phục vụ mục đích nghiên cứu khoa học, thử nghiệm, huấn luyện hệ thống trí tuệ nhân tạo”</b>, không ảnh hưởng bất hợp lý đến quyền của tác giả; với dữ liệu có quyền tác giả còn phải theo quy định của Chính phủ (khoản 5 Điều 7).",
"Nền tảng số, trung gian phải áp dụng biện pháp bảo vệ quyền sở hữu trí tuệ trên không gian mạng (Điều 198b); bổ sung biện pháp gỡ bỏ, chặn truy cập nội dung xâm phạm (Điều 202).",
"Tác phẩm tạo ra bằng ngân sách nhà nước theo đặt hàng, giao nhiệm vụ, đấu thầu (Điều 42); thủ tục đăng ký có thể cấp lại, đổi, hủy bỏ; mẫu đơn do Bộ trưởng Bộ VHTTDL quy định."]},
{h:"Áp dụng trong nghiệp vụ biên tập",items:[
"Kiểm tra văn bản chấp thuận, hợp đồng quyền tác giả trước khi đăng ký xuất bản; sách dịch cần hợp đồng quyền dịch với chủ sở hữu và ghi tên nguyên bản, ngôn ngữ trên sách (Điều 27 Luật Xuất bản).",
"Ảnh, bản đồ, hình minh họa: xác định tác giả, thời hạn bảo hộ (ảnh: 75 năm từ khi công bố), xin phép; không dùng ảnh trôi nổi trên mạng.",
"Tác phẩm hết thời hạn bảo hộ quyền tài sản vẫn phải nêu đúng tên tác giả, giữ nguyên văn, không xuyên tạc (quyền nhân thân vô thời hạn).",
"Sửa chữa, cắt bớt bản thảo phải trao đổi, được tác giả đồng ý (quyền bảo vệ toàn vẹn).",
"Nội dung do AI tạo ra: yêu cầu tác giả khai báo; từ 01/3/2027 phải thông báo, gắn nhãn theo Luật 17/2026/QH16; đối tác liên kết chịu trách nhiệm về quyền và việc dùng AI."]}
],

CONFUSE.push(
{doc:"luatxb",a:"Luật Xuất bản sửa đổi năm 2026 đã có hiệu lực?",b:"<b>Chưa.</b> Luật 17/2026/QH16 được thông qua <b>24/8/2026</b>, có hiệu lực <b>01/3/2027</b> (riêng Điều 34 về in gia công cho nước ngoài từ 01/01/2029). Đến hết 28/02/2027 vẫn áp dụng <b>Luật 19/2012/QH13</b> (VBHN 43/VBHN-VPQH), NĐ 195/2013, TT 01/2020.",tip:"Thông qua ≠ có hiệu lực."},
{doc:"luatxb",a:"07 ngày, 10 ngày, 15 ngày, 45 ngày – cái nào là gì?",b:"<b>07 ngày làm việc</b>: Bộ xác nhận đăng ký xuất bản. <b>10 ngày</b>: nộp lưu chiểu chậm nhất trước khi phát hành. <b>15 ngày</b>: cấp chứng chỉ hành nghề biên tập. <b>45 ngày</b>: nộp Thư viện Quốc gia kể từ ngày phát hành. <b>30 ngày</b>: cấp giấy phép thành lập nhà xuất bản.",tip:"7 đăng ký – 10 lưu chiểu – 15 chứng chỉ – 45 thư viện."},
{doc:"luatxb",a:"Tổng biên tập ký quyết định xuất bản?",b:"Không. <b>Tổng biên tập đọc và ký duyệt từng bản thảo</b> trình tổng giám đốc. <b>Tổng giám đốc (giám đốc)</b> ký duyệt bản thảo hoàn chỉnh trước khi in, <b>ký quyết định xuất bản</b> và <b>quyết định phát hành</b>.",tip:"TBT duyệt – TGĐ quyết."},
{doc:"luatxb",a:"Liên kết xuất bản thì đối tác chịu trách nhiệm về nội dung?",b:"Không. Tổng giám đốc chịu trách nhiệm trước pháp luật về hoạt động liên kết và xuất bản phẩm liên kết; nhà xuất bản phải biên tập hoàn chỉnh bản thảo do đối tác biên tập sơ bộ. Không được liên kết biên tập sơ bộ với <b>lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký</b>.",tip:""},
{doc:"luatxb",a:"Điều 24 Luật Xuất bản: thẩm định khi nào?",b:"<b>Luật 2012</b>: thẩm định trước khi <b>tái bản</b> tác phẩm xuất bản trước 8/1945, 1945–1954 ở vùng tạm chiếm, 1954–1975 ở miền Nam không được Chính phủ CMLT cho phép, xuất bản ở nước ngoài. <b>Luật 2026 (từ 01/3/2027)</b>: thêm nhóm sách về lịch sử cách mạng, chủ quyền, an ninh, lãnh tụ, anh hùng dân tộc phải thẩm định <b>trước khi đăng ký kế hoạch xuất bản</b>.",tip:""},
{doc:"luatxb",a:"Bộ nào quản lý xuất bản sau hợp nhất năm 2025?",b:"<b>Bộ Văn hóa, Thể thao và Du lịch</b> (NĐ 43/2025/NĐ-CP, từ 01/3/2025; NĐ 298/2026/NĐ-CP). Bộ Thông tin và Truyền thông hợp nhất vào Bộ Khoa học và Công nghệ nhưng mảng báo chí, xuất bản chuyển sang Bộ VHTTDL. Luật 2012 vẫn ghi tên “Bộ Thông tin và Truyền thông”.",tip:""},
{doc:"luatxb",a:"“Cấp lại chứng chỉ sau 02 năm” là quy định mới của Luật 2026?",b:"Không. <b>Khoản 4 Điều 20 Luật 2012</b> đã quy định sau 02 năm mới xét cấp lại. Luật 2026 bổ sung căn cứ thu hồi <b>36 tháng liên tục không trực tiếp biên tập</b>, cấp lại khi chuyển nhà xuất bản hoặc hoàn thành bồi dưỡng; chứng chỉ do Bộ VHTTDL cấp.",tip:""},
{doc:"ct04",a:"Chỉ thị 04-CT/TW và Chỉ thị 05-CT/TW năm 2026",b:"<b>04-CT/TW</b>: <b>Ban Bí thư</b>, 17/3/2026, về <b>hoạt động xuất bản</b>; hướng dẫn bằng <b>HD 22</b>. <b>05-CT/TW</b>: <b>Bộ Chính trị</b>, 30/3/2026, về <b>báo chí, truyền thông trên không gian mạng</b>; hướng dẫn bằng <b>HD 21</b>. HD 21 và HD 22 cùng ngày 28/5/2026.",tip:"04 – sách – Ban Bí thư – HD 22."},
{doc:"ct04",a:"100% hay 80%?",b:"<b>100% nhà xuất bản</b> tham gia xuất bản điện tử và ứng dụng chuyển đổi số; <b>80% cơ sở in</b> có công nghệ hiện đại (đều là mục tiêu 2030).",tip:"Nhà xuất bản tròn 100, nhà in 80."},
{doc:"ct04",a:"“Lấy người đọc là trung tâm” hay “người dân và doanh nghiệp là trung tâm”?",b:"<b>Chỉ thị 04</b>: “phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản”. <b>NQ 57</b>: người dân và doanh nghiệp là trung tâm, chủ thể của đổi mới sáng tạo.",tip:""},
{doc:"ct04",a:"Chỉ thị 42-CT/TW và Chỉ thị 04-CT/TW",b:"<b>Chỉ thị 42-CT/TW</b> (Ban Bí thư, 25/8/2004): nâng cao chất lượng toàn diện của hoạt động xuất bản; tổng kết 20 năm ngày 26/8/2025. <b>Chỉ thị 04-CT/TW</b> (17/3/2026): tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới. Tin chính thống không nêu 04 thay thế 42.",tip:""},
{doc:"ct04",a:"“Nhiệm vụ cấp bách” trong Chỉ thị 04 là gì?",b:"<b>Nâng cao chất lượng nguồn nhân lực hoạt động xuất bản</b> (quan điểm 5). Đừng nhầm với Chỉ thị 05: chuyển đổi số là chiến lược, đổi mới tư duy là then chốt.",tip:""},
{doc:"bientap",a:"Sáp nhập hay hợp nhất?",b:"<b>Sáp nhập</b>: một hoặc một số đơn vị nhập vào một đơn vị khác, đơn vị bị sáp nhập chấm dứt. <b>Hợp nhất</b>: các đơn vị hợp lại thành một đơn vị mới. “Sát nhập” là lỗi chính tả. NXB Chính trị quốc gia (1992) được lập trên cơ sở <b>hợp nhất</b> bốn nhà xuất bản.",tip:""},
{doc:"bientap",a:"“Nhân dân” lúc nào viết hoa?",b:"Phụ lục II NĐ 30/2020 coi <b>Nhân dân, Nhà nước</b> là danh từ đặc biệt, viết hoa. Trong tên cơ quan như <b>Hội đồng nhân dân tỉnh Cà Mau</b>, “nhân dân” viết thường theo quy tắc tên cơ quan.",tip:""},
{doc:"bientap",a:"“Yếu điểm” có nghĩa là điểm yếu?",b:"Không. “Yếu điểm” (gốc Hán) nghĩa là <b>điểm quan trọng, chủ yếu</b>. Muốn nói chỗ kém thì dùng <b>điểm yếu</b>. Tương tự: “vô hình chung” là sai, đúng là <b>vô hình trung</b>.",tip:""},
{doc:"bientap",a:"Thứ, tháng viết bằng số hay chữ?",b:"Khi ghi bằng chữ thì viết hoa chữ chỉ thứ, tháng: <b>thứ Hai, tháng Năm</b>. Viết “Thứ hai, tháng năm” là sai quy tắc.",tip:""},
{doc:"bientap",a:"Đọc morat và đọc sách mẫu",b:"<b>Đọc morat</b>: đọc bản in thử trước khi đưa in để sửa lỗi kỹ thuật, chính tả. <b>Đọc sách mẫu</b>: đọc sau khi in, đối chiếu với bản thảo đã duyệt trước khi nộp lưu chiểu, phát hành.",tip:""},
{doc:"qtg",a:"Quyền nhân thân nào được bảo hộ vô thời hạn?",b:"<b>Đặt tên, đứng tên, bảo vệ sự toàn vẹn</b> (khoản 1, 2, 4 Điều 19). <b>Quyền công bố</b> (khoản 3) được bảo hộ có thời hạn, cùng thời hạn với quyền tài sản.",tip:"Tên – tên – toàn vẹn: mãi mãi."},
{doc:"qtg",a:"50 năm, 75 năm, 100 năm, 25 năm",b:"<b>Đời tác giả + 50 năm</b>: văn học, khoa học, âm nhạc… <b>75 năm từ khi công bố</b>: điện ảnh, nhiếp ảnh, mỹ thuật ứng dụng, khuyết danh. <b>100 năm từ khi định hình</b>: các loại trên nếu <b>chưa công bố trong 25 năm</b> từ khi định hình.",tip:""},
{doc:"qtg",a:"Trích dẫn hợp lý tối đa 10%?",b:"Không. <b>10%</b> là giới hạn <b>sao chép bằng thiết bị</b> một phần tác phẩm viết cho nghiên cứu, học tập cá nhân (NĐ 17/2023). <b>Trích dẫn hợp lý</b> không có tỷ lệ cố định: phải phù hợp mục đích bình luận, giới thiệu, minh họa, không làm sai ý tác giả, ghi nguồn.",tip:""},
{doc:"qtg",a:"Luật 131/2025/QH15 và Luật 17/2026/QH16",b:"<b>131/2025/QH15</b>: sửa Luật Sở hữu trí tuệ, hiệu lực <b>01/4/2026</b> (đã có hiệu lực). <b>17/2026/QH16</b>: sửa Luật Xuất bản, hiệu lực <b>01/3/2027</b> (chưa có hiệu lực).",tip:""}
);

FLASH.push(
{doc:"luatxb",q:"Luật Xuất bản nào đang có hiệu lực vào tháng 10/2026?",a:"<b>Luật Xuất bản số 19/2012/QH13</b> (hiệu lực 01/7/2013), đã sửa đổi bởi Luật 35/2018/QH14 và Luật Quy hoạch 112/2025/QH15, hợp nhất tại VBHN 43/VBHN-VPQH. Luật 17/2026/QH16 có hiệu lực từ <b>01/3/2027</b>."},
{doc:"luatxb",q:"Khái niệm “biên tập” theo Luật Xuất bản?",a:"<b>Việc rà soát, hoàn thiện nội dung và hình thức bản thảo để xuất bản</b> (khoản 6 Điều 4)."},
{doc:"luatxb",q:"Khái niệm “xuất bản”?",a:"Việc <b>tổ chức, khai thác bản thảo, biên tập thành bản mẫu</b> để in và phát hành hoặc để phát hành trực tiếp qua các phương tiện điện tử."},
{doc:"luatxb",q:"Bốn tiêu chuẩn của biên tập viên (Điều 19)?",a:"Công dân Việt Nam thường trú tại Việt Nam, phẩm chất chính trị, đạo đức tốt; <b>đại học trở lên</b>; hoàn thành <b>khóa bồi dưỡng</b> kiến thức pháp luật xuất bản và nghiệp vụ biên tập; có <b>chứng chỉ hành nghề biên tập</b>."},
{doc:"luatxb",q:"Ba trường hợp thu hồi chứng chỉ hành nghề biên tập?",a:"(1) Xuất bản phẩm do mình biên tập bị cấm lưu hành, thu hồi, tịch thu, tiêu hủy; (2) trong 01 năm có hai, hoặc 02 năm liên tục có xuất bản phẩm sai phạm nội dung buộc phải sửa chữa mới được phát hành; (3) bị kết án bằng bản án có hiệu lực. Sau <b>02 năm</b> mới được xét cấp lại."},
{doc:"luatxb",q:"Biên tập viên làm gì khi bản thảo có dấu hiệu vi phạm khoản 1 Điều 10?",a:"<b>Được từ chối biên tập</b> và <b>phải báo cáo bằng văn bản</b> với tổng giám đốc (giám đốc) và tổng biên tập."},
{doc:"luatxb",q:"Tiêu chuẩn riêng của tổng biên tập nhà xuất bản?",a:"Có <b>chứng chỉ hành nghề biên tập</b> và <b>ít nhất 03 năm làm biên tập</b> tại nhà xuất bản hoặc cơ quan báo chí."},
{doc:"luatxb",q:"Thời hạn nộp lưu chiểu và nộp Thư viện Quốc gia?",a:"Lưu chiểu: <b>chậm nhất 10 ngày trước khi phát hành</b> (03 bản; in dưới 300 bản thì 02). Thư viện Quốc gia: <b>trong 45 ngày kể từ ngày phát hành</b>."},
{doc:"luatxb",q:"Những lĩnh vực không được liên kết biên tập sơ bộ?",a:"<b>Lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký</b>."},
{doc:"luatxb",q:"Ba điểm mới của Luật 17/2026/QH16 cần nhớ nhất?",a:"(1) Nội dung tạo bằng AI <b>phải thông báo, gắn nhãn</b>, cấm lợi dụng AI vi phạm pháp luật; (2) sách về lịch sử cách mạng, chủ quyền, lãnh tụ… <b>thẩm định trước khi đăng ký kế hoạch</b>, chỉ phát hành khi Bộ VHTTDL có ý kiến; (3) xuất bản là <b>ngành kinh tế – công nghệ</b>, có tập đoàn xuất bản – truyền thông, hợp tác công tư. Hiệu lực 01/3/2027."},
{doc:"luatxb",q:"Văn bản hướng dẫn Luật Xuất bản đang áp dụng?",a:"<b>NĐ 195/2013/NĐ-CP</b> (sửa đổi bởi NĐ 150/2018/NĐ-CP); <b>TT 01/2020/TT-BTTTT</b> (sửa đổi bởi TT 23/2023/TT-BTTTT); xử phạt: <b>NĐ 119/2020/NĐ-CP</b>. Kế hoạch thay thế theo QĐ 1953/QĐ-TTg (08/10/2026)."},
{doc:"luatxb",q:"Ai ký quyết định xuất bản, quyết định phát hành?",a:"<b>Tổng giám đốc (giám đốc)</b> nhà xuất bản, cho từng xuất bản phẩm, đúng giấy xác nhận đăng ký, kể cả khi in tăng số lượng."},
{doc:"ct04",q:"Chỉ thị 04-CT/TW: cơ quan, ngày, người ký, nội dung?",a:"<b>Ban Bí thư</b>, <b>17/3/2026</b>, đồng chí <b>Trần Cẩm Tú</b> ký; về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới."},
{doc:"ct04",q:"Quan điểm 1 của Chỉ thị 04?",a:"<b>“Xuất bản là một lĩnh vực hoạt động tư tưởng sắc bén của Đảng, Nhà nước và nhân dân”</b>."},
{doc:"ct04",q:"Quan điểm 2 của Chỉ thị 04?",a:"<b>“Phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản”</b>; xuất bản trở thành ngành kinh tế – công nghệ phát triển."},
{doc:"ct04",q:"Quan điểm 3 của Chỉ thị 04?",a:"Xuất bản là <b>công cụ chủ đạo trong giáo dục, đào tạo</b>; là bộ phận quan trọng của <b>ngành công nghiệp văn hóa</b>; công cụ ngoại giao văn hóa quan trọng."},
{doc:"ct04",q:"Chỉ tiêu 2030 của Chỉ thị 04?",a:"Hệ thống xuất bản <b>tinh gọn, mạnh, chất lượng, hiện đại hóa</b>; <b>100%</b> nhà xuất bản tham gia xuất bản điện tử; <b>80%</b> cơ sở in có công nghệ hiện đại; hình thành tập đoàn xuất bản, truyền thông chủ lực quốc gia."},
{doc:"ct04",q:"Chín nhóm nhiệm vụ của Chỉ thị 04 (từ khóa)?",a:"Lãnh đạo – thể chế – chiến lược – nội dung – thanh tra – văn hóa đọc – hạ tầng số – hợp tác quốc tế – nhân lực."},
{doc:"ct04",q:"Điểm mới của Chỉ thị 04 liên quan trực tiếp đến biên tập viên?",a:"Nhiệm vụ 4: <b>có cơ chế bảo vệ người làm xuất bản, biên tập viên</b> trước vu khống, xuyên tạc, tấn công mạng; quan điểm 5: nhân lực là <b>nhiệm vụ cấp bách</b>."},
{doc:"ct04",q:"Văn bản hướng dẫn Chỉ thị 04?",a:"<b>Hướng dẫn 22-HD/BTGDVTW ngày 28/5/2026</b> của Ban Tuyên giáo và Dân vận Trung ương."},
{doc:"ct04",q:"Tầm nhìn 2045 của Chỉ thị 04?",a:"Hệ thống xuất bản, truyền thông phát triển mạnh, đa dạng, hiện đại; <b>ngành kinh tế số</b>, có <b>năng lực vươn ra toàn cầu</b>."},
{doc:"bientap",q:"Các cấp đọc duyệt bản thảo tại NXB CTQG Sự thật?",a:"Biên tập viên → lãnh đạo ban biên tập → thư ký biên tập → Phó Giám đốc – Phó Tổng biên tập (hoặc ủy viên Hội đồng biên tập) → <b>Giám đốc – Tổng biên tập duyệt nội dung, duyệt in</b>; sau đó đọc morat trước in, đọc sách mẫu sau in."},
{doc:"bientap",q:"Câu “Qua thực tiễn đã chứng minh…” sai ở đâu?",a:"Câu <b>thiếu chủ ngữ</b> (“qua thực tiễn” là trạng ngữ). Sửa: <b>“Thực tiễn đã chứng minh…”</b> hoặc “Qua thực tiễn, chúng ta thấy…”."},
{doc:"bientap",q:"Viết hoa tên cơ quan theo NĐ 30/2020?",a:"Viết hoa chữ đầu của từ, cụm từ chỉ loại hình, chức năng, lĩnh vực: <b>Bộ Văn hóa, Thể thao và Du lịch</b>, <b>Ban Chấp hành Trung ương Đảng Cộng sản Việt Nam</b>, <b>Hội đồng nhân dân tỉnh Cà Mau</b>."},
{doc:"bientap",q:"Viết hoa tên văn bản và viện dẫn điều khoản?",a:"<b>Bộ luật Dân sự, Luật Xuất bản</b>; <b>điểm b khoản 2 Điều 103 Mục 5 Chương XII Phần I Bộ luật Hình sự</b>."},
{doc:"bientap",q:"Bốn yếu tố cần kiểm tra khi trích dẫn văn kiện của Đảng?",a:"<b>Loại văn bản và số hiệu</b>, <b>cơ quan ban hành</b>, <b>ngày ban hành</b>, <b>trích yếu</b>; trích nguyên văn thì đối chiếu bản chính thức, ghi nguồn."},
{doc:"bientap",q:"Mười nhóm lỗi thường gặp trong bản thảo?",a:"Chính tả, dùng từ, ngữ pháp, dấu câu, viết hoa, sự kiện – số liệu, trích dẫn văn kiện, logic, chính trị – tư tưởng, bản quyền."},
{doc:"bientap",q:"Vì sao phải lưu vết trên bản thảo?",a:"“Các bước biên tập, duyệt đều có lưu vết trên bản thảo để bước duyệt sau kiểm soát”; đồng thời tổng giám đốc có nghĩa vụ <b>lưu trữ hồ sơ biên tập</b> (Điều 18)."},
{doc:"bientap",q:"Tên người nước ngoài phiên âm trực tiếp viết thế nào theo NĐ 30?",a:"Viết hoa chữ đầu mỗi thành phần, nối âm tiết bằng gạch nối: <b>Vla-đi-mia I-lích Lê-nin</b>, <b>Phri-đrích Ăng-ghen</b>; địa danh: <b>Mát-xcơ-va</b>."},
{doc:"bientap",q:"Câu nói về biên tập viên của Giám đốc – Tổng biên tập NXB CTQG Sự thật (6/2026)?",a:"Biên tập viên là <b>“người gác cổng tri thức”</b>; “mỗi thông tin quan trọng đều phải được xác minh”; liên kết “không đồng nghĩa với việc chuyển giao trách nhiệm”."},
{doc:"qtg",q:"Quyền tác giả phát sinh khi nào?",a:"Kể từ khi tác phẩm <b>được sáng tạo và được thể hiện dưới một hình thức vật chất nhất định</b>, đã công bố hay chưa, <b>đã đăng ký hay chưa đăng ký</b>."},
{doc:"qtg",q:"Bốn quyền nhân thân?",a:"Đặt tên tác phẩm; đứng tên thật hoặc bút danh, được nêu tên; công bố tác phẩm; <b>bảo vệ sự toàn vẹn</b> của tác phẩm."},
{doc:"qtg",q:"Sáu quyền tài sản?",a:"Làm tác phẩm phái sinh; biểu diễn trước công chúng; sao chép; phân phối, nhập khẩu để phân phối; phát sóng, truyền đạt đến công chúng; cho thuê."},
{doc:"qtg",q:"Thời hạn bảo hộ tác phẩm nhiếp ảnh?",a:"<b>75 năm kể từ khi công bố lần đầu</b>; chưa công bố trong 25 năm từ khi định hình thì 100 năm từ khi định hình; chấm dứt 24 giờ ngày 31/12."},
{doc:"qtg",q:"Điều kiện trích dẫn hợp lý?",a:"Tác phẩm đã công bố; trích <b>không làm sai ý tác giả</b>, để bình luận, giới thiệu, minh họa trong tác phẩm của mình; phần trích phù hợp; <b>ghi tên tác giả và nguồn gốc</b>."},
{doc:"qtg",q:"Điểm mới về AI trong Luật 131/2025/QH15?",a:"Chính phủ quy định xác lập quyền với đối tượng tạo ra có dùng AI; được dùng văn bản, dữ liệu đã công bố hợp pháp để <b>nghiên cứu, thử nghiệm, huấn luyện AI</b>, không ảnh hưởng bất hợp lý quyền tác giả."},
{doc:"qtg",q:"Quyền đặt tên tác phẩm có chuyển giao được không?",a:"Từ Luật 07/2022: tác giả <b>có thể chuyển quyền sử dụng quyền đặt tên</b> cho tổ chức, cá nhân nhận chuyển giao quyền tài sản."},
{doc:"qtg",q:"Tác phẩm hết thời hạn bảo hộ có được tùy ý sửa không?",a:"Không. Quyền tài sản hết hạn, nhưng quyền <b>đặt tên, đứng tên, bảo vệ toàn vẹn</b> được bảo hộ vô thời hạn: phải nêu đúng tác giả, không xuyên tạc, cắt xén làm sai ý."}
);

{doc:"luatxb",q:"Tổng biên tập nhà xuất bản phải có:",opts:["Chứng chỉ hành nghề biên tập và ít nhất 03 năm làm biên tập tại nhà xuất bản hoặc cơ quan báo chí","Ít nhất 02 năm làm biên tập tại nhà xuất bản","Ít nhất 05 năm làm biên tập và bằng thạc sĩ","Ít nhất 03 năm công tác trong cơ quan nhà nước bất kỳ"],ans:0,ex:"Tổng giám đốc cũng cần 03 năm nhưng có thể là biên tập, quản lý xuất bản, báo chí hoặc quản lý tại cơ quan chủ quản.",ref:"khoản 2 Điều 17"},

ESSAY.push(
{doc:"luatxb",q:"Trình bày tiêu chuẩn, nhiệm vụ, quyền hạn của biên tập viên và quy định về chứng chỉ hành nghề biên tập theo Luật Xuất bản hiện hành. Những điểm nào thay đổi khi Luật 17/2026/QH16 có hiệu lực?",outline:["Hiệu lực: Luật 19/2012/QH13 đang áp dụng; Luật 17/2026/QH16 thông qua 24/8/2026, hiệu lực 01/3/2027.","Khái niệm biên tập (khoản 6 Điều 4).","4 tiêu chuẩn (Điều 19 khoản 1).","6 nhiệm vụ, quyền hạn: biên tập; từ chối và báo cáo bằng văn bản; đứng tên; tập huấn; không để lộ, lọt; chịu trách nhiệm trước tổng biên tập và pháp luật.","Chứng chỉ: hồ sơ, 15 ngày; 3 căn cứ thu hồi; cấp lại sau 02 năm.","Luật 2026: Bộ VHTTDL cấp; thu hồi khi 36 tháng không biên tập; cấp lại khi chuyển NXB, hoàn thành bồi dưỡng; AI phải gắn nhãn, trách nhiệm không giảm.","Liên hệ bản thân: chuẩn bị điều kiện, rèn bản lĩnh và kỹ năng."]},
{doc:"luatxb",q:"Phân tích quy định về liên kết xuất bản. Vì sao Luật Xuất bản không cho liên kết biên tập sơ bộ với tác phẩm lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký? Rút ra bài học từ vụ việc năm 2026.",outline:["Điều 23: đối tác, 4 hình thức, điều kiện (văn bản chấp thuận, hợp đồng, đối tác có biên tập viên).","Trách nhiệm của tổng giám đốc, tổng biên tập; nhà xuất bản biên tập hoàn chỉnh.","Lý do loại trừ 5 lĩnh vực: nhạy cảm về chính trị – tư tưởng, sự thật lịch sử, chủ quyền; nguy cơ vi phạm khoản 1 Điều 10.","Vụ việc 2026: tạm dừng, thu hồi; phạt 100 triệu, đình chỉ 2 tháng, tiêu hủy; khởi tố (đang điều tra).","Bài học: liên kết không chuyển trách nhiệm; thẩm định độc lập; xác minh thông tin; lưu hồ sơ; Luật 2026 không chuyển giao quyền quyết định nội dung."]},
{doc:"luatxb",q:"Trình bày trình tự pháp lý từ khi nhà xuất bản tiếp nhận bản thảo đến khi xuất bản phẩm được phát hành theo Luật Xuất bản 2012.",outline:["Văn bản chấp thuận của tác giả (Điều 21).","Đăng ký xuất bản: 07 ngày làm việc, đến 31/12; số xác nhận, ISBN.","Biên tập, thẩm định (Điều 24 khi tái bản), tổng biên tập ký duyệt, tổng giám đốc ký duyệt bản thảo, ký quyết định xuất bản.","In; ghi đủ thông tin (Điều 27).","Lưu chiểu chậm nhất 10 ngày trước khi phát hành; quyết định phát hành; nộp Thư viện Quốc gia trong 45 ngày.","Đọc, kiểm tra lưu chiểu; xử lý vi phạm; điểm mới Luật 2026."]}
);
ESSAY.push(
{doc:"ct04",q:"Phân tích các quan điểm chỉ đạo và mục tiêu của Chỉ thị 04-CT/TW. Liên hệ trách nhiệm của biên tập viên Nhà xuất bản Chính trị quốc gia Sự thật.",outline:["Thông tin: Ban Bí thư, 17/3/2026; HD 22 (28/5/2026); kế tiếp Chỉ thị 42 (2004).","5 quan điểm: lĩnh vực tư tưởng sắc bén; lấy người đọc là trung tâm; công cụ chủ đạo trong giáo dục, công nghiệp văn hóa; Đảng, Nhà nước định hướng, kiến tạo; nhân lực là nhiệm vụ cấp bách.","Mục tiêu 2030 (100% NXB xuất bản điện tử, 80% cơ sở in hiện đại, tập đoàn xuất bản) và tầm nhìn 2045.","Liên hệ: bản lĩnh chính trị, kiểm tra quan điểm, trích dẫn; sách lý luận dễ tiếp cận; kỹ năng số; tuân thủ quy trình."]},
{doc:"ct04",q:"So sánh Chỉ thị 42-CT/TW (2004) và Chỉ thị 04-CT/TW (2026). Chỉ thị 04 được thể hiện thế nào trong Luật Xuất bản sửa đổi năm 2026?",outline:["CT 42: nâng cao chất lượng toàn diện; tổng kết 20 năm (26/8/2025): số lượng tăng, chất lượng chưa đồng đều.","CT 04: bối cảnh AI, chuyển đổi số; xuất bản là ngành kinh tế – công nghệ, công nghiệp văn hóa; người đọc là trung tâm; 9 nhóm nhiệm vụ.","Luật 17/2026: vị trí kinh tế – công nghệ; ưu đãi thuế, hợp tác công tư, tập đoàn; bản quyền số, AI gắn nhãn; cấm cản trở biên tập viên.","Nhận xét: từ nâng chất lượng sang xây dựng ngành công nghiệp xuất bản hiện đại."]},
{doc:"ct04",q:"Vì sao Chỉ thị 04-CT/TW xác định nâng cao chất lượng nguồn nhân lực hoạt động xuất bản là “nhiệm vụ cấp bách”? Đề xuất giải pháp đối với đội ngũ biên tập viên.",outline:["Yêu cầu mới: chuyển đổi số, AI, xuất bản điện tử, cạnh tranh của nền tảng.","Thực trạng: chất lượng sách chưa đồng đều, sai sót về sự kiện, cách diễn đạt; vụ việc 2026.","Giải pháp: bồi dưỡng lý luận, nghiệp vụ, ngoại ngữ, công nghệ; quy trình nhiều cấp; cơ chế bảo vệ biên tập viên; đánh giá theo chất lượng."]}
);

{doc:"bientap",q:"Trình bày quy trình biên tập một cuốn sách chính trị và trách nhiệm của biên tập viên ở từng khâu.",outline:["Khái niệm biên tập; chuỗi trách nhiệm BTV – TBT – TGĐ.","Tổ chức bản thảo, văn bản chấp thuận, đăng ký.","Đánh giá sơ bộ, thẩm định; biên tập nội dung (quan điểm, sự kiện, trích dẫn, số liệu).","Đọc duyệt nhiều cấp; lưu vết; duyệt in.","Biên tập kỹ thuật, đọc morat, đọc sách mẫu; lưu chiểu, phát hành; lưu hồ sơ."]},
{doc:"bientap",q:"Nêu các nhóm lỗi thường gặp trong bản thảo sách chính trị và biện pháp phòng tránh.",outline:["10 nhóm lỗi, mỗi nhóm một ví dụ.","Lỗi nguy hiểm nhất: chính trị – tư tưởng, sự kiện lịch sử, trích dẫn văn kiện, chủ quyền.","Biện pháp: đối chiếu nguồn gốc, bảng chuẩn hóa (viết hoa, tên riêng, số liệu), phiếu biên tập, nhiều vòng đọc, chuyên gia thẩm định, danh mục tự kiểm.","Liên hệ yêu cầu “mỗi thông tin quan trọng đều phải được xác minh”."]}
);
ESSAY.push(
{doc:"qtg",q:"Trình bày quyền nhân thân, quyền tài sản và thời hạn bảo hộ quyền tác giả. Nhà xuất bản cần làm gì để tôn trọng quyền tác giả?",outline:["Phát sinh quyền; không bắt buộc đăng ký.","4 quyền nhân thân; 6 quyền tài sản.","Thời hạn: vô thời hạn; đời + 50 năm; 75 năm; 100 năm; 24 giờ 31/12.","Ngoại lệ Điều 25, trích dẫn hợp lý.","Nhà xuất bản: văn bản chấp thuận (Điều 21 Luật Xuất bản), hợp đồng, ảnh, sách dịch, sửa bản thảo phải được tác giả đồng ý."]},
{doc:"qtg",q:"Trí tuệ nhân tạo đặt ra vấn đề gì về quyền tác giả trong xuất bản? Pháp luật năm 2025–2026 xử lý ra sao?",outline:["Vấn đề: ai là tác giả; dữ liệu huấn luyện; sao chép trái phép; thông tin sai.","Luật 131/2025: Chính phủ quy định xác lập quyền với đối tượng tạo bằng AI; được dùng dữ liệu công bố hợp pháp để huấn luyện AI có điều kiện; nền tảng phải bảo vệ quyền.","Luật 17/2026 (từ 01/3/2027): nội dung AI phải thông báo, gắn nhãn; cấm lợi dụng AI; đối tác liên kết chịu trách nhiệm về việc dùng AI.","Trách nhiệm biên tập viên: yêu cầu khai báo, xác minh, không để AI thay thế thẩm định."]}

/* ===== Đề viết 90 phút: kiến thức chuyên môn và thực hành biên tập ===== */
WRITTEN.push({id:"viet1",title:"Đề viết số 1 – Biên tập viên theo Luật Xuất bản; sửa bản thảo lịch sử Đảng; viết Lời Nhà xuất bản",minutes:90,
intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề do người biên soạn tự soạn để luyện tập theo hình thức thi viết môn chuyên ngành, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026 – Luật Xuất bản 2012 đang có hiệu lực; Luật 17/2026/QH16 có hiệu lực từ 01/3/2027. Ở câu sửa lỗi, chỉ tính các lỗi đã định sẵn; không tính biến thể chính tả được chấp nhận (i/y, vị trí dấu thanh “hòa/hoà”); sửa sai chỗ vốn đúng bị trừ 1 điểm/lần.`,
questions:[
{q:`Trình bày tiêu chuẩn, nhiệm vụ, quyền hạn của biên tập viên và quy định về cấp, thu hồi chứng chỉ hành nghề biên tập theo Luật Xuất bản hiện hành. Nêu những thay đổi khi Luật số 17/2026/QH16 có hiệu lực. Liên hệ yêu cầu đối với biên tập viên sách chính trị, lý luận tại Nhà xuất bản Chính trị quốc gia Sự thật.`,points:30,
outline:["Mở bài: khái niệm biên tập (khoản 6 Điều 4); luật đang áp dụng là Luật 19/2012/QH13, Luật 17/2026/QH16 hiệu lực 01/3/2027 (3 điểm).","4 tiêu chuẩn (Điều 19 khoản 1): công dân VN thường trú, phẩm chất chính trị, đạo đức; đại học trở lên; hoàn thành khóa bồi dưỡng; có chứng chỉ (5 điểm).","6 nhiệm vụ, quyền hạn: biên tập; từ chối và báo cáo bằng văn bản; đứng tên; tập huấn định kỳ; không để lộ, lọt; chịu trách nhiệm trước tổng biên tập và pháp luật (6 điểm).","Chứng chỉ: hồ sơ 4 thành phần; cấp trong 15 ngày; 3 căn cứ thu hồi; cấp lại sau 02 năm và ngoại lệ (6 điểm).","Luật 2026: Bộ VHTTDL cấp; thêm căn cứ thu hồi 36 tháng liên tục không biên tập; cấp lại khi chuyển NXB, hoàn thành bồi dưỡng; nội dung AI phải gắn nhãn, trách nhiệm không giảm (4 điểm).","Liên hệ: “người gác cổng tri thức”; bản lĩnh chính trị, trình độ lý luận; xác minh mọi thông tin quan trọng, đối chiếu văn kiện; tuân thủ quy trình nhiều cấp, lưu vết; không để lộ bản thảo (6 điểm)."],
answer:`<p><b>Gợi ý trọng tâm.</b> Biên tập là “việc rà soát, hoàn thiện nội dung và hình thức bản thảo để xuất bản”. Tiêu chuẩn: công dân Việt Nam thường trú tại Việt Nam, có phẩm chất chính trị, đạo đức tốt; đại học trở lên; đã hoàn thành khóa bồi dưỡng kiến thức pháp luật xuất bản và nghiệp vụ biên tập; có chứng chỉ hành nghề biên tập. Biên tập viên được từ chối biên tập bản thảo có dấu hiệu vi phạm khoản 1 Điều 10 nhưng phải báo cáo bằng văn bản với tổng giám đốc và tổng biên tập; được đứng tên trên sách; chịu trách nhiệm trước tổng biên tập và trước pháp luật về phần nội dung mình biên tập.</p><p>Chứng chỉ cấp trong 15 ngày kể từ khi nhận đủ hồ sơ. Bị thu hồi khi sách do mình biên tập bị cấm lưu hành, thu hồi, tịch thu, tiêu hủy; khi trong 01 năm có hai, hoặc 02 năm liên tục có xuất bản phẩm sai phạm phải sửa mới được phát hành; khi bị kết án. Sau 02 năm mới được xét cấp lại, trừ trường hợp phạm tội rất nghiêm trọng, đặc biệt nghiêm trọng hoặc xâm phạm an ninh quốc gia.</p><p>Từ 01/3/2027, Bộ VHTTDL cấp chứng chỉ; thu hồi cả khi không trực tiếp biên tập 36 tháng liên tục. Nội dung tạo bằng AI phải thông báo, gắn nhãn, và việc dùng AI không làm giảm trách nhiệm.</p>`},
{q:`Đọc đoạn văn sau (giả định là một đoạn bản thảo gửi Nhà xuất bản). Đoạn văn có <b>14 lỗi</b> thuộc các loại: chính tả, viết hoa, dấu câu, ngữ pháp, dùng từ, sự kiện – số liệu, tên văn kiện, logic, chính trị – tư tưởng. Hãy (1) chỉ ra từng lỗi, sửa và giải thích ngắn gọn; (2) viết lại đoạn văn đã sửa hoàn chỉnh.
<blockquote>Ngày 3/2/1931, tại Quảng Châu (Trung Quốc, dưới sự chủ trì của lãnh tụ Nguyễn Ái Quốc, Hội nghị hợp nhất các tổ chức cộng sản đã thành lập đảng Cộng sản Việt Nam. Hội nghị thông qua Chánh cương vắn tắt, Sách lược vắn tắt do Nguyễn Ái Quốc soạn thảo; đây là Luận cương chính trị đầu tiên của Đảng. Sự ra đời của Đảng là kết quả của sự kết hợp chủ nghĩa Mác – lênin với phong trào công nhân và phong trào yêu nước Việt Nam, chấm dức thời kỳ khủng hoảng về đường lối cứu nước kéo dài từ cuối thế kỷ XIX. Tháng 10/1930, Hội nghị Ban chấp hành Trung ương lần thứ nhất thông qua Luận cương chính trị do đồng chí Lê Hồng Phong khởi thảo và đổi tên Đảng thành Đảng Cộng sản Đông Dương. Từ đó, dưới sự lãnh đạo của Đảng, dân tộc ta đã dành thắng lợi trong Cách mạng Tháng Tám năm 1945, lập nên nước Việt Nam dân chủ cộng hòa. Qua thực tiễn gần một thế kỷ đã chứng minh rằng sự lãnh đạo của Đảng chỉ là một trong nhiều nhân tố góp phần vào thắng lợi của cách mạng Việt Nam. Năm 2030, toàn Đảng, toàn dân ta sẽ kỷ niệm 95 năm Ngày thành lập Đảng.</blockquote>`,points:40,
outline:["Mỗi lỗi 2,5 điểm: phát hiện đúng 1 điểm, sửa đúng 1 điểm, nêu loại lỗi/giải thích 0,5 điểm (14 lỗi = 35 điểm).","Đoạn văn sửa hoàn chỉnh, không phát sinh lỗi mới, giữ văn phong (5 điểm).","Sửa sai chỗ vốn đúng: trừ 1 điểm/lần."],
answer:`<div class="tablewrap"><table class="nums"><thead><tr><th>#</th><th>Chỗ sai</th><th>Sửa</th><th>Loại lỗi – giải thích</th></tr></thead><tbody>
<tr><td>1</td><td>3/2/1931</td><td>3/2/1930</td><td>Sự kiện: Đảng thành lập năm 1930.</td></tr>
<tr><td>2</td><td>Quảng Châu</td><td>Hương Cảng</td><td>Sự kiện: Hội nghị hợp nhất họp tại Hương Cảng (Cửu Long), Trung Quốc.</td></tr>
<tr><td>3</td><td>(Trung Quốc,</td><td>(Trung Quốc),</td><td>Dấu câu: thiếu dấu đóng ngoặc.</td></tr>
<tr><td>4</td><td>đảng Cộng sản Việt Nam</td><td>Đảng Cộng sản Việt Nam</td><td>Viết hoa tên tổ chức.</td></tr>
<tr><td>5</td><td>Luận cương chính trị đầu tiên</td><td>Cương lĩnh chính trị đầu tiên</td><td>Tên văn kiện: Chánh cương vắn tắt, Sách lược vắn tắt là Cương lĩnh chính trị đầu tiên; Luận cương là văn kiện tháng 10/1930.</td></tr>
<tr><td>6</td><td>Mác – lênin</td><td>Mác – Lênin</td><td>Viết hoa tên người.</td></tr>
<tr><td>7</td><td>chấm dức</td><td>chấm dứt</td><td>Chính tả.</td></tr>
<tr><td>8</td><td>Ban chấp hành Trung ương</td><td>Ban Chấp hành Trung ương</td><td>Viết hoa tên cơ quan (NĐ 30/2020: “Ban Chấp hành Trung ương Đảng Cộng sản Việt Nam”).</td></tr>
<tr><td>9</td><td>Lê Hồng Phong</td><td>Trần Phú</td><td>Sự kiện: đồng chí Trần Phú khởi thảo Luận cương chính trị.</td></tr>
<tr><td>10</td><td>dành thắng lợi</td><td>giành thắng lợi</td><td>Chính tả – dùng từ: “giành” là tranh lấy được; “dành” là để riêng.</td></tr>
<tr><td>11</td><td>Việt Nam dân chủ cộng hòa</td><td>Việt Nam Dân chủ Cộng hòa</td><td>Viết hoa tên nước.</td></tr>
<tr><td>12</td><td>Qua thực tiễn … đã chứng minh</td><td>Thực tiễn … đã chứng minh</td><td>Ngữ pháp: câu thiếu chủ ngữ.</td></tr>
<tr><td>13</td><td>chỉ là một trong nhiều nhân tố góp phần</td><td>là nhân tố hàng đầu quyết định mọi thắng lợi</td><td>Chính trị – tư tưởng: hạ thấp vai trò lãnh đạo của Đảng.</td></tr>
<tr><td>14</td><td>95 năm</td><td>100 năm</td><td>Logic – tính toán: 1930–2030 là 100 năm.</td></tr>

<p><b>Đoạn văn đã sửa</b></p><blockquote>Ngày 3/2/1930, tại Hương Cảng (Trung Quốc), dưới sự chủ trì của lãnh tụ Nguyễn Ái Quốc, Hội nghị hợp nhất các tổ chức cộng sản đã thành lập Đảng Cộng sản Việt Nam. Hội nghị thông qua Chánh cương vắn tắt, Sách lược vắn tắt do Nguyễn Ái Quốc soạn thảo; đây là Cương lĩnh chính trị đầu tiên của Đảng. Sự ra đời của Đảng là kết quả của sự kết hợp chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước Việt Nam, chấm dứt thời kỳ khủng hoảng về đường lối cứu nước kéo dài từ cuối thế kỷ XIX. Tháng 10/1930, Hội nghị Ban Chấp hành Trung ương lần thứ nhất thông qua Luận cương chính trị do đồng chí Trần Phú khởi thảo và đổi tên Đảng thành Đảng Cộng sản Đông Dương. Từ đó, dưới sự lãnh đạo của Đảng, dân tộc ta đã giành thắng lợi trong Cách mạng Tháng Tám năm 1945, lập nên nước Việt Nam Dân chủ Cộng hòa. Thực tiễn gần một thế kỷ đã chứng minh rằng sự lãnh đạo đúng đắn của Đảng là nhân tố hàng đầu quyết định mọi thắng lợi của cách mạng Việt Nam. Năm 2030, toàn Đảng, toàn dân ta sẽ kỷ niệm 100 năm Ngày thành lập Đảng.</blockquote>`},
{q:`Nhà xuất bản dự kiến xuất bản cuốn sách (giả định) <b>“Chỉ thị 04-CT/TW của Ban Bí thư về hoạt động xuất bản trong tình hình mới – Hỏi và đáp”</b>, gồm ba phần: văn bản Chỉ thị và Hướng dẫn số 22-HD/BTGDVTW; 60 câu hỏi – đáp về quan điểm, mục tiêu, nhiệm vụ; một số văn bản pháp luật liên quan. Anh/chị hãy viết <b>Lời Nhà xuất bản</b> (200–300 chữ) cho cuốn sách.`,points:30,
outline:["Đúng thể loại: bối cảnh – mục đích – nội dung, cấu trúc sách – giá trị, đối tượng – lời mong góp ý; ghi thời gian và tên nhà xuất bản (8 điểm).","Thông tin chính xác: Ban Bí thư, 17/3/2026; HD 22-HD/BTGDVTW ngày 28/5/2026 của Ban Tuyên giáo và Dân vận Trung ương; trích đúng quan điểm, mục tiêu; không bịa số liệu (10 điểm).","Văn phong trang trọng, súc tích; đúng chính tả, viết hoa, dấu câu (8 điểm).","Độ dài 200–300 chữ (4 điểm)."],
answer:`<p><b>Bài mẫu</b></p><blockquote><b>LỜI NHÀ XUẤT BẢN</b><br><br>Ngày 17/3/2026, Ban Bí thư ban hành Chỉ thị số 04-CT/TW về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới. Chỉ thị khẳng định xuất bản là một lĩnh vực hoạt động tư tưởng sắc bén của Đảng, Nhà nước và nhân dân; phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản. Chỉ thị đề ra mục tiêu đến năm 2030 xây dựng hệ thống xuất bản tinh gọn, mạnh, chất lượng, hiện đại hóa, tầm nhìn đến năm 2045, cùng chín nhóm nhiệm vụ, giải pháp lớn.<br><br>Nhằm giúp cán bộ, đảng viên, người làm công tác xuất bản và đông đảo bạn đọc nghiên cứu, quán triệt và thực hiện Chỉ thị, Nhà xuất bản Chính trị quốc gia Sự thật xuất bản cuốn sách Chỉ thị 04-CT/TW của Ban Bí thư về hoạt động xuất bản trong tình hình mới – Hỏi và đáp. Sách gồm ba phần: Phần thứ nhất giới thiệu Chỉ thị và Hướng dẫn số 22-HD/BTGDVTW ngày 28/5/2026 của Ban Tuyên giáo và Dân vận Trung ương; Phần thứ hai gồm 60 câu hỏi – đáp, làm rõ các quan điểm, mục tiêu, nhiệm vụ, giải pháp; Phần thứ ba tập hợp một số văn bản pháp luật có liên quan.<br><br>Cuốn sách là tài liệu tham khảo cần thiết cho các cơ quan, đơn vị khi xây dựng kế hoạch triển khai Chỉ thị. Mặc dù đã có nhiều cố gắng, song khó tránh khỏi thiếu sót, Nhà xuất bản rất mong nhận được ý kiến đóng góp của bạn đọc.<br><br>Tháng 10 năm 2026<br>NHÀ XUẤT BẢN CHÍNH TRỊ QUỐC GIA SỰ THẬT</blockquote>`}
]});

WRITTEN.push({id:"viet2",title:"Đề viết số 2 – Chỉ thị 04-CT/TW; sửa bản thảo Tuyên ngôn Độc lập; ý kiến về đề nghị liên kết xuất bản hồi ký",minutes:90,
intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề tự soạn để luyện tập, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026. Ở câu sửa lỗi, chỉ tính lỗi đã định sẵn; trích dẫn Tuyên ngôn Độc lập đối chiếu theo văn bản phổ biến trong sách giáo khoa và văn kiện.`,
questions:[
{q:`Phân tích các quan điểm chỉ đạo và mục tiêu của Chỉ thị số 04-CT/TW ngày 17/3/2026 của Ban Bí thư về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới. Là biên tập viên Nhà xuất bản Chính trị quốc gia Sự thật, anh/chị sẽ làm gì để thực hiện Chỉ thị?`,points:35,
outline:["Mở bài: cơ quan ban hành (Ban Bí thư), ngày 17/3/2026, người ký; HD 22-HD/BTGDVTW (28/5/2026); kế tiếp Chỉ thị 42-CT/TW (2004) (3 điểm).","Quan điểm 1: lĩnh vực hoạt động tư tưởng sắc bén; bảo vệ nền tảng tư tưởng của Đảng (3 điểm).","Quan điểm 2: lấy người đọc là trung tâm; ngành kinh tế – công nghệ (3 điểm).","Quan điểm 3: công cụ chủ đạo trong giáo dục, đào tạo; công nghiệp văn hóa; ngoại giao văn hóa (3 điểm).","Quan điểm 4: Đảng, Nhà nước định hướng, kiến tạo; hợp tác công tư (3 điểm).","Quan điểm 5: nhân lực là nhiệm vụ cấp bách (3 điểm).","Mục tiêu 2030: tinh gọn, mạnh, chất lượng, hiện đại hóa; tập đoàn xuất bản; 100% NXB xuất bản điện tử; 80% cơ sở in hiện đại. Tầm nhìn 2045 (5 điểm).","Liên hệ ít nhất 3 việc cụ thể: kiểm tra quan điểm, trích dẫn; làm sách lý luận dễ tiếp cận, đa nền tảng; tự học công nghệ, AI có kiểm soát; tuân thủ quy trình, chống sai sót (9 điểm).","Kết luận (3 điểm)."],
answer:`<p><b>Ý chính cần có.</b> Chỉ thị do Ban Bí thư ban hành ngày 17/3/2026, đồng chí Trần Cẩm Tú ký. Có 5 quan điểm, mục tiêu đến 2030 kèm tầm nhìn 2045, 9 nhóm nhiệm vụ. Câu then chốt: xuất bản là “một lĩnh vực hoạt động tư tưởng sắc bén của Đảng, Nhà nước và nhân dân”; “phát triển văn hóa đọc, lấy người đọc là trung tâm, là mục tiêu của hoạt động xuất bản”; xuất bản là “công cụ chủ đạo trong giáo dục, đào tạo”; “nâng cao chất lượng nguồn nhân lực hoạt động xuất bản là nhiệm vụ cấp bách”. Mục tiêu 2030: 100% nhà xuất bản tham gia xuất bản điện tử, 80% cơ sở in có công nghệ hiện đại. Điểm mới: có cơ chế bảo vệ người làm xuất bản, biên tập viên trước vu khống, xuyên tạc, tấn công mạng.</p>`},
{q:`Đọc đoạn văn sau. Đoạn văn có <b>14 lỗi</b> (chính tả, viết hoa, dấu câu, ngữ pháp, dùng từ, sự kiện – số liệu, trích dẫn, logic, chính trị – tư tưởng). Hãy chỉ ra, sửa, giải thích từng lỗi và viết lại đoạn văn hoàn chỉnh.
<blockquote>Ngày 19/8/1945, tại Quảng trường Ba Đình, Hà Nội, chủ tịch Hồ Chí Minh thay mặt Chính phủ lâm thời đọc bản Tuyên ngôn Độc lập, khai sinh nước Cộng hòa xã hội chủ nghĩa Việt Nam. Mở đầu bản Tuyên ngôn, Người dẫn lời bất hũ trong Tuyên ngôn độc lập năm 1776 của nước Pháp: “Tất cả mọi người đều sinh ra có quyền bình đẳng. Tạo hóa cho họ những quyền không ai có thể xâm phạm được; trong những quyền ấy, có quyền được sống, quyền tự do và quyền được hạnh phúc. Từ đó, người suy rộng ra: tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do. Bản Tuyên ngôn vạch chần tội ác của thực dân Pháp trong hơn 100 năm đô hộ, khẳng định dân ta đã lấy lại nước Việt Nam từ tay Pháp, chứ không phải từ tay Nhật. Bản Tuyên ngôn, với những lập luận chặt chẽ, đanh thép và giàu sức thuyết phục. Tuyên ngôn Độc lập là hậu quả của Cách mạng Tháng Tám. Cuộc cách mạng ấy thắng lợi chủ yếu nhờ may mắn gặp thời cơ; nó đã mở ra kỷ nguyên độc lập, tự do của dân tộc Việt Nam.</blockquote>`,points:45,
outline:["Mỗi lỗi 3 điểm: phát hiện 1, sửa đúng 1, giải thích 1 (14 lỗi = 42 điểm).","Đoạn văn sửa hoàn chỉnh (3 điểm).","Sửa sai chỗ vốn đúng: trừ 1 điểm/lần."],
answer:`<div class="tablewrap"><table class="nums"><thead><tr><th>#</th><th>Chỗ sai</th><th>Sửa</th><th>Loại lỗi – giải thích</th></tr></thead><tbody>
<tr><td>1</td><td>19/8/1945</td><td>2/9/1945</td><td>Sự kiện: Tuyên ngôn Độc lập được đọc ngày 2/9/1945; 19/8/1945 là ngày giành chính quyền ở Hà Nội.</td></tr>
<tr><td>2</td><td>chủ tịch Hồ Chí Minh</td><td>Chủ tịch Hồ Chí Minh</td><td>Viết hoa chức vụ đi với tên người.</td></tr>
<tr><td>3</td><td>Cộng hòa xã hội chủ nghĩa Việt Nam</td><td>Việt Nam Dân chủ Cộng hòa</td><td>Sự kiện: tên nước năm 1945 là Việt Nam Dân chủ Cộng hòa.</td></tr>
<tr><td>4</td><td>bất hũ</td><td>bất hủ</td><td>Chính tả (dấu thanh).</td></tr>
<tr><td>5</td><td>của nước Pháp</td><td>của nước Mỹ</td><td>Trích dẫn sai nguồn: Tuyên ngôn độc lập năm 1776 là của nước Mỹ.</td></tr>
<tr><td>6</td><td>quyền được hạnh phúc</td><td>quyền mưu cầu hạnh phúc</td><td>Trích sai nguyên văn.</td></tr>
<tr><td>7</td><td>…hạnh phúc. Từ đó</td><td>…hạnh phúc.” Từ đó</td><td>Dấu câu: thiếu ngoặc kép đóng.</td></tr>
<tr><td>8</td><td>người suy rộng ra</td><td>Người suy rộng ra</td><td>Viết hoa đại từ chỉ Chủ tịch Hồ Chí Minh.</td></tr>
<tr><td>9</td><td>vạch chần</td><td>vạch trần</td><td>Chính tả (tr/ch).</td></tr>
<tr><td>10</td><td>hơn 100 năm</td><td>hơn 80 năm</td><td>Số liệu: Tuyên ngôn viết “hơn 80 năm nay”.</td></tr>
<tr><td>11</td><td>từ tay Pháp, chứ không phải từ tay Nhật</td><td>từ tay Nhật, chứ không phải từ tay Pháp</td><td>Logic – sự kiện: đảo ngược luận điểm của Tuyên ngôn.</td></tr>
<tr><td>12</td><td>Bản Tuyên ngôn, với những lập luận…</td><td>Với những lập luận chặt chẽ, đanh thép và giàu sức thuyết phục, bản Tuyên ngôn là một áng văn chính luận mẫu mực.</td><td>Ngữ pháp: câu thiếu vị ngữ.</td></tr>
<tr><td>13</td><td>hậu quả</td><td>thành quả</td><td>Dùng từ: “hậu quả” mang sắc thái tiêu cực.</td></tr>
<tr><td>14</td><td>thắng lợi chủ yếu nhờ may mắn gặp thời cơ</td><td>thắng lợi là kết quả của quá trình chuẩn bị lâu dài dưới sự lãnh đạo của Đảng và nghệ thuật chớp đúng thời cơ</td><td>Chính trị – tư tưởng: đánh giá sai nguyên nhân thắng lợi.</td></tr>
</tbody></table></div>
<p><b>Đoạn văn đã sửa</b></p><blockquote>Ngày 2/9/1945, tại Quảng trường Ba Đình, Hà Nội, Chủ tịch Hồ Chí Minh thay mặt Chính phủ lâm thời đọc bản Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa. Mở đầu bản Tuyên ngôn, Người dẫn lời bất hủ trong Tuyên ngôn độc lập năm 1776 của nước Mỹ: “Tất cả mọi người đều sinh ra có quyền bình đẳng. Tạo hóa cho họ những quyền không ai có thể xâm phạm được; trong những quyền ấy, có quyền được sống, quyền tự do và quyền mưu cầu hạnh phúc.” Từ đó, Người suy rộng ra: tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do. Bản Tuyên ngôn vạch trần tội ác của thực dân Pháp trong hơn 80 năm đô hộ, khẳng định dân ta đã lấy lại nước Việt Nam từ tay Nhật, chứ không phải từ tay Pháp. Với những lập luận chặt chẽ, đanh thép và giàu sức thuyết phục, bản Tuyên ngôn là một áng văn chính luận mẫu mực. Tuyên ngôn Độc lập là thành quả của Cách mạng Tháng Tám. Thắng lợi của cuộc cách mạng ấy là kết quả của quá trình chuẩn bị lâu dài dưới sự lãnh đạo của Đảng và nghệ thuật chớp đúng thời cơ; thắng lợi đó đã mở ra kỷ nguyên độc lập, tự do của dân tộc Việt Nam.</blockquote>`},
{q:`Một công ty truyền thông đề nghị liên kết với nhà xuất bản để xuất bản cuốn <b>hồi ký</b> của một cựu chiến binh (tác giả còn sống) về chiến dịch Điện Biên Phủ. Công ty đề nghị: (1) công ty tự <b>biên tập sơ bộ</b>, nhà xuất bản chỉ đọc duyệt; (2) dùng <b>30 ảnh tư liệu sưu tầm trên Internet</b>, không rõ tác giả; (3) giữ nguyên các đoạn tác giả nhận xét về một số tướng lĩnh, chưa có tư liệu đối chiếu; (4) <b>phát hành ngay sau khi in</b> để kịp dịp 7/5. Viết ý kiến của biên tập viên (khoảng 300 chữ) đề xuất với lãnh đạo nhà xuất bản.`,points:20,
outline:["Đề nghị (1): không chấp nhận – hồi ký, lịch sử thuộc nhóm không được liên kết biên tập sơ bộ (khoản 4 Điều 23); có thể liên kết khai thác bản thảo, in, phát hành; nhà xuất bản tự biên tập, chịu trách nhiệm (5 điểm).","Đề nghị (2): cần văn bản chấp thuận của tác giả hồi ký (Điều 21); ảnh phải xác định chủ sở hữu quyền, xin phép, ghi nguồn (ảnh được bảo hộ 75 năm từ khi công bố); không rõ nguồn thì không dùng (4 điểm).","Đề nghị (3): đối chiếu tư liệu, mời chuyên gia lịch sử quân sự thẩm định; đoạn thiếu căn cứ có nguy cơ vi phạm khoản 1 Điều 10 (xuyên tạc lịch sử, xúc phạm danh nhân) – đề nghị tác giả sửa; từ 01/3/2027 loại sách này (nếu thuộc danh mục) phải thẩm định trước khi đăng ký kế hoạch và chỉ phát hành khi Bộ VHTTDL có ý kiến (4 điểm).","Đề nghị (4): không thể – phải nộp lưu chiểu chậm nhất 10 ngày trước khi phát hành, có quyết định phát hành; điều chỉnh tiến độ (4 điểm).","Hình thức phiếu, kết luận rõ ràng (3 điểm)."],
answer:`<p><b>Gợi ý kết luận.</b> Chưa đủ điều kiện ký hợp đồng theo đề nghị của đối tác. Đề xuất: chỉ liên kết khai thác bản thảo, in, phát hành; nhà xuất bản tự biên tập toàn bộ; yêu cầu văn bản chấp thuận của tác giả; thay ảnh không rõ nguồn bằng ảnh có quyền sử dụng hợp pháp; tổ chức thẩm định nội dung lịch sử; lập lại tiến độ, bảo đảm nộp lưu chiểu đúng hạn.</p>`}
]});

WRITTEN.push({id:"viet3",title:"Đề viết số 3 – Liên kết xuất bản và bài học năm 2026; sửa bản thảo Điện Biên Phủ; lập kế hoạch đề tài",minutes:90,
intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề tự soạn để luyện tập, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026. Ở câu sửa lỗi, chỉ tính lỗi đã định sẵn.`,
questions:[
{q:`Trình bày quy định của Luật Xuất bản hiện hành về liên kết xuất bản. Từ việc xử lý cuốn sách “Chuyện với Thanh – Lời kể mới về ánh sáng” năm 2026, hãy rút ra bài học cho biên tập viên.`,points:30,
outline:["Đối tác và 4 hình thức liên kết: khai thác bản thảo, biên tập sơ bộ, in, phát hành; liên kết theo từng xuất bản phẩm (5 điểm).","Điều kiện: văn bản chấp thuận của tác giả, chủ sở hữu quyền; hợp đồng liên kết; đối tác biên tập sơ bộ phải có biên tập viên (NĐ 195: ít nhất 03 người có chứng chỉ) (4 điểm).","Không liên kết biên tập sơ bộ với lý luận chính trị, lịch sử, tôn giáo, chủ quyền quốc gia, hồi ký (4 điểm).","Trách nhiệm: tổng giám đốc quyết định đối tác, ký hợp đồng, tổ chức biên tập hoàn chỉnh, chịu trách nhiệm trước pháp luật, thu hồi quyết định xuất bản khi đối tác vi phạm; tổng biên tập đọc duyệt bản thảo liên kết (5 điểm).","Tóm tắt vụ việc chính xác: tạm dừng (02/6), dừng phát hành, thu hồi (04/6); phạt 100 triệu đồng, đình chỉ hoạt động 02 tháng, tiêu hủy (15/6); khởi tố (7/2026, đang điều tra) (5 điểm).","Bài học: liên kết không chuyển trách nhiệm; xác minh mọi thông tin quan trọng; thẩm định độc lập sách lịch sử, lãnh tụ; cẩn trọng ngôn từ; lưu hồ sơ biên tập; Luật 2026 không chuyển giao quyền quyết định nội dung (7 điểm)."],
answer:`<p><b>Ý cần nhấn.</b> Theo người đứng đầu NXB Chính trị quốc gia Sự thật, “liên kết xuất bản không đồng nghĩa với việc chuyển giao trách nhiệm cho đối tác liên kết”; bản thảo do đối tác đề xuất phải qua quy trình như bản thảo của nhà xuất bản. Cơ quan quản lý nêu lý do xử lý: thông tin, đánh giá không chính xác về một số nhân vật, sự kiện lịch sử; ngôn ngữ không phù hợp khi viết về Chủ tịch Hồ Chí Minh và một số lãnh đạo. Vụ án hình sự đang điều tra, bài làm không kết luận thay cơ quan tố tụng.</p>`},
{q:`Đọc đoạn văn sau. Đoạn văn có <b>13 lỗi</b> (chính tả, viết hoa, dấu câu, ngữ pháp, dùng từ, sự kiện, tên văn kiện, logic, chính trị – tư tưởng). Hãy chỉ ra, sửa, giải thích từng lỗi và viết lại đoạn văn hoàn chỉnh.
<blockquote>Chiến dịch Điện Biên Phủ diễn ra trong 55 ngày đêm, từ ngày 13/3 đến ngày 7/5/1954, là đỉnh cao của cuộc kháng chiến chống thực dân Pháp xâm lược. Dưới sự lãnh đạo của đảng đứng đầu là Chủ tịch Hồ Chí Minh và sự chỉ huy trực tiếp của Đại tướng Văn Tiến Dũng, quân và dân ta đã tiêu diệt và bắt sống toàn bộ tập đoàn cứ điễm Điện Biên Phủ. Bằng tinh thần quyết chiến, quyết thắng của quân và dân ta trên mọi mặt trận. Thắng lợi này buộc Chính phủ Pháp phải ký Hiệp định Pari về chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương. Theo Hiệp định, vĩ tuyến 16 được lấy làm giới tuyến quân sự tạm thời; miền Nam hoàn toàn giải phóng, bước vào thời kỳ quá độ đi lên chủ nghĩa xã hội. Chiến thắng Điện Biên Phủ đã viết nên một trang sử hào nhoáng của dân tộc, được ghi vào lịch sử như một Bạch Đằng, một Chi lăng, một Đống Đa của thế kỷ XX và đi vào lịch sử thế giới như một chiến công chói lọi, “lừng lẫy năm châu, trấn động địa cầu”. Chiến thắng đó chủ yếu nhờ vào sự viện trợ của nước ngoài; đồng thời nó cổ vũ mạnh mẽ phong trào giải phóng dân tộc trên thế giới.</blockquote>`,points:40,
outline:["Mỗi lỗi 2,5 điểm: phát hiện 1, sửa đúng 1, giải thích 0,5 (13 lỗi = 32,5 điểm).","Đoạn văn sửa hoàn chỉnh, mạch lạc (7,5 điểm).","Sửa sai chỗ vốn đúng: trừ 1 điểm/lần."],

<p><b>Đoạn văn đã sửa</b></p><blockquote>Chiến dịch Điện Biên Phủ diễn ra trong 56 ngày đêm, từ ngày 13/3 đến ngày 7/5/1954, là đỉnh cao của cuộc kháng chiến chống thực dân Pháp xâm lược. Dưới sự lãnh đạo của Đảng, đứng đầu là Chủ tịch Hồ Chí Minh, và sự chỉ huy trực tiếp của Đại tướng Võ Nguyên Giáp, quân và dân ta đã tiêu diệt và bắt sống toàn bộ tập đoàn cứ điểm Điện Biên Phủ. Đó là thắng lợi của tinh thần quyết chiến, quyết thắng của quân và dân ta trên mọi mặt trận. Thắng lợi này buộc Chính phủ Pháp phải ký Hiệp định Giơnevơ về chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương. Theo Hiệp định, vĩ tuyến 17 được lấy làm giới tuyến quân sự tạm thời; miền Bắc hoàn toàn giải phóng, bước vào thời kỳ quá độ đi lên chủ nghĩa xã hội. Chiến thắng Điện Biên Phủ đã viết nên một trang sử hào hùng của dân tộc, được ghi vào lịch sử như một Bạch Đằng, một Chi Lăng, một Đống Đa của thế kỷ XX và đi vào lịch sử thế giới như một chiến công chói lọi, “lừng lẫy năm châu, chấn động địa cầu”. Chiến thắng đó là thắng lợi của sức mạnh khối đại đoàn kết toàn dân tộc kết hợp với sức mạnh thời đại; đồng thời cổ vũ mạnh mẽ phong trào giải phóng dân tộc trên thế giới.</blockquote>`},
{q:`Lập <b>kế hoạch đề tài</b> (dạng đề cương) cho một tủ sách kỷ niệm 100 năm Ngày thành lập Đảng Cộng sản Việt Nam (3/2/1930 – 3/2/2030), dự kiến xuất bản trong giai đoạn 2028–2030 tại Nhà xuất bản Chính trị quốc gia Sự thật.`,points:30,
outline:["Tên tủ sách, mục đích, ý nghĩa chính trị (4 điểm).","Đối tượng bạn đọc: cán bộ, đảng viên; học sinh, sinh viên; bạn đọc phổ thông; bạn đọc nước ngoài (3 điểm).","Danh mục 5–7 đầu sách đa dạng loại hình: chính luận – lý luận, tư liệu – văn kiện, lịch sử phổ thông, hỏi – đáp, sách ảnh, song ngữ; sách in, sách điện tử, sách nói (8 điểm).","Tổ chức bản thảo: đặt hàng tác giả, cơ quan nghiên cứu; hội đồng chuyên gia lịch sử Đảng thẩm định; đối chiếu văn kiện, tư liệu gốc (5 điểm).","Pháp lý, tiến độ: văn bản chấp thuận/hợp đồng quyền tác giả, bản quyền ảnh; đăng ký kế hoạch xuất bản; từ 01/3/2027 sách lịch sử cách mạng (nếu thuộc danh mục của Chính phủ) phải thẩm định trước khi đăng ký và chỉ phát hành khi Bộ VHTTDL có ý kiến; lưu chiểu chậm nhất 10 ngày; mốc hoàn thành trước 3/2/2030 (5 điểm).","Nguồn lực (đặt hàng của Nhà nước, ngân sách), quảng bá (Ngày Sách và Văn hóa đọc Việt Nam 21/4, nền tảng số), rủi ro và biện pháp kiểm soát chất lượng (5 điểm)."],
answer:`<p><b>Khung mẫu.</b> (1) Tên: Tủ sách “Đảng Cộng sản Việt Nam – 100 năm”. (2) Mục đích: tuyên truyền, giáo dục truyền thống, bảo vệ nền tảng tư tưởng của Đảng, đáp ứng nhu cầu đọc của nhiều nhóm bạn đọc. (3) Danh mục dự kiến: văn kiện, cương lĩnh tiêu biểu qua các thời kỳ; biên niên sự kiện lịch sử Đảng; hỏi – đáp về lịch sử Đảng cho thanh niên; sách ảnh tư liệu; bản tiếng Anh giới thiệu cho bạn đọc quốc tế; phiên bản điện tử và sách nói. (4) Tổ chức: mỗi đầu sách có biên tập viên chủ trì; hội đồng thẩm định; phiếu đối chiếu trích dẫn. (5) Tiến độ: 2027 hoàn thiện đề cương và ký hợp đồng; 2028–2029 viết, thẩm định, biên tập; đăng ký kế hoạch, lưu chiểu, phát hành theo đợt trước 3/2/2030. (6) Kiểm soát: không liên kết biên tập sơ bộ (sách lịch sử); lưu vết các vòng duyệt.</p>`}
]});

WRITTEN.push({id:"viet4",title:"Đề viết số 4 – Quy trình biên tập; sửa bản thảo về công cuộc Đổi mới; tình huống quyền tác giả",minutes:90,
intro:`Thời gian làm bài <b>90 phút</b>, không sử dụng tài liệu, tổng điểm <b>100</b>. Đề tự soạn để luyện tập, không phải đề thi chính thức. Mốc pháp luật: tháng 10/2026. Ở câu sửa lỗi, chỉ tính lỗi đã định sẵn; cách viết “Tổ chức Thương mại thế giới” hay “Tổ chức Thương mại Thế giới” đều chấp nhận nếu thống nhất.`,
questions:[
{q:`Trình bày quy trình biên tập một xuất bản phẩm từ khâu tổ chức bản thảo đến khi phát hành. Phân tích trách nhiệm của biên tập viên, tổng biên tập, tổng giám đốc (giám đốc) nhà xuất bản theo Luật Xuất bản.`,points:30,
outline:["Khái niệm biên tập; nguyên tắc “Nhà nước không kiểm duyệt trước khi xuất bản” – nhà xuất bản tự chịu trách nhiệm (3 điểm).","Tổ chức bản thảo: kế hoạch đề tài, đặt hàng, văn bản chấp thuận của tác giả (Điều 21), đăng ký xuất bản (07 ngày làm việc, đến 31/12) (4 điểm).","Đánh giá, thẩm định; biên tập nội dung: quan điểm, sự kiện, số liệu, trích dẫn; trao đổi với tác giả (5 điểm).","Đọc duyệt nhiều cấp, lưu vết: lãnh đạo ban, thư ký biên tập, Phó GĐ – Phó TBT, GĐ – TBT duyệt nội dung và duyệt in (4 điểm).","Biên tập kỹ thuật, mỹ thuật; đọc morat trước in; đọc sách mẫu sau in; thông tin bắt buộc (Điều 27) (4 điểm).","Lưu chiểu chậm nhất 10 ngày trước khi phát hành; quyết định phát hành; Thư viện Quốc gia 45 ngày; lưu hồ sơ biên tập (4 điểm).","Trách nhiệm: BTV (Điều 19), TBT (khoản 2 Điều 18), TGĐ (khoản 1 Điều 18) – mỗi chủ thể chịu trách nhiệm trước ai (6 điểm)."],
answer:`<p><b>Sơ đồ tóm tắt:</b> tổ chức bản thảo → đăng ký → đánh giá, thẩm định → biên tập viên biên tập → lãnh đạo ban biên tập đọc → thư ký biên tập đọc kiểm tra → Phó Giám đốc – Phó Tổng biên tập duyệt → Giám đốc – Tổng biên tập duyệt nội dung, duyệt in, ký quyết định xuất bản → chế bản, đọc morat → in → đọc sách mẫu → nộp lưu chiểu (≥ 10 ngày trước phát hành) → quyết định phát hành → nộp Thư viện Quốc gia (45 ngày) → lưu hồ sơ biên tập.</p><p>Biên tập viên chịu trách nhiệm trước tổng biên tập và pháp luật về phần mình biên tập; tổng biên tập chịu trách nhiệm trước tổng giám đốc và pháp luật về nội dung; tổng giám đốc chịu trách nhiệm trước pháp luật và cơ quan chủ quản về xuất bản phẩm và mọi hoạt động của nhà xuất bản.</p>`},
{q:`Đọc đoạn văn sau. Đoạn văn có <b>14 lỗi</b> (chính tả, viết hoa, dấu câu, ngữ pháp, dùng từ, sự kiện – số liệu, tên văn kiện, logic, chính trị – tư tưởng). Hãy chỉ ra, sửa, giải thích từng lỗi và viết lại đoạn văn hoàn chỉnh.
<blockquote>Đại hội đại biểu toàn quốc lần thứ VI của Đảng (tháng 12/1987) đã đề ra đường lối đổi mới toàn diện đất nước, trước hết là đổi mới tư duy nhất là tư duy kinh tế. Đại hội chủ trương phát triển nền kinh tế hàng hóa nhiều thành phần, xóa bỏ cơ chế tập trung quan liêu, bao biện, tăng cường vai trò quản lý của nhà nước. Đến Đại hội VIII (năm 2001), Đảng xác định nền kinh tế thị trường tự do là mô hình kinh tế tổng quát của nước ta trong thời kỳ quá độ. Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2016) tiếp tục làm rõ mô hình, mục tiêu và phương hướng phát triển. Đổi mới chính là thay đổi mục tiêu xã hội chủ nghĩa cho phù hợp với điều kiện mới. Nhờ đổi mới mà đã đưa nước ta thoát khỏi khủng hoảng kinh tế – xã hội; các nghành kinh tế phát triển mạnh, đời sống người dân được cải thiện rõ rệt. Năm 2007, Việt Nam trở thành thành viên chính thức của tổ chức thương mại thế giới (WTO). Sau 45 năm đổi mới (1986–2026), đất nước đã đạt được những thành tựu to lớn, có ý nghĩa lịch xử. Đó là nền tảng để thực hiện tham vọng đưa nước ta trở thành nước phát triển, thu nhập cao vào năm 2045.</blockquote>`,points:40,
