</tbody></table></div><p><span class="muted">Dễ nhầm: có một "Quy định 225-QĐ/TW" cũ của Ban Bí thư về giải mật thông tin; Quyết định 223-QĐ/TW là văn bản về chức năng của Nhà xuất bản. Luôn nói kèm ngày ban hành.</span></p>`},
{h:"Điều lệ Đảng: kiểm tra, giám sát và kỷ luật",items:[
"Chương VII (Điều 30–33): công tác kiểm tra, giám sát của Đảng và Ủy ban kiểm tra các cấp. Chương VIII (Điều 34–40): khen thưởng và kỷ luật.",
"Điều 30: <b>\"Kiểm tra, giám sát là những chức năng lãnh đạo của Đảng\"</b>.",
"Ủy ban kiểm tra do cấp ủy cùng cấp bầu, làm việc tập thể, dưới sự lãnh đạo của cấp ủy cùng cấp và sự chỉ đạo của Ủy ban kiểm tra cấp trên.",
"Nhiệm vụ của Ủy ban kiểm tra các cấp: kiểm tra đảng viên (kể cả cấp ủy viên cùng cấp) và tổ chức đảng cấp dưới khi có dấu hiệu vi phạm; giám sát; xem xét, kết luận và thi hành hoặc đề nghị kỷ luật; giải quyết tố cáo; giải quyết khiếu nại kỷ luật đảng.",
"Hình thức kỷ luật: tổ chức đảng – khiển trách, cảnh cáo, giải tán; đảng viên chính thức – khiển trách, cảnh cáo, cách chức, khai trừ; đảng viên dự bị – khiển trách, cảnh cáo."]},
{h:"Quy định 212-QĐ/TW (17/8/2026): kỷ luật vi phạm",items:[
"Do Bộ Chính trị ban hành, Thường trực Ban Bí thư Trần Cẩm Tú ký; 4 chương, <mark>60</mark> điều; thay Quy định 69-QĐ/TW và 264-QĐ/TW.",
"Thời hiệu: <mark>5 năm</mark> với khiển trách, <mark>10 năm</mark> với cảnh cáo hoặc cách chức (áp dụng cả tổ chức đảng).",
"Không áp dụng thời hiệu với: vi phạm đến mức khai trừ hoặc giải tán; vi phạm chính trị nội bộ; quốc phòng, an ninh, đối ngoại; dùng văn bằng, chứng chỉ không hợp pháp.",
"Một hành vi chỉ bị kỷ luật một lần; xét nhiều hành vi cùng lúc thì quyết định một hình thức cao nhất. Quyết định kỷ luật tự hết hiệu lực sau 12 tháng nếu không tái phạm (trừ khai trừ, giải tán).",
"<b>Điểm mới:</b> thêm nhóm vi phạm về khoa học, công nghệ, chuyển đổi số, kể cả <b>dùng trí tuệ nhân tạo giả mạo video, hình ảnh, giọng nói, chữ ký</b>; mở rộng tới đảng viên ở nước ngoài."]},
{h:"Quy định 207-QĐ/TW (26/7/2026): 19 điều đảng viên không được làm",items:[
"Ban Chấp hành Trung ương ban hành, Tổng Bí thư Tô Lâm ký; thay Quy định 37-QĐ/TW năm 2021.",
"Có điều cấm <b>lợi dụng không gian số để phát tán thông tin sai sự thật</b>; chạy chức, chạy quyền; nhận tài trợ du lịch, học tập, chữa bệnh từ tổ chức liên quan đến lĩnh vực mình quản lý; cản trở kiểm tra, thanh tra, điều tra, xét xử, kỷ luật.",
"Liên hệ: Luật Viên chức 2025 (Điều 10) cũng cấm viên chức đăng tải, phát tán thông tin sai lệch. Với biên tập viên, lời nói trên mạng gắn với uy tín cơ quan xuất bản của Đảng."]},
{h:"Quy định 225-QĐ/TW (14/10/2026) và Nghị quyết 05-NQ/TW",items:[
"Quy định 225: Ban Chấp hành Trung ương ban hành, có hiệu lực từ ngày ký; 7 chương, 35 điều; thay Quy định 21-QĐ/TW.",
"Ủy ban kiểm tra được kết nối cơ sở dữ liệu ngân hàng, chứng khoán, đăng ký tài sản, đất đai, thuế, thanh tra, kiểm toán…; nguồn phát hiện vi phạm gồm cả phần mềm giám sát và dữ liệu số; cán bộ đã nghỉ hưu, chuyển công tác vẫn bị xử lý vi phạm xảy ra lúc đương chức.",
"Nguyên tắc nhấn mạnh: \"không có ngoại lệ\" và \"bảo vệ cái đúng, người tốt\".",
"Nghị quyết 05: kiểm tra, giám sát là <b>\"công cụ để kiểm soát quyền lực, giữ vững kỷ luật, kỷ cương của Đảng\"</b>; toàn Đảng làm kiểm tra, giám sát, không khoán trắng cho Ủy ban kiểm tra.",
"6 nhóm giải pháp của Nghị quyết 05: nâng nhận thức, trách nhiệm; hoàn thiện quy định; đổi mới phương thức (chương trình toàn khóa, cảnh báo sớm, giám sát trên dữ liệu); chuyển đổi số; kiện toàn Ủy ban kiểm tra đến cấp xã; phối hợp với các cơ quan liên quan."]},
{h:"Phương châm, cách nói cần thuộc",items:[
"\"Giám sát phải mở rộng, kiểm tra phải có trọng tâm, trọng điểm\" (Chủ nhiệm Trần Sỹ Thanh trình bày tại hội nghị quán triệt Nghị quyết Đại hội XIV, 7/2/2026).",
"\"Không có vùng cấm, không có ngoại lệ\"; ngành Kiểm tra là \"thanh bảo kiếm của Đảng\".",
"Tổng Bí thư Tô Lâm (24/11/2025): không để \"khoảng trống\", \"vùng tối\" mà kiểm tra, giám sát không vươn tới; \"kiểm tra trên dữ liệu, giám sát trên dữ liệu\"; xử lý nghiêm vi phạm nhưng bảo vệ người dám nghĩ, dám làm.",
"Chủ nhiệm Trần Sỹ Thanh: \"Chi bộ chính là nền tảng của Đảng, phải là nơi thực hiện giám sát thường xuyên\" (13/4/2026); kiểm tra, giám sát \"là để cùng tìm ra cách tháo gỡ vấn đề, chứ không phải để làm khó vấn đề\" (29/6/2026).",
"Phòng, chống tham nhũng nhiệm kỳ XIII: <mark>174</mark> cán bộ diện Trung ương quản lý bị kỷ luật, <mark>66</mark> người bị xử lý hình sự (tổng kết 11/12/2025).",
"Ngày truyền thống ngành Kiểm tra Đảng: <mark>16/10/1948</mark>."]},
{h:"Sách về lĩnh vực này do NXB Chính trị quốc gia Sự thật in",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Sách</th><th>Tác giả</th><th>Năm</th></tr></thead><tbody>
<tr><td><b>Kiểm soát quyền lực ở nước ta qua công tác kiểm tra, giám sát và kỷ luật Đảng</b> (giải B Giải thưởng Sách Quốc gia lần III; có bản tiếng Lào 2021)</td><td>Ủy ban Kiểm tra Trung ương, Mai Trực (Phó Chủ nhiệm) chủ biên</td><td>Giải trao 9/10/2020</td></tr>
<tr><td>Kiên quyết, kiên trì đấu tranh phòng, chống tham nhũng, tiêu cực…</td><td>Nguyễn Phú Trọng</td><td>2023</td></tr>
<tr><td>Xây dựng, chỉnh đốn Đảng – Một số vấn đề lý luận và thực tiễn (lần thứ ba)</td><td>Nguyễn Phú Trọng</td><td>2024</td></tr>
<tr><td>Vì sự trong sạch, vững mạnh và trường tồn của Đảng</td><td>Trần Quốc Vượng, nguyên Chủ nhiệm Ủy ban Kiểm tra Trung ương</td><td>2024</td></tr>
<tr><td>Quy định về công tác kiểm tra, giám sát và kỷ luật của Đảng (14 văn bản)</td><td>Ủy ban Kiểm tra Trung ương</td><td>12/2022</td></tr>
<tr><td>Kiểm tra, giám sát của Đảng về công tác cán bộ</td><td>TS Phan Thăng An chủ biên</td><td>2024</td></tr>
</tbody></table></div><p><span class="muted">Tập văn bản năm 2022 và cuốn hỏi – đáp năm 2023 viết theo các quy định nay đã bị thay (22, 37, 69). Chưa thấy bản cập nhật theo các quy định năm 2026: có thể nêu như một đề xuất đề tài khi phỏng vấn, sau khi kiểm tra trên stbook.vn.</span></p>`}

tldr:`Theo Nghị định 259, hội đồng tuyển dụng có <mark>5 hoặc 7</mark> người: Chủ tịch là người đứng đầu hoặc cấp phó; Phó Chủ tịch là người phụ trách tổ chức cán bộ; Ủy viên kiêm Thư ký là viên chức làm tổ chức cán bộ; các ủy viên khác có chuyên môn liên quan. Phỏng vấn tối đa <mark>30 phút</mark>, chuẩn bị không quá 15 phút, chấm tư duy, giao tiếp, phán đoán tình huống. Người nhiều khả năng chủ trì là <b>PGS.TS Vũ Trọng Lâm</b>: ông gọi biên tập viên là <b>"người gác cổng tri thức"</b> và muốn biên tập viên vững chính trị, nắm pháp luật xuất bản số, biết làm truyền thông. Ủy ban Kiểm tra Trung ương khóa XIV có <mark>23</mark> thành viên; không tìm thấy sách đứng tên lãnh đạo hiện nay của Ủy ban.`,
sections:[

<tr><td>Chủ tịch: người đứng đầu hoặc cấp phó</td><td>PGS.TS Vũ Trọng Lâm, hoặc một Phó Giám đốc được ủy quyền</td></tr>
<tr><td>Phó Chủ tịch: người phụ trách tổ chức cán bộ</td><td>Văn phòng (đã gồm tổ chức – cán bộ): ThS Đặng Đức Chiến, Chánh Văn phòng; bà Phạm Tuyết Nhung, Phó Chánh Văn phòng, Trưởng phòng Tổ chức – Cán bộ</td></tr>
<tr><td>Ủy viên kiêm Thư ký</td><td>Viên chức làm tổ chức cán bộ</td></tr>

</tbody></table></div>`},
{h:"PGS.TS Vũ Trọng Lâm: tiểu sử và sách",items:[
"Sinh năm 1969 tại Thanh Miện, Hải Dương (địa danh theo bài năm 2023). PGS.TS ngành Kinh tế, Luật học.",
"Từng là Phó Viện trưởng Viện Nghiên cứu phát triển kinh tế – xã hội Hà Nội, Phó Chánh Văn phòng Thành ủy Hà Nội; <mark>7/2011</mark> Phó Giám đốc – Phó Tổng Biên tập Nhà xuất bản; <mark>8/2020</mark> Phó Tổng Biên tập Tạp chí Cộng sản; <mark>21/6/2023</mark> Giám đốc – Tổng Biên tập.",
"Chủ tịch Hội đồng Biên tập – Xuất bản; Chủ tịch Hội đồng Thi đua – Khen thưởng; Ủy viên Ban Chấp hành Đảng bộ các cơ quan Đảng Trung ương.",
"Sách: <b>Những nội dung cơ bản trong Văn kiện Đại hội XIV của Đảng – Hỏi và đáp</b> (đồng chủ biên, 6/2026); Quốc hội Việt Nam qua các nhiệm kỳ – Những dấu ấn lịch sử (đồng chủ biên, tái bản 4/2026); Trao quyền: Từ lý thuyết đến thực tế (đồng tác giả, tái bản 2/2026); Hoàn thiện thể chế, chính sách về phát huy nguồn lực tôn giáo ở Việt Nam (12/2025); Nhận diện văn hóa trong không gian số (đồng chủ biên, 2025); Võ Nguyên Giáp – Vị tướng của nhân dân (chủ biên, 2024).",
"Bài nên đọc trước: \"Tăng cường bồi dưỡng, đào tạo kỹ năng, nghiệp vụ cho đội ngũ cán bộ, biên tập viên ngành Xuất bản trong bối cảnh chuyển đổi số hiện nay\" (Tạp chí Chính trị và Phát triển số 06/2024); \"Phát huy vai trò của các cơ quan báo chí, xuất bản trong đấu tranh phòng, chống tham nhũng, tiêu cực trong công tác cán bộ\" (số 02/2024)."]},
{h:"PGS.TS Vũ Trọng Lâm: những ý hay nhấn mạnh",items:[
"Biên tập viên là <b>\"người gác cổng tri thức\"</b>; công nghệ không thể thay vai trò người biên tập; liên kết xuất bản không chuyển giao trách nhiệm cho đối tác; sách nhạy cảm phải thẩm định nhiều vòng (Tuổi Trẻ, 25/6/2026).",
"Biên tập viên cần lập trường chính trị vững vàng, nắm pháp luật xuất bản (nhất là xuất bản số), biết lập kế hoạch nội dung số, biết làm truyền thông, chuyển sang vai trò \"nhà cung cấp dịch vụ tri thức\" (bài số 06/2024).",
"Chuyển đổi số là \"phương thức bắt buộc\"; trí tuệ nhân tạo là \"con dao hai lưỡi\"; sách hay mà truyền thông kém như \"mặc áo gấm mà đi đêm\".",
"Phương châm Đảng ủy: lấy chất lượng xuất bản phẩm làm trung tâm, nghiên cứu làm nền tảng, tuyên truyền làm lực đẩy. Mục tiêu đến hết 2026 còn <mark>217</mark> viên chức, giảm 10% so với 2021.",
"Đừng gán nhầm: \"mỗi trang sách là một hàng rào tư tưởng\" là lời Chủ tịch Quốc hội Trần Thanh Mẫn; \"Sách là văn bia để đời\" là lời cố Tổng Bí thư Nguyễn Phú Trọng."]},
{h:"Bốn Phó Giám đốc – Phó Tổng Biên tập",items:[
"<b>ThS Phạm Thị Thinh</b> (Phó Bí thư Đảng ủy): từ 2004 biên tập hơn 20 cuốn sách của Tổng Bí thư Nguyễn Phú Trọng; viết bài phân tích Chỉ thị 04-CT/TW. Phỏng vấn Znews 29/6/2026: \"Làm xuất bản là nghề chọn chữ, không phải nghề sắp chữ\"; biên tập viên đọc mỗi bản thảo ít nhất 3 lần; biên tập viên giỏi phải \"vững về chính trị, sáng về đạo đức, sâu về chuyên môn, nhạy bén với thực tiễn và thành thạo công nghệ\".",
"<b>ThS Nguyễn Hoài Anh</b> (Ủy viên Thư ký Hội đồng Biên tập – Xuất bản): 34 năm làm xuất bản, bổ nhiệm lại 29/4/2026. Bài \"Phát triển đội ngũ biên tập viên… ngang tầm nhiệm vụ\" (số 04/2025): gác cổng tri thức, kiến thức vừa sâu vừa rộng, nhận diện nội dung nhạy cảm, dùng AI nhưng không phụ thuộc, KPI thay \"cào bằng\".",
"<b>TS Võ Văn Bé</b> (Phó Chủ tịch Hội đồng Khoa học): nguyên Trưởng Ban sách Kinh điển – Lý luận. Bài số 08/2025 tự nhận hạn chế: nhiều sách nặng tính hàn lâm, thiếu sách lý luận phổ thông; mục tiêu \"Nhà xuất bản số\" năm 2030.",
"<b>ThS Nguyễn Thái Bình</b>: nguyên Giám đốc Trung tâm Sách quốc gia, phụ trách in, phát hành, chuyển đổi số; kiêm Phó Tổng Biên tập từ 19/3/2026. Doanh thu trực tuyến tăng từ khoảng 1,3 tỷ đồng (2023) lên 4,28 tỷ đồng (2024); phát biểu \"cần siết chặt lại tất cả các khâu trong quy trình xuất bản sách\"."]},
{h:"Hội đồng Biên tập – Xuất bản và các đơn vị",html:`<p>Hội đồng Biên tập – Xuất bản có <mark>8</mark> người: Chủ tịch Vũ Trọng Lâm, Ủy viên Thư ký Nguyễn Hoài Anh, ba Phó Giám đốc còn lại và ba ủy viên chuyên trách (từ 1/3/2025): <b>TS Nguyễn Công Dũng</b> (tuyên truyền; nguyên Tổng Biên tập Báo điện tử Đảng Cộng sản Việt Nam), <b>PGS.TS Lê Thị Thục</b> (nghiên cứu khoa học; Trưởng Ban Biên tập Tạp chí Chính trị và Phát triển), <b>ThS Phạm Thị Kim Huế</b> (đọc duyệt bản thảo; nguyên Trưởng Ban sách Kinh tế).</p>

"Hà Quốc Trị: người duy nhất trong lãnh đạo Ủy ban từng làm báo (Tạp chí Kiểm tra). Phát biểu: \"Việc kiểm tra để xử lý không phải là mục đích chính\"; chuyển \"từ bị động sang chủ động\".",

{doc:"ktgs",q:"Trình bày những điểm mới của các văn bản về kiểm tra, giám sát, kỷ luật đảng năm 2026. Liên hệ trách nhiệm của biên tập viên là đảng viên trên không gian mạng.",outline:["Căn cứ: Nghị quyết 05-NQ/TW (07/4/2026); Quy định 207 (26/7/2026), 212 (17/8/2026), 225 (14/10/2026).","Quan điểm: kiểm tra, giám sát là công cụ kiểm soát quyền lực; giám sát mở rộng, kiểm tra có trọng tâm; trên dữ liệu; không vùng cấm.","Điểm mới: 19 điều cấm, có cấm phát tán thông tin sai trên không gian số; vi phạm dùng AI giả mạo; kết nối cơ sở dữ liệu.","Liên hệ: Luật Viên chức 2025 Điều 10; trách nhiệm kiểm chứng thông tin, không chia sẻ tin chưa xác minh; biên tập viên là người gác cổng tri thức.","Kết luận: tự giác, nêu gương; bảo vệ cái đúng, người tốt."]}

INTERVIEW.push({h:"Theo từng thành viên hội đồng (cập nhật 21/10/2026)",intro:"Mỗi câu trả lời trong 1–2 phút: ý chính, một dẫn chứng, một liên hệ bản thân. Chỉ nhắc sách, bài của người hỏi khi thật sự khớp với ý.",items:[
{q:"(Giám đốc) Biên tập viên ở Nhà xuất bản này khác gì nơi khác?",a:`<ul><li>Là "người gác cổng tri thức": chịu trách nhiệm chính trị với từng câu chữ.</li><li>Sách nhạy cảm thẩm định nhiều vòng; liên kết xuất bản không chuyển giao trách nhiệm cho đối tác.</li><li>Ví dụ: vụ thu hồi sách năm 2026 cho thấy hậu quả khi buông khâu duyệt.</li></ul>`},
{q:"(Giám đốc) Chuyển đổi số, trí tuệ nhân tạo thay đổi nghề biên tập thế nào?",a:`<ul><li>Chuyển đổi số là "phương thức bắt buộc"; AI dùng để tra cứu, đối chiếu, soát lỗi nhưng là "con dao hai lưỡi".</li><li>Người biên tập quyết định nội dung; nêu công cụ cụ thể mình đã dùng.</li><li>Luật 17/2026 yêu cầu gắn nhãn nội dung do AI tạo; Quy định 212 xử lý dùng AI giả mạo.</li></ul>`},
{q:"(Giám đốc) Gần đây bạn đọc cuốn nào của Nhà xuất bản?",a:`<ul><li>Hỏi – đáp nội dung cơ bản Văn kiện Đại hội XIV (6/2026, do ông Vũ Trọng Lâm đồng chủ biên).</li><li>Sách của cố Chủ tịch nước Trần Đại Quang (ra mắt 12/10/2026); Tuyển tập Fidel Castro (8/2026).</li><li>Nói được một điều mình rút ra từ cuốn đó.</li></ul>`},
{q:"(Giám đốc, Phó Giám đốc) Làm sao để sách lý luận hấp dẫn hơn?",a:`<ul><li>Dựa trên tự đánh giá của lãnh đạo: một số ấn phẩm chậm đổi mới cách tiếp cận; thiếu sách lý luận phổ thông.</li><li>Đề xuất: sách hỏi – đáp, sách nói, mã QR, bài giới thiệu ngắn trên mạng để sách hay không "mặc áo gấm mà đi đêm".</li></ul>`},
{q:"(Phó Giám đốc) Bản thảo trích văn kiện sai chữ hoặc số liệu không khớp nguồn, bạn xử lý thế nào?",a:`<ul><li>Tra lại nguyên văn, ghi rõ trong phiếu duyệt, trao đổi với tác giả; không tự sửa ý tác giả.</li><li>Vấn đề nhạy cảm: báo lãnh đạo ban, đề nghị hội đồng thẩm định.</li><li>Nêu đúng thứ tự quy trình: lãnh đạo ban đọc sơ bộ → biên tập viên đọc ít nhất 3 lần → phiếu duyệt → bộ phận đọc kiểm tra → Phó Giám đốc duyệt → Giám đốc ký duyệt in → đọc sách mẫu → nộp lưu chiểu.</li></ul>`},
{q:"(Phó Giám đốc) Bạn tự bồi dưỡng thế nào trong năm đầu?",a:`<ul><li>"Chỉ có sự tự học của biên tập viên mới nhanh chóng trưởng thành" (Phạm Thị Thinh).</li><li>Kế hoạch: đọc văn kiện, học lớp chứng chỉ hành nghề biên tập, học biên tập viên lâu năm, ghi sổ lỗi thường gặp.</li></ul>`},
{q:"Thu nhập ở đây không cao, vì sao vẫn chọn?",a:`<ul><li>Lãnh đạo đã thừa nhận điều này trong bài viết, nên trả lời thẳng thắn.</li><li>Giá trị nghề nghiệp, môi trường học hỏi, sự phù hợp với ngành học, mục tiêu dài hạn.</li></ul>`},
{q:"(Ủy ban Kiểm tra) Viên chức, đảng viên không được làm gì trên mạng xã hội?",a:`<ul><li>Quy định 207-QĐ/TW (26/7/2026): cấm lợi dụng không gian số phát tán thông tin sai sự thật.</li><li>Luật Viên chức 2025 Điều 10: cấm đăng tải, phát tán thông tin sai lệch.</li><li>Biên tập viên càng phải cẩn trọng vì gắn với uy tín cơ quan xuất bản của Đảng.</li></ul>`},
{q:"(Ủy ban Kiểm tra) Xuất bản góp phần gì vào phòng, chống tham nhũng, kiểm soát quyền lực?",a:`<ul><li>Sách của cố Tổng Bí thư Nguyễn Phú Trọng về phòng, chống tham nhũng (2023).</li><li>Cuốn "Kiểm soát quyền lực ở nước ta qua công tác kiểm tra, giám sát và kỷ luật Đảng" của Ủy ban Kiểm tra Trung ương (giải B Sách Quốc gia 2020).</li><li>Bài của Giám đốc Vũ Trọng Lâm về vai trò báo chí, xuất bản trong phòng, chống tham nhũng, tiêu cực trong công tác cán bộ (2024).</li></ul>`},
{q:"(Ủy ban Kiểm tra) Kể một văn bản mới về kiểm tra, giám sát.",a:`<ul><li>Nghị quyết 05-NQ/TW (07/4/2026); Quy định 225-QĐ/TW (14/10/2026); Quy định 212-QĐ/TW (17/8/2026).</li><li>Luôn nói kèm ngày; không nói Quy định 69 hay 296 là hiện hành.</li></ul>`},
{q:"(Ủy ban Kiểm tra) Nếu phát hiện sai phạm trong đơn vị, bạn làm gì?",a:`<ul><li>Báo cáo đúng kênh, đúng thẩm quyền, trung thực; không che giấu, không tự xử lý.</li><li>Tinh thần "bảo vệ cái đúng, người tốt"; kiểm tra để tháo gỡ, không phải để làm khó.</li></ul>`},
{q:"(Ủy ban Kiểm tra) Phương châm công tác kiểm tra hiện nay?",a:`<ul><li>"Giám sát phải mở rộng, kiểm tra phải có trọng tâm, trọng điểm".</li><li>"Kiểm tra trên dữ liệu, giám sát trên dữ liệu"; "không có vùng cấm, không có ngoại lệ".</li></ul>`}
]});

DOCS.push({id:"quytrinh",group:"pro",short:"Quy trình xuất bản của NXB (dự thảo 11/2025) – tóm tắt",mmLabel:"Quy trình xuất bản nội bộ (dự thảo 11/2025)",so:"Dự thảo",
title:"Quy định về Quy trình xuất bản của NXB Chính trị quốc gia Sự thật (bản trình ký, sửa ngày 15/11/2025) – tóm tắt để ôn tập",
meta:[["Loại văn bản","Quy định nội bộ, ban hành kèm Quyết định của Giám đốc – Tổng Biên tập (bản trình ký, chưa ghi số, ngày)"],["Bố cục","6 chương, 35 điều"],["Phạm vi","Xuất bản, tái bản, in nối bản xuất bản phẩm; thực hiện trên phần mềm quy trình xuất bản điện tử"],["Đầu mối","Vụ Kế hoạch – Tài chính theo dõi, đôn đốc, làm các thủ tục"],["Hiệu lực (dự kiến)","Từ ngày ký; thay các quy định về quy trình xuất bản trước đây"],["Lưu ý","<b>Bản dự thảo, chưa chính thức.</b> Trang này chỉ tóm tắt để ôn, không đăng toàn văn"]],
tldr:`Dự thảo chia quy trình thành 4 phần: <b>kế hoạch đề tài</b> (lập từ tháng 8, gửi Ban Tuyên giáo và Dân vận Trung ương tháng 10 với sách Trung ương đặt hàng); <b>các công đoạn xuất bản</b> từ đặt in, đăng ký xuất bản, biên tập, duyệt cấp Ban, đọc kiểm tra, duyệt cấp Nhà xuất bản, chuẩn bị in, quyết định xuất bản, in, đọc sách mẫu, nộp lưu chiểu, quyết định phát hành đến thanh quyết toán; <b>quy trình gấp, tái bản, in nối bản</b>; và <b>trách nhiệm của từng đơn vị</b>. Mốc cần nhớ: biên tập viên biên tập bản thảo 200 trang trong tối đa <mark>10 ngày làm việc</mark>; Giám đốc – Tổng Biên tập ký duyệt in trong <mark>2 ngày làm việc</mark>; sách kỷ niệm ra trước ngày lễ ít nhất <mark>15 ngày</mark>; biên tập viên chưa có chứng chỉ hành nghề không được đứng tên biên tập.`,
sections:[
{h:"Bố cục 6 chương",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Chương</th><th>Nội dung</th></tr></thead><tbody>
<tr><td>I (Điều 1–4)</td><td>Quy định chung: mục đích, phạm vi, nguyên tắc, giải thích từ ngữ</td></tr>
<tr><td>II (Điều 5–7)</td><td>Công tác kế hoạch đề tài biên tập – xuất bản</td></tr>
<tr><td>III (Điều 8–18)</td><td>Các công đoạn của quy trình xuất bản</td></tr>
<tr><td>IV (Điều 19–21)</td><td>Quy trình xuất bản gấp, tái bản, in nối bản</td></tr>
<tr><td>V (Điều 22–33)</td><td>Quyền hạn, trách nhiệm của Giám đốc, các Phó Giám đốc, Hội đồng Biên tập – Xuất bản, đơn vị biên tập, các đơn vị chức năng, cơ sở in</td></tr>
<tr><td>VI (Điều 34–35)</td><td>Trách nhiệm thi hành, hiệu lực</td></tr>
</tbody></table></div>`},
{h:"Các loại sách theo nguồn kinh phí",items:[
"<b>Sách Trung ương đặt hàng</b>: cơ quan Trung ương giao chỉ tiêu, ngân sách theo kế hoạch hằng năm, phục vụ nhiệm vụ chính trị, công tác văn hóa – tư tưởng.",
"<b>Sách trợ giá</b>: Trung ương giao cho các ban Đảng Trung ương về đề tài, kinh phí; Nhà xuất bản phối hợp biên tập, xuất bản.",
"<b>Sách tự phát hành</b>: Nhà xuất bản khai thác từ cộng tác viên, dùng kinh phí của mình để biên tập, in, phát hành.",
"<b>Sách liên kết trọn gói</b>: đối tác chịu chi phí biên tập, in, phát hành. <b>Sách quản lý phí</b>: đối tác trả chi phí biên tập, duyệt, chế bản, đọc morát; đối tác tự in và phát hành.",
"Phân biệt: <b>tái bản</b> là xuất bản lại sách của các năm trước (có hoặc không sửa), hoặc sách trong năm có sửa chữa, bổ sung; <b>in nối bản</b> là in thêm sách xuất bản trong năm, không sửa chữa. <b>Sách mẫu</b> là sách đủ bìa, tay sách, phụ bản nhưng chưa gia công vào bìa."]},
{h:"Kế hoạch đề tài",items:[
"5 căn cứ đề xuất đề tài: chức năng, nhiệm vụ của Nhà xuất bản; chỉ đạo của Bộ Chính trị, Ban Bí thư; chương trình xây dựng pháp luật của Quốc hội, chương trình làm việc của Trung ương và Chính phủ; nhu cầu của các cấp, ngành và thị trường; các ngày lễ, kỷ niệm lớn.",
"<mark>Tháng 8</mark> hằng năm: Vụ Kế hoạch – Tài chính trình thông báo xây dựng kế hoạch đề tài năm sau (cả sách giấy và sách điện tử). Trong <mark>30 ngày</mark>, biên tập viên lập kế hoạch cá nhân, đơn vị tổng hợp; xử lý trùng lặp trong 10 ngày.",
"Hội đồng Biên tập – Xuất bản cho ý kiến; Giám đốc – Tổng Biên tập phê duyệt; gửi Ban Tuyên giáo và Dân vận Trung ương vào <mark>tháng 10</mark> (sách Trung ương đặt hàng).",
"Sách kỷ niệm ngày lễ lớn phải lên kế hoạch trước <mark>6 tháng đến 1 năm</mark>."]},
{h:"Chuỗi công đoạn một cuốn sách",html:`<ol>
<li><b>Tổng hợp số lượng đặt in</b> (sách tự phát hành: đơn vị phát hành đăng ký trong 2 ngày làm việc).</li>
<li><b>Đăng ký xuất bản</b>: sau khi có Chủ trương xuất bản; tổng hợp trình duyệt vào <b>thứ Sáu hằng tuần</b>; đợt cuối năm trước <b>15/11</b> (sách Trung ương đặt hàng) và <b>15/12</b> (sách khác).</li>
<li><b>Biên tập và duyệt cấp Ban</b>: biên tập viên đổ khổ, dàn trang, biên tập, viết Lời Nhà xuất bản, lập Phiếu duyệt bản thảo, viết Lời giới thiệu, dự thảo hợp đồng; lãnh đạo ban đọc duyệt.</li>
<li><b>Vụ Kế hoạch – Tài chính đọc kiểm tra</b> toàn bộ bản thảo, ghi lưu ý bằng bút chì, không tự sửa; ghi nhận xét vào Phiếu duyệt.</li>
<li><b>Phó Giám đốc – Phó Tổng Biên tập hoặc Ủy viên Hội đồng Biên tập – Xuất bản</b> phụ trách đơn vị đọc duyệt nội dung chính trị, khoa học.</li>
<li><b>Giám đốc – Tổng Biên tập ký duyệt in</b> và Chủ trương xuất bản.</li>
<li><b>Chuẩn bị in</b>: thiết kế, duyệt bìa; chế bản, đọc bông; duyệt giá; hợp đồng xuất bản, hợp đồng in.</li>
<li><b>Quyết định xuất bản/tái bản</b> (chỉ cấp một lần); tạo mã QR, mã vạch.</li>
<li><b>In</b>; <b>đọc sách mẫu</b> (đơn vị biên tập đọc nếu Trung tâm Xuất bản điện tử đã đọc bông, và ngược lại).</li>
<li><b>Nộp lưu chiểu</b>, nhập kho; <b>Quyết định phát hành</b> rồi mới được phân phối.</li>
<li><b>Thanh quyết toán</b>, trả nhuận bút.</li></ol>`},
{h:"Thời hạn cần nhớ (theo dự thảo)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Việc</th><th>Thời hạn</th></tr></thead><tbody>
<tr><td>Biên tập viên biên tập bản thảo 200 trang (khổ 14,5 x 20,5 cm)</td><td>Tối đa 10 ngày làm việc; bản thảo phức tạp tối đa 20</td></tr>
<tr><td>Lãnh đạo ban đọc duyệt</td><td>Tối đa 20 ngày (khó: 30); duyệt lại không quá ½ thời gian lần đầu</td></tr>
<tr><td>Vụ Kế hoạch – Tài chính đọc kiểm tra</td><td>200 trang: 2 ngày làm việc; 300: 3; 500: 5; trên 500: 8</td></tr>
<tr><td>Phó Giám đốc / Ủy viên Hội đồng đọc duyệt</td><td>Tối đa 10 ngày làm việc</td></tr>
<tr><td>Giám đốc – Tổng Biên tập ký duyệt in</td><td>Tối đa 2 ngày làm việc</td></tr>
<tr><td>Đã duyệt in 1 tháng mà chưa chuyển in</td><td>Phải báo cáo lý do, làm rõ trách nhiệm</td></tr>
<tr><td>Vẽ bìa</td><td>1 ngày; bìa khó 2–3 ngày</td></tr>
<tr><td>Chế bản 300 trang</td><td>Không có file: 7 ngày làm việc; có file: 2; thêm 1 ngày cho mỗi 100 trang</td></tr>
<tr><td>Đọc bông 300 trang</td><td>4 ngày (bản viết tay: 7)</td></tr>
<tr><td>In sách 400 trang</td><td>3 ngày; bìa cứng 7; chất lượng cao, sách ảnh, bìa vải 10</td></tr>
<tr><td>Đọc sách mẫu 200 trang</td><td>1 ngày; thêm ½ ngày cho mỗi 200 trang</td></tr>
<tr><td>Thanh toán nhuận bút cho đối tác</td><td>5 ngày làm việc từ khi có đề nghị được duyệt</td></tr>
<tr><td>Sách trọng tâm, sách kỷ niệm</td><td>Ra sách trước ngày kỷ niệm ít nhất 15 ngày</td></tr>
<tr><td>Sai sót không báo cáo</td><td>Sau 7 ngày: xem xét thi đua của đơn vị</td></tr>
</tbody></table></div>`},
{h:"Yêu cầu với bản thảo và hồ sơ trình duyệt",items:[
"Bản thảo trình duyệt cấp Ban phải bảo đảm: <b>nội dung chính trị, pháp lý</b> đúng quan điểm, đường lối của Đảng, pháp luật của Nhà nước và điều ước quốc tế; <b>nội dung khoa học</b> chính xác, cập nhật, có căn cứ, hệ thống, lôgíc, đúng ngữ pháp, trích dẫn chính xác và rõ nguồn; <b>hình thức</b> đúng quy định của Nhà xuất bản.",
"Hồ sơ trình duyệt cấp Nhà xuất bản: bản thảo có chữ ký biên tập viên và trưởng đơn vị ở trang bìa; Phiếu duyệt bản thảo; hợp đồng hoặc giấy chấp thuận sử dụng tác phẩm; Lời giới thiệu; nhận xét của hội đồng thẩm định hoặc chuyên gia (nếu có); bản quyền (sách liên quan bản quyền); bản khai thông tin tạo mã QR (sách Trung ương đặt hàng, liên kết trọn gói, quản lý phí).",
"Bản thảo văn bản luật, văn kiện của Đảng và Nhà nước: thời gian đọc duyệt phải rút ngắn theo yêu cầu của lãnh đạo."]},
{h:"Quy tắc biên tập viên phải nhớ",items:[
"Không tự ý sửa chữa, bổ sung bản thảo sau khi lãnh đạo ban đã duyệt; mọi sửa đổi sau khi duyệt in phải báo cáo bằng văn bản và được Giám đốc – Tổng Biên tập đồng ý.",
"<b>Biên tập viên tập sự và biên tập viên chưa có Chứng chỉ hành nghề biên tập không được đứng tên biên tập</b> của xuất bản phẩm.",
"Sách tái bản phải trao đổi, thỏa thuận với tác giả theo quy định pháp luật.",
"Chịu trách nhiệm trước thủ trưởng đơn vị và trước pháp luật về nội dung xuất bản phẩm mình biên tập; chủ động khai thác đề tài, bản thảo, thực hiện định mức.",
"Không phân phối xuất bản phẩm khi chưa có Quyết định phát hành.",
"Khi có sai sót phải báo cáo ngay để xử lý; gây thiệt hại thì phải xác định trách nhiệm, bồi thường."]},
{h:"Quy trình gấp, tái bản, in nối bản",items:[
"Sách gấp có 3 mức: <b>gấp, khẩn, thượng khẩn</b>; đơn vị biên tập lập tờ trình nêu mức độ, lý do, tiến độ; đăng ký xuất bản ngay trong ngày; ký duyệt in trong ngày; cấp mã sách, ISBN tối đa 2 giờ.",
"Khi xuất bản gấp, Vụ Kế hoạch – Tài chính ưu tiên đọc trước và chỉ chịu trách nhiệm về nội dung chính trị.",
"Tái bản thực hiện đủ các bước như xuất bản mới.",

title:"Nghị quyết 27-NQ/TW về tiếp tục xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam trong giai đoạn mới",
organ:"Ban Chấp hành Trung ương (Hội nghị Trung ương 6 khóa XIII); Tổng Bí thư Nguyễn Phú Trọng ký",date:"09/11/2022",
prev:["NQ 48-NQ/TW (2005)","NQ 49-NQ/TW (2005)"],next:["Kế hoạch của Bộ Chính trị","NQ 66-NQ/TW (2025)"],
origin:`<p>Hội nghị Trung ương 6 khóa XIII (3–9/10/2022) ban hành cùng lúc ba nghị quyết: 27 (Nhà nước pháp quyền), 28 (đổi mới phương thức lãnh đạo, cầm quyền của Đảng) và 29 (công nghiệp hóa, hiện đại hóa). Sau hơn 35 năm đổi mới, nghị quyết chỉ ra các hạn chế: quyền lực nhà nước chưa được kiểm soát hiệu quả, giám sát của Nhân dân chưa phát huy mạnh, ý thức chấp hành pháp luật chưa nghiêm, cải cách hành chính và tư pháp chưa đáp ứng yêu cầu.</p><p>Cùng lĩnh vực trước đó có Nghị quyết 48-NQ/TW (24/5/2005) về Chiến lược xây dựng và hoàn thiện hệ thống pháp luật và Nghị quyết 49-NQ/TW (2/6/2005) về Chiến lược cải cách tư pháp. <span class="muted">Toàn văn Nghị quyết 27 không ghi là thay thế hai văn bản này.</span></p>`,
nature:"Nghị quyết của Hội nghị Trung ương, tức là văn bản của toàn Ban Chấp hành Trung ương, ở tầm cao hơn nghị quyết của Bộ Chính trị.",
meaning:"Là nền tảng lý luận về Nhà nước pháp quyền cho giai đoạn đến 2030, tầm nhìn 2045. Văn kiện Đại hội XIV tiếp tục xác định xây dựng, hoàn thiện Nhà nước pháp quyền là nhiệm vụ trọng tâm.",
content:`<ul><li>Mục tiêu 2030: hoàn thiện cơ bản cơ chế bảo đảm quyền làm chủ của Nhân dân, quyền con người, quyền công dân; nền hành chính và tư pháp chuyên nghiệp, hiện đại.</li><li>Tầm nhìn 2045: nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa.</li><li>10 nhóm nhiệm vụ: hoàn thiện pháp luật; đổi mới Quốc hội; thiết chế Chủ tịch nước; nền tư pháp "chuyên nghiệp, hiện đại, công bằng, liêm chính"; kiểm soát quyền lực, phòng chống tham nhũng…</li></ul>`,
links:"Nghị quyết 66-NQ/TW (2025) cụ thể hóa nhóm nhiệm vụ hoàn thiện pháp luật; định hướng cải cách tư pháp của Đại hội XIV dựa trên cả Nghị quyết 27 và 66. Luật Viên chức 2025 và các nghị định năm 2026 nằm trong dòng hoàn thiện thể chế này.",
books:[["Tài liệu nghiên cứu các văn kiện Hội nghị lần thứ sáu Ban Chấp hành Trung ương Đảng khóa XIII (dùng cho cán bộ chủ chốt và báo cáo viên)","https://www.nxbctqg.org.vn/tai-lieu-nghien-cuu-cac-van-kien-hoi-nghi-lan-thu-sau-ban-chap-hanh-trung-uong-dang-khoa-xiii-dung-cho-can-bo-chu-chot-va-bao-cao-vien-.html","12/2022, Ban Tuyên giáo Trung ương và NXB biên soạn"],["Xây dựng, hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam: Giai đoạn mới, yêu cầu mới","https://www.nxbctqg.org.vn/xay-dung-hoan-thien-nha-nuoc-phap-quyen-xa-hoi-chu-nghia-viet-nam-giai-doan-moi-yeu-cau-moi.html","7/2024, 708 trang, 43 bài"]]},

{id:"g-nq57",kind:"party",so:"57-NQ/TW",docId:"nq57",
title:"Nghị quyết 57-NQ/TW về đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia",
organ:"Bộ Chính trị; Tổng Bí thư Tô Lâm ký",date:"22/12/2024",
prev:["NQ 20-NQ/TW (2012)","NQ 52-NQ/TW (2019)"],next:["NQ 193/2025/QH15","Chương trình hành động của Chính phủ"],
origin:`<p>Nghị quyết nêu các hạn chế: phát triển còn chậm, khoảng cách lớn với nước phát triển; chưa làm chủ công nghệ chiến lược, cốt lõi; thể chế chưa đáp ứng, thiếu nhân lực chất lượng cao; hạ tầng số hạn chế; an ninh mạng còn nhiều thách thức.</p><p class="muted">Cùng lĩnh vực trước đó có Nghị quyết 20-NQ/TW (2012) về khoa học, công nghệ và Nghị quyết 52-NQ/TW (2019) về Cách mạng công nghiệp lần thứ tư; toàn văn Nghị quyết 57 không nhắc hai văn bản này.</p>`,
nature:"Nghị quyết của Bộ Chính trị. Thành lập Ban Chỉ đạo Trung ương do Tổng Bí thư làm Trưởng ban.",
meaning:`Nghị quyết xác định đây là <b>"đột phá quan trọng hàng đầu"</b>; thể chế là "điều kiện tiên quyết, cần đi trước một bước"; dữ liệu là "tư liệu sản xuất chính". Tổng Bí thư Tô Lâm xếp Nghị quyết 57 vào <b>"bộ tứ trụ cột"</b> (57, 59, 66, 68) ngày 18/5/2025.`,
content:`<ul><li>Mục tiêu 2030: nhóm 3 nước dẫn đầu Đông Nam Á, nhóm 50 thế giới về năng lực cạnh tranh số và Chính phủ điện tử; kinh tế số tối thiểu <b>30% GDP</b>; chi nghiên cứu, phát triển <b>2% GDP</b>; ngân sách cho lĩnh vực ít nhất <b>3%</b> tổng chi; dịch vụ công trực tuyến trên 80%; phủ sóng 5G.</li><li>Tầm nhìn 2045: kinh tế số tối thiểu 50% GDP; nhóm 30 nước dẫn đầu.</li><li>7 nhóm nhiệm vụ, giải pháp.</li></ul>`,
links:`Quốc hội thể chế hóa bằng <b>Nghị quyết 193/2025/QH15</b> (19/2/2025) về thí điểm cơ chế đặc biệt (miễn trách nhiệm dân sự trong nghiên cứu, khoán chi đến sản phẩm cuối cùng…). Nghị quyết 59, 71, 72 đều có nhóm giải pháp về chuyển đổi số. Với Nhà xuất bản: chuyển đổi số xuất bản, sách điện tử, sách nói.`,
books:[["Hỏi – đáp về Nghị quyết số 57-NQ/TW (Ban Tuyên giáo và Dân vận Trung ương phối hợp với NXB biên soạn)","https://khodulieu.sohoa.tuyenquang.gov.vn/congthongtin/media/10a799a2391dc54712386c93bcdd4807.pdf","5/2025; bản PDF trên cổng tỉnh Tuyên Quang, chưa thấy trang sách trên website NXB"]]},

{id:"g-nq59",kind:"party",so:"59-NQ/TW",

origin:`<p>Xây dựng trên cơ sở Đề án tổng kết 10 năm thực hiện Nghị quyết 22-NQ/TW (10/4/2013) về hội nhập quốc tế. Tư duy hội nhập phát triển qua các kỳ Đại hội: Đại hội IX "hội nhập kinh tế quốc tế"; Đại hội XI hội nhập trên mọi lĩnh vực; Đại hội XIII "toàn diện, sâu rộng, có hiệu quả".</p>`,
nature:"Nghị quyết của Bộ Chính trị.",
meaning:`Tổng Bí thư gọi là "quyết sách đột phá", "bước ngoặt có tính lịch sử". Thuộc "bộ tứ trụ cột" (18/5/2025); ngày 16/9/2025 được gọi là "Nghị quyết trụ cột" cùng ba nghị quyết chuyên đề 70, 71, 72.`,
content:`<ul><li>6 quan điểm; "hội nhập kinh tế là trung tâm"; nội lực có vai trò quyết định; không tham gia liên minh của bên này chống bên kia.</li><li>Hai bước chuyển: từ "tiếp nhận sang đóng góp", từ "hội nhập sâu rộng sang hội nhập đầy đủ".</li><li>Không có chỉ tiêu định lượng.</li></ul>`,
links:"Chương trình hành động của Chính phủ: Nghị quyết 153/NQ-CP (31/5/2025). Quốc hội ban hành Nghị quyết 250/2025/QH15 (10/12/2025) về cơ chế đặc thù nâng cao hiệu quả hội nhập quốc tế.",
books:[["Bài phân tích Nghị quyết 59 trên Tạp chí Chính trị và Phát triển số 06/2025","https://vjol.info.vn/tcchinhtrivaphattrien/article/download/139687/114192/",""]]},

origin:`<p>Thủ tướng Phạm Minh Chính gọi thể chế, pháp luật là "điểm nghẽn lớn nhất". Mục tiêu đầu tiên của nghị quyết là đến 2025 cơ bản tháo gỡ các "điểm nghẽn". <span class="muted">Chưa thấy nguồn nêu văn bản mà Nghị quyết 66 thay thế; cùng lĩnh vực có Nghị quyết 48 (2005) và nhóm nhiệm vụ hoàn thiện pháp luật của Nghị quyết 27 (2022).</span></p>`,
nature:"Nghị quyết của Bộ Chính trị. Lập Ban Chỉ đạo Trung ương về hoàn thiện thể chế, pháp luật do Tổng Bí thư làm Trưởng ban.",
meaning:`Xây dựng pháp luật là <b>"đột phá của đột phá"</b>; Tổng Bí thư gọi nghị quyết là "lời hiệu triệu cho một cuộc cải cách thể chế sâu sắc"; từ bỏ tư duy "không quản được thì cấm"; coi pháp luật là "lợi thế cạnh tranh". Thuộc "bộ tứ trụ cột".`,
content:`<ul><li>Mốc: 2025 tháo gỡ điểm nghẽn; 2027 sửa xong luật cho mô hình chính quyền mới; 2028 môi trường đầu tư vào nhóm 3 ASEAN; 2030 hệ thống pháp luật dân chủ, công bằng, minh bạch, khả thi; 2045 chất lượng cao, hiện đại.</li><li>Kinh phí xây dựng pháp luật không dưới <b>0,5%</b> tổng chi ngân sách hằng năm.</li><li>7 nhiệm vụ, có ứng dụng trí tuệ nhân tạo và dữ liệu lớn.</li></ul>`,
links:"Thể chế hóa: Nghị quyết 197/2025/QH15 về cơ chế đặc biệt trong xây dựng và thi hành pháp luật; Chương trình hành động 140/NQ-CP. Nghị quyết 66 không \"hình sự hóa\" quan hệ kinh tế, dân sự, gắn với Nghị quyết 68. Đại hội XIV gọi thể chế là \"khâu đột phá chiến lược mang tính quyết định\".",
books:[["Tư liệu văn kiện: toàn văn Nghị quyết 66-NQ/TW","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-66-nqtw-ngay-3042025-cua-bo-chinh-tri-ve-doi-moi-cong-tac-xay-dung-va-thi-hanh-phap-luat-dap-ung-yeu-11561","dangcongsan.vn; chưa tìm thấy sách riêng của NXB"]]},

{id:"g-nq68",kind:"party",so:"68-NQ/TW",
title:"Nghị quyết 68-NQ/TW về phát triển kinh tế tư nhân",
organ:"Bộ Chính trị; Tổng Bí thư Tô Lâm ký",date:"04/5/2025",
prev:["NQ 10-NQ/TW (2017)"],next:["NQ 198/2025/QH15","NQ 138/NQ-CP","NQ 139/NQ-CP"],
origin:`<p>Mục tiêu của Nghị quyết 10-NQ/TW (2017) là 1,5 triệu doanh nghiệp và 55% GDP vào 2025 "vẫn chưa đạt được". Hạn chế: phần lớn doanh nghiệp siêu nhỏ, nhỏ và vừa; quyền tài sản, tự do kinh doanh chưa được bảo đảm đầy đủ; khó tiếp cận vốn, đất đai; chi phí kinh doanh cao.</p>`,
nature:"Nghị quyết của Bộ Chính trị.",
meaning:`Kinh tế tư nhân là <b>"một động lực quan trọng nhất"</b> của nền kinh tế; doanh nhân là "chiến sỹ trên mặt trận kinh tế". Thuộc "bộ tứ trụ cột".`,
content:`<ul><li>Mục tiêu 2030: <b>2 triệu doanh nghiệp</b> (20 doanh nghiệp/1.000 dân); đóng góp 55–58% GDP, 35–40% thu ngân sách; tăng trưởng 10–12%/năm.</li><li>Tầm nhìn 2045: ít nhất 3 triệu doanh nghiệp, trên 60% GDP.</li><li>8 nhóm giải pháp.</li></ul>`,
links:"Quốc hội ban hành Nghị quyết 198/2025/QH15 (hiệu lực 17/5/2025): thanh tra, kiểm tra tối đa 1 lần/năm; miễn thuế thu nhập doanh nghiệp 3 năm cho doanh nghiệp nhỏ và vừa; bỏ lệ phí môn bài từ 1/1/2026. Chính phủ: Nghị quyết 138/NQ-CP và 139/NQ-CP.",
books:[["Nghị quyết số 68-NQ/TW của Bộ Chính trị: Đột phá để phát triển kinh tế tư nhân – Hỏi và đáp (Nguyễn Thái Bình chủ biên, 97 câu hỏi)","https://nxbctqg.org.vn/lam-ro-tu-duy-dot-pha-phat-trien-kinh-te-tu-nhan-tu-nghi-quyet-so-68-nq-tw-213.html","bài giới thiệu trên website NXB, 26/5/2026"]]},

{id:"g-nq70",kind:"party",so:"70-NQ/TW",
title:"Nghị quyết 70-NQ/TW về bảo đảm an ninh năng lượng quốc gia đến năm 2030, tầm nhìn đến năm 2045",
organ:"Bộ Chính trị; Tổng Bí thư Tô Lâm ký",date:"20/8/2025",
prev:["NQ 55-NQ/TW (2020)"],next:["NQ 253/2025/QH15"],
origin:`<p>Nghị quyết đánh giá sau 5 năm thực hiện Nghị quyết 55-NQ/TW (2020): một số hạn chế "chưa được khắc phục triệt để", nhiều chỉ tiêu khó đạt; nguy cơ thiếu điện khi tăng trưởng hai con số. <span class="muted">Không ghi là thay thế Nghị quyết 55.</span></p>`,
nature:"Nghị quyết của Bộ Chính trị (nghị quyết chuyên đề).",
meaning:"Cùng Nghị quyết 71, 72 là ba nghị quyết chuyên đề, cùng Nghị quyết 59 họp thành \"bộ tứ\" được quán triệt ngày 16/9/2025.",
content:`<ul><li>2030: năng lượng tái tạo 25–30% tổng cung năng lượng sơ cấp; công suất nguồn điện 183–236 GW; dự trữ xăng dầu khoảng 90 ngày nhập ròng.</li><li>Áp dụng giá thị trường, không bù chéo; phát triển điện hạt nhân, điện khí, giảm dần điện than.</li></ul>`,
links:"Quốc hội ban hành Nghị quyết 253/2025/QH15 (11/12/2025) về cơ chế, chính sách phát triển năng lượng quốc gia 2026–2030.",
books:[]},

{id:"g-nq71",kind:"party",so:"71-NQ/TW",
title:"Nghị quyết 71-NQ/TW về đột phá phát triển giáo dục và đào tạo",
organ:"Bộ Chính trị; Tổng Bí thư Tô Lâm ký",date:"22/8/2025",
prev:["NQ 29-NQ/TW (2013)"],next:["NQ 248/2025/QH15","QĐ 131/QĐ-TTg (2026)","Luật Giáo dục sửa đổi"],
origin:`<p>Chuyển trọng tâm từ "đổi mới căn bản, toàn diện" của Nghị quyết 29-NQ/TW (2013) sang "đột phá chiến lược". Hạn chế: chênh lệch vùng miền; cơ sở vật chất, đội ngũ chưa đáp ứng; giáo dục đại học, nghề nghiệp còn manh mún.</p>`,
nature:"Nghị quyết của Bộ Chính trị (nghị quyết chuyên đề).",
meaning:`Giáo dục là "quốc sách hàng đầu"; phương châm "lấy chất lượng làm trục" (Tổng Bí thư, 16/9/2025).`,
content:`<ul><li>2030: phổ cập mầm non 3–5 tuổi; chi cho giáo dục ≥ 20% tổng chi ngân sách; ít nhất 8 trường đại học vào top 200 châu Á.</li><li>2045: nhóm 20 nước đứng đầu thế giới về giáo dục.</li></ul>`,
links:"Quốc hội: Nghị quyết 248/2025/QH15; Chính phủ: Quyết định 131/QĐ-TTg (19/1/2026); sửa Luật Giáo dục, Luật Giáo dục đại học, Luật Giáo dục nghề nghiệp.",
books:[]},

{id:"g-nq72",kind:"party",so:"72-NQ/TW",
title:"Nghị quyết 72-NQ/TW về một số giải pháp đột phá, tăng cường bảo vệ, chăm sóc và nâng cao sức khỏe nhân dân",
organ:"Bộ Chính trị",date:"09/9/2025",

nature:"Nghị quyết của Bộ Chính trị (nghị quyết chuyên đề).",

links:"Quốc hội: Nghị quyết 261/2025/QH15 (cơ chế đặc biệt), 262/2025/QH15 (Chương trình mục tiêu quốc gia); Luật Phòng bệnh (hiệu lực 1/7/2026).",

{id:"g-dh14",kind:"party",so:"Đại hội XIV",docId:"dh14",
title:"Văn kiện Đại hội đại biểu toàn quốc lần thứ XIV của Đảng và Chương trình hành động",
organ:"Đại hội XIV (Trung tâm Hội nghị quốc gia, Hà Nội)",date:"19–23/01/2026",
prev:["Văn kiện Đại hội XIII (2021)","9 nghị quyết chiến lược 2024–2025"],next:["Chỉ thị của Bộ Chính trị về học tập Nghị quyết","NQ 05-NQ/TW","NQ 25-NQ/TW","Chương trình, kế hoạch của cấp ủy (quý I/2026)"],
origin:`<p>Ngày 21/10/2025 công bố báo cáo về những vấn đề mới trong dự thảo văn kiện. Lần đầu tiên <b>ba báo cáo</b> (chính trị; kinh tế – xã hội; tổng kết xây dựng Đảng) được tích hợp thành một Báo cáo chính trị, và lần đầu tiên có <b>Chương trình hành động</b> đi kèm. Trước Đại hội, Đảng đã ban hành 9 nghị quyết chiến lược; báo chí mô tả đây là bước chuyển từ "nghị quyết định hướng" sang "nghị quyết hành động".</p>`,
nature:"Văn kiện của Đại hội, cơ quan lãnh đạo cao nhất của Đảng. Bộ sách Văn kiện gồm 10 văn kiện, trong đó có Báo cáo tổng kết 40 năm đổi mới và Báo cáo tổng kết 15 năm thi hành Điều lệ Đảng.",
meaning:"Chuyển từ tổng kết nhiệm kỳ sang thiết kế chiến lược phát triển dài hạn; là nền tảng của mọi nghị quyết, chỉ thị ban hành trong năm 2026.",
content:`<ul><li>Phương châm Đại hội: "Đoàn kết – Dân chủ – Kỷ cương – Đột phá – Phát triển".</li><li>Mục tiêu 2030: nước đang phát triển, công nghiệp hiện đại, thu nhập trung bình cao; tầm nhìn 2045: nước phát triển, thu nhập cao; tăng trưởng GDP từ 10%/năm.</li><li>Khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số là động lực chính; kinh tế tư nhân là "một động lực quan trọng nhất"; thể chế là "khâu đột phá chiến lược mang tính quyết định".</li></ul>`,
links:`Chỉ thị của Bộ Chính trị về nghiên cứu, học tập Nghị quyết (Nhà xuất bản đăng 25/01/2026) yêu cầu chuyển từ "học tập, quán triệt" sang "hiểu sâu, hành động đúng, làm đến cùng"; cấp ủy làm chương trình, kế hoạch trong quý I/2026. Sau Đại hội: Hội nghị Trung ương 2 ban hành Nghị quyết 05 (kiểm tra, giám sát); Bộ Chính trị ban hành Nghị quyết 25 (công tác tư tưởng).`,
books:[["Văn kiện Đại hội đại biểu toàn quốc lần thứ XIV (trọn bộ 2 tập)","https://nxbctqg.org.vn/van-kien-dai-hoi-dai-bieu-toan-quoc-lan-thu-xiv-tron-bo-2-tap--44.html","3/2026, phối hợp Văn phòng Trung ương Đảng (trang sách ghi 832 trang; báo ghi 823)"],["Những nội dung cơ bản trong Văn kiện Đại hội XIV của Đảng – Hỏi và đáp","https://nxbctqg.org.vn/nhung-noi-dung-co-ban-trong-van-kien-dai-hoi-dai-bieu-toan-quoc-lan-thu-xiv-cua-dang-hoi-va-dap.html","6/2026, TS Ngô Đông Hải, PGS.TS Vũ Trọng Lâm đồng chủ biên"],["Tài liệu bồi dưỡng nhận thức về Đảng (lần thứ 24, theo Văn kiện XIV)","https://nxbctqg.org.vn/tai-lieu-boi-duong-nhan-thuc-ve-dang-xuat-ban-lan-thu-24-co-sua-chua-bo-sung-theo-van-kien-dai-hoi-lan-thu-xiv-cua-dang-.html",""],["Chỉ thị của Bộ Chính trị về nghiên cứu, học tập Nghị quyết Đại hội XIV (tin trên website NXB)","https://nxbctqg.org.vn/chi-thi-cua-bo-chinh-tri-ve-nghien-cuu-hoc-tap-quan-triet-tuyen-truyen-va-trien-khai-thuc-hien-nghi-quyet-dai-hoi-dai-bieu-toan-quoc-lan-thu-xiv-cua-dang.html",""],["Chuyên mục Đại hội XIV trên website NXB","https://nxbctqg.org.vn/dai-hoi-dai-bieu-toan-quoc-lan-thu-xiv-cua-dang.html",""]]},

{id:"g-ct04",kind:"party",so:"04-CT/TW",docId:"ct04",
title:"Chỉ thị 04-CT/TW về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới",
organ:"Ban Bí thư; đồng chí Trần Cẩm Tú, Thường trực Ban Bí thư, ký",date:"17/3/2026",
prev:["CT 42-CT/TW (25/8/2004)","CT 44-CT/TW (16/4/2020)"],next:["HD 22-HD/BTGDVTW (28/5/2026)","Luật 17/2026/QH16"],
origin:`<p>Chỉ thị 42-CT/TW (25/8/2004) về nâng cao chất lượng toàn diện hoạt động xuất bản đã "tạo nền tảng quan trọng" (Cục trưởng Nguyễn Nguyên); Hội nghị tổng kết 20 năm Chỉ thị 42 họp ngày 26/8/2025. Chỉ thị 44-CT/TW (16/4/2020) của Ban Bí thư về sách lý luận, chính trị được Nhà xuất bản sơ kết 5 năm tại hội thảo ngày 28/11/2025. <span class="muted">Chưa thấy nguồn ghi Chỉ thị 04 "thay thế" Chỉ thị 42; toàn văn Chỉ thị 04 do Nhà xuất bản đăng không nhắc Chỉ thị 42.</span></p>`,
nature:"Chỉ thị của Ban Bí thư: văn bản lãnh đạo, chỉ đạo thực hiện một lĩnh vực; Ban Tuyên giáo và Dân vận Trung ương ra hướng dẫn thực hiện.",
meaning:"Khẳng định xuất bản vừa là lĩnh vực văn hóa – tư tưởng, vừa là ngành kinh tế – công nghệ, công nghiệp sáng tạo; vai trò Nhà nước chuyển từ quản lý ngành sang kiến tạo hệ sinh thái. Là văn bản trực tiếp nhất với công việc biên tập viên.",
content:`<ul><li>Đến 2030: <b>100%</b> nhà xuất bản tham gia xuất bản điện tử; 80% cơ sở in dùng công nghệ hiện đại; có tập đoàn xuất bản – truyền thông. Đến 2045: trung tâm hàng đầu Đông Nam Á.</li><li>Hoàn thiện pháp luật, nhất là bản quyền trong môi trường số và trí tuệ nhân tạo; bảo vệ biên tập viên trước vu khống, tấn công mạng; nền tảng dữ liệu xuất bản quốc gia; chống in lậu; phát triển văn hóa đọc.</li><li>Phân công: Đảng ủy Quốc hội hoàn thiện pháp luật xuất bản; Bộ Giáo dục và Đào tạo đưa tiết đọc sách vào trường.</li></ul>`,
links:"Hướng dẫn 22-HD/BTGDVTW (28/5/2026) của Ban Tuyên giáo và Dân vận Trung ương. Thực hiện gắn với Nghị quyết Đại hội XIV, Nghị quyết 57 và Nghị quyết 80-NQ/TW (7/1/2026). Luật 17/2026/QH16 sửa Luật Xuất bản được thông qua ngày 24/8/2026, sau khi chỉ thị giao hoàn thiện pháp luật (báo chí không nêu trực tiếp quan hệ này).",
books:[["Toàn văn Chỉ thị 04-CT/TW (website NXB, 27/3/2026)","https://nxbctqg.org.vn/tang-cuong-su-lanh-dao-cua-dang-doi-voi-hoat-dong-xuat-ban-trong-tinh-hinh-moi.html",""],["Biên tập viên phải coi chất lượng sách là danh dự nghề nghiệp (Phạm Thị Thinh)","https://nxbctqg.org.vn/bien-tap-vien-phai-coi-chat-luong-sach-la-danh-du-nghe-nghiep-61.html","29/6/2026"],["Cần siết chặt lại tất cả các khâu trong quy trình xuất bản sách (Nguyễn Thái Bình)","https://nxbctqg.org.vn/can-siet-chat-lai-tat-ca-cac-khau-trong-quy-trinh-xuat-ban-sach.html","29/6/2026"],["Vũ Trọng Lâm: Xuất bản sách lý luận, chính trị, góp phần xây dựng Đảng về chính trị, tư tưởng, đạo đức trong giai đoạn mới","https://vjol.info.vn/tcchinhtrivaphattrien/article/view/168617","TC Chính trị và Phát triển số 03/2024"]]},

{id:"g-ct05",kind:"party",so:"05-CT/TW",docId:"ct05",

content:`<ul><li>10 nhóm nhiệm vụ: Đảng lãnh đạo trực tiếp, toàn diện; hoàn thiện quy định và pháp luật; hệ thống báo chí tinh gọn, hiện đại.</li><li>Chuyển đổi số: tòa soạn hội tụ, trí tuệ nhân tạo, dữ liệu lớn; kỷ luật thông tin, không để khoảng trống thông tin.</li><li>Quản lý nền tảng xuyên biên giới; hướng dẫn người dân dùng Internet an toàn, nhận diện deepfake.</li></ul>`,
links:"Hướng dẫn 21-HD/BTGDVTW (28/5/2026). Luật Báo chí 126/2025/QH15 (thông qua 10/12/2025, hiệu lực 1/7/2026) thay Luật Báo chí 2016. Nghị quyết 25-NQ/TW (8/2026) bao trùm cả phạm vi của Chỉ thị 04 và 05.",

nature:"Nghị quyết của Bộ Chính trị; Ban Bí thư ban hành Kế hoạch 08-KH/TW cùng ngày. Trưởng Ban Tuyên giáo và Dân vận Trung ương Trịnh Văn Quyết trình bày tại hội nghị quán triệt 3/9/2026.",
meaning:`"Lần đầu tiên công tác tư tưởng của Đảng được xác lập ở tầm chiến lược tổng thể" (Vietnam+).`,
content:`<ul><li>Chuyển từ "quản lý thông tin" sang "dẫn dắt nhận thức xã hội"; phương châm "Chủ động – Sắc bén – Thuyết phục – Hiệu quả".</li><li>Đến 2030: giảm ít nhất 70% thông tin xấu độc so với năm 2026; 100% cấp xã có cán bộ chuyên trách công tác tư tưởng.</li><li>8 nhóm nhiệm vụ, 3 đột phá; nguyên tắc "6 rõ"; sơ kết 2028, tổng kết trước Đại hội XV.</li></ul>`,
links:"Bao trùm phạm vi của Chỉ thị 04 (xuất bản) và Chỉ thị 05 (báo chí). Với Nhà xuất bản: sách bảo vệ nền tảng tư tưởng, Tủ sách Bảo vệ nền tảng tư tưởng Đảng.",

{id:"g-luatvc",kind:"state",so:"129/2025/QH15",docId:"luatvc",
title:"Luật Viên chức số 129/2025/QH15 và các nghị định hướng dẫn năm 2026",
organ:"Quốc hội khóa XV, Kỳ họp thứ 10; Chủ tịch Quốc hội Trần Thanh Mẫn ký",date:"Thông qua 10/12/2025; hiệu lực 01/7/2026",
prev:["Luật Viên chức 58/2010/QH12","Luật sửa đổi 52/2019/QH14"],next:["NĐ 259/2026 (tuyển dụng)","NĐ 233/2026 (đánh giá)","NĐ 234/2026 (kỷ luật)","NĐ 299/2026 (đơn vị sự nghiệp)"],
origin:`<p>Bộ Nội vụ chủ trì soạn thảo; Chính phủ thông qua dự án bằng Nghị quyết 279/NQ-CP (15/9/2025); Ủy ban Thường vụ Quốc hội cho ý kiến 29/9/2025; Quốc hội nghe tờ trình 22/10/2025; thông qua 10/12/2025 với 437/442 đại biểu tán thành. Báo cáo thẩm tra dẫn Kết luận 121-KL/TW (2025, sắp xếp bộ máy), Nghị quyết 27-NQ/TW ngày 21/5/2018 (cải cách tiền lương theo vị trí việc làm), Nghị quyết 57 và Kết luận 91-KL/TW.</p>`,
nature:"Luật của Quốc hội (văn bản quy phạm pháp luật có hiệu lực cao sau Hiến pháp); Chính phủ ban hành nghị định để hướng dẫn.",
meaning:"Chuyển quản lý viên chức từ \"chức danh nghề nghiệp\" sang \"vị trí việc làm\"; mở rộng quyền của viên chức (góp vốn, quản lý doanh nghiệp khi không xung đột lợi ích).",
content:`<ul><li>Ba nhóm vị trí: quản lý; chuyên môn nghiệp vụ; hỗ trợ. Bỏ thi, xét thăng hạng chức danh nghề nghiệp.</li><li>Tuyển dụng bằng thi tuyển hoặc xét tuyển; ba loại quan hệ: hợp đồng làm việc, hợp đồng lao động, hợp đồng dịch vụ.</li><li>Điều 10 cấm phát tán thông tin sai lệch; Điều 25 thêm tiêu chí đổi mới, sáng tạo; thời hiệu kỷ luật 5 năm (khiển trách), 10 năm (hành vi khác).</li><li>Hoàn thành bố trí vị trí việc làm, xếp lương trước 01/7/2027.</li></ul>`,
links:`Nghị định 259 thay 115/2020 (và 85/2023); 233 thay 90/2020; 234 thay 112/2020; 299 về đơn vị sự nghiệp (hiệu lực 28/7/2026). <b>Dễ nhầm:</b> "Nghị quyết 27-NQ/TW" năm 2018 (cải cách tiền lương, khóa XII) khác hẳn Nghị quyết 27-NQ/TW năm 2022 (Nhà nước pháp quyền, khóa XIII), vì số hiệu văn bản Đảng đánh lại từ đầu mỗi khóa.`,
books:[["Pháp luật về cán bộ, công chức: Thực trạng và định hướng hoàn thiện đáp ứng yêu cầu quản trị quốc gia","https://nxbctqg.org.vn/phap-luat-ve-can-bo-cong-chuc-thuc-trang-va-dinh-huong-hoan-thien-dap-ung-yeu-cau-quan-tri-quoc-gia.html","sách liên quan; chưa thấy sách riêng về Luật Viên chức 2025"]]},

/* ===== Hệ thống văn bản của Đảng và Nhà nước, thể chế hóa (tra cứu 22/10/2026) ===== */
GUIDE.intro=`Tab này giúp hiểu văn bản như một hệ thống: văn bản nào của Đảng, văn bản nào của Nhà nước, ai ban hành, văn bản nào cụ thể hóa văn bản nào. Mỗi hồ sơ trả lời 5 câu hỏi: <b>ra đời thế nào, bản chất là gì, ý nghĩa ra sao, nội dung cốt lõi, liên hệ với văn bản khác</b>, kèm sách và bài của Nhà xuất bản Chính trị quốc gia Sự thật. Khung 5 câu hỏi này là cách tự học do sổ tay đề xuất, không phải khung chính thức.`;

GUIDE.system=[
{eyebrow:"Văn bản của Đảng",h:"Quy định 399-QĐ/TW (09/01/2026): 25 thể loại",html:`<p><b>Quy định 399-QĐ/TW</b> của Ban Bí thư (đồng chí Trần Cẩm Tú ký, hiệu lực từ ngày ký) thay <b>Quy định 66-QĐ/TW (06/02/2017)</b> và <b>Quyết định 223-QĐ/TW (06/3/2020)</b>. Bố cục 5 phần, 19 điều.</p>
<ul><li><b>Điều 5:</b> 25 thể loại, như cương lĩnh, điều lệ, chiến lược, <b>nghị quyết, quyết định, chỉ thị, kết luận</b>, quy chế, quy định, thông tri, hướng dẫn, thông báo, báo cáo, kế hoạch, chương trình, đề án, tờ trình, công văn, biên bản.</li><li><b>Điều 6:</b> 8 loại giấy tờ hành chính (giấy giới thiệu, giấy mời, thư công…).</li><li><b>Điều 8–13:</b> thẩm quyền theo cấp: Trung ương (Đại hội, Ban Chấp hành Trung ương, Bộ Chính trị, Ban Bí thư), tỉnh, xã, chi bộ, cơ quan tham mưu.</li><li><b>Hướng dẫn 05-HD/VPTW (27/5/2026)</b> của Văn phòng Trung ương về thể thức, kỹ thuật trình bày thay Hướng dẫn 36-HD/VPTW (2018).</li></ul>`},
{eyebrow:"Văn bản quy phạm pháp luật",h:"Luật 64/2025/QH15, sửa bởi Luật 87/2025/QH15: 15 loại",html:`<p>Luật Ban hành văn bản quy phạm pháp luật số <b>64/2025/QH15</b> (thông qua 19/02/2025, hiệu lực 01/4/2025; 9 chương, 72 điều), sửa bởi Luật <b>87/2025/QH15</b> (25/6/2025, hiệu lực 01/7/2025) khi bỏ cấp huyện.</p>
<ul><li>Quốc hội: Hiến pháp, bộ luật, luật, nghị quyết. Ủy ban Thường vụ Quốc hội: pháp lệnh, nghị quyết.</li><li>Chủ tịch nước: lệnh, quyết định. Chính phủ: nghị định, nghị quyết. Thủ tướng: quyết định. Bộ trưởng và tương đương: thông tư.</li><li>Địa phương: nghị quyết Hội đồng nhân dân, quyết định Ủy ban nhân dân cấp tỉnh và cấp xã; quyết định Chủ tịch Ủy ban nhân dân tỉnh (mới).</li><li>Điều 58: văn bản mâu thuẫn thì áp dụng văn bản có <b>hiệu lực cao hơn</b>; cùng cơ quan thì áp dụng <b>văn bản ban hành sau</b>.</li></ul>`},
{eyebrow:"Đảng lãnh đạo, Nhà nước thể chế hóa",h:"Từ nghị quyết của Đảng đến luật, nghị định",html:`<p>Hiến pháp 2013, Điều 4: Đảng là "lực lượng lãnh đạo Nhà nước và xã hội"; tổ chức đảng và đảng viên "hoạt động trong khuôn khổ Hiến pháp và pháp luật". Cương lĩnh 2011: "Đảng lãnh đạo bằng cương lĩnh, chiến lược, các định hướng về chính sách và chủ trương lớn".</p>
<p>Văn bản của Đảng <b>không phải văn bản quy phạm pháp luật</b> (không có trong Điều 4 Luật 64/2025). Muốn thành quy tắc bắt buộc với mọi người, chủ trương phải được <b>thể chế hóa</b>: Quốc hội làm luật, Chính phủ ra nghị định, bộ ra thông tư, địa phương lập kế hoạch.</p>
<p class="muted">Ví dụ có thật: NQ 66-NQ/TW (30/4/2025) → KH 04-KH/BCĐTW (10/6/2025) → NQ 140/NQ-CP (chương trình hành động của Chính phủ) → NQ 206/2025/QH15 (24/6/2025) → QĐ 1785/QĐ-TTg (kế hoạch thi hành).</p>`},
{eyebrow:"Đọc số, ký hiệu",h:"Vì sao cùng số mà khác văn bản",html:`<ul><li>Văn bản của Ban Chấp hành Trung ương, Bộ Chính trị, Ban Bí thư đều ghi cơ quan là <b>Ban Chấp hành Trung ương</b>, nên cùng ký hiệu <b>/TW</b>.</li><li>Số đánh liên tục từ 01 <b>cho mỗi thể loại trong một nhiệm kỳ</b>; sang khóa mới đánh lại. Vì vậy có hai "Hướng dẫn 01-HD/TW" (khóa XIII: 28/9/2021; khóa XIV: 19/5/2026), hai "Quyết định 223-QĐ/TW", hai "Nghị quyết 27-NQ/TW".</li><li>Phân biệt nghị quyết của Ban Chấp hành Trung ương (thông qua tại hội nghị Trung ương) với nghị quyết của Bộ Chính trị: xem trích yếu và khối chữ ký "T/M Bộ Chính trị".</li><li><b>Quy tắc của biên tập viên:</b> luôn ghi đủ thể loại + số, ký hiệu + ngày + cơ quan ban hành.</li></ul>`}
];

GUIDE.howto=`<ol>
<li><b>Ra đời:</b> số, ký hiệu, ngày, cơ quan, hội nghị nào, khóa nào; phần "tình hình" nói văn bản giải quyết vấn đề gì; văn bản trước đó cùng lĩnh vực.</li>
<li><b>Bản chất:</b> thể loại gì (nghị quyết, chỉ thị, kết luận, quy định…), cấp nào ban hành; là văn bản của Đảng hay văn bản quy phạm pháp luật.</li>
<li><b>Nội dung:</b> đọc theo cấu trúc quan điểm → mục tiêu (các mốc năm, chỉ tiêu số) → nhiệm vụ, giải pháp → tổ chức thực hiện. Chọn 3 điểm mới.</li>
<li><b>Ý nghĩa:</b> câu đánh giá ngắn của nguồn chính thống ("lần đầu tiên…", "đột phá…").</li>
<li><b>Mối liên hệ:</b> kế hoạch của Bộ Chính trị, Ban Bí thư; chương trình hành động của Chính phủ; luật, nghị quyết của Quốc hội; hướng dẫn học tập của Ban Tuyên giáo và Dân vận Trung ương.</li>
<li><b>Liên hệ nghề:</b> Nhà xuất bản xuất bản sách gì để tuyên truyền văn bản đó (tài liệu học tập, hỏi – đáp, sách chuyên khảo).</li>
</ol>
<p class="muted">Kế hoạch 42-KH/BTGDVTW (31/3/2026) yêu cầu khi học nghị quyết phải nắm "nội dung cốt lõi" và "điểm mới", rồi cụ thể hóa thành chương trình, kế hoạch hành động.</p>`;

{h:"25 thể loại văn bản của Đảng",html:`<p>Cương lĩnh chính trị; Điều lệ Đảng; Chiến lược; <b>Nghị quyết</b> (NQ); <b>Quyết định</b> (QĐ); <b>Chỉ thị</b> (CT); <b>Kết luận</b> (KL); Quy chế (QC); <b>Quy định</b> (QĐ); Thông tri (TT); Hướng dẫn (HD); Thông báo (TB); Thông cáo; Tuyên bố; Lời kêu gọi; Báo cáo (BC); Kế hoạch (KH); Quy hoạch; Chương trình (CTr); Đề án; Phương án; Dự án; Tờ trình (TTr); Công văn (CV); Biên bản.</p>
<ul><li><b>Nghị quyết:</b> ghi các quyết định được thông qua tại đại hội, hội nghị. <b>Chỉ thị:</b> chỉ đạo cấp dưới thực hiện. <b>Kết luận:</b> ý kiến chính thức về một vấn đề. <b>Quy định:</b> nguyên tắc, tiêu chuẩn, chế độ cho một lĩnh vực. <b>Hướng dẫn:</b> chỉ dẫn cách thực hiện văn bản cấp trên.</li><li>Quyết định và Quy định cùng viết tắt <b>QĐ</b>: phải đọc trích yếu mới biết là loại nào.</li></ul>
<p class="muted">Định nghĩa từng thể loại lấy theo Quy định 66 cũ; chưa đối chiếu được nguyên văn Quy định 399 (bản PDF là ảnh quét).</p>`},
{h:"Thẩm quyền và số, ký hiệu",items:[
"Cấp Trung ương có 4 chủ thể ban hành: <b>Đại hội đại biểu toàn quốc, Ban Chấp hành Trung ương, Bộ Chính trị, Ban Bí thư</b> (Điều 8 Quy định 399).",
"Văn bản của 3 cơ quan Ban Chấp hành Trung ương, Bộ Chính trị, Ban Bí thư đều ghi tên cơ quan là Ban Chấp hành Trung ương, ký hiệu <b>/TW</b>.",
"Số của cấp ủy đánh liên tục từ 01 <b>cho mỗi thể loại trong một nhiệm kỳ</b>; văn bản của đại hội đánh số chung cho mọi thể loại. Văn bản mật dùng chung dãy số với văn bản thường.",
"Cách viết: số Ả-rập, dưới 10 thêm số 0; gạch nối giữa số và ký hiệu (05-CT/TW); gạch chéo giữa tên loại và cơ quan.",
"Nghị quyết của Ban Chấp hành Trung ương được thông qua tại hội nghị Trung ương (ví dụ NQ 27-NQ/TW, Trung ương 6 khóa XIII); nghị quyết của Bộ Chính trị do Tổng Bí thư ký thay mặt Bộ Chính trị (ví dụ NQ 66-NQ/TW)."
]},
{h:"15 loại văn bản quy phạm pháp luật (Điều 4, sau sửa đổi)",html:`<div class="tablewrap"><table class="nums"><thead><tr><th>Cơ quan</th><th>Văn bản</th></tr></thead><tbody>
<tr><td>Quốc hội</td><td>Hiến pháp; bộ luật, luật, nghị quyết</td></tr>
<tr><td>Ủy ban Thường vụ Quốc hội</td><td>Pháp lệnh, nghị quyết; nghị quyết liên tịch với Đoàn Chủ tịch Ủy ban Trung ương Mặt trận</td></tr>
<tr><td>Chủ tịch nước</td><td>Lệnh, quyết định</td></tr>
<tr><td>Chính phủ</td><td>Nghị định, nghị quyết; nghị quyết liên tịch với Mặt trận</td></tr>
<tr><td>Thủ tướng Chính phủ</td><td>Quyết định</td></tr>
<tr><td>Hội đồng Thẩm phán Tòa án nhân dân tối cao</td><td>Nghị quyết</td></tr>
<tr><td>Chánh án, Viện trưởng, Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Tổng Kiểm toán nhà nước</td><td>Thông tư; thông tư liên tịch</td></tr>
<tr><td>Cấp tỉnh</td><td>Nghị quyết Hội đồng nhân dân; quyết định Ủy ban nhân dân; quyết định Chủ tịch Ủy ban nhân dân (mới)</td></tr>
<tr><td>Đơn vị hành chính – kinh tế đặc biệt</td><td>Văn bản của chính quyền địa phương ở đó</td></tr>
<tr><td>Cấp xã</td><td>Nghị quyết Hội đồng nhân dân; quyết định Ủy ban nhân dân (mới)</td></tr>
</tbody></table></div><p>Hiến pháp có hiệu lực pháp lý cao nhất. Điều 58: văn bản mâu thuẫn thì áp dụng văn bản có hiệu lực cao hơn; cùng một cơ quan thì áp dụng văn bản ban hành sau.</p>`},
{h:"Đảng lãnh đạo, Nhà nước thể chế hóa",items:[
"Hiến pháp 2013, Điều 4: Đảng là \"lực lượng lãnh đạo Nhà nước và xã hội\", \"chịu trách nhiệm trước Nhân dân về những quyết định của mình\"; tổ chức đảng, đảng viên \"hoạt động trong khuôn khổ Hiến pháp và pháp luật\".",
"Cương lĩnh 2011: \"Đảng lãnh đạo bằng cương lĩnh, chiến lược, các định hướng về chính sách và chủ trương lớn\" (Cương lĩnh 1991 viết \"chủ trương công tác\").",
"Tổng Bí thư Tô Lâm (21/10/2024): \"Đảng lãnh đạo bằng đường lối, chính sách; lãnh đạo thể chế hóa đường lối, chính sách thành pháp luật\".",
"Nghị quyết 66-NQ/TW yêu cầu \"thể chế hóa đầy đủ, đúng đắn, kịp thời chủ trương, đường lối của Đảng\"; giao Đảng ủy Quốc hội, Đảng ủy Chính phủ thực hiện.",
"Ví dụ chuỗi: NQ 66-NQ/TW (30/4/2025) → KH 04-KH/BCĐTW (10/6/2025) → NQ 140/NQ-CP → NQ 206/2025/QH15 (24/6/2025) → QĐ 1785/QĐ-TTg.",
"Quy định 178-QĐ/TW (27/6/2024) của Bộ Chính trị về kiểm soát quyền lực, chống tham nhũng, tiêu cực trong công tác xây dựng pháp luật."
]},
{h:"Áp dụng khi biên tập",items:[
"Ghi đủ: <b>thể loại + số, ký hiệu + ngày + cơ quan ban hành + trích yếu</b>. Ví dụ: Chỉ thị số 04-CT/TW ngày 17/3/2026 của Ban Bí thư về tăng cường sự lãnh đạo của Đảng đối với hoạt động xuất bản trong tình hình mới.",
"Không gọi văn bản ký hiệu QĐ là \"nghị quyết\"; không gọi chỉ thị của Ban Bí thư là \"chỉ thị của Bộ Chính trị\".",
"Kiểm tra văn bản còn hiệu lực hay đã bị thay (Quy định 66 → 399; Quy định 37 → 207…).",
"Khi gặp số trùng (01-HD/TW, 223-QĐ/TW, 27-NQ/TW), đối chiếu ngày và khóa."
]}
],

CONFUSE.push(
{doc:"hethongvb",a:"Quyết định 223-QĐ/TW bị Quy định 399 thay là văn bản về Nhà xuất bản Chính trị quốc gia Sự thật.",b:"Không. Có <b>hai</b> văn bản 223-QĐ/TW: <b>ngày 06/3/2020</b> bổ sung thẩm quyền ban hành văn bản của Ban Bí thư (bị Quy định 399 thay); <b>ngày 28/12/2024</b> của Bộ Chính trị về chức năng, nhiệm vụ của Nhà xuất bản (vẫn hiện hành).",tip:"Số văn bản của Đảng đánh lại mỗi khóa: luôn nhớ số kèm ngày."},
{doc:"hethongvb",a:"Quy định 66-QĐ/TW (2017) vẫn là văn bản về thể loại, thể thức văn bản của Đảng.",b:"Đã bị thay bởi <b>Quy định 399-QĐ/TW ngày 09/01/2026</b>. Hướng dẫn 36-HD/VPTW cũng đã bị thay bởi <b>Hướng dẫn 05-HD/VPTW ngày 27/5/2026</b>.",tip:"66 → 399; 36 → 05."},
{doc:"hethongvb",a:"Ký hiệu /TW nghĩa là văn bản của Ban Chấp hành Trung ương (hội nghị Trung ương).",b:"Không hẳn. Văn bản của <b>Ban Chấp hành Trung ương, Bộ Chính trị và Ban Bí thư</b> đều ghi /TW. Phải xem trích yếu và khối chữ ký (\"T/M Bộ Chính trị\", \"T/M Ban Bí thư\").",tip:"NQ 27-NQ/TW (2022): Trung ương; NQ 66-NQ/TW (2025): Bộ Chính trị."},
{doc:"hethongvb",a:"Nghị quyết của Đảng là văn bản quy phạm pháp luật.",b:"Không. Điều 4 Luật 64/2025 không có văn bản của Đảng. Chủ trương của Đảng được <b>thể chế hóa</b> thành luật, nghị quyết của Quốc hội, nghị định của Chính phủ…",tip:"Đảng lãnh đạo → Nhà nước thể chế hóa, quản lý."},
{doc:"hethongvb",a:"Cương lĩnh 2011 viết \"Đảng lãnh đạo bằng… chủ trương công tác\".",b:"\"Chủ trương công tác\" là chữ của <b>Cương lĩnh 1991</b>. Cương lĩnh 2011: \"cương lĩnh, chiến lược, các định hướng về chính sách và <b>chủ trương lớn</b>\".",tip:"1991: công tác; 2011: lớn."}
);

FLASH.push(
{doc:"hethongvb",q:"Văn bản hiện hành quy định thể loại, thẩm quyền ban hành và thể thức văn bản của Đảng?",a:"<b>Quy định 399-QĐ/TW ngày 09/01/2026</b> của Ban Bí thư, thay Quy định 66-QĐ/TW (2017) và Quyết định 223-QĐ/TW (2020)."},
{doc:"hethongvb",q:"Văn bản hướng dẫn thể thức, kỹ thuật trình bày văn bản của Đảng hiện hành?",a:"<b>Hướng dẫn 05-HD/VPTW ngày 27/5/2026</b> của Văn phòng Trung ương Đảng, thay Hướng dẫn 36-HD/VPTW (2018)."},
{doc:"hethongvb",q:"Bốn chủ thể ban hành văn bản của Đảng ở cấp Trung ương?",a:"Đại hội đại biểu toàn quốc, Ban Chấp hành Trung ương, Bộ Chính trị, Ban Bí thư."},
{doc:"hethongvb",q:"Số văn bản của cấp ủy được đánh thế nào?",a:"Liên tục từ 01 <b>cho mỗi thể loại trong một nhiệm kỳ cấp ủy</b>; sang nhiệm kỳ mới đánh lại. Văn bản của đại hội đánh số chung cho mọi thể loại."},
{doc:"hethongvb",q:"Luật Ban hành văn bản quy phạm pháp luật hiện hành?",a:"<b>Luật 64/2025/QH15</b> (19/02/2025, hiệu lực 01/4/2025), sửa bởi <b>Luật 87/2025/QH15</b> (25/6/2025, hiệu lực 01/7/2025)."},
{doc:"hethongvb",q:"Văn bản quy phạm pháp luật mâu thuẫn nhau thì áp dụng văn bản nào?",a:"Văn bản có <b>hiệu lực pháp lý cao hơn</b>; nếu cùng một cơ quan ban hành thì áp dụng <b>văn bản ban hành sau</b> (Điều 58 Luật 64/2025)."},
{doc:"hethongvb",q:"\"Thể chế hóa\" chủ trương của Đảng là gì? Ví dụ?",a:"Nhà nước chuyển chủ trương của Đảng thành pháp luật, chính sách bắt buộc thi hành. Ví dụ: NQ 66-NQ/TW → NQ 140/NQ-CP → NQ 206/2025/QH15 → QĐ 1785/QĐ-TTg."},
{doc:"hethongvb",q:"Hiến pháp 2013 quy định về Đảng ở điều nào, nội dung chính?",a:"<b>Điều 4</b>: Đảng là lực lượng lãnh đạo Nhà nước và xã hội; chịu trách nhiệm trước Nhân dân; tổ chức đảng, đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật."}
);

<script>
(function(){
"use strict";
const store={get(k,d){try{const v=localStorage.getItem("ontvc:"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem("ontvc:"+k,JSON.stringify(v))}catch(e){}}};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,attrs={},html)=>{const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!==undefined)e.innerHTML=html;return e;};
const docById=Object.fromEntries(DOCS.map(d=>[d.id,d]));
const docShort=id=>docById[id]?docById[id].short:id;
const GROUPS=[["law","Pháp luật về viên chức","Pháp luật"],["party","Chủ trương, đường lối của Đảng","Văn kiện Đảng"],["congress","Văn kiện Đại hội Đảng","Đại hội Đảng"],["pro","Chuyên môn xuất bản – biên tập","Chuyên môn"]].filter(g=>DOCS.some(d=>d.group===g[0]));
const grpName=g=>(GROUPS.find(x=>x[0]===g)||[g,g,g]);
const grpTag=d=>`<span class="tag ${d.group}">${grpName(d.group)[2]}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let done=store.get("done",{});

const TABS=[
 {id:"tongquan",label:"Tổng quan"},
 {id:"bando",label:"Bản đồ tư duy"},
 {id:"vanban",label:"Văn bản",count:()=>DOCS.length},
 {id:"hieuvb",label:"Hiểu văn bản",count:()=>GUIDE.chains.length},
 {id:"conso",label:"Con số cần nhớ",count:()=>NUMBERS.length},
 {id:"denham",label:"Dễ nhầm",count:()=>CONFUSE.length},
 {id:"the",label:"Thẻ ghi nhớ",count:()=>FLASH.length},
 {id:"tracnghiem",label:"Trắc nghiệm",count:()=>QUIZ.length},
 {id:"bode",label:"Bộ đề thi thử",count:()=>EXAMSETS.length+WRITTEN.length},
 {id:"tuluan",label:"Tự luận",count:()=>ESSAY.length},
 {id:"phongvan",label:"Phỏng vấn",count:()=>INTERVIEW.reduce((n,s)=>n+s.items.length,0)},
 {id:"sachnxb",label:"Sách NXB theo năm",count:()=>BOOKS.years.length}
].filter(t=>t.id==="hieuvb"?GUIDE.chains.length>0:t.id==="sachnxb"?BOOKS.years.length>0:true);
const views={};
const rendered={};
let current=null;

function buildTabs(){
  const nav=$("#tabs");
  TABS.forEach(t=>{
    const b=el("button",{class:"tab",role:"tab",id:"tab-"+t.id,"aria-controls":"view-"+t.id,"aria-selected":"false",onclick:()=>show(t.id)},
      t.label+(t.count?`<span class="count">${t.count()}</span>`:""));
    nav.appendChild(b);
    const v=el("section",{class:"view",id:"view-"+t.id,role:"tabpanel","aria-labelledby":"tab-"+t.id});
    v.hidden=true;$("#main").appendChild(v);views[t.id]=v;
  });
}
function show(id,opts={}){
  if(!views[id])id="tongquan";
  current=id;
  TABS.forEach(t=>{views[t.id].hidden=t.id!==id;$("#tab-"+t.id).setAttribute("aria-selected",t.id===id?"true":"false")});
  if(!rendered[id]||opts.rerender){RENDER[id](views[id],opts);rendered[id]=true;}
  else if(RENDER[id].onShow)RENDER[id].onShow(opts);
  store.set("tab",id);
  try{history.replaceState(null,"","#"+id)}catch(e){}
  const tb=$("#tab-"+id);if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:"nearest",inline:"nearest"});
  if(!opts.keepScroll)window.scrollTo({top:Math.min(window.scrollY,$(".tabbar").offsetTop)});
}

/* ---------- Tổng quan ---------- */
function renderOverview(v){
  const nDone=()=>DOCS.filter(d=>done[d.id]).length;
  v.innerHTML=`
  <div class="view-head"><div><h2>Bắt đầu từ đây</h2><p>${OVERVIEW.intro}</p></div></div>
  <div class="stats">
    <div class="stat"><b>${DOCS.length}</b><span>văn bản, chủ đề</span></div>
    <div class="stat"><b>${QUIZ.length}</b><span>câu trắc nghiệm</span></div>
    <div class="stat"><b>${EXAMSETS.length+WRITTEN.length}</b><span>bộ đề thi thử</span></div>
    <div class="stat"><b>${INTERVIEW.reduce((n,s)=>n+s.items.length,0)}</b><span>câu hỏi phỏng vấn</span></div>
  </div>
  ${quickLinks()}
  ${EXAMINFO.length?`<div class="panel"><div class="eyebrow">Kỳ thi gồm những gì</div><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:6px">${EXAMINFO.slice(0,1).map(x=>`<h3>${x.h}</h3><div>${x.html}</div>`).join("")}</div><div style="margin-top:10px"><button class="btn primary" id="ovGoExam">Xem cấu trúc đề và làm bộ đề thi thử</button></div></div>`:""}
  <div class="grid g2">
    <div class="panel"><div class="eyebrow">Tiến độ ôn</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px"><h3>Đã ôn <span id="ovDone">${nDone()}</span>/${DOCS.length} văn bản</h3></div>
      <div class="progress"><i id="ovBar"></i></div>
      <div class="checklist" id="ovList" style="margin-top:10px"></div>
    </div>
    <div class="panel"><div class="eyebrow">Mối liên hệ giữa các văn bản</div>
      <div class="relmap" style="margin-top:8px">${OVERVIEW.relations.map(r=>`<div>${r}</div>`).join("")}</div>
    </div>
  </div>
  <div class="panel"><div class="eyebrow">Những điều phải thuộc lòng trước ngày thi</div>
    <ul class="dots">${OVERVIEW.mustKnow.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="panel" style="overflow-x:auto"><div class="eyebrow">Lộ trình ôn gợi ý</div>
    <table class="plan" style="margin-top:6px;min-width:520px"><thead><tr><th>Buổi</th><th>Nội dung</th><th>Cách học</th></tr></thead>
    <tbody>${OVERVIEW.plan.map(p=>`<tr><td><b>${p[0]}</b></td><td>${p[1]}</td><td class="muted">${p[2]}</td></tr>`).join("")}</tbody></table></div>
  <div class="grid g2">
    <div class="panel"><div class="eyebrow">Mẹo làm bài trắc nghiệm</div><ul class="dots">${OVERVIEW.tipsMcq.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="panel"><div class="eyebrow">Mẹo làm bài tự luận / vấn đáp</div><ul class="dots">${OVERVIEW.tipsEssay.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  </div>`;
  const gx=$("#ovGoExam",v);if(gx)gx.onclick=()=>show("bode");
  bindGo(v);
  const list=$("#ovList",v);
  const upd=()=>{$("#ovDone",v).textContent=nDone();$("#ovBar",v).style.width=(nDone()/DOCS.length*100)+"%";};
  DOCS.forEach(d=>{
    const lab=el("label",{},`<input type="checkbox" id="ov-${d.id}" ${done[d.id]?"checked":""}><span><b>${d.short}</b> <span class="muted mono">${d.so}</span></span>`);
    lab.querySelector("input").addEventListener("change",e=>{done[d.id]=e.target.checked;store.set("done",done);upd();rendered.vanban=false;});
    list.appendChild(lab);
  });
  upd();
}
renderOverview.onShow=function(){const v=views.tongquan;DOCS.forEach(d=>{const c=$("#ov-"+d.id,v);if(c)c.checked=!!done[d.id];});
  const n=DOCS.filter(d=>done[d.id]).length;$("#ovDone",v).textContent=n;$("#ovBar",v).style.width=(n/DOCS.length*100)+"%";};

/* ---------- Văn bản ---------- */
let curDoc=store.get("doc",DOCS[0].id);
function renderDocs(v,opts){
  if(opts&&opts.doc)curDoc=opts.doc;
  if(!docById[curDoc])curDoc=DOCS[0].id;
  v.innerHTML=`<div class="view-head"><div><h2>Từng văn bản</h2><p>Mỗi văn bản có: thông tin chung, tóm tắt 30 giây, nội dung chính, điểm mới, con số và điểm dễ nhầm. Chọn văn bản ở cột trái.</p></div></div>
  <select class="docselect" id="docSel" aria-label="Chọn văn bản">${DOCS.map(d=>`<option value="${d.id}">${d.short} (${d.so})</option>`).join("")}</select>
  <div class="docs-layout"><nav class="doclist" id="docList" aria-label="Danh sách văn bản"></nav><div id="docBody" style="min-width:0"></div></div>`;
  const list=$("#docList",v);
  GROUPS.forEach(([g,name])=>{
    list.appendChild(el("div",{class:"eyebrow grp"},name));
    DOCS.filter(d=>d.group===g).forEach(d=>{
      list.appendChild(el("button",{class:"docbtn","data-id":d.id,onclick:()=>openDoc(d.id)},
        `<span class="t">${d.short}</span><span class="s">${d.so}${done[d.id]?' <span class="done">· đã ôn</span>':""}</span>`));
    });
  });
  $("#docSel",v).addEventListener("change",e=>openDoc(e.target.value));
  openDoc(curDoc,true);
}
renderDocs.onShow=function(opts){if(opts&&opts.doc)openDoc(opts.doc);};
function openDoc(id,first){
  curDoc=id;store.set("doc",id);
  const v=views.vanban,d=docById[id];
  v.querySelectorAll(".docbtn").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id?"true":"false"));
  $("#docSel",v).value=id;
  const nums=NUMBERS.filter(n=>n.doc===id),conf=CONFUSE.filter(c=>c.doc===id),nq=QUIZ.filter(q=>q.doc===id).length,nf=FLASH.filter(f=>f.doc===id).length;
  const body=$("#docBody",v);
  body.innerHTML=`<article class="doc ${d.group}">
    <div class="doc-head">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${grpTag(d)}<span class="stamp"><span style="font-family:var(--f-body)">Số</span> ${d.so}</span></div>
      <h2>${d.title}</h2>
      <dl class="meta">${d.meta.map(m=>`<div><dt>${m[0]}</dt><dd>${m[1]}</dd></div>`).join("")}</dl>
    </div>
    <div class="tldr"><div class="eyebrow">Tóm tắt 30 giây</div>${d.tldr}</div>
    ${d.sections.map((s,i)=>`<details class="acc" ${i<2?"open":""}><summary>${s.h}</summary><div>${s.html?s.html:`<ul class="dots">${s.items.map(x=>`<li>${x}</li>`).join("")}</ul>`}</div></details>`).join("")}
    ${nums.length?`<details class="acc" open><summary>Con số cần nhớ (${nums.length})</summary><div><div class="tablewrap"><table class="nums"><thead><tr><th>Nội dung</th><th>Con số</th><th>Căn cứ</th></tr></thead><tbody>${nums.map(n=>`<tr><td>${n.what}</td><td class="v"><span>${n.val}</span></td><td class="r">${n.ref||""}</td></tr>`).join("")}</tbody></table></div></div></details>`:""}
    ${conf.length?`<details class="acc"><summary>Điểm dễ nhầm (${conf.length})</summary><div class="grid" style="gap:10px">${conf.map(pairHTML).join("")}</div></details>`:""}
    ${d.sources&&d.sources.length?`<details class="acc"><summary>Nguồn tra cứu</summary><div class="srcs"><ul class="dots">${d.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("")}</ul></div></details>`:""}
    <div class="doc-actions">
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" id="doneChk" ${done[id]?"checked":""} style="accent-color:var(--ok)"> Đã ôn xong văn bản này</label>
      <span style="flex:1"></span>
      ${nq?`<button class="btn primary" id="goQuiz">Làm ${nq} câu trắc nghiệm</button>`:""}
      ${nf?`<button class="btn" id="goFlash">Ôn ${nf} thẻ</button>`:""}
    </div>
  </article>`;
  $("#doneChk",body).addEventListener("change",e=>{done[id]=e.target.checked;store.set("done",done);
    const b=v.querySelector(`.docbtn[data-id="${id}"] .s`);if(b)b.innerHTML=d.so+(done[id]?' <span class="done">· đã ôn</span>':"");});
  const gq=$("#goQuiz",body);if(gq)gq.onclick=()=>show("tracnghiem",{doc:id,rerender:true});
  const gf=$("#goFlash",body);if(gf)gf.onclick=()=>show("the",{doc:id,rerender:true});
  if(!first){const t=body.getBoundingClientRect().top+window.scrollY-70;if(window.scrollY>t)window.scrollTo({top:t});}
}
function pairHTML(c){return `<div class="pair"><div><div class="lab">${c.aLab||"Dễ nhầm"}</div>${c.a}</div><div><div class="lab">${c.bLab||"Thực tế / phân biệt"}</div>${c.b}</div>${c.tip?`<div class="tip"><b>Mẹo nhớ:</b> ${c.tip}</div>`:""}</div>`;}

/* ---------- Con số ---------- */
function renderNumbers(v){
  let f="all",q="";
  v.innerHTML=`<div class="view-head"><div><h2>Bảng con số cần nhớ</h2><p>Thời hạn, tỷ lệ, mốc thời gian, chỉ tiêu. Đề trắc nghiệm hay hỏi đúng những con số này. Lọc theo văn bản hoặc gõ từ khóa.</p></div></div>
   <div class="toolbar"><input type="search" id="numQ" placeholder="Tìm: tập sự, 2030, kỷ luật…" aria-label="Tìm con số" style="flex:1 1 220px"></div>
   <div class="chips" id="numChips"></div>
   <div class="tablewrap"><table class="nums"><thead><tr><th>Văn bản</th><th>Nội dung</th><th>Con số</th><th>Căn cứ</th></tr></thead><tbody id="numBody"></tbody></table></div>
   <p class="muted" id="numCount" style="margin:0;font-size:.85rem"></p>`;
  const chips=$("#numChips",v);
  const mk=(id,label)=>{const c=el("button",{class:"chip","aria-pressed":id===f?"true":"false"},label);c.onclick=()=>{f=id;chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");draw();};chips.appendChild(c);};
  mk("all","Tất cả");DOCS.filter(d=>NUMBERS.some(n=>n.doc===d.id)).forEach(d=>mk(d.id,d.short));

      <div class="fc-face back"><div class="fc-meta"><span>Đáp án</span><span id="fcPos2"></span></div><div class="a" id="fcA"></div></div>
    </div></button>
    <div class="fc-ctrl"><button class="btn" id="fcPrev">← Trước</button><button class="btn" id="fcKnow">Đã thuộc</button><button class="btn primary" id="fcNext">Tiếp →</button></div>
    <div class="muted" id="fcStat" style="font-size:.85rem"></div>
  </div>`;
  const sel=$("#fcDoc",v),only=$("#fcOnly",v),card=$("#fcCard",v);
  sel.value=fcState.doc;

    let items=FLASH.map((f,i)=>({f,i})).filter(x=>(fcState.doc==="all"||x.f.doc===fcState.doc)&&(!only.checked||!known[x.i]));

    else{const idx=fcState.order[fcState.i],f=FLASH[idx];

      $("#fcPos",v).textContent=`${fcState.i+1}/${n}`;$("#fcPos2",v).textContent=`${fcState.i+1}/${n}`;
      $("#fcKnow",v).textContent=known[idx]?"Bỏ đánh dấu thuộc":"Đã thuộc";}
    const k=Object.keys(known).filter(i=>known[i]&&FLASH[i]&&(fcState.doc==="all"||FLASH[i].doc===fcState.doc)).length;
    const tot=FLASH.filter(f=>fcState.doc==="all"||f.doc===fcState.doc).length;

  card.onclick=()=>card.classList.toggle("flipped");

  $("#fcNext",v).onclick=()=>{if(fcState.order.length){fcState.i=(fcState.i+1)%fcState.order.length;draw();}};
  $("#fcKnow",v).onclick=()=>{if(!fcState.order.length)return;const idx=fcState.order[fcState.i];known[idx]=!known[idx];if(!known[idx])delete known[idx];store.set("known",known);
    if(only.checked&&known[idx]){fcState.order.splice(fcState.i,1);if(fcState.i>=fcState.order.length)fcState.i=0;}else if(known[idx]&&fcState.order.length){fcState.i=(fcState.i+1)%fcState.order.length;}draw();};
  $("#fcShuf",v).onclick=()=>build(true);

let qz={doc:"all",n:10,set:[],i:0,answers:[]};
function renderQuiz(v,opts){
  if(opts&&opts.doc){qz.doc=opts.doc;qz.n=0;}
  v.innerHTML=`<div class="view-head"><div><h2>Trắc nghiệm tự kiểm tra</h2><p>Chọn văn bản và số câu rồi bấm "Làm đề mới". Chọn đáp án để xem ngay đúng/sai và giải thích. Câu sai được gom lại ở cuối để ôn.</p></div></div>

function poolFor(doc){return QUIZ.map((q,i)=>i).filter(i=>{const d=QUIZ[i].doc;return doc==="all"||d===doc||(docById[d]&&docById[d].group===doc);});}
function newQuiz(){
  const pool=shuffle(poolFor(qz.doc));qz.set=qz.n?pool.slice(0,qz.n):pool;qz.i=0;qz.answers=[];qz.single=false;
  const best=store.get("best",{});const b=best[qz.doc];
  $("#qzBest",views.tracnghiem).textContent=b?`Điểm cao nhất nhóm này: ${b}`:"";
  drawQ();
}
function drawQ(){
  const box=$("#qzBox",views.tracnghiem);
  if(qz.i>=qz.set.length){return drawResult(box);}
  const qi=qz.set[qz.i],q=QUIZ[qi],L="ABCD";
  const order=q.keep?q.opts.map((_,i)=>i):shuffle(q.opts.map((_,i)=>i));
  box.innerHTML=`<div class="qbar"><span>Câu ${qz.i+1}/${qz.set.length} · ${docShort(q.doc)}</span><span>Đúng: ${qz.answers.filter(a=>a.ok).length}</span></div>
   <div class="progress"><i style="width:${qz.i/qz.set.length*100}%"></i></div>
   <div class="qcard"><div class="qtext">${q.q}</div><div class="opts">${order.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="k">${L[k]}.</span><span>${q.opts[oi]}</span></button>`).join("")}</div>
   <div class="explain" id="qzEx" hidden></div>
   <div style="display:flex;justify-content:flex-end"><button class="btn primary" id="qzNext" hidden>${qz.i+1<qz.set.length?"Câu tiếp →":"Xem kết quả"}</button></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi,ok=oi===q.ans;qz.answers.push({qi,oi,ok});
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.oi===q.ans)x.classList.add("right");});
    if(!ok)b.classList.add("wrong");
    const ex=$("#qzEx",box);ex.hidden=false;ex.className="explain callout "+(ok?"ok":"warn");
    ex.innerHTML=`<b>${ok?"Chính xác.":"Chưa đúng."}</b> ${q.ex||""}${q.ref?` <span class="mono muted">(${q.ref})</span>`:""}`;
    const nx=$("#qzNext",box);nx.hidden=false;nx.focus();nx.onclick=()=>{qz.i++;drawQ();};
  });
}
function drawResult(box){
  const ok=qz.answers.filter(a=>a.ok).length,n=qz.set.length,pct=n?Math.round(ok/n*100):0;
  const best=store.get("best",{});const prev=best[qz.doc];const cur=`${ok}/${n}`;
  const pv=prev?(+prev.split("/")[0])/(+prev.split("/")[1]||1):-1;
  if(n&&!qz.single&&ok/n>pv){best[qz.doc]=cur;store.set("best",best);}
  const wrong=qz.answers.filter(a=>!a.ok);
  box.innerHTML=`<div class="qcard"><div class="eyebrow">Kết quả</div><div class="score">${ok}/${n} <span class="muted" style="font-size:1rem">(${pct}%)</span></div>
   <p style="margin:0">${pct>=80?"Rất tốt. Chuyển sang nhóm văn bản khác hoặc làm đề 30 câu.":pct>=50?"Khá. Xem lại các câu sai bên dưới rồi làm lại đề mới.":"Cần ôn thêm. Đọc lại phần Văn bản và Con số cần nhớ của các văn bản có câu sai."}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="qzAgain">Làm đề mới</button>${wrong.length?`<button class="btn" id="qzRetry">Làm lại ${wrong.length} câu sai</button>`:""}</div></div>
   ${wrong.length?`<h3 style="margin-top:6px">Các câu làm sai</h3>${wrong.map(a=>{const q=QUIZ[a.qi];return `<div class="qcard"><div class="muted" style="font-size:.8rem">${docShort(q.doc)}</div><div class="qtext" style="font-size:1rem">${q.q}</div><div>Bạn chọn: <span style="color:var(--seal)">${q.opts[a.oi]}</span></div><div>Đáp án đúng: <b style="color:var(--ok)">${q.opts[q.ans]}</b></div><div class="explain muted">${q.ex||""}${q.ref?` (${q.ref})`:""}</div></div>`}).join("")}`:""}`;
  $("#qzAgain",box).onclick=newQuiz;
  const r=$("#qzRetry",box);if(r)r.onclick=()=>{qz.set=shuffle(wrong.map(a=>a.qi));qz.i=0;qz.answers=[];drawQ();};
}

function renderMindmap(v){
  v.innerHTML=`<div class="view-head"><div><h2>Bản đồ tư duy</h2><p>Bấm vào một nút để mở hoặc thu nhánh. Kéo để di chuyển, cuộn hoặc chụm hai ngón để phóng to. Màu nút cho biết nhóm: xanh lam là pháp luật, cam là chủ trương của Đảng, đỏ là văn kiện Đại hội, xanh lục là chuyên môn.</p></div>
   <div class="mm-ctrl"><button class="btn" id="mmExpand">Mở hết</button><button class="btn" id="mmCollapse">Chỉ hiện văn bản</button><button class="btn" id="mmFit">Vừa khung</button></div></div>
   <div class="mm-wrap" id="mmWrap"><svg id="mmSvg" role="img" aria-label="Bản đồ tư duy các văn bản ôn thi"></svg><div class="mm-hint">Bấm nút có dấu + để mở nhánh</div></div>
   <details class="acc" id="mmOutlineBox"><summary>Xem bản đồ dạng dàn ý (dễ đọc trên điện thoại)</summary><div id="mmOutline"></div></details>`;
  const data={n:"Ôn thi Biên tập viên 2026",c:GROUPS.map(([g,name])=>({n:name,g,c:DOCS.filter(d=>d.group===g).map(d=>({n:d.mmLabel||d.short,g,doc:d.id,c:d.mm}))}))};
